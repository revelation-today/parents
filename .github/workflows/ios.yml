# The iPhone app: builds the Capacitor app on a Mac runner and uploads it to
# App Store Connect, where it appears in TestFlight a few minutes later.
# Run it by hand: Actions -> "iOS build to TestFlight" -> Run workflow.
#
# Repository secrets it needs (Settings -> Secrets and variables -> Actions):
#   APPLE_TEAM_ID        your 10-character Team ID (developer.apple.com -> Membership)
#   APPSTORE_KEY_ID      the Key ID of an App Store Connect API key
#   APPSTORE_ISSUER_ID   the Issuer ID shown above the list of API keys
#   APPSTORE_KEY_P8      the full text of the downloaded AuthKey_XXXX.p8 file
# The key needs the Admin role, so that Xcode may create the signing
# certificate and provisioning profile itself (cloud signing, no Mac needed).
name: iOS build to TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown in the App Store, e.g. 1.0.0"
        required: true
        default: "1.0.0"

jobs:
  testflight:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Create the Xcode project from web/
        run: |
          npx cap add ios
          npx capacitor-assets generate --ios --assetPath resources \
            --iconBackgroundColor '#1E3D35' \
            --splashBackgroundColor '#F4F6F2' --splashBackgroundColorDark '#101514'
          npx cap sync ios

      - name: App settings
        run: |
          PLIST=ios/App/App/Info.plist
          # No encryption beyond the system's own: skips the export-compliance question.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Parents" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Parents" "$PLIST"

      - name: App Store Connect API key
        env:
          KEY: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}" \
            archive

      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}"

      - name: Clean up the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
