# The Android app: builds the Capacitor app on a Linux runner, signs it with the
# upload key, and (once Play is set up for it) sends it to Google Play.
# Run it by hand: Actions -> "Android build for Google Play" -> Run workflow.
#
# Repository secrets it needs (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_B64       the upload keystore (upload-key.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  the keystore password
#   ANDROID_KEY_ALIAS          the key's alias, e.g. "upload"
#   ANDROID_KEY_PASSWORD       the key password (the same as the keystore password
#                              if keytool did not ask for a second one)
# Optional, for uploading straight to Play (store/listing-android.md, Teil 5):
#   PLAY_SERVICE_ACCOUNT_JSON  the JSON key of a Google Cloud service account that
#                              has been invited in the Play Console
# Without it, the run still produces the signed .aab (and an .apk for trying the
# app on your own phone) as a download under the run's "Artifacts".
name: Android build for Google Play

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown in Google Play, e.g. 1.0.0"
        required: true
        default: "1.0.0"
      track:
        description: "Play track to upload to (only with PLAY_SERVICE_ACCOUNT_JSON)"
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      status:
        description: "Release status. Must be 'draft' until the app has been published once."
        required: true
        default: draft
        type: choice
        options: [draft, completed]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Create the Android project from web/
        run: |
          npx cap add android
          npx capacitor-assets generate --android --assetPath resources \
            --iconBackgroundColor '#1E3D35' \
            --splashBackgroundColor '#F4F6F2' --splashBackgroundColorDark '#101514'
          # The reminder's small icon: Android draws it as a white silhouette.
          cp resources/android/ic_stat_aleph.png android/app/src/main/res/drawable/
          npx cap sync android

      - name: Version
        run: |
          GRADLE=android/app/build.gradle
          # The version code is the run number, so it always goes up (Play refuses a repeat).
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" "$GRADLE"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${{ inputs.version }}\"/" "$GRADLE"
          grep -E "versionCode|versionName" "$GRADLE"

      - name: Build
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys" out
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keys/upload.jks"
          NAME="faithful-parents-${{ inputs.version }}-${{ github.run_number }}"
          # The bundle for Play: signed with jarsigner (Play re-signs it with the app key).
          cp android/app/build/outputs/bundle/release/app-release.aab "out/$NAME.aab"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/keys/upload.jks" -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            "out/$NAME.aab" "$KEY_ALIAS"
          # An .apk for installing by hand on your own phone.
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/keys/upload.jks" --ks-pass "pass:$STORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
            --out "out/$NAME.apk" "$RUNNER_TEMP/aligned.apk"
          ls -l out

      - name: Clean up the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.version }}-${{ github.run_number }}
          path: out/

      - name: Check for a Play key
        id: play
        env:
          JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "ready=$([ -n "$JSON" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      # Play accepts uploads through the API only after the first bundle has been
      # uploaded by hand in the Play Console.
      - name: Upload to Google Play
        if: steps.play.outputs.ready == 'yes'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.revelationtoday.parent
          releaseFiles: out/*.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
