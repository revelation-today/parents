# The web version: web/ is the finished site (built by tools/app/build_app.py
# in the book project), so it is deployed as it is, with no build step.
name: Deploy web app to Pages

# Started by hand only (Actions -> Deploy web app to Pages -> Run workflow),
# so the books go on the open web only when that is decided. To publish on
# every push instead, add:  push: { branches: ["main"], paths: ["web/**"] }
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The recorded narration is served beside the app, but is not part of the
      # iPhone bundle (which carries web/ only), so the app stays small.
      - name: Put the site together
        run: |
          mkdir -p site
          cp -r web/. site/
          if [ -d audio ]; then mkdir -p site/audio && cp -r audio/. site/audio/; fi
          du -sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
