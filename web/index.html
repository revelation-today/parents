ype=\"1\">\n<li>Gibt es eine Lage, in der du Nein sagen musst, um ein Kind zu schützen?<\/li>\n<li>Wen fürchtest du mehr – Gott oder die Menschen, die Macht über dich haben?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, danke für Schifra und Pua, die dich mehr fürchteten als einen König.<br />\nGib mir ihren Mut – still, klug und furchtlos –,<br />\ndie Kinder in meiner Obhut zu schützen,<br />\nwas es auch kostet. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Bete für Mütter und Hebammen an Orten, an denen das Leben von Kindern in Gefahr ist. Wenn du von einer Lage weißt, in der ein Kind gefährdet ist, tu einen Schritt, um es zu schützen.\n<\/p>", "note": "„Er baute ihnen Häuser“ (2. Mose 1,21) kann bedeuten, dass Gott den Hebammen eigene Familien schenkte. 2. Mose 1,15 kann „die hebräischen Hebammen“ oder „die Hebammen der hebräischen Frauen“ bedeuten; Josephus (<em>Jüdische Altertümer<\/em> 2,206–207) hielt sie für Ägypterinnen.", "readEn": "Exodus 1:8–22"}, {"id": "M14", "n": 14, "title": "Eine kleine Arche im Schilf", "part": 2, "read": "2. Mose 2,1–10", "ref": "2. Mose 2,2–3", "html": "<blockquote>\n<p>„Die Frau wurde schwanger und gebar einen Sohn. Sie sah, dass er gut war, und verbarg ihn drei Monate lang. Als sie ihn nicht länger verbergen konnte, nahm sie für ihn ein Kästchen aus Papyrus, bestrich es mit Asphalt und Pech, legte das Kind hinein und setzte es ins Schilf am Ufer des Nils.“<\/p>\n<p><span class=\"ref\">2. Mose 2,2–3<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">תֵּבָה<\/span> (<em>tēbâ<\/em>) – „Kästchen“, „Arche“. Dieses Wort kommt in der Bibel nur an zwei Stellen vor: hier und in der Geschichte von Noahs Arche.<\/p>\n<\/div>\n<p>Die Mutter des Mose wird in diesem Kapitel nicht einmal mit Namen genannt. Später erfahren wir, dass sie Jochebed hieß (2. Mose 6,20). Aber was sie tat, vergisst man nicht.<\/p>\n<p>Sie „sah, dass er gut war“ – dieselben Worte, die Gott über der Schöpfung in 1. Mose 1 sprach. Jede Mutter kennt diesen Moment, in dem sie ihr Neugeborenes ansieht und etwas Wunderbares sieht.<\/p>\n<p>Dann versteckte sie ihn. Drei Monate lang hielt sie ein Baby still, in einem Land, in dem jeder hebräische Junge in den Nil geworfen werden sollte.<\/p>\n<p>Und als sie ihn nicht länger verstecken konnte, baute sie ihm eine <em>tēbâ<\/em> – dasselbe Wort wie für Noahs Arche. Eine kleine Arche, mit Pech abgedichtet, um ihren Sohn durch die Wasser zu tragen.<\/p>\n<p>Dann kam das Schwerste. Sie setzte ihn in den Fluss und ließ ihn los.<\/p>\n<p>Das ist eines der großen Paradoxe des Mutterseins. Eine Mutter schützt ihr Kind mit aller Kraft – und muss dann, im richtigen Moment, loslassen und vertrauen. Jochebed konnte dem Kästchen den Fluss hinunter nicht folgen. Sie hatte alles getan, was sie konnte; der Rest lag in Gottes Hand.<\/p>\n<p>Aber sie war nicht allein. Die Schwester des Babys – Mirjam, wie wir später erfahren – sah aus der Ferne zu und sprach genau im richtigen Moment. Und die Tochter des Pharao selbst – eine ägyptische Prinzessin – hatte Mitleid mit dem Kind und nahm es als Sohn an. Jochebed wurde sogar dafür bezahlt, ihr eigenes Baby zu stillen!<\/p>\n<p>Mose überlebte dank einer ganzen Mannschaft von Frauen: einer Mutter, einer Schwester, einer Prinzessin und, noch vor ihnen, zweier Hebammen.<\/p>\n<p>Wenn du vor einem Moment stehst, in dem du ein Kind loslassen musst – in die Schule, ins Krankenhaus, in ein neues Zuhause, ins Erwachsensein –, denk an Jochebed. Bau die beste Arche, die du bauen kannst. Dann vertrau den Fluss Gott an.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>In welchem Bereich im Leben deines Kindes musst du gerade „loslassen“?<\/li>\n<li>Wer sind die anderen Menschen – Schwestern, Freundinnen, sogar Fremde –, die mit dir dein Kind schützen?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, du hast Jochebeds kleine Arche im Schilf gesehen.<br />\nHilf mir, meine Kinder mit aller Kraft zu schützen<br />\nund sie loszulassen, wenn die Zeit gekommen ist,<br />\nim Vertrauen auf deine Hände. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Benenne einen Bereich, in dem du ein wenig loslassen musst. Bete darüber – und danke Gott für die Menschen, die dir helfen, für deine Kinder zu sorgen.\n<\/p>", "note": "Das Wort <em>tēbâ<\/em> wird in 1. Mose 6–9 für Noahs Arche und in 2. Mose 2,3.5 für das Kästchen des Mose gebraucht. Die Mutter des Mose wird in 2. Mose 6,20 genannt, seine Schwester Mirjam in 4. Mose 26,59; 2. Mose 2 nennt keine von beiden mit Namen.", "art": {"file": "images/m14.webp", "caption": "Das Kästchen im Schilf", "title": "Die Auffindung des Mose", "credit": "Gustave Doré, Bibelillustrationen (1866)", "source": "https://commons.wikimedia.org/wiki/File%3A031.The_Finding_of_Moses.jpg", "licence": "Public domain", "w": 900, "h": 1118}, "readEn": "Exodus 2:1–10"}, {"id": "M15", "n": 15, "title": "Hanna schüttet ihr Herz aus", "part": 2, "read": "1. Samuel 1,1–18", "ref": "1. Samuel 1,15", "html": "<blockquote>\n<p>„Hanna aber antwortete: ‚Nein, mein Herr, ich bin eine betrübte Frau. Wein und starkes Getränk habe ich nicht getrunken, sondern ich habe mein Herz vor dem HERRN ausgeschüttet.‘“<\/p>\n<p><span class=\"ref\">1. Samuel 1,15<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">מָרַת נָפֶשׁ<\/span> (<em>mārat nāpeš<\/em>) – „bitter in der Seele“. Es beschreibt Hannas Zustand in 1. Samuel 1,10: tiefer, bohrender Kummer.<\/p>\n<\/div>\n<p>Hanna wünschte sich ein Kind und konnte keines bekommen. Jahr für Jahr zog sie mit ihrer Familie zum Gottesdienst nach Schilo, und Jahr für Jahr kränkte sie Peninna, die andere Frau ihres Mannes.<\/p>\n<p>Ihr Mann Elkana liebte sie, aber er verstand sie nicht wirklich. „Warum weinst du? Bin ich dir nicht mehr wert als zehn Söhne?“ (1,8). Er meinte es gut. Aber es half nicht.<\/p>\n<p>Also ging Hanna ins Haus Gottes und betete. Die Bibel sagt, sie war „bitter in der Seele“ und „weinte sehr“. Sie betete so inständig, dass ihre Lippen sich bewegten, aber kein Laut herauskam. Der Priester Eli sah ihr zu, hielt sie für betrunken und wies sie zurecht.<\/p>\n<p>Ihre Antwort ist einer der ehrlichsten Sätze der Bibel: „Ich habe mein Herz vor dem HERRN ausgeschüttet.“<\/p>\n<p>Hanna räumt ihr Gebet nicht auf. Sie tut nicht so, als ginge es ihr gut. Sie bringt ihren Kummer, ihre Sehnsucht und ihre Bitterkeit direkt zu Gott – so roh, dass es für einen Beobachter wie Trunkenheit aussieht.<\/p>\n<p>Viele Mütter, und viele Frauen, die sich danach sehnen, Mutter zu sein, kennen diese Art zu beten. Das Gebet um drei Uhr nachts an einem kranken Kind. Das Gebet nach einem weiteren Monat ohne Schwangerschaft. Das Gebet für ein Kind, das verloren gegangen ist. Die Worte versagen, und übrig bleibt nur das Ausschütten.<\/p>\n<p>Hanna zeigt, dass Gott solche Gebete willkommen heißt. Er verlangt nicht, dass wir ruhig sind, bevor wir zu ihm kommen. Und nachdem sie gebetet hatte, sah sie nicht mehr traurig aus (1,18) – nicht weil sich schon etwas geändert hätte, sondern weil sie es zu Gott gebracht hatte.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Gibt es einen Kummer oder eine Sehnsucht, die du vor Gott zurückgehalten hast, weil sie sich zu roh anfühlt?<\/li>\n<li>Hat schon einmal jemand deinen Schmerz missverstanden, wie Eli Hannas Schmerz missverstand? Wie hat sich das angefühlt?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, du hast Hanna gehört, als niemand sonst sie verstand.<br />\nIch schütte jetzt mein Herz vor dir aus –<br />\ndie Sehnsucht, den Kummer, die Bitterkeit.<br />\nHör mich, wie du sie gehört hast. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Nimm dir Zeit allein, um ehrlich zu beten – laut oder auf Papier – über das, was dir als Mutter am schwersten auf dem Herzen liegt, oder als Frau, die sich danach sehnt, eine zu sein.\n<\/p>", "note": "Hannas Geschichte folgt dem Muster der kinderlosen Frau und des angekündigten Sohnes; siehe Robert Alter, „How Convention Helps Us Read: The Case of the Bible’s Annunciation Type-Scene“, <em>Prooftexts<\/em> 3 (1983). Ihr Lied (1. Samuel 2,1–10) ist das Vorbild für Marias Magnificat (Lukas 1,46–55).", "readEn": "1 Samuel 1:1–18"}, {"id": "M16", "n": 16, "title": "Dem Herrn geliehen – und jedes Jahr ein kleiner Rock", "part": 2, "read": "1. Samuel 1,19–28; 2,18–21", "ref": "1. Samuel 1,28; 2,19", "html": "<blockquote>\n<p>„So habe auch ich ihn dem HERRN geliehen; sein Leben lang soll er dem HERRN geliehen sein … Und seine Mutter machte ihm jedes Jahr einen kleinen Rock und brachte ihn hinauf, wenn sie mit ihrem Mann zum jährlichen Opfer hinaufzog.“<\/p>\n<p><span class=\"ref\">1. Samuel 1,28; 2,19<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">מְעִיל קָטֹן<\/span> (<em>mĕʿîl qāṭōn<\/em>) – „ein kleiner Rock“.<\/p>\n<\/div>\n<p>Gott erhörte Hannas Gebet. Sie gebar einen Sohn und nannte ihn Samuel. Und dann tat sie etwas, das man sich kaum vorstellen kann.<\/p>\n<p>Sie hatte versprochen, dass sie Gott einen Sohn, wenn er ihr einen schenkte, zurückgeben würde. Als Samuel entwöhnt war – vermutlich mit etwa drei Jahren –, brachte sie ihn zum Haus Gottes in Schilo und ließ ihn dort, damit er beim alten Priester Eli aufwuchs und dem Herrn diente.<\/p>\n<p>„Ich habe ihn dem HERRN geliehen“, sagte sie.<\/p>\n<p>Was für eine Mutter tut so etwas? Eine, die weiß, dass ihr Kind nie wirklich ihr gehörte, um es zu behalten. Jedes Kind ist in gewissem Sinn „geliehen“. Kinder kommen von Gott, und sie gehören Gott, bevor sie uns gehören. Hanna machte nur sichtbar, was für alle Eltern gilt.<\/p>\n<p>Aber die Geschichte endet hier nicht. Sieh dir die kleine Einzelheit in Kapitel 2 an: „Und seine Mutter machte ihm jedes Jahr einen kleinen Rock und brachte ihn hinauf.“<\/p>\n<p>Hanna gab ihren Sohn Gott – und blieb seine Mutter. Jedes Jahr machte sie ihm neue Kleider. Jedes Jahr wusste sie, dass er gewachsen war, und machte sie ein wenig größer. Jedes Jahr kam sie, sah ihn und schenkte ihm etwas, das sie mit eigenen Händen gemacht hatte.<\/p>\n<p>Loslassen hieß nicht, aufzuhören zu lieben. Es hieß, anders zu lieben.<\/p>\n<p>Jede Mutter erlebt das. Kinder gehen fort – in die Schule, an die Universität, in eine Ehe, in eine Arbeit weit weg. Manche gehen in die Mission; manche gehen Wege, die wir nicht gewählt hätten. Loslassen gehört zum Muttersein. Aber der „kleine Rock“ auch: das Päckchen, der Anruf, der Besuch, das Gebet, die beständige Gegenwart, die sagt: <em>Ich bin immer noch deine Mutter.<\/em><\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Kannst du deine Kinder als von Gott „geliehen“ sehen? Was ändert das?<\/li>\n<li>Was ist der „kleine Rock“, den du einem Kind, das aus dem Haus ist, noch geben kannst?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, meine Kinder hast du mir geliehen.<br />\nSchenk mir die Gnade, sie dir zurückzugeben<br />\nund sie weiter zu lieben –<br />\njedes Jahr ein kleiner Rock, solange ich lebe. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Tu etwas Kleines und Persönliches für ein Kind, das aus dem Haus ist oder gerade flügge wird: eine Karte, ein Päckchen, ein Anruf, ein Essen.\n<\/p>", "note": "„Geliehen“ (<em>šāʾûl<\/em>) ist ein Wortspiel mit dem Namen Saul.", "readEn": "1 Samuel 1:19–28; 2:18–21"}, {"id": "M17", "n": 17, "title": "„Sie ist seine Mutter“", "part": 2, "read": "1. Könige 3,16–28", "ref": "1. Könige 3,26–27", "html": "<blockquote>\n<p>„Da sagte die Frau, deren Sohn lebte, zum König – denn ihr Erbarmen um ihren Sohn entbrannte –: ‚Ach, mein Herr, gebt ihr das lebende Kind und tötet es nicht!‘ … Da antwortete der König: ‚Gebt der ersten das lebende Kind und tötet es nicht. Sie ist seine Mutter.‘“<\/p>\n<p><span class=\"ref\">1. Könige 3,26–27<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">רַחֲמֶיהָ<\/span> (<em>raḥămêhā<\/em>) – „ihr Erbarmen“. Das Wort ist mit <em>reḥem<\/em>, „Mutterschoß“, verwandt – ein schönes Sprachbild, auch wenn dieselbe Wendung für Josefs Liebe zu seinem Bruder gebraucht wird (1. Mose 43,30).<\/p>\n<\/div>\n<p>Das ist der berühmteste Rechtsfall der Bibel. Zwei Frauen kommen vor König Salomo. Sie wohnen in einem Haus; beide haben ein Kind geboren; ein Baby ist in der Nacht gestorben. Jetzt beanspruchen beide das lebende Kind.<\/p>\n<p>Es gibt keine Zeugen. Es steht Wort gegen Wort.<\/p>\n<p>Salomo lässt ein Schwert bringen. „Teilt das lebende Kind in zwei Teile und gebt die eine Hälfte dieser und die andere Hälfte jener.“<\/p>\n<p>Die eine Frau sagt: „Gut – es soll weder mir noch dir gehören.“ Die andere schreit auf: „Nein! Gebt es ihr. Tötet es nicht.“<\/p>\n<p>Und Salomo weiß sofort, wer die wahre Mutter ist. „Sie ist seine Mutter.“<\/p>\n<p>Was hat sie verraten? Kein Besitzanspruch. Die wahre Mutter war die, die bereit war, ihr Kind zu <em>verlieren<\/em>, statt zuzusehen, wie ihm geschadet wird. Ihre Liebe war größer als ihr Recht, es zu behalten.<\/p>\n<p>Im Hebräischen heißt es, ihr Erbarmen „entbrannte“ für ihren Sohn. Es ist ein leibliches Wort. In ihrem Körper regte sich etwas, bevor ihr Verstand überhaupt entschieden hatte.<\/p>\n<p>Achte darauf, wer diese Frauen waren: Die Bibel sagt, sie waren Prostituierte (3,16). Niemand hätte sie für ehrbar gehalten. Und doch hörte der König ihnen zu, und die Bibel stellt eine von ihnen als das eigentliche Bild einer wahren Mutter hin.<\/p>\n<p>Es gibt Momente im Leben jeder Mutter, in denen Liebe bedeutet, etwas aufzugeben: einen Plan, eine Hoffnung, einen Anspruch, eine Beziehung. Manchmal bedeutet es, zurückzutreten, damit ein Kind sicher oder frei sein kann, auch wenn es uns viel kostet. Das ist keine Schwäche. Nach Salomo ist es das sicherste Zeichen echter Mutterschaft.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Gibt es eine Lage, in der die Liebe zu deinem Kind bedeutet, etwas aufzugeben?<\/li>\n<li>Verwechselst du manchmal, dein Kind zu „behalten“, damit, es zu lieben?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, gib mir eine Liebe wie ihre –<br />\neine Liebe, die lieber verliert, als zu schaden,<br />\neine Liebe, die größer ist als meine Rechte.<br />\nLass mein Erbarmen für das Wohl meiner Kinder brennen, nicht für mein eigenes. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Frag dich ehrlich: Halte ich an einem Kind um meinetwillen fest statt um seinetwillen? Bete darüber.\n<\/p>", "note": "Dieselbe Wendung – ein Erbarmen, das „entbrennt“ – wird von Josef gegenüber Benjamin gebraucht, 1. Mose 43,30. <em>Raḥămîm<\/em> („Erbarmen“) und <em>reḥem<\/em> („Mutterschoß“) haben dieselbe Wurzel; zu den Grenzen von Argumenten aus der Wortwurzel siehe James Barr, <em>The Semantics of Biblical Language<\/em> (1961; deutsch: <em>Bibelexegese und moderne Semantik<\/em>, 1965).", "art": {"file": "images/m17.webp", "caption": "„Gebt ihr das lebende Kind“", "title": "Das Urteil Salomos", "credit": "Gustave Doré, Bibelillustrationen (1866)", "source": "https://commons.wikimedia.org/wiki/File%3A084.The_Judgment_of_Solomon.jpg", "licence": "Public domain", "w": 900, "h": 1108}, "readEn": "1 Kings 3:16–28"}, {"id": "M18", "n": 18, "title": "Rizpa auf dem Felsen", "part": 2, "read": "2. Samuel 21,1–14", "ref": "2. Samuel 21,10", "html": "<blockquote>\n<p>„Da nahm Rizpa, die Tochter Ajas, einen Sack und breitete ihn für sich auf dem Felsen aus, vom Beginn der Ernte an, bis Regen vom Himmel auf die Toten fiel; und sie ließ weder am Tag die Vögel des Himmels noch in der Nacht die Tiere des Feldes an sie heran.“<\/p>\n<p><span class=\"ref\">2. Samuel 21,10<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">שַׂק<\/span> (<em>śaq<\/em>) – „Sack“, „Trauergewand“, das raue Tuch, das man zur Trauer trug. Von diesem Wort stammt letztlich unser Wort „Sack“.<\/p>\n<\/div>\n<p>Das ist eine der härtesten Geschichten der Bibel und eine der am wenigsten bekannten.<\/p>\n<p>König David lieferte, um eine Hungersnot zu beenden, sieben Nachkommen des früheren Königs Saul an die Gibeoniter aus, die sie hinrichteten und ihre Leichen auf einem Hügel liegen ließen. Zwei der Toten waren die Söhne Rizpas, einer von Sauls Nebenfrauen. Sie starben für etwas, das ihr Vater Jahre zuvor getan hatte: Die Gibeoniter verlangten Sauls Nachkommen als Sühne für seine Verbrechen an ihnen. Dabei sagt das Gesetz der Bibel selbst, dass Kinder nicht für die Sünde ihres Vaters hingerichtet werden dürfen (5. Mose 24,16).<\/p>\n<p>Rizpa konnte ihre Söhne nicht retten. Sie konnte die Entscheidung des Königs nicht ändern. Sie hatte überhaupt keine Macht.<\/p>\n<p>Aber sie ließ nicht zu, dass sie vergessen wurden.<\/p>\n<p>Sie nahm ein Stück Sacktuch, breitete es auf dem Felsen neben den Leichen aus und blieb dort. Tag für Tag verscheuchte sie die Geier. Nacht für Nacht verscheuchte sie die Schakale. Von der Gerstenernte im Frühling bis zu den Herbstregen – monatelang.<\/p>\n<p>Und es wirkte. Als David hörte, was Rizpa getan hatte, wurde er bewegt zu handeln. Er sammelte die Gebeine Sauls und Jonatans und der hingerichteten Männer und gab ihnen allen ein ehrenvolles Begräbnis. Erst dann, sagt die Bibel, erhörte Gott die Gebete für das Land (21,14).<\/p>\n<p>Denk daran, wie David an seinen eigenen Kindern versagt hatte – wie er nichts tat, als seiner Tochter Tamar Gewalt angetan wurde, und seinen Sohn Absalom zwei Jahre lang nicht sehen wollte. Jetzt beschämte eine machtlose Mutter durch ihre bloße treue Gegenwart den König, sodass er tat, was recht war.<\/p>\n<p>In unserer eigenen Zeit haben Mütter dasselbe getan. In Argentinien gingen die „Mütter der Plaza de Mayo“ jahrelang jede Woche über den Platz, mit Fotos ihrer Kinder, die unter der Militärdiktatur „verschwunden“ waren, bis die Welt nicht mehr wegsehen konnte.<\/p>\n<p>Manche Mütter halten auch heute Wache: für ein Kind im Gefängnis, ein Kind im Krankenhaus, ein Kind, das zu Unrecht gestorben ist. Rizpa sagt dir, dass deine treue Gegenwart zählt – auch wenn du das Ergebnis nicht ändern kannst. Liebe, die nicht weggeht, ist eine Art von Macht.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Gibt es eine Lage, in der du dich machtlos fühlst, einem Kind zu helfen? Wie sähe „Wache halten“ aus?<\/li>\n<li>Kennst du eine Mutter, die gerade Wache hält? Wie könntest du sie unterstützen?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Gott, der Rizpa auf dem Felsen gesehen hat,<br />\nsei bei jeder Mutter, die über einem Kind Wache hält, das sie nicht retten kann.<br />\nGib treuer Liebe Kraft,<br />\nund bewege die Mächtigen, gerecht zu handeln. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Bete für eine Mutter, die Wache hält – für ein Kind, das krank, im Gefängnis, vermisst oder verloren ist. Wenn du kannst, schick ihr eine Nachricht, dass sie nicht allein ist.\n<\/p>", "note": "Der Grund für die Hinrichtungen wird in 2. Samuel 21,1–9 genannt; das Gesetz, das verbietet, Kinder für die Sünde ihres Vaters hinzurichten, ist 5. Mose 24,16. Die Erzählung löst die Spannung nicht auf. Die Mütter der Plaza de Mayo begannen ihre wöchentlichen Märsche in Buenos Aires im Jahr 1977.", "art": {"file": "images/m18.webp", "caption": "Rizpa, die ihre Söhne nicht vergessen ließ", "title": "Rizpas Treue gegenüber den Toten", "credit": "Gustave Doré, Bibelillustrationen (1866)", "source": "https://commons.wikimedia.org/wiki/File%3A082.Rizpah%E2%80%99s_Kindness_toward_the_Dead.jpg", "licence": "Public domain", "w": 900, "h": 1111}, "readEn": "2 Samuel 21:1–14"}, {"id": "M19", "n": 19, "title": "„Es ist gut“", "part": 2, "read": "2. Könige 4,8–37", "ref": "2. Könige 4,26.30", "html": "<blockquote>\n<p>„‚Geht es dir gut? Geht es deinem Mann gut? Geht es dem Kind gut?‘ Sie sprach: ‚Es ist gut.‘ … Die Mutter des Knaben aber sprach: ‚So wahr der HERR lebt und so wahr du lebst: Ich lasse nicht von dir.‘“<\/p>\n<p><span class=\"ref\">2. Könige 4,26.30<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">שָׁלוֹם<\/span> (<em>šālôm<\/em>) – „Friede“, „Wohlergehen“, „es ist gut“.<\/p>\n<\/div>\n<p>Die Frau aus Schunem hatte dem Propheten Elisa ein Zimmer in ihrem Haus gegeben. Dafür schenkte Gott ihr einen Sohn, auf den sie nicht zu hoffen gewagt hatte.<\/p>\n<p>Jahre später arbeitete der Junge mit seinem Vater auf dem Feld, als er aufschrie: „Mein Kopf, mein Kopf!“ Man trug ihn zu seiner Mutter; er saß bis zum Mittag auf ihrem Schoß und starb.<\/p>\n<p>Was sie dann tat, ist erstaunlich.<\/p>\n<p>Sie trug ihn hinauf, legte ihn auf das Bett des Propheten und schloss die Tür. Ihrem Mann sagte sie nichts als „Es ist gut“ – <em>šālôm<\/em>. Sie sattelte einen Esel und ritt, so schnell sie konnte, zu Elisa.<\/p>\n<p>Als Elisas Diener ihr entgegenlief und fragte: „Geht es dem Kind gut?“, sagte sie wieder: „Es ist gut.“<\/p>\n<p>Dann erreichte sie Elisa, fiel ihm zu Füßen und ließ nicht mehr los.<\/p>\n<p>Ihr „Es ist gut“ war keine Verdrängung. Es war Entschlossenheit. Sie weigerte sich zusammenzubrechen, bevor sie den einen Menschen erreicht hatte, der helfen konnte. Sie vergeudete keine Kraft damit, anderen etwas zu erklären; sie ging direkt zur Quelle.<\/p>\n<p>Und als Elisa seinen Diener mit seinem Stab vorausschicken wollte, lehnte sie ab. „So wahr der HERR lebt und so wahr du lebst: Ich lasse nicht von dir.“ Sie nahm keinen Ersatz an. Sie wollte den Propheten selbst.<\/p>\n<p>Elisa ging mit, und der Junge wurde zum Leben erweckt.<\/p>\n<p>Nicht jede Geschichte endet so. Viele Mütter haben mit derselben Entschlossenheit gebetet und ihr Kind trotzdem verloren. 1873 verlor ein Vater namens Horatio Spafford bei einem Schiffsunglück seine vier Töchter und schrieb danach das Lied „It Is Well with My Soul“ (auf Deutsch gesungen als „Wenn Friede mit Gott meine Seele durchdringt“). Manchmal wird „Es ist gut“ in tiefster Trauer gesprochen, nicht nach einem Wunder.<\/p>\n<p>Aber die Schunemiterin zeigt uns etwas, das jede Mutter tun kann: die Not direkt zu Gott bringen, nicht loslassen und darauf vertrauen, dass er hört.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Wohin gehst du in einer Krise zuerst? Gehst du „direkt zur Quelle“?<\/li>\n<li>Gibt es etwas für dein Kind, das du vor Gott festhalten musst, ohne loszulassen?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, wenn mein Kind in Not ist, gib mir die Entschlossenheit der Schunemiterin:<br />\ndirekt zu dir zu kommen, festzuhalten und nicht loszulassen.<br />\nUnd ob du mit einem Wunder antwortest oder mit deiner Gegenwart –<br />\nlehre meine Seele zu sagen: Es ist gut. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Bring ein dringendes Anliegen für ein Kind direkt zu Gott im Gebet – und bring es diese Woche jeden Tag wieder.\n<\/p>", "note": "Horatio Spaffords vier Töchter kamen 1873 beim Untergang der <em>Ville du Havre<\/em> ums Leben; danach schrieb er „It Is Well with My Soul“.", "readEn": "2 Kings 4:8–37"}, {"id": "M20", "n": 20, "title": "Mehr wert als sieben Söhne", "part": 2, "read": "Rut 1,1–22; 4,13–17", "ref": "Rut 4,15–16", "html": "<blockquote>\n<p>„… denn deine Schwiegertochter, die dich liebt, hat ihn geboren, und sie ist dir mehr wert als sieben Söhne. Und Noomi nahm das Kind, legte es auf ihren Schoß und wurde seine Pflegemutter.“<\/p>\n<p><span class=\"ref\">Rut 4,15–16<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">אֹמֶנֶת<\/span> (<em>ʾōmenet<\/em>) – „Pflegemutter“, „Amme“, „eine, die für ein Kind sorgt“.<\/p>\n<\/div>\n<p>Als Noomi nach Bethlehem zurückkam, hatte sie alles verloren: Ihr Mann und ihre beiden Söhne waren in einem fremden Land gestorben. „Nennt mich nicht Noomi“ (das heißt „die Liebliche“), sagte sie zu den Frauen der Stadt. „Nennt mich Mara“ („die Bittere“) (1,20).<\/p>\n<p>Das Einzige, was sie mit nach Hause brachte, war Rut, ihre moabitische Schwiegertochter, die sich geweigert hatte, sie zu verlassen. „Wo du hingehst, da will ich auch hingehen; wo du bleibst, da bleibe ich auch. Dein Volk ist mein Volk, und dein Gott ist mein Gott“ (1,16).<\/p>\n<p>Das Buch Rut ist unter anderem die Geschichte davon, wie Noomi wieder Mutter wird.<\/p>\n<p>Rut heiratet Boas und bringt einen Sohn zur Welt. Und dann geschieht etwas Schönes. Noomi nimmt das Baby in die Arme und wird seine <em>ʾōmenet<\/em> – seine Pflegemutter, seine Amme, die, die für es sorgt. Die Frauen der Stadt sagen: „Noomi ist ein Sohn geboren!“ (4,17).<\/p>\n<p>Und über Rut sagen sie etwas noch Bemerkenswerteres: Sie „ist dir mehr wert als sieben Söhne“. In einer Kultur, die Söhne über fast alles schätzte, war das ein erstaunlicher Satz über eine Schwiegertochter – noch dazu über eine Ausländerin.<\/p>\n<p>Dieses kleine Buch dehnt das Muttersein in zwei Richtungen.<\/p>\n<p><strong>Über die Grenze des Blutes hinaus.<\/strong> Eine Großmutter wird Mutter. Eine Schwiegertochter wird mehr als eine Tochter.<\/p>\n<p><strong>Über die Grenze des Volkes hinaus.<\/strong> Eine Moabiterin wird die Urgroßmutter König Davids – und eine Vorfahrin Jesu (Matthäus 1,5).<\/p>\n<p>Viele Familien sehen heute aus wie die Noomis: zusammengesetzt, zerbrochen und neu gebaut, über Generationen und Kulturen hinweg. Großmütter, die Enkel großziehen. Stiefmütter. Schwiegermütter, die zu echten Müttern werden. Das Buch Rut sagt: Auch das ist Muttersein – und Gott ist darin.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Gibt es jemanden außerhalb deiner „Blutsverwandtschaft“, der dir Mutter oder Tochter geworden ist?<\/li>\n<li>Gibt es ein Kind – ein Enkelkind, ein Stiefkind, ein Pflegekind –, das Gott dir „in die Arme legen“ will?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, du hast Noomis Bitterkeit in Freude verwandelt.<br />\nDanke für die Familien, die du über Blut und Grenzen hinaus baust.<br />\nWo ich leer bin, fülle mich;<br />\nund zeig mir, wen ich halten soll. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Danke einer Schwiegertochter, Stiefmutter, Großmutter oder einer anderen „Rut“ oder „Noomi“ in deinem Leben für das, was sie dir bedeutet.\n<\/p>", "note": "Rut erscheint im Stammbaum Jesu, Matthäus 1,5.", "art": {"file": "images/m20.webp", "caption": "Noomi und Rut auf dem Weg nach Bethlehem", "title": "Noomi und ihre Schwiegertöchter", "credit": "Gustave Doré, Bibelillustrationen (1866)", "source": "https://commons.wikimedia.org/wiki/File%3A068.Naomi_and_Her_Daughters-in-Law.jpg", "licence": "Public domain", "w": 900, "h": 1124}, "readEn": "Ruth 1:1–22; 4:13–17"}, {"id": "M21", "n": 21, "title": "Maria bewegte es in ihrem Herzen", "part": 2, "read": "Lukas 1,26–38; 2,15–19.41–52", "ref": "Lukas 2,19.34–35", "html": "<blockquote>\n<p>„Maria aber bewahrte alle diese Worte und bewegte sie in ihrem Herzen … Und Simeon sprach zu Maria, seiner Mutter: ‚Auch durch deine Seele wird ein Schwert dringen.‘“<\/p>\n<p><span class=\"ref\">Lukas 2,19.34–35<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> συνετήρει (<em>synetērei<\/em>) – griechisch „sie bewahrte“, „sie hütete“, „sie hielt sorgsam fest“. Es wird davon gebraucht, etwas sicher zu verwahren.<\/p>\n<\/div>\n<p>Maria ist die berühmteste Mutter der Geschichte. Und doch erzählen die Evangelien überraschend wenig über sie. Was sie uns geben, sind ein paar „Augenblicke“, und jeder zeigt eine andere Seite des Mutterseins.<\/p>\n<p><strong>Sie sagte Ja.<\/strong> Als der Engel ihr sagte, dass sie ein Kind gebären würde, antwortete sie: „Mir geschehe nach deinem Wort“ (1,38). Ihr Muttersein begann mit Vertrauen – in einer Lage, die ihr Schande hätte einbringen können.<\/p>\n<p><strong>Sie wusste, dass man sich an sie erinnern würde.<\/strong> In ihrem Lied, dem Magnificat, sagt sie: „Von nun an werden mich seligpreisen alle Geschlechter“ (1,48). Und so ist es gekommen. Über weite Strecken der christlichen Geschichte, und besonders in der katholischen und orthodoxen Kirche, ist Maria als Mutter des Herrn über alle anderen geehrt worden; schon im Jahr 431 nannte die Kirche sie <em>Theotokos<\/em>, „Gottesgebärerin“ – ein Titel, der zuerst ein Bekenntnis darüber war, wer Jesus ist. Christen denken unterschiedlich darüber, wie man sie ehren soll. Aber kein Buch über die Mütter der Bibel kann sie am Rand stehen lassen.<\/p>\n<p><strong>Sie bewegte es in ihrem Herzen.<\/strong> Als die Hirten mit ihrer seltsamen Geschichte kamen, „bewahrte Maria alle diese Worte und bewegte sie in ihrem Herzen“ (2,19). Später, nachdem der zwölfjährige Jesus im Tempel geblieben war, sagt Lukas es noch einmal: Sie „bewahrte alle diese Worte in ihrem Herzen“ (2,51).<\/p>\n<p>Maria verstand ihren Sohn nicht ganz. Aber sie hielt fest, was sie sah und hörte, und dachte weiter darüber nach. Das ist eine Art Liebe: geduldig, aufmerksam, nachdenklich.<\/p>\n<p><strong>Sie wurde gewarnt.<\/strong> Simeon sagte ihr: „Auch durch deine Seele wird ein Schwert dringen.“ Zu Marias Muttersein würde tiefer Schmerz gehören – am Ende, ihren Sohn sterben zu sehen.<\/p>\n<p><strong>Sie suchte voller Angst.<\/strong> Als Jesus in Jerusalem verschwunden war, suchten sie und Josef drei Tage lang. „Dein Vater und ich haben dich mit Schmerzen gesucht“ (2,48). Selbst die Mutter Jesu kannte die Panik um ein verlorenes Kind.<\/p>\n<p><strong>Sie wies von sich weg.<\/strong> Bei der Hochzeit in Kana sagte sie zu den Dienern: „Was er euch sagt, das tut“ (Johannes 2,5).<\/p>\n<p><strong>Sie stand unter dem Kreuz<\/strong> (Johannes 19,25) – und danach betete sie mit den Jüngern (Apostelgeschichte 1,14).<\/p>\n<p>Marias Muttersein war kein Märchen. Es war Vertrauen, Nachdenken, Verwirrung, Angst, Schmerz und Treue. Viele Mütter werden in ihr keine ferne Heilige finden, sondern eine Weggefährtin.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Was „bewegst“ du über deine Kinder in deinem Herzen – Dinge, die du noch nicht verstehst?<\/li>\n<li>Welcher „Augenblick“ aus Marias Muttersein spricht dich gerade am meisten an?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, danke für Maria, die Ja sagte, nachdachte und standhielt.<br />\nGib mir ihr Vertrauen, wenn ich nicht verstehe,<br />\nihre Geduld, weiter hinzusehen,<br />\nund ihren Mut, meinen Kindern im Schmerz beizustehen. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Schreib über jedes deiner Kinder eine Sache auf, die du „bewahren und bewegen“ willst – etwas, das dir aufgefallen ist, das du aber noch nicht ganz verstehst.\n<\/p>", "note": "Siehe Beverly Roberts Gaventa, <em>Mary: Glimpses of the Mother of Jesus<\/em> (1995). Der Titel <em>Theotokos<\/em> wurde auf dem Konzil von Ephesus (431) gegen Nestorius bekräftigt, als Bekenntnis, dass der von Maria Geborene der menschgewordene Gott ist.", "readEn": "Luke 1:26–38; 2:15–19, 41–52"}, {"id": "M22", "n": 22, "title": "Die Mutter, die kein Nein hinnahm", "part": 2, "read": "Markus 7,24–30; Matthäus 15,21–28", "ref": "Markus 7,28–29", "html": "<blockquote>\n<p>„Sie aber antwortete ihm: ‚Ja, Herr – aber auch die Hündlein unter dem Tisch essen von den Brosamen der Kinder.‘ Und er sprach zu ihr: ‚Um dieses Wortes willen geh hin – der Dämon ist von deiner Tochter ausgefahren.‘“<\/p>\n<p><span class=\"ref\">Markus 7,28–29<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> ναί, κύριε (<em>nai, kyrie<\/em>) – griechisch „Ja, Herr“.<\/p>\n<\/div>\n<p>Das ist eines der überraschendsten Gespräche der Evangelien.<\/p>\n<p>Eine nichtjüdische Frau – eine Ausländerin – findet Jesus in einem Haus, in dem er unerkannt bleiben will. Ihre kleine Tochter wird von einem bösen Geist gequält. Sie fällt ihm zu Füßen und fleht ihn um Hilfe an.<\/p>\n<p>Und Jesus scheint abzulehnen. „Lass zuerst die Kinder satt werden; es ist nicht recht, den Kindern das Brot zu nehmen und es den Hündlein vorzuwerfen“ (7,27). Die „Kinder“ sind das Volk Israel; die „Hündlein“ sind die Heiden.<\/p>\n<p>Das ist ein hartes Wort. Viele Mütter wären gekränkt weggegangen.<\/p>\n<p>Sie nicht. Sie antwortet: „Ja, Herr – aber auch die Hündlein unter dem Tisch essen von den Brosamen der Kinder.“<\/p>\n<p>Sie nimmt sein Bild an und dreht es um. <em>Gut, ich sitze nicht am Tisch. Aber ich brauche nur einen Krümel.<\/em> Sie ist demütig, schlagfertig und wild entschlossen – alles um ihrer Tochter willen.<\/p>\n<p>Und Jesus freut sich darüber. In der Fassung des Matthäus sagt er: „Frau, dein Glaube ist groß!“ (15,28). Ihre Tochter wird gesund.<\/p>\n<p>Bei Markus heilt Jesus ihre Tochter „um dieses Wortes willen“ (7,29) – ihre Antwort, nicht seine, hat das letzte Wort. Und sie tut es für ihr Kind.<\/p>\n<p>Mütter müssen oft zu Fürsprecherinnen werden: bei Ärzten, Schulen, Ämtern, Gerichten, sogar in Gemeinden. Man sagt ihnen „Nein“ oder „Noch nicht“ oder „Dafür sind wir nicht zuständig“. Manche geben auf. Diese Mutter zeigt den Glauben, der weiter bittet – demütig, klug und ohne loszulassen –, weil das Leben eines Kindes davon abhängt.<\/p>\n<p>Jesus tadelt diese Art von Beharrlichkeit nicht. Er lobt sie.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Wo musst du gerade für ein Kind eintreten? Warst du versucht aufzugeben?<\/li>\n<li>Wie sieht es aus, im Gebet zugleich demütig und beharrlich zu sein?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, danke für diese Mutter, die kein Nein als Antwort hinnahm.<br />\nGib mir ihren Glauben – demütig, klug und unerschütterlich –,<br />\ndass ich weiter bitte, für meine Kinder und für andere,<br />\nbis deine Hilfe kommt. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Tu einen praktischen Schritt, um für ein Kind einzutreten – einen Anruf, einen Brief, ein Gespräch, das du aufgeschoben hast.\n<\/p>", "note": "Matthäus nennt sie eine Kanaanäerin (15,22); Markus nennt sie eine Griechin, von Geburt Syrophönizierin (7,26). Bei Markus heilt Jesus ihre Tochter „um dieses Wortes willen“ (7,29): Ihre Antwort, nicht seine, hat das letzte Wort. Dazu, wie ungewöhnlich das unter den Geschichten der Evangelien ist, siehe Sharon H. Ringe, „A Gentile Woman’s Story“, in Letty M. Russell (Hg.), <em>Feminist Interpretation of the Bible<\/em> (1985), und ihren Aufsatz „A Gentile Woman’s Story, Revisited“, in <em>A Feminist Companion to Mark<\/em> (2001).", "readEn": "Mark 7:24–30; Matthew 15:21–28"}, {"id": "M23", "n": 23, "title": "Eva: Freude und Trauer in einem Kapitel", "part": 3, "read": "1. Mose 4,1–16.25–26", "ref": "1. Mose 4,1.25", "html": "<blockquote>\n<p>„Eva wurde schwanger und gebar Kain, und sie sprach: ‚Ich habe einen Mann gewonnen – zusammen mit dem HERRN!‘ … Sie gebar einen Sohn und nannte ihn Set: ‚Denn Gott hat mir einen anderen Nachkommen gesetzt für Abel, weil Kain ihn erschlagen hat.‘“<\/p>\n<p><span class=\"ref\">1. Mose 4,1.25<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">קָנִיתִי<\/span> (<em>qānîtî<\/em>) – „ich habe gewonnen“, „ich habe geschaffen“. Evas erstes Wort als Mutter ist ein Jubelruf: Sie hat einen neuen Menschen hervorgebracht, zusammen mit Gott.<\/p>\n<\/div>\n<p>Die erste Mutter der Bibel beginnt mit einem Freudenschrei. Als Kain geboren wird, ruft Eva: „Ich habe einen Mann geschaffen – zusammen mit dem HERRN!“ Jede Mutter, die ihr erstes Kind im Arm gehalten hat, kennt etwas von diesem Staunen.<\/p>\n<p>Und dann, im selben Kapitel, geschieht das Schlimmste, was man sich vorstellen kann. Einer ihrer Söhne tötet den anderen.<\/p>\n<p>Die Bibel überliefert keine Worte Evas, als Abel stirbt. Gar nichts. Vielleicht gab es keine Worte.<\/p>\n<p>Man hätte viele Kapitel über ihre Trauer schreiben können, aber die Bibel gibt nur noch einen Satz. Als sie wieder einen Sohn bekommt, nennt sie ihn Set und erklärt: „Gott hat mir ein anderes Kind gegeben für Abel, weil Kain ihn erschlagen hat.“<\/p>\n<p>In diesem einen Satz liegen Trauer und Hoffnung zugleich. Sie tut nicht so, als wäre Abel ersetzt. Sie spricht aus, was geschehen ist – „Kain hat ihn erschlagen“. Und sie nimmt ein neues Kind als Geschenk von Gott an.<\/p>\n<p>Eva ist keine „schlechte“ Mutter. Aber die erste Mutter der Schrift ist auch die erste Mutter, die ein Kind verliert, und die erste Mutter, deren Kinder sich gegeneinander wandten.<\/p>\n<p>Das ist für viele Mütter wichtig:<\/p>\n<ul>\n<li>Mütter, deren Kinder miteinander im Streit liegen;<\/li>\n<li>Mütter, die ein Kind verloren haben;<\/li>\n<li>Mütter, die Freude und Schmerz im selben Herzen tragen.<\/li>\n<\/ul>\n<p>Die Geschichte des Mutterseins in der Bibel beginnt mit beidem. Sie verlangt nicht von dir, dich zwischen ihnen zu entscheiden. Du kannst deine Trauer halten und trotzdem die Geschenke annehmen, die Gott gibt.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Trägst du Trauer um eines deiner Kinder, während du dich über ein anderes freust?<\/li>\n<li>Gibt es Spannungen zwischen deinen Kindern, die dir das Herz brechen?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, du warst bei Eva in ihrer Freude und in ihrer Trauer.<br />\nSei bei mir in beidem.<br />\nWo meine Kinder im Streit liegen, bring Frieden.<br />\nWo ich verloren habe, gib mir Hoffnung. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Wenn deine Kinder im Streit liegen, bete für jedes von ihnen mit Namen – und such nach einer kleinen Möglichkeit, ihnen zu helfen, einander freundlicher zu sehen.\n<\/p>", "note": "Evas Ruf „Ich habe einen Mann gewonnen“ (1. Mose 4,1) gebraucht das Verb <em>qānâ<\/em>, das Verb, das 5. Mose 32,6 dafür gebraucht, dass Gott Israel zum Vater wurde. Der Text berichtet kein Wort Evas bei Abels Tod; sie spricht erst wieder, als sie Set seinen Namen gibt (4,25).", "art": {"file": "images/m23.webp", "caption": "Die Trauer der ersten Mutter", "title": "Kain erschlägt Abel", "credit": "Gustave Doré, Bibelillustrationen (1866)", "source": "https://commons.wikimedia.org/wiki/File%3ACain_kills_Abel.png", "licence": "Public domain", "w": 900, "h": 1144}, "readEn": "Genesis 4:1–16, 25–26"}, {"id": "M24", "n": 24, "title": "Sara und Hagar: Die Herrin und die Sklavin", "part": 3, "read": "1. Mose 16,1–13; 21,8–21", "ref": "1. Mose 16,13; 21,16", "html": "<blockquote>\n<p>„Und sie nannte den Namen des HERRN, der mit ihr redete: ‚Du bist El-Roï – ein Gott, der mich sieht.‘ … ‚Ich kann nicht mit ansehen, wie das Kind stirbt.‘“<\/p>\n<p><span class=\"ref\">1. Mose 16,13; 21,16<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">אֵל רֳאִי<\/span> (<em>ʾēl rŏʾî<\/em>) – „ein Gott, der mich sieht“. Hagar, eine ägyptische Sklavin, gibt Gott diesen Namen.<\/p>\n<\/div>\n<p>Sara konnte keine Kinder bekommen. In ihrer Verzweiflung gab sie Abraham ihre ägyptische Sklavin Hagar, in der Hoffnung, durch sie ein Kind zu bekommen – ein Brauch jener Zeit. Hagar wurde nicht gefragt.<\/p>\n<p>Es gelang, und es ging furchtbar schief. Als Hagar schwanger wurde, sah sie auf Sara herab. Sara beschwerte sich bei Abraham, und er wusch seine Hände in Unschuld: „Deine Sklavin ist in deiner Hand; tu mit ihr, was dir gut erscheint.“ Und Sara, so sagt die Bibel, „demütigte sie“ (16,6). Das hebräische Wort ist dasselbe, das später für Ägyptens grausame Unterdrückung der Israeliten gebraucht wird. Die Mutter von Gottes Volk behandelte ihre ägyptische Sklavin so, wie Ägypten eines Tages ihre Nachkommen behandeln würde.<\/p>\n<p>Hagar floh in die Wüste. Und dort, allein und schwanger, begegnete ihr der Engel des HERRN. Sie gab Gott einen Namen: „Du bist ein Gott, der mich sieht.“ Oft wird bemerkt, dass sie der einzige Mensch im Alten Testament ist, der Gott einen Namen gibt.<\/p>\n<p>Jahre später, nachdem Isaak geboren war, bestand Sara darauf, Hagar und ihren Sohn Ismael zu vertreiben. In der Wüste ging das Wasser aus. Hagar legte den Jungen unter einen Strauch und setzte sich in einiger Entfernung hin: „Ich kann nicht mit ansehen, wie das Kind stirbt.“ Und Gott hörte den Jungen, öffnete ihr die Augen und zeigte ihr einen Brunnen.<\/p>\n<p>Das ist keine Geschichte von zwei Rivalinnen. Es ist die Geschichte einer Frau, die eine andere Frau besaß – und ihren Körper benutzte, um ein Kind zu bekommen. Leserinnen und Leser, die von versklavten Menschen abstammen, haben in Hagar oft ihre eigenen Mütter und Großmütter gesehen: benutzt, verstoßen und doch von Gott gesehen.<\/p>\n<p>Es ist auch eine Warnung für Mütter heute. Der leidenschaftliche Schutzinstinkt einer Mutter für ihre eigenen Kinder kann sich gegen andere Frauen richten – besonders gegen Frauen mit weniger Macht: die Kinderfrau, die Putzhilfe, die geflüchtete Mutter, die Frau, deren Kinder nicht willkommen sind.<\/p>\n<p>Sara bleibt die Mutter der Verheißung. Gott hält ihr gegenüber weiter sein Wort. Aber die Bibel sorgt auch dafür, dass wir Hagar sehen – und dass Gott sie sieht. Er stellt sich auf die Seite der Mutter, die verstoßen wurde.<\/p>\n<p>Wenn du eine Hagar bist: Er sieht dich. Wenn du eine Sara gewesen bist: Es ist nicht zu spät umzukehren.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Wurdest du schon einmal von einer anderen Mutter verletzt? Hast du eine verletzt?<\/li>\n<li>Gibt es eine Frau mit weniger Macht als du – bei der Arbeit, in deinem Haus, in deinem Umfeld –, die du so sehen könntest, wie Gott Hagar sieht?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Gott, der sieht, du hast Hagar in der Wüste gesehen.<br />\nSieh jede Mutter, die beiseitegestoßen wurde.<br />\nVergib mir, wo ich eine andere Mutter verletzt habe,<br />\nund mach mich stattdessen zu ihrer Freundin. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Sprich oder schreib ein ehrlich ermutigendes Wort an eine Mutter, mit der du schwer zurechtkommst.\n<\/p>", "note": "Das Verb für Saras Behandlung Hagars (<em>ʿinnâ<\/em>, „demütigen, bedrücken“) wird für Ägyptens Unterdrückung Israels gebraucht, 1. Mose 15,13 und 2. Mose 1,11–12. Zu Hagar siehe Phyllis Trible, <em>Texts of Terror<\/em> (1984; deutsch: <em>Mein Gott, warum hast du mich vergessen!<\/em>, 1987). Zu Hagar als versklavter Frau siehe Delores S. Williams, <em>Sisters in the Wilderness<\/em> (1993), und Renita J. Weems, <em>Just a Sister Away<\/em> (1988).", "art": {"file": "images/m24.webp", "caption": "Hagar in der Wüste, gesehen von dem Gott, der sieht", "title": "Hagar und Ismael in der Wüste", "credit": "Gustave Doré, Bibelillustrationen (1866)", "source": "https://commons.wikimedia.org/wiki/File%3A015.Hagar_and_Ishmael_in_the_Wilderness.jpg", "licence": "Public domain", "w": 900, "h": 1134}, "readEn": "Genesis 16:1–13; 21:8–21"}, {"id": "M25", "n": 25, "title": "Rebekka: „Der Fluch komme auf mich“", "part": 3, "read": "1. Mose 25,19–28; 27,1–17.41–46", "ref": "1. Mose 27,13", "html": "<blockquote>\n<p>„Da sprach seine Mutter zu ihm: ‚Der Fluch komme auf mich, mein Sohn. Gehorche nur meiner Stimme.‘“<\/p>\n<p><span class=\"ref\">1. Mose 27,13<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">קִלְלָתְךָ<\/span> (<em>qilĕlātĕkā<\/em>) – „dein Fluch“.<\/p>\n<\/div>\n<p>Rebekka ist eine der stärksten Frauen im 1. Buch Mose. Als ihre Schwangerschaft schwer war, „ging sie hin, den HERRN zu befragen“ – selbst (25,22), etwas Seltenes für jeden Menschen in dieser Geschichte. Und Gott sagte ihr, dass sie Zwillinge trug und dass „der Ältere dem Jüngeren dienen wird“.<\/p>\n<p>Dann fügt die Bibel einen Satz hinzu, der viel von dem erklärt, was folgt: „Isaak hatte Esau lieb … Rebekka aber hatte Jakob lieb“ (25,28).<\/p>\n<p>Jahre später, als Isaak alt und blind war und Esau seinen Segen geben wollte, schmiedete Rebekka einen Plan. Sie zog Jakob die Kleider seines Bruders an, bedeckte seine Arme mit Ziegenfellen, kochte das Essen und schickte ihn hinein, um seinen Vater zu täuschen.<\/p>\n<p>Als Jakob Angst hatte, er könnte verflucht werden, sagte sie: „Der Fluch komme auf mich, mein Sohn.“<\/p>\n<p>Das ist ein erstaunlicher Satz. Er zeigt leidenschaftliche, opferbereite Liebe. Er zeigt auch eine Mutter, die bereit ist, ihren Mann zu täuschen und ihren anderen Sohn zu betrügen, um für ihren Liebling zu bekommen, was sie wollte.<\/p>\n<p>Vielleicht glaubte sie, sie helfe Gottes Verheißung, wahr zu werden. Aber die Bibel billigt ihre Methode nicht. Und der Preis war hoch. Esau schwor, Jakob zu töten, und Rebekka musste ihren geliebten Sohn wegschicken, „für einige Zeit“ (27,44). Sie sah ihn nie wieder. Die Bibel berichtet nicht einmal von ihrem Tod.<\/p>\n<p>Rebekkas Geschichte ist eine Warnung vor zwei Dingen, zu denen Mütter versucht sein können:<\/p>\n<ul>\n<li><strong>ein Kind zu bevorzugen<\/strong>, auch ohne es zu wollen;<\/li>\n<li><strong>Ereignisse zu manipulieren<\/strong>, um zu sichern, was wir für das Beste für unsere Kinder halten – sogar das, von dem wir glauben, dass Gott es für sie will.<\/li>\n<\/ul>\n<p>Gott brauchte Rebekkas Täuschung nicht, um seine Verheißung zu halten. Und er braucht unsere nicht. Gott die Zukunft unserer Kinder anzuvertrauen, heißt, sich zu weigern, für sie zu betrügen.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Gibt es ein Kind, das du von Natur aus bevorzugst? Wie könnten deine anderen Kinder das sehen?<\/li>\n<li>Versuchst du, für eines deiner Kinder ein Ergebnis zu steuern oder zu manipulieren?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, vergib mir, wo ich versuche, die Zukunft meiner Kinder durch eigene Pläne zu sichern.<br />\nHilf mir, jedes von ihnen ganz zu lieben<br />\nund dir die Verheißungen anzuvertrauen, die ich nicht in der Hand habe. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Achte auf jede Lage, in der du für ein Kind „die Fäden ziehst“. Entscheide dich, zurückzutreten und es Gott anzuvertrauen.\n<\/p>", "note": "Der Tod von Rebekkas Amme Debora wird berichtet (1. Mose 35,8), der Rebekkas nicht.", "art": {"file": "images/m25.webp", "caption": "Isaak segnet Jakob, wie Rebekka es geplant hatte", "title": "Isaak segnet Jakob", "credit": "Gustave Doré, Bibelillustrationen (1866)", "source": "https://commons.wikimedia.org/wiki/File%3AIsaac_Blessing_Jacob_%2889394529%29.jpg", "licence": "Public domain", "w": 900, "h": 1141}, "readEn": "Genesis 25:19–28; 27:1–17, 41–46"}, {"id": "M26", "n": 26, "title": "Lea und Rahel: Namen, die Wunden tragen", "part": 3, "read": "1. Mose 29,31–30,24", "ref": "1. Mose 29,32", "html": "<blockquote>\n<p>„Und Lea wurde schwanger und gebar einen Sohn; den nannte sie Ruben, denn sie sprach: ‚Der HERR hat mein Elend angesehen; nun wird mein Mann mich lieben.‘“<\/p>\n<p><span class=\"ref\">1. Mose 29,32<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">רְאוּבֵן<\/span> (<em>rĕʾûbēn<\/em>) – „Ruben“. Der Name klingt wie „Seht – ein Sohn!“ und zugleich wie „Er hat mein Elend gesehen“.<\/p>\n<\/div>\n<p>In vielen Geschichten der Bibel ist es die Mutter, die dem Kind den Namen gibt. Und in der Geschichte von Lea und Rahel sehen wir, was das bedeuten kann.<\/p>\n<p>Jakob liebte Rahel und wurde dazu gebracht, zuerst ihre ältere Schwester Lea zu heiraten. So war Lea die ungeliebte Frau – und Jakob verbarg es nie. Jedes Mal, wenn sie einen Sohn bekam, gab sie ihm einen Namen, der in Wahrheit eine Botschaft an ihren Mann war:<\/p>\n<ul>\n<li><strong>Ruben<\/strong> – „Der HERR hat mein Elend angesehen. Nun wird mein Mann mich lieben.“<\/li>\n<li><strong>Simeon<\/strong> – „Der HERR hat gehört, dass ich ungeliebt bin.“<\/li>\n<li><strong>Levi<\/strong> – „Nun endlich wird mein Mann an mir hängen.“<\/li>\n<\/ul>\n<p>Rahel, geliebt, aber kinderlos, schrie Jakob an: „Gib mir Kinder, sonst sterbe ich!“ (30,1). Jakobs einzige Antwort war Zorn: „Bin ich denn an Gottes statt?“ (30,2). Sie gab ihm ihre Magd Bilha, und als Bilha einen Sohn bekam, nannte Rahel ihn Naftali: „Ich habe einen gewaltigen Kampf mit meiner Schwester gekämpft, und ich habe gewonnen“ (30,8).<\/p>\n<p>Achte darauf, wer <em>nicht<\/em> spricht. Bilha und Silpa, die Sklavinnen, die vier dieser Söhne tatsächlich geboren haben, geben ihren eigenen Kindern nie einen Namen. Ihre Herrinnen tun es für sie. Die Bibel überliefert von keiner der beiden ein einziges Wort.<\/p>\n<p>Stell dir vor, mit so einem Namen aufzuwachsen. Jedes Mal, wenn jemand dich ruft, wiederholt er die Klage deiner Mutter gegen ihren Mann – oder ihren Sieg über ihre Schwester.<\/p>\n<p>Die zwölf Söhne Jakobs wuchsen in dieser Rivalität auf. Und der Hass der älteren Brüder auf Josef, Rahels Sohn, war das nächste Kapitel desselben Krieges.<\/p>\n<p>Kinder tragen oft die Konflikte ihrer Eltern mit sich herum: in unglücklichen Ehen, bei Scheidungen, in Familienfehden. Sie hören die Klagen. Sie sollen Partei ergreifen. Sie tragen die Namen, die wir ihnen geben – manchmal wörtlich, manchmal in den Worten, die wir über ihnen aussprechen.<\/p>\n<p>Und doch hat die Geschichte einen Wendepunkt. Als Lea ihren vierten Sohn bekam, nannte sie ihn Juda und sagte schlicht: „Diesmal will ich den HERRN loben“ (29,35). Zum ersten Mal ging es bei dem Namen nicht um ihren Mann. Es ging um Gott.<\/p>\n<p>Aus Juda kamen König David – und Jesus.<\/p>\n<p>Noch ein Schweigen. Lea hatte auch eine Tochter, Dina (1. Mose 30,21). Als Dina vergewaltigt wurde (1. Mose 34), nahmen ihre Brüder Rache, und ihr Vater sorgte sich um seinen Ruf – und ihre Mutter wird mit keinem Wort erwähnt. Die Bibel zeigt uns Mütter fast nie mit ihren Töchtern. Wenn du Mutter von Töchtern bist, schreibst du eine Geschichte, die die Bibel größtenteils leer lässt.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Tragen deine Kinder etwas von deinen Konflikten mit – mit einem Partner, einem Ex oder einem Verwandten?<\/li>\n<li>Welche Worte, oft gesagt, prägen, wie deine Kinder sich selbst sehen?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, du hast Leas Elend gesehen und Rahels Schrei gehört.<br />\nBewahre mich davor, meine Wunden auf meine Kinder zu legen.<br />\nLass die Namen, die ich über ihnen ausspreche, Worte des Segens sein,<br />\nund lass mein Zuhause ein Ort des Lobes sein, nicht der Rivalität. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Sprich über jedem Kind einen Satz des Segens aus – über das, wer es ist, nicht über irgendjemand anderen.\n<\/p>", "note": "Die Erklärungen der Namen sind Wortspiele, keine strengen Wortableitungen. Zur Namensgebung durch Mütter siehe Edward J. Bridge, „A Mother’s Influence: Mothers Naming Children in the Hebrew Bible“, <em>Vetus Testamentum<\/em> 64 (2014). Zur Rivalität zwischen den „Häusern“ verschiedener Mütter in einem Haushalt siehe Cynthia R. Chapman, <em>The House of the Mother<\/em> (2016). Dasselbe Kind kann in einem Bericht von seiner Mutter und in einem anderen von seinem Vater benannt werden: Eva benennt Set in 1. Mose 4,25, Adam in 1. Mose 5,3. Rahel und Lea gaben den Söhnen Bilhas und Silpas die Namen (1. Mose 30,6–13). Leas Tochter Dina erscheint in 1. Mose 30,21 und 34.", "art": {"file": "images/m26.webp", "caption": "Jakob begegnet Rahel am Brunnen", "title": "Jakob hütet Labans Herden und begegnet Rahel", "credit": "Gustave Doré, Bibelillustrationen (1866)", "source": "https://commons.wikimedia.org/wiki/File%3A022.Jacob_Tends_Laban%27s_Flocks_and_Meets_Rachel.jpg", "licence": "Public domain", "w": 900, "h": 1134}, "readEn": "Genesis 29:31–30:24"}, {"id": "M27", "n": 27, "title": "Ein Kind für eigene Zwecke benutzen", "part": 3, "read": "Markus 6,17–28; Matthäus 20,20–28", "ref": "Markus 6,24", "html": "<blockquote>\n<p>„Das Mädchen ging hinaus und fragte seine Mutter: ‚Was soll ich erbitten?‘ Die sagte: ‚Den Kopf Johannes des Täufers.‘“<\/p>\n<p><span class=\"ref\">Markus 6,24<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> αἰτήσωμαι (<em>aitēsōmai<\/em>) – griechisch „Soll ich bitten?“ oder „Worum soll ich bitten?“<\/p>\n<\/div>\n<p>Zwei Mütter in den Evangelien zeigen, wie leicht der Ehrgeiz einer Mutter das Leben eines Kindes vereinnahmen kann.<\/p>\n<p>Die erste ist <strong>Herodias<\/strong>. Sie hasste Johannes den Täufer, der ihre Ehe mit Herodes verurteilt hatte. Bei Herodes’ Geburtstagsfest tanzte ihre Tochter, und der König versprach ihr begeistert alles, was sie erbitten würde. Das Mädchen ging zu seiner Mutter: „Was soll ich erbitten?“<\/p>\n<p>Herodias zögerte nicht. „Den Kopf Johannes des Täufers.“<\/p>\n<p>Eine Mutter machte ihre eigene Tochter zum Werkzeug eines Mordes. Der Moment der Freude des Mädchens wurde zum Mittel für den Groll ihrer Mutter. Markus erzählt die Geschichte, um zu erklären, wie Johannes der Täufer starb, nicht um etwas über Muttersein zu lehren – aber der kurze Einblick ist trotzdem eine Warnung.<\/p>\n<p>Die zweite Mutter ist sanfter. <strong>Die Mutter von Jakobus und Johannes<\/strong> kam zu Jesus, kniete vor ihm nieder und bat, dass ihre beiden Söhne in seinem Reich zu seiner Rechten und zu seiner Linken sitzen dürften (Matthäus 20,20–21). Sie wollte das Beste für sie – die höchsten Plätze.<\/p>\n<p>Jesus schalt sie nicht. Aber er wandte sich an ihre Söhne und fragte: „Könnt ihr den Kelch trinken, den ich trinken werde?“ Er lenkte ihren Ehrgeiz weg von Stellung und hin zu Treue, sogar zum Leiden. Und später wird genau diese Mutter unter den Frauen genannt, die in der Nähe des Kreuzes standen (Matthäus 27,56). Ihr Ehrgeiz war in Treue verwandelt worden.<\/p>\n<p>Die meisten Mütter würden nie tun, was Herodias tat. Aber es gibt leisere Arten, Kinder für eigene Zwecke zu benutzen:<\/p>\n<ul>\n<li>durch ihre Leistungen leben, sodass ihr Erfolg unser Erfolg wird;<\/li>\n<li>sie zu unseren eigenen unerfüllten Träumen drängen;<\/li>\n<li>sie als Boten oder Waffen im Streit mit dem anderen Elternteil benutzen;<\/li>\n<li>uns mehr darum sorgen, wie sie uns dastehen lassen, als darum, wer sie sind.<\/li>\n<\/ul>\n<p>Die Mutter von Jakobus und Johannes zeigt den besseren Weg. Es ist richtig, Gutes für unsere Kinder zu wollen. Aber Jesus bittet uns, für sie zu wollen, was <em>er<\/em> will: nicht die besten Plätze, sondern ein treues Leben.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Lebst du in irgendeiner Weise durch dein Kind – seine Noten, seinen Sport, sein Aussehen, seinen Erfolg?<\/li>\n<li>Was willst du am meisten für deine Kinder? Ist es das, was Jesus für sie will?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, vergib mir, wo ich meine Kinder benutzt habe, um meine eigenen Bedürfnisse zu stillen.<br />\nLenke meinen Ehrgeiz für sie um,<br />\nwie du den Ehrgeiz der Mutter von Jakobus und Johannes umgelenkt hast –<br />\nvon der Stellung zur Treue, von meinem Willen zu deinem. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Frag eines deiner Kinder, was <em>es<\/em> sich für sein eigenes Leben erhofft – und hör zu, ohne zu lenken.\n<\/p>", "note": "Die Mutter der Söhne des Zebedäus erscheint wieder am Kreuz, Matthäus 27,56.", "readEn": "Mark 6:17–28; Matthew 20:20–28"}, {"id": "M28", "n": 28, "title": "Rahel weint", "part": 4, "read": "Jeremia 31,15–17; Matthäus 2,16–18", "ref": "Jeremia 31,15–17", "html": "<p class=\"warning\">\nDiese Andacht ist besonders für Mütter, die ein Kind verloren haben – durch Fehlgeburt, Totgeburt, Krankheit, Unfall, Gewalt oder Entfremdung.\n<\/p>\n<blockquote>\n<p>„In Rama hört man Klagen und bitteres Weinen. Rahel weint über ihre Kinder; sie will sich nicht trösten lassen über ihre Kinder, denn sie sind nicht mehr. So spricht der HERR: ‚Halte deine Stimme zurück vom Weinen und deine Augen von den Tränen … Es gibt Hoffnung für deine Zukunft.‘“<\/p>\n<p><span class=\"ref\">Jeremia 31,15–17<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">מֵאֲנָה לְהִנָּחֵם<\/span> (<em>mēʾănâ lĕhinnāḥēm<\/em>) – „sie will sich nicht trösten lassen“.<\/p>\n<\/div>\n<p>Rahel starb bei einer Geburt. Jahrhunderte später, als das Volk Israel in die Verbannung geführt wurde, hörte der Prophet Jeremia wieder ihre Stimme – die Stimme einer Mutter, die um ihre verlorenen Kinder weint.<\/p>\n<p>Und die Bibel lässt sie sich weigern, getröstet zu werden.<\/p>\n<p>Das ist wichtig. Es gibt eine Art Trauer, die sich nicht trösten lässt, jedenfalls noch nicht. Wohlmeinende Menschen eilen mit Worten herbei – „Du hast ja noch andere Kinder“, „Gott hat einen Engel mehr gebraucht“, „Ihr könnt es ja noch einmal versuchen“. Solche Worte tun meistens mehr weh, als dass sie helfen.<\/p>\n<p>Die Bibel macht das nicht. Sie berichtet von Rahels Weigerung ohne Tadel. Sie gibt ihrer Trauer eine Stimme. Sie nimmt ihr Weinen in die Heilige Schrift auf.<\/p>\n<p>Und dann spricht Gott – nicht um sie zu korrigieren, sondern um zu verheißen: „Es gibt Hoffnung für deine Zukunft.“<\/p>\n<p>Matthäus holt Rahels Weinen in die Weihnachtsgeschichte hinein. Als König Herodes die kleinen Jungen von Bethlehem töten ließ, sagt Matthäus, erfüllte sich, was der Prophet Jeremia gesagt hatte: „Rahel weint über ihre Kinder“ (Matthäus 2,17–18). Mitten in der Geschichte von der Geburt Jesu stehen trauernde Mütter, deren Söhne ermordet wurden. Das Evangelium überspringt sie nicht.<\/p>\n<p>Wenn du ein Kind verloren hast, verlangt die Bibel nicht von dir, „nach vorn zu schauen“. Sie gibt deiner Trauer Raum – sogar einer Trauer, die sich nicht trösten lassen will. Und sie hält eine Hoffnung hin, die deinen Schmerz nicht aufhebt, sondern neben ihm steht: eine Zukunft, in der Gott jede Träne abwischen wird (Offenbarung 21,4).<\/p>\n<p>Wenn du eine trauernde Mutter begleitest, lerne von diesem Abschnitt. Dräng sie nicht. Erkläre nichts. Setz dich zu ihr und lass sie weinen.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Wenn du ein Kind verloren hast: Durftest du trauern? Hast du es dir selbst erlaubt?<\/li>\n<li>Wenn du eine trauernde Mutter kennst: Wie könntest du einfach bei ihr sein?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, du hast Rahel weinen gehört und sie nicht zum Schweigen gebracht.<br />\nHör die Mütter, die um Kinder weinen, die nicht mehr sind.<br />\nHalte ihre Trauer; dräng sie nicht.<br />\nUnd gib ihnen, zu deiner Zeit, Hoffnung für ihre Zukunft. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Wenn du ein Kind verloren hast, sprich seinen Namen laut vor Gott aus. Wenn du eine trauernde Mutter kennst, schick ihr eine Nachricht, in der einfach steht: „Ich denke heute an dein Kind.“\n<\/p>", "note": "Rahel starb bei der Geburt ihres zweiten Sohnes und nannte ihn Ben-Oni, „Sohn meines Schmerzes“; Jakob nannte ihn um in Benjamin (1. Mose 35,18). Jeremia 31,15 macht sie zur Stimme jeder Mutter, die ihre Kinder verloren hat, und Gott antwortet ihr mit einer Verheißung, nicht mit einem Tadel (31,16–17). Matthäus bezieht den Vers auf die Mütter von Bethlehem (2,18).", "readEn": "Jeremiah 31:15–17; Matthew 2:16–18"}, {"id": "M29", "n": 29, "title": "Für die, die sich nach Kindern sehnten", "part": 4, "read": "Jesaja 54,1–5; 56,3–5; Lukas 11,27–28", "ref": "Jesaja 56,5", "html": "<blockquote>\n<p>„Ich will ihnen in meinem Haus und in meinen Mauern ein Denkmal und einen Namen geben – besser als Söhne und Töchter. Einen ewigen Namen will ich ihnen geben, der nicht ausgelöscht wird.“<\/p>\n<p><span class=\"ref\">Jesaja 56,5<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">עֲקָרָה<\/span> (<em>ʿăqārâ<\/em>) – „unfruchtbar“, eine Frau, die keine Kinder bekommen konnte.<\/p>\n<\/div>\n<p>Die Bibel ist voller Frauen, die sich nach Kindern sehnten: Sara, Rebekka, Rahel, Hanna, Elisabet. Ihre Geschichten werden immer wieder erzählt – und in jeder wird am Ende ein Kind geboren.<\/p>\n<p>Für viele Frauen sind diese Geschichten schmerzlich. Wenn Gott Hanna erhört hat, warum nicht mich? War ihr Glaube größer als meiner? Habe ich nicht genug gebetet?<\/p>\n<p>Das muss klar gesagt werden: <strong>Die Geschichten unfruchtbarer Frauen in der Bibel sind kein Versprechen, dass jede Frau, die betet, ein Kind bekommt.<\/strong> Sie handeln davon, dass Gott seine Verheißungen an sein Volk unter unmöglichen Umständen hält. Sie waren nie als Formel gedacht – und sie waren nie dazu gedacht, kinderlosen Frauen das Gefühl zu geben, versagt zu haben.<\/p>\n<p>Wir sollten auch ehrlich sein: Die Bibel sieht Kinder als großen Segen und Kinderlosigkeit als echten Kummer. Als Rahel endlich einen Sohn bekam, sagte sie: „Gott hat meine Schmach von mir genommen“ (1. Mose 30,23), und ein Psalm lobt Gott, weil er „die Unfruchtbare im Haus wohnen lässt als fröhliche Mutter von Kindern“ (Psalm 113,9). Die Schrift tut nie so, als sei die Sehnsucht nach einem Kind klein.<\/p>\n<p>Und doch sagt die Bibel an einigen eindrücklichen Stellen auch, dass der Wert einer Frau vor Gott nicht von Kindern abhängt.<\/p>\n<p><strong>Jesaja sagt den Kinderlosen, sie sollen singen.<\/strong> „Juble, du Unfruchtbare, die nicht geboren hat“ (54,1). Gottes Volk, als kinderlose Frau dargestellt, wird eine Familie verheißen, größer als es sich vorstellen kann.<\/p>\n<p><strong>Jesaja verheißt etwas <em>Besseres<\/em> als Kinder.<\/strong> Denen, die von einer Familie ausgeschlossen waren – den Eunuchen –, sagt Gott: „Ich will ihnen ein Denkmal und einen Namen geben, besser als Söhne und Töchter“ (56,5). Die Verheißung galt zuerst Eunuchen, aber seither hat sie kinderlose Frauen getröstet.<\/p>\n<p><strong>Jesus weigert sich, eine Frau an ihrem Schoß zu messen.<\/strong> Als eine Frau in der Menge ihm zurief: „Selig ist der Leib, der dich getragen hat!“, antwortete Jesus: „Selig sind vielmehr, die Gottes Wort hören und bewahren“ (Lukas 11,27–28). Seligkeit ist nicht an Mutterschaft gebunden. Sie steht jeder Frau offen, die Gott folgt.<\/p>\n<p><strong>Von vielen treuen Frauen der Bibel wird nie gesagt, dass sie Kinder hatten.<\/strong> Mirjam, Hulda, Hanna die Prophetin, Phöbe, Lydia, Maria Magdalena – und vielleicht Debora, die „Mutter in Israel“ (Tag 11). Ihr Wert wird nie in Frage gestellt.<\/p>\n<p>Wenn du dich nach Kindern gesehnt und nie welche bekommen hast oder noch wartest: Du bist in Gottes Augen nicht weniger. Dein Name ist in seinem Haus geschrieben.<\/p>\n<p>Und wenn du Mutter bist, denk an die Frauen um dich herum, für die der Muttertag einer der schwersten Tage des Jahres ist.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Wenn du dich nach Kindern gesehnt hast: Hast du dich verurteilt gefühlt, von anderen oder von dir selbst? Was sagt Gott in diesen Versen über dich?<\/li>\n<li>Wenn du Mutter bist: Wer in deiner Gemeinde oder deinem Umfeld trägt diesen Kummer im Stillen?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, du verheißt einen Namen, besser als Söhne und Töchter.<br />\nFür jede Frau, die sich nach einem Kind gesehnt und vergeblich gewartet hat,<br />\nsei du ihre Freude, ihre Familie und ihr ewiger Name.<br />\nSelig sind, die dein Wort hören und bewahren. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Wenn das dein Kummer ist, sag einer vertrauten Freundin, wie es dir wirklich geht. Wenn nicht, wende dich freundlich einer Frau zu, für die er es ist.\n<\/p>", "note": "Zu den Geschichten unfruchtbarer Frauen als wiederkehrendem Muster siehe Robert Alter, „How Convention Helps Us Read: The Case of the Bible’s Annunciation Type-Scene“, <em>Prooftexts<\/em> 3 (1983), und Mary Callaway, <em>Sing, O Barren One<\/em> (1986). Zu dem schwierigen Vers 1. Timotheus 2,15 („sie wird gerettet werden durch das Kindergebären“) gehen die Auslegungen weit auseinander (siehe Stanley Porter, <em>JSNT<\/em> 49 [1993]; Andreas Köstenberger, <em>BBR<\/em> 7 [1997]); keine der ernsthaften Auslegungen macht Kinder zur Bedingung der Rettung.", "readEn": "Isaiah 54:1–5; 56:3–5; Luke 11:27–28"}, {"id": "M30", "n": 30, "title": "Wenn deine Mutter dir wehgetan hat", "part": 4, "read": "Jesaja 49,14–16; Psalm 27,7–14; 2. Könige 11,1–3", "ref": "Jesaja 49,15; Psalm 27,10", "html": "<blockquote>\n<p>„Selbst wenn sie vergessen – ich vergesse dich nicht … Denn mein Vater und meine Mutter verlassen mich, aber der HERR nimmt mich auf.“<\/p>\n<p><span class=\"ref\">Jesaja 49,15; Psalm 27,10<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">גַּם־אֵלֶּה תִשְׁכַּחְנָה<\/span> (<em>gam-ʾēlleh tiškaḥnâ<\/em>) – „selbst wenn sie vergessen“. Gott gibt zu, dass manche Mütter an ihren Kindern versagen.<\/p>\n<\/div>\n<p>Dieser Tag ist für alle, denen ihre Mutter wehgetan hat – durch Grausamkeit, Vernachlässigung, Manipulation, Gewalt oder eine Kälte, die sie sich nie geliebt fühlen ließ.<\/p>\n<p>Es ist sehr schwer, darüber zu sprechen. Unsere Kultur – und oft auch unsere Gemeinden – behandeln Mütter fast wie etwas Heiliges. Menschen, denen ihre Mütter geschadet haben, wird oft nicht geglaubt, oder man sagt ihnen, sie müssten sie „ehren“, indem sie schweigen.<\/p>\n<p>Die Bibel ist ehrlicher als das.<\/p>\n<p><strong>Sie weiß, dass Mütter versagen können.<\/strong> „Selbst wenn sie vergessen“, sagt Jesaja. Gott tut nicht so, als wäre jede Mutter sicher.<\/p>\n<p><strong>Sie zeigt, wie Gott andere Menschen schickt.<\/strong> Als der mörderische Griff einer Königin nach der Macht einen kleinen Prinzen in Gefahr brachte, brachte seine Tante Joscheba ihn heimlich fort und versteckte ihn mit seiner Amme sechs Jahre lang im Tempel (2. Könige 11,1–3). Das ist eine Geschichte über Politik, nicht über Erziehung – aber sie zeigt etwas, was Gott immer wieder tut: Wo ein Mensch an einem Kind versagt, stellt er einen anderen daneben. Viele Menschen, die von ihren Müttern verletzt wurden, können eine „Joscheba“ nennen – eine Tante, eine Großmutter, eine Lehrerin, eine Nachbarin, die Mutter einer Freundin –, die ihnen die Liebe gab, die ihre eigene Mutter ihnen nicht gab.<\/p>\n<p><strong>Ehren heißt nicht, so zu tun als ob.<\/strong> Das Gebot, deine Mutter zu ehren, ist keine Waffe, um dich zum Schweigen zu bringen. Es heißt nicht, zu sagen, der Schaden sei nicht geschehen, und es heißt nicht, dich wieder in Gefahr zu begeben. Manchmal heißt eine Mutter zu ehren, die dich verletzt hat, die Wahrheit zu sagen, sichere Grenzen zu ziehen und dich zu weigern, den Schaden weiterzugeben.<\/p>\n<p><strong>Vergebung ist nicht dasselbe wie Vertrauen.<\/strong> Vergeben heißt, dein Recht auf Rache an Gott abzugeben. Das kann lange dauern. Vertrauen ist etwas anderes: Es kann nur durch echte Veränderung wieder aufgebaut werden, und manchmal lässt es sich überhaupt nicht wieder aufbauen.<\/p>\n<p><strong>Du bist nicht dazu verurteilt, es zu wiederholen.<\/strong> Viele Menschen, die von ihren Müttern verletzt wurden, sind zu sanften, treuen Eltern geworden. Es braucht Mut und meistens Hilfe – aber es ist möglich.<\/p>\n<p><strong>Gottes Liebe ist keine vergrößerte Ausgabe der Liebe deiner Mutter.<\/strong> „Selbst wenn sie vergessen – ich vergesse dich nicht.“ Seine Liebe ist die Liebe, die deine Mutter dir hätte geben sollen.<\/p>\n<p>Bitte trag das nicht allein. Eine weise Beraterin, ein Seelsorger oder eine vertraute Freundin kann dir helfen.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Was hat dich das, was deine Mutter dir angetan hat, über dich selbst glauben lassen? Ist es wahr?<\/li>\n<li>Wer war dir eine „Joscheba“ – jemand, der dir die Liebe gab, die du gebraucht hast?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, selbst Mütter können vergessen, aber du vergisst nie.<br />\nDu hast gesehen, was mir geschehen ist.<br />\nWo meine Mutter an mir versagt hat, nimm du mich auf.<br />\nHeile, was zerbrochen ist, und bewahre mich davor, es weiterzugeben. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Danke Gott für eine „Joscheba“ in deinem Leben. Wenn du Wunden von deiner Mutter mit dir trägst, erzähl einem sicheren Menschen davon – oder schreib ihr einen Brief, den du nicht abschickst, und gib ihn Gott.\n<\/p>", "note": "Ataljas Blutbad an der königlichen Familie (2. Könige 11,1) war eine politische Säuberung durch eine Königin, die den Thron an sich riss; die Geschichte wird hier nur wegen der Rettung des Joasch durch seine Tante Joscheba gebraucht.", "readEn": "Isaiah 49:14–16; Psalm 27:7–14; 2 Kings 11:1–3"}, {"id": "M31", "n": 31, "title": "„Frau, siehe, das ist dein Sohn“", "part": 4, "read": "Johannes 19,25–27; Apostelgeschichte 1,12–14", "ref": "Johannes 19,25–27", "html": "<blockquote>\n<p>„Bei dem Kreuz Jesu standen seine Mutter und die Schwester seiner Mutter, Maria, die Frau des Klopas, und Maria Magdalena. Als nun Jesus seine Mutter sah und den Jünger, den er lieb hatte, bei ihr stehen, sprach er zu seiner Mutter: ‚Frau, siehe, das ist dein Sohn!‘ Dann sprach er zu dem Jünger: ‚Siehe, das ist deine Mutter!‘ Und von jener Stunde an nahm der Jünger sie zu sich.“<\/p>\n<p><span class=\"ref\">Johannes 19,25–27<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> γύναι, ἴδε (<em>gynai, ide<\/em>) – griechisch „Frau, sieh“, „Frau, siehe“.<\/p>\n<\/div>\n<p>Dreißig Tage lang sind wir mit den Müttern der Bibel gegangen: Mütter, die versteckten und losließen, beteten und dranblieben, weinten und sich nicht trösten lassen wollten; Mütter, die einander verletzten, und Mütter, die verletzt wurden.<\/p>\n<p>Wir enden unter dem Kreuz.<\/p>\n<p>Maria ist da. Mehr als dreißig Jahre zuvor hatte der alte Simeon ihr gesagt: „Auch durch deine Seele wird ein Schwert dringen.“ Jetzt ist das Schwert gekommen. Sie sieht ihren Sohn sterben.<\/p>\n<p>Die tiefste Angst jeder Mutter ist in diesem Moment versammelt. Und Jesus, im Todeskampf, sieht sie.<\/p>\n<p>„Frau, siehe, das ist dein Sohn.“ Und zu seinem geliebten Jünger: „Siehe, das ist deine Mutter.“ Und von jener Stunde an nahm der Jünger sie in sein eigenes Haus auf.<\/p>\n<p>Mit seinem letzten Atem tut Jesus zwei Dinge.<\/p>\n<p><strong>Er ehrt seine Mutter.<\/strong> Er sorgt dafür, dass für sie gesorgt ist. Selbst am Kreuz hält er das Gebot, seine Mutter zu ehren.<\/p>\n<p><strong>Er schafft eine neue Familie.<\/strong> Einer Mutter, die ihren Sohn verliert, wird ein Sohn gegeben. Einem Jünger wird eine Mutter gegeben. Unter dem Kreuz beginnt ein neuer Haushalt – die Familie aller, die Jesus folgen. In dieser Familie muss keine Mutter allein trauern und kein Kind ohne Mutter sein.<\/p>\n<p>Und Marias Geschichte endet nicht am Kreuz. Als wir sie zum letzten Mal sehen, ist sie mit den Jüngern im Obergemach und betet (Apostelgeschichte 1,14). Die Mutter, die unter dem Kreuz stand, wurde Teil der betenden Kirche.<\/p>\n<p>Das ist das letzte Wort für Mütter – und für alle, die eine Mutter hatten. Gott hat uns nicht allein gelassen mit unseren Freuden und unserem Schmerz. Er sammelt uns in eine Familie, in der den Trauernden Söhne und Töchter gegeben werden, den Einsamen Mütter, und in der eines Tages jede Träne abgewischt wird.<\/p>\n<p>Wir haben mit einer Verheißung begonnen: „Wie einen seine Mutter tröstet, so will ich euch trösten.“ Wir enden dort, wo diese Verheißung besiegelt wird – am Kreuz, wo Gott selbst in den Schmerz einer Mutter eintrat und anfing, die Welt zu trösten.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Wenn du auf diese einunddreißig Tage zurückblickst: Welche Mutter der Bibel hat am meisten zu dir gesprochen?<\/li>\n<li>Wen hat Gott dir als Familie gegeben – „siehe, dein Sohn“, „siehe, deine Mutter“ – über deine eigene Familie hinaus?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr Jesus, vom Kreuz aus hast du deine Mutter gesehen und ihr einen Sohn gegeben.<br />\nSieh jede Mutter, die trauert; gib ihr Familie und Trost.<br />\nSammle uns alle in dein Haus,<br />\nbis zu dem Tag, an dem du jede Träne abwischst. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Bete mit Namen für drei Mütter, die du kennst. Dann danke Gott für die „Mütter“ und „Kinder“, die er dir in seiner Familie gegeben hat.\n<\/p>", "note": "„Er wird jede Träne abwischen“ steht in Offenbarung 21,4.", "art": {"file": "images/m31.webp", "caption": "„Frau, siehe, das ist dein Sohn“", "title": "Die Kreuzigung Jesu", "credit": "Gustave Doré, Bibelillustrationen (1866)", "source": "https://commons.wikimedia.org/wiki/File%3AGustave_Dor%C3%A9_-_Crucifixion_of_Jesus.jpg", "licence": "Public domain", "w": 900, "h": 1145}, "readEn": "John 19:25–27; Acts 1:12–14"}], "marksTitle": "Sechzehn Kennzeichen einer guten Mutter", "marks": "<p>Sechzehn Dinge, die dieses Buch aus der Schrift gewonnen hat – keine Liste, die die Bibel selbst aufstellt, sondern eine sorgfältige Lesart.<\/p>\n<ol type=\"1\">\n<li><strong>Schütze das Leben, auch gegen die Macht.<\/strong> <em>(2. Mose 1,17; 2,2–3)<\/em><\/li>\n<li><strong>Schütte dein Herz vor Gott aus.<\/strong> <em>(1. Samuel 1,15)<\/em><\/li>\n<li><strong>Halte deine Kinder mit offenen Händen.<\/strong> <em>(1. Samuel 1,28; 1. Könige 3,26)<\/em><\/li>\n<li><strong>Bleib da – jedes Jahr ein kleiner Rock.<\/strong> <em>(1. Samuel 2,19)<\/em><\/li>\n<li><strong>Lehre: Deine Unterweisung ist <em>tôrâ<\/em>.<\/strong> <em>(Sprüche 1,8; 6,20)<\/em><\/li>\n<li><strong>Lehre Gerechtigkeit für die Stimmlosen.<\/strong> <em>(Sprüche 31,8–9)<\/em><\/li>\n<li><strong>Lass die Weisung der Güte auf deiner Zunge sein.<\/strong> <em>(Sprüche 31,26)<\/em><\/li>\n<li><strong>Vergiss nicht.<\/strong> <em>(Jesaja 49,15)<\/em><\/li>\n<li><strong>Tröste.<\/strong> <em>(Jesaja 66,13)<\/em><\/li>\n<li><strong>Verweigere Bevorzugung und Manipulation.<\/strong> <em>(1. Mose 27)<\/em><\/li>\n<li><strong>Lass deine Kinder nicht deine Kämpfe tragen.<\/strong> <em>(1. Mose 29–30; Markus 6,24)<\/em><\/li>\n<li><strong>Bleib hartnäckig für dein Kind.<\/strong> <em>(2. Könige 4,30; Markus 7,28)<\/em><\/li>\n<li><strong>Trauere ehrlich.<\/strong> <em>(Jeremia 31,15)<\/em><\/li>\n<li><strong>Sei Mutter über die Biologie hinaus.<\/strong> <em>(Rut 4,16; Richter 5,7)<\/em><\/li>\n<li><strong>Bewahre und bewege es im Herzen.<\/strong> <em>(Lukas 2,19)<\/em><\/li>\n<li><strong>Wisse, dass dein Wert nicht dein Schoß ist.<\/strong> <em>(Lukas 11,28; Jesaja 56,5)<\/em><\/li>\n<\/ol>", "languages": "<p>Alle Bibelzitate sind eigene Übersetzungen des Verfassers aus dem Hebräischen und Griechischen, nah am ursprünglichen Wortlaut gehalten, damit man sieht, worauf sich die Gedanken eines Tages stützen. „Der HERR“ in Großbuchstaben steht für den persönlichen Namen Gottes im Hebräischen, der oft JHWH geschrieben wird.<\/p>\n<p><strong>Verszählung<\/strong> und <strong>Namen der biblischen Bücher<\/strong> folgen den deutschen Bibeln (Lutherbibel, Elberfelder, Einheitsübersetzung).<\/p>\n<p><strong>Umschrift.<\/strong> Jedes hebräische oder griechische Wort ist auch in lateinischen Buchstaben geschrieben, damit man es aussprechen kann:<\/p>\n<ul>\n<li>ʾ ist ein leichtes Absetzen der Stimme; ʿ ist ein tieferer Laut aus der Kehle. Beim lauten Lesen kann man beide einfach übergehen.<\/li>\n<li>Ein Strich über einem Vokal (ā, ē, ō) bedeutet, dass er lang ist; ein Zirkumflex (â, ê, î, ô, û) bedeutet dasselbe.<\/li>\n<li>ĕ und ă sind sehr kurze, flüchtige Vokale.<\/li>\n<li>š ist „sch“. ḥ ist ein raues „ch“ wie in „Bach“. ṣ ist „z“ (wie in „Zeit“). ś und s klingen beide wie ein scharfes „s“.<\/li>\n<\/ul>\n<p>Nichts davon musst du wissen, um dieses Buch zu benutzen. Die Wörter sind kleine Fenster in den Text – eine Erinnerung daran, dass diese Geschichten zuerst in wirklichen Sprachen erzählt wurden, über wirkliche Mütter, ihren eigenen Kindern.<\/p>", "sources": [{"group": "Texte und Nachschlagewerke", "items": ["<em>Biblia Hebraica Stuttgartensia<\/em>. 5th ed. Stuttgart: Deutsche Bibelgesellschaft, 1997.", "<em>Novum Testamentum Graece<\/em> (Nestle-Aland). 28th rev. ed. Stuttgart: Deutsche Bibelgesellschaft, 2012.", "Josephus. <em>Jewish Antiquities<\/em>, Book 2.", "Koehler, L., W. Baumgartner, and J. J. Stamm. <em>The Hebrew and Aramaic Lexicon of the Old Testament<\/em> (HALOT). Trans. and ed. M. E. J. Richardson. Leiden: Brill, 1994–2000.", "Barr, James. <em>The Semantics of Biblical Language<\/em>. Oxford: Oxford University Press, 1961.", "Lichtheim, Miriam. <em>Ancient Egyptian Literature<\/em>. Vol. 2: <em>The New Kingdom<\/em>. Berkeley: University of California Press, 1976."]}, {"group": "Haushalt, Verwandtschaft und das Leben von Frauen", "items": ["Bridge, Edward J. \"A Mother's Influence: Mothers Naming Children in the Hebrew Bible.\" <em>Vetus Testamentum<\/em> 64, no. 3 (2014).", "Chapman, Cynthia R. <em>The House of the Mother: The Social Roles of Maternal Kin in Biblical Hebrew Narrative and Poetry<\/em>. Anchor Yale Bible Reference Library. New Haven: Yale University Press, 2016.", "Meyers, Carol. <em>Discovering Eve: Ancient Israelite Women in Context<\/em>. New York: Oxford University Press, 1988.", "———. \"'To Her Mother's House': Considering a Counterpart to the Israelite <em>Bêt ʾāb<\/em>.\" In <em>The Bible and the Politics of Exegesis: Essays in Honor of Norman K. Gottwald on His Sixty-Fifth Birthday<\/em>, ed. David Jobling, Peggy L. Day, and Gerald T. Sheppard. Cleveland: Pilgrim Press, 1991.", "———. <em>Rediscovering Eve: Ancient Israelite Women in Context<\/em>. New York: Oxford University Press, 2013.", "Stager, Lawrence E. \"The Archaeology of the Family in Ancient Israel.\" <em>Bulletin of the American Schools of Oriental Research<\/em> 260 (1985): 1–35.", "Yoder, Christine Roy. <em>Wisdom as a Woman of Substance: A Socioeconomic Reading of Proverbs 1–9 and 31:10–31<\/em>. BZAW 304. Berlin: de Gruyter, 2001."]}, {"group": "Königinmütter", "items": ["Ackerman, Susan. \"The Queen Mother and the Cult in Ancient Israel.\" <em>Journal of Biblical Literature<\/em> 112 (1993): 385–401."]}, {"group": "Mütterliche Gottesbilder", "items": ["Clines, David J. A. \"Alleged Female Language about the Deity in the Hebrew Bible.\" <em>Journal of Biblical Literature<\/em> 140 (2021): 229–249.", "Dille, Sarah J. <em>Mixing Metaphors: God as Mother and Father in Deutero-Isaiah<\/em>. JSOTSup 398. London: T&T Clark, 2004.", "Gruber, Mayer I. \"The Motherhood of God in Second Isaiah.\" <em>Revue Biblique<\/em> 9
