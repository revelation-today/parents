it that way. Twice it sets the mother’s teaching directly beside the father’s (1:8; 6:20). And the word it chooses for her teaching is <em>tôrâ<\/em>. That is not a soft word. It is the word for authoritative instruction — the word the Bible uses for the Law of Moses.<\/p>\n<p>In other words, what a mother teaches her child is not a lesser kind of teaching. It is <em>tôrâ<\/em>: instruction that shapes a whole life.<\/p>\n<p>Look at how Proverbs describes it: “Wherever you walk, it will lead you; when you sleep, it will keep watch; when you wake, it will speak with you.” A mother’s teaching goes with a child long after the child has left home. Many adults still hear their mother’s voice at key moments — “Tell the truth.” “Be kind.” “Say your prayers.”<\/p>\n<p>It is striking how many people say their first faith came from their mother. The bedtime prayer. The song sung over a cot. The Bible story told on a rainy afternoon. The quiet example of a woman who prayed.<\/p>\n<p>None of that is small. It is <em>tôrâ<\/em>.<\/p>\n<p>If you are a mother, you may not feel like a teacher. You may feel that you are simply getting through the day. But the words you speak, the prayers you pray aloud, and the way you live in front of your children are forming them more deeply than you know.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>What words of your own mother (or another woman who raised you) still come back to you?<\/li>\n<li>What do you most want your children to hear in their heads when they are grown?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, you have given my teaching a place beside your own Word.<br />\nLet what I teach my children be true, and kind, and lasting.<br />\nWalk with them through my words long after they leave my home. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Teach your child one short prayer, Bible verse, or song — and say it together at bedtime.\n<\/p>", "note": "Proverbs 6:22 echoes Deuteronomy 6:7 (“when you walk… when you lie down… when you rise”)."}, {"id": "M8", "n": 8, "title": "Faith That Lived First in a Grandmother", "part": 1, "read": "2 Timothy 1:3–7; 3:14–15; Acts 16:1", "ref": "2 Timothy 1:5 (NIV)", "html": "<blockquote>\n<p>“I am reminded of your sincere faith, which first lived in your grandmother Lois and in your mother Eunice and, I am persuaded, now lives in you also.”<\/p>\n<p><span class=\"ref\">2 Timothy 1:5 (NIV)<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> μάμμη (<em>mammē<\/em>) — Greek for “grandmother.” It appears only here in the whole New Testament.<\/p>\n<\/div>\n<p>Timothy became one of Paul’s most trusted co-workers — a leader in the early church. Where did his faith come from?<\/p>\n<p>Paul tells us. It “dwelt first” in his grandmother Lois, then in his mother Eunice, and then in him. And later Paul adds: “from infancy you have known the sacred writings” (3:15).<\/p>\n<p>The book of Acts adds one more detail: Timothy’s father was a Greek (Acts 16:1). He was probably not a believer. The faith came to Timothy through the women of his family.<\/p>\n<p>Many readers will recognise this story. It is very common for faith to be carried by mothers and grandmothers — sometimes in homes where the father does not share it, or is not there at all. If that is your situation, this passage is for you. Your faithfulness matters. A faith that “lives” in you can live on in your children and grandchildren.<\/p>\n<p>Notice the word Paul uses: <em>sincere<\/em> faith — in Greek, <em>unpretended<\/em> — literally “unhypocritical.” Children are quick to spot the difference between a faith that is performed and a faith that is real. What passed from Lois to Eunice to Timothy was not a set of religious habits but a living trust in God that the child could see was genuine.<\/p>\n<p>And notice the grandmother. Grandmothers often have something mothers don’t: more time, more patience, a longer view. Many people say it was a grandmother who first showed them what faith looked like. If you are a grandmother, your role in passing on faith may be larger than you think.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Who first showed you a real, sincere faith? Was it a woman in your family?<\/li>\n<li>Is there a grandchild, niece, or young person whose faith you could help nurture?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, thank you for the women who handed faith down to me.<br />\nLet my faith be sincere — real enough for a child to see.<br />\nLet it live on in my children, and in their children after them. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Tell a child one true story about a time God helped you — or, if you’re a grandmother, call a grandchild and pray for them by name.\n<\/p>", "note": "On Timothy’s father, see Acts 16:1."}, {"id": "M9", "n": 9, "title": "A Mother Teaches a King Justice", "part": 1, "read": "Proverbs 31:1–9", "ref": "Proverbs 31:1, 8–9", "html": "<blockquote>\n<p>“The words of King Lemuel, which his mother taught him… Open your mouth for those who cannot speak, for the rights of all who are perishing. Open your mouth, judge rightly, and defend the poor and needy.”<\/p>\n<p><span class=\"ref\">Proverbs 31:1, 8–9<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">יִסְּרַתּוּ<\/span> (<em>yissĕrattû<\/em>) — “she instructed him,” “she trained him.” It comes from the same root as the main word for teaching and discipline in Proverbs.<\/p>\n<\/div>\n<p>There is only one place in the whole Bible where a long piece of teaching is said to come directly from a mother. It is here, at the start of Proverbs 31 — and her pupil is a king.<\/p>\n<p>We know almost nothing else about King Lemuel or his mother. “Massa” may be the name of an Arabian tribe descended from Ishmael (Genesis 25:14) — in which case Lemuel’s mother was not an Israelite at all, and her wisdom was welcomed into Israel’s Bible from outside. But we know what she taught him, and it is worth listening to.<\/p>\n<p>First, she warns him about self-indulgence: don’t waste your strength on women, don’t drink yourself into forgetting your duties (31:3–7).<\/p>\n<p>Then she tells him what his power is <em>for<\/em>:<\/p>\n<p>“Open your mouth for those who cannot speak. Judge rightly. Defend the poor and needy.”<\/p>\n<p>A mother teaching her son, the king, that his whole purpose is to speak up for people who have no voice. That is extraordinary.<\/p>\n<p>In the companion book on fathers, we saw that God chose Abraham “so that he may teach his children… to do righteousness and justice” (Genesis 18:19). It is striking — though it may be no more than a happy echo — that the one long teaching from a mother in the Bible has the same heart: <em>raise children who stand up for the weak.<\/em><\/p>\n<p>Most of us are not raising kings. But every child will one day have some kind of power — over a younger sibling, in a classroom, at work, in a family of their own. What they do with that power will depend a great deal on what they learned at home.<\/p>\n<p>Lemuel’s mother did not only teach her son to be good. She taught him to be <em>just<\/em>.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>What are your children learning from you about how to treat people who are weaker than them?<\/li>\n<li>Who in your community “cannot speak for themselves”? How could your family help?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, thank you for Lemuel’s mother, who taught a king to care for the voiceless.<br />\nHelp me to raise children who open their mouths for the weak,<br />\nand who use whatever power they have for others. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Talk with your child about someone who is left out or unfairly treated — and think together of one small way to help.\n<\/p>", "note": "The word <em>maśśāʾ<\/em> in Proverbs 31:1 may be a place-name (“Massa,” an Ishmaelite tribe in Genesis 25:14) or may mean “oracle.” The parallel with Genesis 18:19 is the author’s own observation, not an established reading."}, {"id": "M10", "n": 10, "title": "The Teaching of Kindness", "part": 1, "read": "Proverbs 31:10–31", "ref": "Proverbs 31:26, 28", "html": "<blockquote>\n<p>“Her mouth she opens in wisdom, and on her tongue is the teaching of kindness… Her children rise up and call her blessed.”<\/p>\n<p><span class=\"ref\">Proverbs 31:26, 28<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">תּוֹרַת־חֶסֶד<\/span> (<em>tôrat-ḥesed<\/em>) — “the teaching of kindness.” <em>Ḥesed<\/em> is one of the richest words in the Old Testament: loyal, steadfast, faithful love — the word used for God’s own love.<\/p>\n<\/div>\n<p>Proverbs 31 has probably made more women feel inadequate than any other chapter in the Bible.<\/p>\n<p>The “woman of strength” gets up before dawn, runs a household, buys a field, plants a vineyard, makes and sells clothing, cares for the poor, and never seems to rest. Many women read it as a checklist — and fail.<\/p>\n<p>So it helps to know four things about this poem.<\/p>\n<p><strong>It is a poem of praise, not a job description.<\/strong> In Hebrew, each verse begins with the next letter of the alphabet — A to Z. It is a celebration, not a set of instructions.<\/p>\n<p><strong>It describes a working woman.<\/strong> She is a businesswoman and a landowner. She is “known in the city gates.” Whatever this poem says, it does not say that a woman’s only place is the nursery.<\/p>\n<p><strong>Many read it as a portrait of Wisdom herself.<\/strong> Proverbs begins with Wisdom pictured as a woman calling out in the streets (chapters 1–9), and many interpreters think it ends with her too. If so, this is not a job description for mothers at all, but a picture of what wisdom looks like in a life.<\/p>\n<p><strong>When it finally talks about mothering, it praises her <em>words<\/em>.<\/strong> Not her cooking, her cleaning, or her schedule. “Her mouth she opens in wisdom, and on her tongue is the teaching of kindness.”<\/p>\n<p>That phrase — <em>tôrat-ḥesed<\/em> — is lovely. It joins “teaching” (<em>tôrâ<\/em>) with God’s own word for faithful love (<em>ḥesed<\/em>). Her instruction is shaped by kindness. She corrects, guides, and teaches — but in a way that carries love.<\/p>\n<p>And the result? “Her children rise up and call her blessed.”<\/p>\n<p>Children rarely remember the tidiness of the house or the perfection of the meals. They remember the tone of their mother’s voice. Was it harsh, or kind? Anxious, or steady? Mocking, or encouraging?<\/p>\n<p>You don’t have to be the woman of Proverbs 31 in every detail. But you can let the teaching of kindness be on your tongue.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Has Proverbs 31 made you feel inadequate? What changes when you read it as praise rather than a checklist?<\/li>\n<li>What is the usual <em>tone<\/em> of your voice when you correct your children?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, set me free from impossible checklists.<br />\nPut your kind of teaching on my tongue —<br />\nwise, faithful, and full of steadfast love —<br />\nso that my children will one day rise up and bless you for it. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> The next time you need to correct a child, pause first — and let your first words be kind.\n<\/p>", "note": "Proverbs 31:10–31 is an alphabetic acrostic. On its social and economic background, see Christine Roy Yoder, <em>Wisdom as a Woman of Substance<\/em> (2001). Ruth is also called an <em>ʾēšet ḥayil<\/em>, “woman of strength” (Ruth 3:11). Many interpreters read the poem as a portrait of personified Wisdom."}, {"id": "M11", "n": 11, "title": "A Mother in Israel", "part": 1, "read": "Judges 4:4–10; 5:1–7", "ref": "Judges 5:7", "html": "<blockquote>\n<p>“The villages were empty in Israel; they were empty until I arose — I, Deborah — until I arose, a mother in Israel.”<\/p>\n<p><span class=\"ref\">Judges 5:7<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">אֵם בְּיִשְׂרָאֵל<\/span> (<em>ʾēm bĕyiśrāʾēl<\/em>) — “a mother in Israel.” A title of honour for a woman who protects and leads her people.<\/p>\n<\/div>\n<p>Deborah was a prophet and a judge. People came to her under a palm tree to have their disputes settled. When Israel was oppressed, she summoned the army commander Barak and went with him into battle.<\/p>\n<p>And when she sang about it afterwards, she chose a surprising title for herself: “a mother in Israel.”<\/p>\n<p>The Bible never tells us whether Deborah had children of her own. That is the point. “Mother in Israel” was not a description of her family life. It was a description of her role: someone who protected, guided, and fought for the people in her care, the way a mother fights for her children.<\/p>\n<p>Elsewhere in the Bible, a whole city is called “a mother in Israel” (2 Samuel 20:19), because it sheltered the villages around it.<\/p>\n<p>This matters for many women.<\/p>\n<p><strong>For women without children<\/strong>, whether by choice, by circumstance, or through the pain of infertility: the Bible has a place for you in the family of “mothers.” Some of the most important mothering in the world is done by women who never gave birth — teachers, aunts, mentors, leaders, friends. Deborah was a mother to a whole nation.<\/p>\n<p><strong>For mothers whose children are grown<\/strong>: your mothering is not over. The church and the world need women who will be “mothers in Israel” — wise, protective, willing to stand up for others.<\/p>\n<p><strong>For every woman<\/strong>: motherhood in the Bible is bigger than biology. It is a way of loving that anyone can practise.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Who has been a “mother in Israel” to you — a woman who guided or protected you, though she wasn’t your mother?<\/li>\n<li>Who could you “mother” who isn’t your own child?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, thank you for Deborah, a mother to a whole people.<br />\nThank you for the women who have mothered me.<br />\nShow me whom I am called to mother,<br />\nwhether or not they are my own. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Thank a woman who has been a “mother in Israel” to you — or reach out to a younger person who needs someone to watch out for them.\n<\/p>", "note": "A city is called “a mother in Israel” in 2 Samuel 20:19. Judges does not say whether Deborah had children."}, {"id": "M12", "n": 12, "title": "Honour Your Mother", "part": 1, "read": "Exodus 20:12; Leviticus 19:3; Proverbs 23:22–25; John 19:25–27", "ref": "Leviticus 19:3", "html": "<blockquote>\n<p>“Each of you shall revere his mother and his father.”<\/p>\n<p><span class=\"ref\">Leviticus 19:3<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">תִּירָאוּ<\/span> (<em>tîrāʾû<\/em>) — “you shall revere.” It is related to the word for “fear,” meaning deep respect and awe.<\/p>\n<\/div>\n<p>The Ten Commandments say, “Honour your father and your mother.” But in Leviticus, the same command appears with the order reversed: “Each of you shall revere his <em>mother<\/em> and his father.”<\/p>\n<p>The ancient rabbis noticed this. They concluded that neither parent comes first. Mother and father are owed exactly the same honour.<\/p>\n<p>In a world where women often had little legal power, this was significant. A mother’s honour was not a secondary matter. Striking or cursing a mother was treated just as seriously as striking or cursing a father (Exodus 21:15, 17).<\/p>\n<p>What does honouring a mother mean? Proverbs gives one clear answer: “Do not look down on your mother when she is old” (23:22). Honour includes care — especially when a mother grows old, frail, or dependent.<\/p>\n<p>Jesus showed this in the most moving way possible. Dying on the cross, in terrible pain, he looked down and saw his mother. And he made sure she would be cared for: “Woman, here is your son.” And to his disciple: “Here is your mother.” “From that time on, this disciple took her into his home” (John 19:26–27, NIV).<\/p>\n<p>With almost his last breath, Jesus kept the commandment to honour his mother.<\/p>\n<p>For mothers, this is a word of dignity. You are owed honour — not because you were perfect, but because you gave life and care.<\/p>\n<p>For adult children, it is a word of calling. Honouring our mothers may mean phone calls, visits, practical help, patience with their ageing, and gratitude spoken while they can still hear it.<\/p>\n<p>And for those whose mothers caused them deep harm: honour does not mean pretending, or putting yourself back in danger. We will come back to that on Day 30.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>If your mother is living, how could you honour her this week?<\/li>\n<li>If you are a mother of grown children, how do you want to be honoured — and have you told them?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord Jesus, even on the cross you cared for your mother.<br />\nTeach me to honour my mother as you honoured yours —<br />\nwith care, with patience, and with gratitude.<br />\nAnd let my children learn honour by watching me. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Call, visit, or write to your mother or an older woman in your life. If your mother has died, give thanks to God for one thing she gave you.\n<\/p>", "note": "The rabbinic discussion of Leviticus 19:3 and Exodus 20:12 is in the Babylonian Talmud, Qiddushin 30b–31a."}, {"id": "M13", "n": 13, "title": "The Midwives Who Said No", "part": 2, "read": "Exodus 1:8–22", "ref": "Exodus 1:17 (NIV)", "html": "<blockquote>\n<p>“The midwives, however, feared God and did not do what the king of Egypt had told them to do; they let the boys live.”<\/p>\n<p><span class=\"ref\">Exodus 1:17 (NIV)<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">הַמְיַלְּדֹת<\/span> (<em>hamyallĕdōt<\/em>) — “the midwives,” literally “the women who help to give birth.”<\/p>\n<\/div>\n<p>The story of Israel’s rescue from Egypt begins with two women whose names most people have never heard: Shiphrah and Puah.<\/p>\n<p>They were midwives. Their work was bringing babies safely into the world. (We don’t actually know whether they were Hebrews themselves. The Hebrew can mean “the Hebrew midwives” or “the midwives of the Hebrew women,” and the ancient historian Josephus thought they were Egyptians. If so, their courage is even more striking: Egyptian women defying their own king to save the children of foreigners.) And the most powerful man on earth, the king of Egypt, gave them an order: when a Hebrew woman gives birth, kill the boy.<\/p>\n<p>They said no.<\/p>\n<p>Not with a speech or a protest march. Quietly. They simply did not do it. When the king summoned them and demanded an explanation, they gave him a clever answer: “The Hebrew women are not like the Egyptian women. They are full of life, and they have given birth before the midwife reaches them” (1:19).<\/p>\n<p>Why did they risk their lives? The Bible gives one reason: “The midwives feared God.” They feared God more than they feared Pharaoh.<\/p>\n<p>And God rewarded them: “He made them households” (1:21) — families of their own.<\/p>\n<p>This is the first act of resistance in the whole story of the Exodus. Before Moses, before the plagues, before the Red Sea, there were two women who would not harm a child.<\/p>\n<p>Every mother is, in some way, a guardian of life. Most of the time that means ordinary things — feeding, protecting, keeping safe. But sometimes it means saying no to powerful people: a system, a school, a doctor, an employer, a relative, even a church, when what they ask would harm a child.<\/p>\n<p>Shiphrah and Puah show that such courage does not need to be loud. It needs only to fear God more than anyone else.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Is there a situation where you need to say “no” to protect a child?<\/li>\n<li>Whom do you fear more — God, or the people who have power over you?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, thank you for Shiphrah and Puah, who feared you more than a king.<br />\nGive me their courage — quiet, clever, and unafraid —<br />\nto protect the children in my care,<br />\nwhatever it costs. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Pray for mothers and midwives in places where children’s lives are in danger. If you know of a situation where a child is at risk, take one step to protect them.\n<\/p>", "note": "“He made them households” (Exodus 1:21) may mean that God gave the midwives families of their own. Exodus 1:15 can mean “the Hebrew midwives” or “the midwives of the Hebrew women”; Josephus (<em>Jewish Antiquities<\/em> 2.206–207) took them to be Egyptians."}, {"id": "M14", "n": 14, "title": "A Small Ark in the Reeds", "part": 2, "read": "Exodus 2:1–10", "ref": "Exodus 2:2–3", "html": "<blockquote>\n<p>“The woman conceived and bore a son. She saw that he was good, and she hid him for three months. When she could hide him no longer, she took a papyrus basket for him, sealed it with tar and pitch, laid the child inside, and set it among the reeds at the river’s edge.”<\/p>\n<p><span class=\"ref\">Exodus 2:2–3<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">תֵּבָה<\/span> (<em>tēbâ<\/em>) — “basket,” “ark.” This word appears in only two places in the Bible: here, and in the story of Noah’s ark.<\/p>\n<\/div>\n<p>The mother of Moses isn’t even named in this chapter. We learn later that her name was Jochebed (Exodus 6:20). But what she did is unforgettable.<\/p>\n<p>She “saw that he was good” — the same words God said over creation in Genesis 1. Every mother knows that moment of looking at her newborn and seeing something wonderful.<\/p>\n<p>Then she hid him. For three months she kept a baby quiet in a world where soldiers were searching for Hebrew boys.<\/p>\n<p>And when she could hide him no longer, she built him a <em>tēbâ<\/em> — the same word used for Noah’s ark. A small ark, sealed with tar, to carry her son through the waters.<\/p>\n<p>Then came the hardest part. She put him in the river and let him go.<\/p>\n<p>This is one of the great paradoxes of motherhood. A mother protects her child with all her strength — and then, at the right moment, she must let go and trust. Jochebed could not follow the basket down the river. She had done all she could; the rest was in God’s hands.<\/p>\n<p>But she was not alone. The baby’s sister Miriam watched from a distance and spoke up at exactly the right moment. And Pharaoh’s own daughter — an Egyptian princess — took pity on the child and adopted him as her son. Jochebed was even paid to nurse her own baby!<\/p>\n<p>Moses survived because of a whole team of women: a mother, a sister, a princess, and before them, two midwives.<\/p>\n<p>If you are facing a moment when you must let a child go — to school, to hospital, to a new home, into adulthood — remember Jochebed. Build the best ark you can. Then trust the river to God.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>In what part of your child’s life do you need to “let go” right now?<\/li>\n<li>Who are the other people — sisters, friends, even strangers — who share in protecting your child?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, you saw Jochebed’s little ark in the reeds.<br />\nHelp me to protect my children with all my strength,<br />\nand to let them go when the time comes,<br />\ntrusting them to your hands. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Name one area where you need to let go a little. Pray about it — and thank God for the people who help you care for your children.\n<\/p>", "note": "The word <em>tēbâ<\/em> is used in Genesis 6–9 for Noah’s ark and in Exodus 2:3, 5 for Moses’ basket. Moses’ mother is named in Exodus 6:20."}, {"id": "M15", "n": 15, "title": "Hannah Pours Out Her Soul", "part": 2, "read": "1 Samuel 1:1–18", "ref": "1 Samuel 1:15 (NIV)", "html": "<blockquote>\n<p>“‘Not so, my lord,’ Hannah replied, ‘I am a woman who is deeply troubled. I have not been drinking wine or beer; I was pouring out my soul to the LORD.’”<\/p>\n<p><span class=\"ref\">1 Samuel 1:15 (NIV)<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">מָרַת נָפֶשׁ<\/span> (<em>mārat nāpeš<\/em>) — “bitter of soul.” It describes Hannah’s state in 1 Samuel 1:10: deep, aching grief.<\/p>\n<\/div>\n<p>Hannah wanted a child and could not have one. Year after year she went with her family to worship at Shiloh, and year after year her husband’s other wife, Peninnah, taunted her.<\/p>\n<p>Her husband Elkanah loved her, but he didn’t really understand. “Why are you weeping? Am I not better to you than ten sons?” (1:8). He meant well. But it didn’t help.<\/p>\n<p>So Hannah went to the house of God and prayed. The Bible says she was “bitter of soul” and “wept bitterly.” She prayed so intensely that her lips moved but no sound came out. The priest Eli, watching, thought she was drunk and told her off.<\/p>\n<p>Her answer is one of the most honest lines in the Bible: “I was pouring out my soul to the LORD.”<\/p>\n<p>Hannah does not tidy up her prayer. She does not pretend to be fine. She brings her grief, her longing, and her bitterness straight to God — so raw that it looks like drunkenness to someone watching.<\/p>\n<p>Many mothers, and many women who long to be mothers, know that kind of prayer. The prayer at 3 a.m. over a sick child. The prayer after another month with no pregnancy. The prayer for a child who is lost. Words fail, and all that is left is pouring out.<\/p>\n<p>Hannah shows that God welcomes that kind of prayer. He does not require us to be calm before we come to him. And after she had prayed, she no longer looked sad (1:18) — not because anything had changed yet, but because she had brought it to God.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Is there a grief or longing you have been holding back from God, because it feels too raw?<\/li>\n<li>Has anyone ever misunderstood your pain, as Eli misunderstood Hannah’s? How did that feel?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, you heard Hannah when no one else understood her.<br />\nI pour out my soul before you now —<br />\nthe longing, the grief, the bitterness.<br />\nHear me, as you heard her. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Take time alone to pray honestly — out loud or on paper — about the thing that weighs most on your heart as a mother, or as a woman who longs to be one.\n<\/p>", "note": ""}, {"id": "M16", "n": 16, "title": "Lent to the Lord — and a Little Robe Each Year", "part": 2, "read": "1 Samuel 1:19–28; 2:18–21", "ref": "1 Samuel 1:28; 2:19", "html": "<blockquote>\n<p>“So I have lent him to the LORD; for as long as he lives, he is lent to the LORD… Every year his mother would sew him a small robe and take it up to him when she came with her husband for the yearly sacrifice.”<\/p>\n<p><span class=\"ref\">1 Samuel 1:28; 2:19<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">מְעִיל קָטֹן<\/span> (<em>mĕʿîl qāṭōn<\/em>) — “a little robe.”<\/p>\n<\/div>\n<p>God answered Hannah’s prayer. She gave birth to a son and named him Samuel. And then she did something almost impossible to imagine.<\/p>\n<p>She had promised that if God gave her a son, she would give him back. So when Samuel was weaned — probably around three years old — she brought him to the house of God at Shiloh and left him there, to grow up serving the Lord with the old priest Eli.<\/p>\n<p>“I have lent him to the LORD,” she said.<\/p>\n<p>What kind of mother does that? One who knows that her child was never really hers to keep. Every child is, in a sense, “lent.” They come from God, and they belong to God before they belong to us. Hannah simply made visible what is true for every parent.<\/p>\n<p>But the story doesn’t end there. Look at the small detail in chapter 2: “Every year his mother would sew him a small robe and take it up to him.”<\/p>\n<p>Hannah gave her son to God — and she kept on being his mother. Every year she made him new clothes. Every year she knew he had grown and made them a little bigger. Every year she came, and saw him, and gave him something made by her own hands.<\/p>\n<p>Letting go did not mean stopping loving. It meant loving differently.<\/p>\n<p>Every mother faces this. Children leave for school, for university, for marriage, for jobs far away. Some leave for the mission field; some leave for paths we would not have chosen. Letting go is part of motherhood. But so is the “little robe”: the care package, the phone call, the visit, the prayer, the steady presence that says, <em>I’m still your mother.<\/em><\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Can you think of your children as “lent” to you by God? How does that change things?<\/li>\n<li>What is the “little robe” you can still give to a child who has left home?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, my children were lent to me by you.<br />\nGive me grace to give them back to you,<br />\nand to keep on loving them —<br />\na little robe each year, for as long as I live. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Do something small and personal for a child who has left home, or is beginning to: a note, a parcel, a call, a meal.\n<\/p>", "note": "“Lent” (<em>šāʾûl<\/em>) is a play on the name Saul."}, {"id": "M17", "n": 17, "title": "“She Is His Mother”", "part": 2, "read": "1 Kings 3:16–28", "ref": "1 Kings 3:26–27", "html": "<blockquote>\n<p>“Then the woman whose son was alive spoke to the king — for her compassion burned for her son — ‘Oh, my lord, give her the child alive; don’t put him to death!’… And the king answered, ‘Hand the living child to the first woman; do not kill him. She is his mother.’”<\/p>\n<p><span class=\"ref\">1 Kings 3:26–27<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">רַחֲמֶיהָ<\/span> (<em>raḥămêhā<\/em>) — “her compassion.” The word is related to <em>reḥem<\/em>, “womb” — a lovely word-picture, though the same phrase is also used of Joseph’s love for his brother (Genesis 43:30).<\/p>\n<\/div>\n<p>This is the most famous court case in the Bible. Two women come before King Solomon. They share a house; both gave birth; one baby died in the night. Now both claim the living child.<\/p>\n<p>There are no witnesses. It is one woman’s word against another’s.<\/p>\n<p>Solomon calls for a sword. “Cut the living child in two; give half to one and half to the other.”<\/p>\n<p>One woman says, “Fine — let him be neither mine nor yours.” The other cries out: “No! Give her the child. Don’t kill him.”<\/p>\n<p>And Solomon knows immediately who the real mother is. “She is his mother.”<\/p>\n<p>What revealed her? Not a claim of ownership. The real mother was the one willing to <em>lose<\/em> her child rather than see him harmed. Her love was bigger than her right to keep him.<\/p>\n<p>The Hebrew says her compassion “burned” for her son. It is a physical word. Something moved in her body before her mind had even decided.<\/p>\n<p>Notice who these women were: the Bible says they were prostitutes (3:16). No one would have thought them respectable. Yet the king listened to them, and the Bible holds up one of them as the very picture of a true mother.<\/p>\n<p>There are moments in every mother’s life when love means giving something up: a plan, a hope, a claim, a relationship. Sometimes it means stepping back so that a child can be safe or free, even at great cost to ourselves. That is not weakness. According to Solomon, it is the surest sign of real motherhood.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Is there a situation where love for your child means giving something up?<\/li>\n<li>Do you ever confuse “keeping” your child with loving them?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, give me a love like hers —<br />\na love that would rather lose than harm,<br />\na love bigger than my rights.<br />\nLet my compassion burn for my children’s good, not my own. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Ask yourself honestly: is there any way I am holding on to a child for my sake rather than theirs? Pray about it.\n<\/p>", "note": "The same idiom — compassion “growing warm” — is used of Joseph for Benjamin in Genesis 43:30. <em>Raḥămîm<\/em> (“compassion”) and <em>reḥem<\/em> (“womb”) share a root; on the limits of arguing from roots, see James Barr, <em>The Semantics of Biblical Language<\/em> (1961)."}, {"id": "M18", "n": 18, "title": "Rizpah on the Rock", "part": 2, "read": "2 Samuel 21:1–14", "ref": "2 Samuel 21:10 (NIV)", "html": "<blockquote>\n<p>“Rizpah daughter of Aiah took sackcloth and spread it out for herself on a rock. From the beginning of the harvest till the rain poured down from the heavens on the bodies, she did not let the birds touch them by day or the wild animals by night.”<\/p>\n<p><span class=\"ref\">2 Samuel 21:10 (NIV)<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">שַׂק<\/span> (<em>śaq<\/em>) — “sackcloth,” the rough cloth worn for mourning. It is the origin of our word “sack.”<\/p>\n<\/div>\n<p>This is one of the hardest stories in the Bible, and one of the least known.<\/p>\n<p>King David, to end a famine, handed over seven descendants of the former king Saul to the Gibeonites, who executed them and left their bodies exposed on a hill. Two of the dead were the sons of Rizpah, one of Saul’s concubines. They died for something their father had done years before: the Gibeonites demanded Saul’s descendants as payment for his crimes against them. Yet the Bible’s own law says that children must not be put to death for their father’s sin (Deuteronomy 24:16).<\/p>\n<p>Rizpah could not save her sons. She could not change the king’s decision. She had no power at all.<\/p>\n<p>But she would not let them be forgotten.<\/p>\n<p>She took a piece of sackcloth, spread it on the rock beside their bodies, and stayed there. Day after day, she drove away the vultures. Night after night, she drove away the jackals. From the barley harvest in spring until the autumn rains — for months.<\/p>\n<p>And it worked. When David heard what Rizpah had done, he was moved to act. He gathered the bones of Saul and Jonathan and of the executed men, and gave them all an honourable burial. Only then, the Bible says, did God answer prayer for the land (21:14).<\/p>\n<p>Remember how David failed his own children — how he did nothing when his daughter Tamar was harmed, and refused to see his son Absalom for two years. Now a powerless mother, by sheer faithful presence, shamed the king into doing what was right.<\/p>\n<p>In our own time, mothers have done the same. In Argentina, the “Mothers of the Plaza de Mayo” walked in the public square every week for years, holding photographs of children who had “disappeared” under the military regime, until the world could no longer look away.<\/p>\n<p>Some mothers today keep vigil too: for a child in prison, a child in hospital, a child who died unjustly. Rizpah tells you that your faithful presence matters — even when you cannot change the outcome. Love that will not leave is a kind of power.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Is there a situation where you feel powerless to help a child? What would “keeping vigil” look like?<\/li>\n<li>Do you know a mother who is keeping vigil right now? How could you support her?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>God who saw Rizpah on the rock,<br />\nbe with every mother who keeps vigil over a child she cannot save.<br />\nGive strength to faithful love,<br />\nand move the powerful to act justly. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Pray for a mother who is keeping vigil — for a child who is sick, imprisoned, missing, or lost. If you can, send her a message to say she is not alone.\n<\/p>", "note": "The reason for the executions is given in 2 Samuel 21:1–9; the law that forbids putting children to death for their father’s sin is Deuteronomy 24:16. The narrative does not resolve the tension. The Mothers of the Plaza de Mayo began their weekly marches in Buenos Aires in 1977."}, {"id": "M19", "n": 19, "title": "“It Is Well”", "part": 2, "read": "2 Kings 4:8–37", "ref": "2 Kings 4:26, 30", "html": "<blockquote>\n<p>“‘Are you well? Is your husband well? Is the boy well?’ And she said, ‘It is well.’… Then the boy’s mother said, ‘By the life of the LORD and by your own life, I will not leave you.’”<\/p>\n<p><span class=\"ref\">2 Kings 4:26, 30<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">שָׁלוֹם<\/span> (<em>šālôm<\/em>) — “peace,” “well-being,” “it is well.”<\/p>\n<\/div>\n<p>The woman of Shunem had given the prophet Elisha a room in her house. In return, God gave her a son she had not dared to hope for.<\/p>\n<p>Years later, the boy was working in the fields with his father when he cried out, “My head, my head!” He was carried to his mother, sat on her lap until noon, and died.<\/p>\n<p>What she did next is astonishing.<\/p>\n<p>She carried him upstairs, laid him on the prophet’s bed, and shut the door. She told her husband nothing except “It is well” — <em>šālôm<\/em>. She saddled a donkey and rode as fast as she could to find Elisha.<\/p>\n<p>When Elisha’s servant ran to meet her and asked, “Is it well with the child?”, she said again: “It is well.”<\/p>\n<p>Then she reached Elisha, fell at his feet, and would not let go.<\/p>\n<p>Her “It is well” was not denial. It was determination. She refused to fall apart until she reached the one person who could help. She did not waste her strength explaining to others; she went straight to the source.<\/p>\n<p>And when Elisha tried to send his servant ahead with his staff, she refused. “By the life of the LORD and by your own life, I will not leave you.” She would not accept a substitute. She wanted the prophet himself.<\/p>\n<p>Elisha went, and the boy was raised to life.<\/p>\n<p>Not every story ends like this one. Many mothers have prayed with the same determination and still lost their child. In 1873 a father named Horatio Spafford lost his four daughters in a shipwreck, and wrote the hymn “It Is Well With My Soul.” Sometimes “It is well” is spoken in the deepest grief, not after a miracle.<\/p>\n<p>But the Shunammite shows us something every mother can do: bring the crisis straight to God, refuse to let go, and trust that he hears.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>In a crisis, where do you go first? Do you “go straight to the source”?<\/li>\n<li>Is there something for your child that you need to keep holding before God, and not let go?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, when my child is in trouble, give me the Shunammite’s resolve:<br />\nto come straight to you, to hold on, and not to let go.<br />\nAnd whether you answer with a miracle or with your presence,<br />\nteach my soul to say: it is well. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Bring one urgent need for a child directly to God in prayer — and keep bringing it, every day this week.\n<\/p>", "note": "Horatio Spafford’s four daughters died in the sinking of the <em>Ville du Havre<\/em> in 1873; he wrote “It Is Well with My Soul” afterwards."}, {"id": "M20", "n": 20, "title": "Better Than Seven Sons", "part": 2, "read": "Ruth 1:1–22; 4:13–17", "ref": "Ruth 4:15–16", "html": "<blockquote>\n<p>“…for your daughter-in-law, who loves you and is worth more to you than seven sons, is the one who bore him. Naomi took the boy, held him in her lap, and became his foster-mother.”<\/p>\n<p><span class=\"ref\">Ruth 4:15–16<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">אֹמֶנֶת<\/span> (<em>ʾōmenet<\/em>) — “foster-mother,” “nurse,” “one who cares for a child.”<\/p>\n<\/div>\n<p>When Naomi came back to Bethlehem, she had lost everything: her husband and both her sons had died in a foreign country. “Don’t call me Naomi” (which means “pleasant”), she told the women of the town. “Call me Mara” (“bitter”) (1:20).<\/p>\n<p>The only thing she brought home was Ruth, her Moabite daughter-in-law, who had refused to leave her. “Wherever you go, I go; wherever you stay the night, I stay. Your people — my people; your God — my God” (1:16).<\/p>\n<p>The book of Ruth is, among other things, the story of how Naomi becomes a mother again.<\/p>\n<p>Ruth marries Boaz and gives birth to a son. And then something beautiful happens. Naomi takes the baby in her arms and becomes his <em>ʾōmenet<\/em> — his foster-mother, his nurse, his carer. The women of the town say: “A son has been born to Naomi!” (4:17).<\/p>\n<p>And they say something even more remarkable about Ruth: she “is better to you than seven sons.” In a culture that valued sons above almost everything, that was an astonishing thing to say about a daughter-in-law — and a foreigner at that.<\/p>\n<p>This little book stretches motherhood in two directions.<\/p>\n<p><strong>Across the boundary of blood.<\/strong> A grandmother becomes a mother. A daughter-in-law becomes more than a daughter.<\/p>\n<p><strong>Across the boundary of nation.<\/strong> A Moabite woman becomes the great-grandmother of King David — and an ancestor of Jesus (Matthew 1:5).<\/p>\n<p>Many families today look like Naomi’s: blended, broken and rebuilt, stretched across generations and cultures. Grandmothers raising grandchildren. Stepmothers. Mothers-in-law who become true mothers. The book of Ruth says: this, too, is motherhood — and God is in it.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Is there someone outside your “blood family” who has been a mother or daughter to you?<\/li>\n<li>Is there a child — a grandchild, a stepchild, a foster child — whom God is calling you to “take in your arms”?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, you turned Naomi’s bitterness into joy.<br />\nThank you for the families you build beyond blood and borders.<br />\nWhere I am empty, fill me;<br />\nand show me whom I am called to hold. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Thank a daughter-in-law, stepmother, grandmother, or other “Ruth” or “Naomi” in your life for what she means to you.\n<\/p>", "note": "Ruth appears in the genealogy of Jesus in Matthew 1:5."}, {"id": "M21", "n": 21, "title": "Mary Pondered", "part": 2, "read": "Luke 1:26–38; 2:15–19, 41–52", "ref": "Luke 2:19, 34–35", "html": "<blockquote>\n<p>“Mary kept all these things, turning them over in her heart… Then Simeon said to Mary his mother, ‘And a sword will pierce your own soul too.’”<\/p>\n<p><span class=\"ref\">Luke 2:19, 34–35<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> συνετήρει (<em>synetērei<\/em>) — Greek for “she kept,” “she treasured,” “she held carefully.” It is used of keeping something safe.<\/p>\n<\/div>\n<p>Mary is the most famous mother in history. Yet the Gospels tell us surprisingly little about her. What they give us are a few “glimpses,” and each one shows a different side of motherhood.<\/p>\n<p><strong>She said yes.<\/strong> When the angel told her she would bear a child, she answered, “Let it be to me according to your word” (1:38). Her motherhood began with trust — in a situation that could have brought her shame.<\/p>\n<p><strong>She knew she would be remembered.<\/strong> In her song, the Magnificat, she says: “From now on all generations will call me blessed” (1:48). And they have. For much of Christian history, and especially in the Catholic and Orthodox churches, Mary has been honoured above all others as the mother of the Lord; as early as the year 431 the church called her <em>Theotokos<\/em>, “God-bearer” — a title that was first of all a confession about who Jesus is. Christians differ about how to honour her. But no book about the mothers of the Bible can leave her at the margins.<\/p>\n<p><strong>She pondered.<\/strong> When the shepherds came with their strange story, Mary “kept all these things, turning them over in her heart” (2:19). Later, after the twelve-year-old Jesus stayed behind in the temple, Luke says it again: she “kept all these words in her heart” (2:51).<\/p>\n<p>Mary did not fully understand her son. But she held on to what she saw and heard, and kept thinking about it. That is a kind of love: patient, attentive, reflective.<\/p>\n<p><strong>She was warned.<\/strong> Simeon told her, “A sword will pierce your own soul too.” Mary’s motherhood would include deep sorrow — ultimately, watching her son die.<\/p>\n<p><strong>She searched anxiously.<\/strong> When Jesus went missing in Jerusalem, she and Joseph searched for three days. “Your father and I have been looking for you in anguish” (2:48). Even the mother of Jesus knew the panic of a lost child.<\/p>\n<p><strong>She pointed away from herself.<\/strong> At the wedding in Cana, she told the servants, “Whatever he tells you, do it” (John 2:5).<\/p>\n<p><strong>She stood at the cross<\/strong> (John 19:25) — and afterwards, she prayed with the disciples (Acts 1:14).<\/p>\n<p>Mary’s motherhood was not a fairy tale. It was trust, reflection, confusion, anxiety, sorrow, and faithfulness. Many mothers will find in her not a distant saint but a companion.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>What do you “keep and ponder” about your children — things you don’t yet understand?<\/li>\n<li>Which “glimpse” of Mary’s motherhood speaks most to you right now?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, thank you for Mary, who said yes, and pondered, and stood firm.<br />\nGive me her trust when I don’t understand,<br />\nher patience to keep watching,<br />\nand her courage to stand by my children in sorrow. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Write down one thing about each of your children that you want to “keep and ponder” — something you have noticed, but don’t yet fully understand.\n<\/p>", "note": "See Beverly Roberts Gaventa, <em>Mary: Glimpses of the Mother of Jesus<\/em> (1995). The title <em>Theotokos<\/em> was affirmed at the Council of Ephesus (431), against Nestorius, as a confession that the one born of Mary is God incarnate."}, {"id": "M22", "n": 22, "title": "The Mother Who Would Not Take No", "part": 2, "read": "Mark 7:24–30; Matthew 15:21–28", "ref": "Mark 7:28–29", "html": "<blockquote>\n<p>“But she answered him, ‘Yes, Lord — but even the little dogs under the table get the children’s crumbs.’ And he said to her, ‘Because of this word, go — the demon has left your daughter.’”<\/p>\n<p><span class=\"ref\">Mark 7:28–29<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> ναί, κύριε (<em>nai, kyrie<\/em>) — Greek for “Yes, Lord.”<\/p>\n<\/div>\n<p>This is one of the most surprising conversations in the Gospels.<\/p>\n<p>A Gentile woman — a foreigner, not Jewish — finds Jesus in a house where he is trying not to be noticed. Her little daughter is tormented by an evil spirit. She falls at his feet and begs him for help.<\/p>\n<p>And Jesus seems to refuse. “First let the children eat their fill; it isn’t right to take the children’s bread and toss it to the little dogs” (7:27). The “children” are the people of Israel; the “little dogs” are the Gentiles.<\/p>\n<p>It is a hard saying. Many mothers would have walked away hurt.<\/p>\n<p>She doesn’t. She answers: “Yes, Lord — but even the little dogs under the table eat the children’s crumbs.”<\/p>\n<p>She accepts his picture and turns it around. <em>All right, I’m not at the table. But I only need a crumb.<\/em> She is humble, quick-witted, and utterly determined — all for the sake of her daughter.<\/p>\n<p>And Jesus is delighted. In Matthew’s version he says, “Woman, great is your faith!” (15:28). Her daughter is healed.<\/p>\n<p>She is often described as the only person in the Gospels who wins an argument with Jesus. And she does it for her child.<\/p>\n<p>Mothers often have to become advocates: with doctors, schools, social services, courts, even churches. They are told “no,” or “not yet,” or “that’s not our responsibility.” Some give up. This mother shows the faith that keeps asking — humbly, cleverly, and without letting go — because a child’s life depends on it.<\/p>\n<p>Jesus does not rebuke that kind of persistence. He praises it.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Where do you need to advocate for a child right now? Have you been tempted to give up?<\/li>\n<li>What does it look like to be both humble and persistent in prayer?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, thank you for this mother who would not take no for an answer.<br />\nGive me her faith — humble, clever, and unshakeable —<br />\nto keep asking, for my children and for others,<br />\nuntil your help comes. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Take one practical step in advocating for a child — a phone call, a letter, a meeting you have been putting off.\n<\/p>", "note": ""}, {"id": "M23", "n": 23, "title": "Eve: Joy and Grief in One Chapter", "part": 3, "read": "Genesis 4:1–16, 25–26", "ref": "Genesis 4:1, 25", "html": "<blockquote>\n<p>“Eve conceived and bore Cain, and she said, ‘I have gotten a man, together with the LORD!’… She bore a son and called him Seth: ‘For God has set another child in place of Abel, because Cain killed him.’”<\/p>\n<p><span class=\"ref\">Genesis 4:1, 25<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">קָנִיתִי<\/span> (<em>qānîtî<\/em>) — “I have gotten,” “I have made.” Eve’s first word as a mother is a cry of triumph: she has made a new person, together with God.<\/p>\n<\/div>\n<p>The first mother in the Bible begins with a shout of joy. When Cain is born, Eve cries out, “I have made a man — together with the LORD!” Every mother who has held her firstborn knows something of that wonder.<\/p>\n<p>And then, in the same chapter, the worst thing imaginable happens. One of her sons kills the other.<\/p>\n<p>The Bible records no words from Eve when Abel dies. Nothing at all. Perhaps there were no words.<\/p>\n<p>Many chapters could have been written about her grief, but the Bible gives only one more sentence. When she bears another son, she names him Seth, and explains: “God has given me another child in place of Abel, because Cain killed him.”<\/p>\n<p>In that one sentence are both grief and hope. She does not pretend Abel is replaced. She names what happened — “Cain killed him.” And she receives a new child as a gift from God.<\/p>\n<p>Eve is not a “bad” mother. But the first mother in Scripture is also the first bereaved mother, and the first mother whose children turned on one another.<\/p>\n<p>This matters for many mothers:<\/p>\n<ul>\n<li>mothers whose children are at war with each other;<\/li>\n<li>mothers who have lost a child;<\/li>\n<li>mothers who carry joy and sorrow in the same heart.<\/li>\n<\/ul>\n<p>The Bible’s story of motherhood begins with both. It does not ask you to choose between them. You can hold your grief, and still receive the gifts God gives.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Do you carry a grief over one of your children, even as you rejoice over another?<\/li>\n<li>Are there tensions between your children that break your heart?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, you were with Eve in her joy and in her grief.<br />\nBe with me in both.<br />\nWhere my children are at war, bring peace.<br />\nWhere I have lost, give me hope. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> If your children are in conflict, pray for each of them by name — and look for one small way to help them see each other kindly.\n<\/p>", "note": ""}, {"id": "M24", "n": 24, "title": "Sarah and Hagar: The Mistress and the Slave", "part": 3, "read": "Genesis 16:1–13; 21:8–21", "ref": "Genesis 16:13; 21:16", "html": "<blockquote>\n<p>“She called the LORD who had spoken to her by this name: ‘You are El-roi — a God who sees me.’… ‘Let me not watch the child die.’”<\/p>\n<p><span class=\"ref\">Genesis 16:13; 21:16<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">אֵל רֳאִי<\/span> (<em>ʾēl rŏʾî<\/em>) — “a God who sees me.” Hagar, an Egyptian slave woman, gives God this name.<\/p>\n<\/div>\n<p>Sarah could not have children. In desperation she gave her Egyptian slave, Hagar, to Abraham, hoping to have a child through her — a practice of the time. Hagar had no say in it.<\/p>\n<p>It worked, and it went terribly wrong. When Hagar became pregnant, she looked down on Sarah. Sarah complained to Abraham, and he washed his hands of it: “Your slave is in your hands; do to her whatever you think best.” And Sarah, the Bible says, “afflicted her” (16:6). The Hebrew word is the same one used later for Egypt’s cruel oppression of the Israelites. The mother of God’s people treated her Egyptian slave the way Egypt would one day treat her descendants.<\/p>\n<p>Hagar ran away into the desert. And there, alone and pregnant, she was met by the angel of the LORD. She gave God a name: “You are a God who sees me.” She is often noted as the only person in the Old Testament who gives God a name.<\/p>\n<p>Years later, after Isaac was born, Sarah insisted that Hagar and her son Ishmael be driven out. In the desert the water ran out. Hagar put the boy under a bush and sat at a distance, saying, “Let me not watch the child die.” And God heard the boy, opened her eyes, and showed her a well.<\/p>\n<p>This is not a story of two rivals. It is the story of a woman who owned another woman — and used her body to get a child. Readers who descend from enslaved people have often seen in Hagar their own mothers and grandmothers: used, cast out, and yet seen by God.<\/p>\n<p>It is also a warning for mothers today. A mother’s fierce protectiveness for her own children can turn against other women — especially women with less power: the nanny, the cleaner, the refugee mother, the woman whose children are not welcome.<\/p>\n<p>Sarah is still the mother of the promise. God still keeps his word to her. But the Bible also makes sure we see Hagar — and that God sees her. He sides with the mother who has been cast out.<\/p>\n<p>If you are a Hagar, he sees you. If you have been a Sarah, it is not too late to turn.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Have you ever been hurt by another mother? Have you hurt one?<\/li>\n<li>Is there a woman with less power than you — at work, in your home, in your community — whom you could see as God sees Hagar?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>God who sees, you saw Hagar in the desert.<br />\nSee every mother who has been pushed aside.<br />\nForgive me where I have wounded another mother,<br />\nand make me a friend to her instead. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Speak or write a genuine word of encouragement to a mother you find it hard to get along with.\n<\/p>", "note": "The verb for Sarah’s treatment of Hagar (<em>ʿinnâ<\/em>, “afflict”) is used of Egypt’s oppression of Israel in Genesis 15:13 and Exodus 1:11–12. See Phyllis Trible, <em>Texts of Terror<\/em> (1984), on Hagar. On Hagar as an enslaved woman, see Delores S. Williams, <em>Sisters in the Wilderness<\/em> (1993), and Renita J. Weems, <em>Just a Sister Away<\/em> (1988)."}, {"id": "M25", "n": 25, "title": "Rebekah: “Upon Me Be the Curse”", "part": 3, "read": "Genesis 25:19–28; 27:1–17, 41–46", "ref": "Genesis 27:13", "html": "<blockquote>\n<p>“His mother answered him, ‘Upon me be your curse, my son. Only listen to me.’”<\/p>\n<p><span class=\"ref\">Genesis 27:13<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">קִלְלָתְךָ<\/span> (<em>qilĕlātĕkā<\/em>) — “your curse.”<\/p>\n<\/div>\n<p>Rebekah is one of the strongest women in Genesis. When her pregnancy was difficult, she “went to inquire of the LORD” herself (25:22) — something rare for anyone in that story. And God told her that she carried twins, and that “the older will serve the younger.”<\/p>\n<p>Then the Bible adds a sentence that explains much of what follows: “Isaac loved Esau… but Rebekah loved Jacob” (25:28).<\/p>\n<p>Years later, when Isaac was old and blind and about to give his blessing to Esau, Rebekah made a plan. She dressed Jacob in his brother’s clothes, covered his arms with goatskins, cooked the meal, and sent him in to deceive his father.<\/p>\n<p>When Jacob was afraid he would be cursed, she said, “Upon me be your curse, my son.”<\/p>\n<p>It is an astonishing sentence. It shows fierce, sacrificial love. It also shows a mother willing to deceive her husband and cheat her other son to get what she wanted for her favourite.<\/p>\n<p>Perhaps she believed she was helping God’s promise come true. But the Bible does not approve of her method. And the cost was high. Esau vowed to kill Jacob, and Rebekah had to send her beloved son away, “for a few days” (27:44). She never saw him again. The Bible does not even record her death.<\/p>\n<p>Rebekah’s story is a warning about two things mothers can be tempted to do:<\/p>\n<ul>\n<li><strong>to favour one child<\/strong>, even without meaning to;<\/li>\n<li><strong>to manipulate events<\/strong> to secure what we think is best for our children — even what we believe God wants for them.<\/li>\n<\/ul>\n<p>God did not need Rebekah’s deception to keep his promise. And he does not need ours. Trusting God with our children’s future means refusing to cheat on their behalf.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Is there a child you naturally favour? How might your other children see it?<\/li>\n<li>Are you trying to control or manipulate an outcome for one of your children?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, forgive me for the ways I try to secure my children’s future by my own schemes.<br />\nHelp me to love each of them fully,<br />\nand to trust you with the promises I cannot control. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Notice any situation where you are “pulling strings” for a child. Decide to step back and trust God with it.\n<\/p>", "note": "Rebekah’s nurse Deborah’s death is recorded (Genesis 35:8), but Rebekah’s is not."}, {"id": "M26", "n": 26, "title": "Leah and Rachel: Names That Carry Wounds", "part": 3, "read": "Genesis 29:31–30:24", "ref": "Genesis 29:32 (NIV)", "html": "<blockquote>\n<p>“Leah became pregnant and gave birth to a son. She named him Reuben, for she said, ‘It is because the LORD has seen my misery. Surely my husband will love me now.’”<\/p>\n<p><span class=\"ref\">Genesis 29:32 (NIV)<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">רְאוּבֵן<\/span> (<em>rĕʾûbēn<\/em>) — “Reuben.” The name sounds like “See — a son!” and also like “He has seen my misery.”<\/p>\n<\/div>\n<p>In many of the Bible’s stories, it is the mother who names the child. And in the story of Leah and Rachel we see what that can mean.<\/p>\n<p>Jacob loved Rachel and was tricked into marrying her older sister Leah first. So Leah was the unloved wife — and Jacob never hid it. Every time she had a son, she gave him a name that was really a message to her husband:<\/p>\n<ul>\n<li><strong>Reuben<\/strong> — “The LORD has seen my misery. Surely my husband will love me now.”<\/li>\n<li><strong>Simeon<\/strong> — “The LORD has heard that I am unloved.”<\/li>\n<li><strong>Levi<\/strong> — “Now at last my husband will be attached to me.”<\/li>\n<\/ul>\n<p>Rachel, loved but unable to have children, cried to Jacob: “Give me children, or I will die!” (30:1). Jacob’s only answer was anger: “Am I in the place of God?” (30:2). She gave him her maid Bilhah, and when Bilhah had a son, Rachel named him Naphtali: “I have fought a mighty fight with my sister, and I have won” (30:8).<\/p>\n<p>Notice who is <em>not<\/em> speaking. Bilhah and Zilpah, the slave-women who actually gave birth to four of these sons, never name their own children. Their mistresses do it for them. The Bible does not record a single word from either of them.<\/p>\n<p>Imagine growing up with a name like that. Every time someone calls you, they are repeating your mother’s grievance against her husband, or her victory over her sister.<\/p>\n<p>The twelve sons of Jacob grew up inside this rivalry. And the hatred of the older brothers for Joseph, Rachel’s son, was the next chapter of the same war.<\/p>\n<p>Children often end up carrying their parents’ conflicts: in marriages that are unhappy, in divorces, in family feuds. They hear the complaints. They are asked to take sides. They carry the names we give them — sometimes literally, sometimes in the words we speak over them.<\/p>\n<p>And yet the story has a turning point. When Leah had her fourth son, she named him Judah and said simply: “This time I will praise the LORD” (29:35). For once, the name was not about her husband. It was about God.<\/p>\n<p>From Judah came King David — and Jesus.<\/p>\n<p>One more silence. Leah also had a daughter, Dinah (Genesis 30:21). When Dinah was raped (Genesis 34), her brothers took revenge and her father worried about his reputation — and her mother is never mentioned. The Bible almost never shows us mothers with their daughters. If you are a mother of daughters, you are writing a story the Bible mostly leaves blank.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Are your children carrying any of your conflicts — with a spouse, an ex, or a relative?<\/li>\n<li>What words, spoken often, are shaping how your children see themselves?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, you saw Leah’s misery and heard Rachel’s cry.<br />\nKeep me from putting my wounds on my children.<br />\nLet the names I speak over them be words of blessing,<br />\nand let my home be a place of praise, not rivalry. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Speak one sentence of blessing over each child — about who they are, not about anyone else.\n<\/p>", "note": "The explanations of the names are wordplays rather than strict etymologies. On mothers naming children, see Edward J. Bridge, “A Mother’s Influence: Mothers Naming Children in the Hebrew Bible,” <em>Vetus Testamentum<\/em> 64 (2014). On rivalry between the “houses” of different mothers in a household, see Cynthia R. Chapman, <em>The House of the Mother<\/em> (2016). The same child can be named by his mother in one account and his father in another: Eve names Seth in Genesis 4:25, Adam in Genesis 5:3. Rachel and Leah named the sons of Bilhah and Zilpah (Genesis 30:6–13). Leah’s daughter Dinah appears in Genesis 30:21 and 34."}, {"id": "M27", "n": 27, "title": "Using a Child for Our Own Ends", "part": 3, "read": "Mark 6:17–28; Matthew 20:20–28", "ref": "Mark 6:24", "html": "<blockquote>\n<p>“The girl went out and asked her mother, ‘What am I to ask for?’ Her mother replied, ‘The head of John the Baptizer.’”<\/p>\n<p><span class=\"ref\">Mark 6:24<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> αἰτήσωμαι (<em>aitēsōmai<\/em>) — Greek for “Should I ask?” or “What shall I ask for?”<\/p>\n<\/div>\n<p>Two mothers in the Gospels show how easily a mother’s ambition can take over a child’s life.<\/p>\n<p>The first is <strong>Herodias<\/strong>. She hated John the Baptist, who had condemned her marriage to Herod. At Herod’s birthday feast, her daughter danced, and the king, delighted, promised her anything she asked. The girl went to her mother: “What am I to ask for?”<\/p>\n<p>Herodias did not hesitate. “The head of John the Baptizer.”<\/p>\n<p>A mother made her own daughter the instrument of a killing. The girl’s moment of delight became the vehicle for her mother’s grudge. Mark tells the story to explain how John the Baptist died, not to teach about mothering — but the glimpse is still a warning.<\/p>\n<p>The second mother is gentler. <strong>The mother of James and John<\/strong> came to Jesus, knelt before him, and asked that her two sons might sit at his right and left in his kingdom (Matthew 20:20–21). She wanted the best for them — the highest places.<\/p>\n<p>Jesus did not scold her. But he turned to her sons and asked, “Are you able to drink the cup I am about to drink?” He redirected her ambition away from status and toward faithfulness, even suffering. And later, this same mother is named among the women standing near the cross (Matthew 27:56). Her ambition had been transformed into loyalty.<\/p>\n<p>Most mothers would never do what Herodias did. But there are quieter ways of using children for our own ends:<\/p>\n<ul>\n<li>living through their achievements, so that their success becomes our success;<\/li>\n<li>pushing them toward our own unfulfilled dreams;<\/li>\n<li>using them as messengers or weapons in conflicts with the other parent;<\/li>\n<li>caring more about how they make us look than about who they are.<\/li>\n<\/ul>\n<p>The mother of James and John shows the better way. It is right to want good things for our children. But Jesus asks us to want for them what <em>he<\/em> wants: not the best seats, but a faithful life.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Is there any way you are living through your child — their grades, sports, looks, or success?<\/li>\n<li>What do you most want for your children? Is it what Jesus wants for them?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, forgive me where I have used my children to meet my own needs.<br />\nRedirect my ambitions for them,<br />\nas you redirected the mother of James and John —<br />\nfrom status to faithfulness, from my will to yours. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Ask one of your children what <em>they<\/em> hope for their own life — and listen without steering.\n<\/p>", "note": "The mother of the sons of Zebedee appears again at the cross in Matthew 27:56."}, {"id": "M28", "n": 28, "title": "Rachel Weeping", "part": 4, "read": "Jeremiah 31:15–17; Matthew 2:16–18", "ref": "Jeremiah 31:15–17", "html": "<p class=\"warning\">\nThis reading is especially for mothers who have lost a child — through miscarriage, stillbirth, illness, accident, violence, or estrangement.\n<\/p>\n<blockquote>\n<p>“A cry is heard in Ramah — mourning and bitter weeping. It is Rachel, weeping for her children. She will not be comforted over her children, because they are gone. This is what the LORD says: ‘Hold back your voice from weeping and your eyes from tears… There is hope for your future.’”<\/p>\n<p><span class=\"ref\">Jeremiah 31:15–17<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">מֵאֲנָה לְהִנָּחֵם<\/span> (<em>mēʾănâ lĕhinnāḥēm<\/em>) — “she refuses to be comforted.”<\/p>\n<\/div>\n<p>Rachel died giving birth. Centuries later, when the people of Israel were being led away into exile, the prophet Jeremiah heard her voice again — the voice of a mother weeping for her lost children.<\/p>\n<p>And the Bible lets her refuse to be comforted.<\/p>\n<p>That is important. There is a kind of grief that cannot be comforted, at least not yet. Well-meaning people rush in with words — “at least you have other children,” “God needed another angel,” “you can try again.” Those words usually hurt more than they help.<\/p>\n<p>The Bible does not do that. It records Rachel’s refusal without rebuke. It gives her grief a voice. It includes her weeping in the Scriptures.<\/p>\n<p>And then God speaks — not to correct her, but to promise: “There is hope for your future.”<\/p>\n<p>Matthew brings Rachel’s weeping into the Christmas story. When King Herod killed the little boys of Bethlehem, Matthew says that this fulfilled what Jeremiah the prophet had said: “Rachel, weeping for her children” (Matthew 2:17–18). In the middle of the story of Jesus’ birth there are grieving mothers whose sons were murdered. The Gospel does not skip over them.<\/p>\n<p>If you have lost a child, the Bible is not asking you to “move on.” It makes room for your grief — even for grief that refuses comfort. And it holds out a hope that does not cancel your sorrow but stands beside it: a future in which God will wipe away every tear (Revelation 21:4).<\/p>\n<p>If you are walking alongside a grieving mother, learn from this passage. Don’t hurry her. Don’t explain. Sit with her, and let her weep.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>If you have lost a child, have you been allowed to grieve? Have you allowed yourself?<\/li>\n<li>If you know a grieving mother, how could you simply be with her?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, you heard Rachel weeping and did not silence her.<br />\nHear the mothers who weep for children who are no more.<br />\nHold their grief; do not hurry them.<br />\nAnd give them, in your time, hope for their future. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> If you have lost a child, say their name aloud to God. If you know a grieving mother, send her a message that simply says, “I’m remembering your child today.”\n<\/p>", "note": ""}, {"id": "M29", "n": 29, "title": "For Those Who Longed for Children", "part": 4, "read": "Isaiah 54:1–5; 56:3–5; Luke 11:27–28", "ref": "Isaiah 56:5", "html": "<blockquote>\n<p>“In my house, inside my walls, I will give them a memorial and a name — better than sons and daughters. An everlasting name I will give them, one that will never be cut off.”<\/p>\n<p><span class=\"ref\">Isaiah 56:5<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">עֲקָרָה<\/span> (<em>ʿăqārâ<\/em>) — “barren,” a woman who has not been able to have children.<\/p>\n<\/div>\n<p>The Bible is full of women who longed for children: Sarah, Rebekah, Rachel, Hannah, Elizabeth. Their stories are told again and again — and in each one, a child is finally born.<\/p>\n<p>For many women, those stories are painful. If God answered Hannah, why not me? Was her faith greater than mine? Did I not pray enough?<\/p>\n<p>It is important to say this clearly: <strong>the Bible’s stories of barren women are not a promise that every woman who prays will have a child.<\/strong> They are about God keeping his promises to his people in impossible circumstances. They were never meant to be a formula — and they were never meant to make childless women feel like failures.<\/p>\n<p>We should also be honest: the Bible treats children as a great blessing, and childlessness as a real grief. When Rachel finally had a son she said, “God has taken away my disgrace” (Genesis 30:23), and a psalm praises God because he “settles the childless woman in her home as a joyful mother of children” (Psalm 113:9). Scripture never pretends that longing for a child is small.<\/p>\n<p>And yet, in a few striking places, the Bible also says that a woman’s worth before God does not depend on children.<\/p>\n<p><strong>Isaiah tells the childless to sing.<\/strong> “Sing, O barren one, who never bore a child” (54:1). God’s people, pictured as a childless woman, are promised a family larger than they could imagine.<\/p>\n<p><strong>Isaiah promises something <em>better<\/em> than children.<\/strong> To those who were cut off from having families — the eunuchs — God says: “I will give them a memorial and a name better than sons and daughters” (56:5). The promise was first spoken to eunuchs, but it has comforted childless women ever since.<\/p>\n<p><strong>Jesus refuses to measure a woman by her womb.<\/strong> When a woman in the crowd called out, “Blessed is the womb that carried you!”, Jesus answered, “Blessed rather are those who hear God’s word and keep it” (Luke 11:27–28). Blessing is not tied to motherhood. It is open to every woman who follows God.<\/p>\n<p><strong>Many of the Bible’s faithful women are never said to have children.<\/strong> Miriam, Huldah, Anna, Phoebe, Lydia, Mary Magdalene — and possibly Deborah, the “mother in Israel” (Day 11). Their worth is never questioned.<\/p>\n<p>If you longed for children and never had them, or are still waiting, you are not less in God’s eyes. Your name is written in his house.<\/p>\n<p>And if you are a mother, remember the women around you for whom Mother’s Day is one of the hardest days of the year.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>If you have longed for children: have you felt judged, by others or by yourself? What does God say about you in these verses?<\/li>\n<li>If you are a mother: who in your church or circle carries this grief silently?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, you promise a name better than sons and daughters.<br />\nFor every woman who has longed for a child and waited in vain,<br />\nbe her joy, her family, and her everlasting name.<br />\nBlessed are those who hear your word and keep it. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> If this is your grief, let a trusted friend know how you are really doing. If it isn’t, reach out kindly to a woman for whom it is.\n<\/p>", "note": "On the stories of barren women as a recurring pattern, see Robert Alter, “How Convention Helps Us Read: The Case of the Bible’s Annunciation Type-Scene,” <em>Prooftexts<\/em> 3 (1983), and Mary Callaway, <em>Sing, O Barren One<\/em> (1986). On the difficult verse 1 Timothy 2:15 (“saved through childbearing”), interpretations differ widely (see Stanley Porter, <em>JSNT<\/em> 49 [1993]; Andreas Köstenberger, <em>BBR<\/em> 7 [1997]); none of the serious readings makes having children a condition of salvation."}, {"id": "M30", "n": 30, "title": "If Your Mother Hurt You", "part": 4, "read": "Isaiah 49:14–16; Psalm 27:7–14; 2 Kings 11:1–3", "ref": "Isaiah 49:15; Psalm 27:10", "html": "<blockquote>\n<p>“Even they may forget — but I will not forget you… Though my father and my mother forsake me, the LORD will take me in.”<\/p>\n<p><span class=\"ref\">Isaiah 49:15; Psalm 27:10<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">גַּם־אֵלֶּה תִשְׁכַּחְנָה<\/span> (<em>gam-ʾēlleh tiškaḥnâ<\/em>) — “even they may forget.” God admits that some mothers fail their children.<\/p>\n<\/div>\n<p>This day is for everyone whose mother hurt them — by cruelty, neglect, manipulation, violence, or a coldness that never let them feel loved.<\/p>\n<p>It is very hard to talk about. Our culture — and often our churches — treat mothers as almost sacred. People who were harmed by their mothers are often not believed, or are told they must “honour” her by staying silent.<\/p>\n<p>The Bible is more honest than that.<\/p>\n<p><strong>It knows that mothers can fail.<\/strong> “Even they may forget,” says Isaiah. God does not pretend that every mother is safe.<\/p>\n<p><strong>It shows God providing other people.<\/strong> When a queen’s murderous grab for power put a baby prince in danger, his aunt Jehosheba stole him away and hid him with his nurse in the temple for six years (2 Kings 11:1–3). That is a story about politics, not parenting — but it shows something God does again and again: where one person fails a child, he raises up another. Many people who were hurt by their mothers can name a “Jehosheba” — an aunt, a grandmother, a teacher, a neighbour, a friend’s mother — who gave them the love their own mother didn’t.<\/p>\n<p><strong>Honour does not mean pretending.<\/strong> The command to honour your mother is not a weapon to silence you. It does not mean saying the harm didn’t happen, and it does not mean putting yourself back in danger. Sometimes honouring a mother who hurt you means telling the truth, setting safe boundaries, and refusing to pass the harm on.<\/p>\n<p><strong>Forgiveness is not the same as trust.<\/strong> Forgiveness means handing your right to revenge over to God. It may take a long time. Trust is different: it can only be rebuilt by real change, and sometimes it cannot be rebuilt at all.<\/p>\n<p><strong>You are not doomed to repeat it.<\/strong> Many people hurt by their mothers have become gentle, faithful parents. It takes courage, and usually help — but it is possible.<\/p>\n<p><strong>God’s love is not a bigger copy of your mother’s.<\/strong> “Even they may forget — but I will not forget you.” His love is the love your mother should have given you.<\/p>\n<p>Please don’t carry this alone. A wise counsellor, pastor, or trusted friend can help.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>What did your mother’s harm teach you to believe about yourself? Is it true?<\/li>\n<li>Who has been a “Jehosheba” to you — someone who gave you the love you needed?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, even mothers may forget, but you never do.<br />\nYou saw what happened to me.<br />\nWhere my mother failed me, take me in.<br />\nHeal what was broken, and keep me from passing it on. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/s
