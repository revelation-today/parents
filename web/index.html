trong> Thank God for a “Jehosheba” in your life. If you carry wounds from your mother, tell one safe person — or write her a letter you do not send, and give it to God.\n<\/p>", "note": "Athaliah’s massacre of the royal family (2 Kings 11:1) was a political purge by a queen seizing the throne; the story is used here only for the rescue of Joash by his aunt Jehosheba."}, {"id": "M31", "n": 31, "title": "“Woman, Here Is Your Son”", "part": 4, "read": "John 19:25–27; Acts 1:12–14", "ref": "John 19:25–27 (NIV)", "html": "<blockquote>\n<p>“Near the cross of Jesus stood his mother, his mother’s sister, Mary the wife of Clopas, and Mary Magdalene. When Jesus saw his mother there, and the disciple whom he loved standing near by, he said to her, ‘Woman, here is your son,’ and to the disciple, ‘Here is your mother.’ From that time on, this disciple took her into his home.”<\/p>\n<p><span class=\"ref\">John 19:25–27 (NIV)<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> γύναι, ἴδε (<em>gynai, ide<\/em>) — Greek for “Woman, look,” “Woman, here is…”<\/p>\n<\/div>\n<p>For thirty days we have walked with the mothers of the Bible: mothers who hid and let go, prayed and persisted, wept and refused to be comforted; mothers who wounded one another, and mothers who were wounded.<\/p>\n<p>We end at the foot of the cross.<\/p>\n<p>Mary is there. Thirty-three years earlier, the old man Simeon had told her, “A sword will pierce your own soul too.” Now the sword has come. She is watching her son die.<\/p>\n<p>Every mother’s deepest fear is gathered in that moment. And Jesus, in agony, sees her.<\/p>\n<p>“Woman, here is your son.” And to his beloved disciple: “Here is your mother.” And from that hour, the disciple welcomed her into his own home.<\/p>\n<p>With his dying breath, Jesus does two things.<\/p>\n<p><strong>He honours his mother.<\/strong> He makes sure she will be cared for. Even on the cross, he keeps the command to honour his mother.<\/p>\n<p><strong>He creates a new family.<\/strong> A mother who is losing her son is given a son. A disciple is given a mother. At the foot of the cross, a new household begins — the family of all who follow Jesus. In that family, no mother need grieve alone, and no child need be motherless.<\/p>\n<p>And Mary’s story does not end at the cross. The last time we see her, she is in the upper room with the disciples, praying (Acts 1:14). The mother who stood at the cross became part of the praying church.<\/p>\n<p>This is the last word for mothers — and for everyone who has had a mother. God has not left us to carry our joys and sorrows alone. He gathers us into a family where the grieving are given sons and daughters, the lonely are given mothers, and every tear will one day be wiped away.<\/p>\n<p>We began with a promise: “As a mother comforts her child, so will I comfort you.” We end where that promise is sealed — at the cross, where God himself entered a mother’s grief, and began to comfort the world.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Looking back over these thirty-one days, which mother of the Bible has spoken to you most?<\/li>\n<li>Who has God given you as family — “here is your son,” “here is your mother” — beyond your own family?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord Jesus, from the cross you saw your mother and gave her a son.<br />\nSee every mother who grieves; give her family and comfort.<br />\nGather us all into your household,<br />\nuntil the day you wipe away every tear. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Pray for three mothers you know by name. Then thank God for the “mothers” and “children” he has given you in his family.\n<\/p>", "note": "“He will wipe away every tear” is from Revelation 21:4."}], "marksTitle": "Sixteen Marks of a Good Mother", "marks": "<p>Sixteen things this book has drawn from Scripture — not a list the Bible itself gives, but one careful reading of it.<\/p>\n<ol type=\"1\">\n<li><strong>Protect life, even against power.<\/strong> <em>(Exodus 1:17; 2:2–3)<\/em><\/li>\n<li><strong>Pour out your soul to God.<\/strong> <em>(1 Samuel 1:15)<\/em><\/li>\n<li><strong>Hold your children with open hands.<\/strong> <em>(1 Samuel 1:28; 1 Kings 3:26)<\/em><\/li>\n<li><strong>Keep showing up — a little robe each year.<\/strong> <em>(1 Samuel 2:19)<\/em><\/li>\n<li><strong>Teach: your teaching is <em>tôrâ<\/em>.<\/strong> <em>(Proverbs 1:8; 6:20)<\/em><\/li>\n<li><strong>Teach justice for the voiceless.<\/strong> <em>(Proverbs 31:8–9)<\/em><\/li>\n<li><strong>Let the teaching of kindness be on your tongue.<\/strong> <em>(Proverbs 31:26)<\/em><\/li>\n<li><strong>Do not forget.<\/strong> <em>(Isaiah 49:15)<\/em><\/li>\n<li><strong>Comfort.<\/strong> <em>(Isaiah 66:13)<\/em><\/li>\n<li><strong>Refuse favouritism and manipulation.<\/strong> <em>(Genesis 27)<\/em><\/li>\n<li><strong>Don’t make your children carry your battles.<\/strong> <em>(Genesis 29–30; Mark 6:24)<\/em><\/li>\n<li><strong>Persist on your child’s behalf.<\/strong> <em>(2 Kings 4:30; Mark 7:28)<\/em><\/li>\n<li><strong>Grieve honestly.<\/strong> <em>(Jeremiah 31:15)<\/em><\/li>\n<li><strong>Mother beyond biology.<\/strong> <em>(Ruth 4:16; Judges 5:7)<\/em><\/li>\n<li><strong>Ponder and treasure.<\/strong> <em>(Luke 2:19)<\/em><\/li>\n<li><strong>Know that your worth is not your womb.<\/strong> <em>(Luke 11:28; Isaiah 56:5)<\/em><\/li>\n<\/ol>", "notesIntro": "<p>This devotional is based on a longer study, <em>Mothers in the Bible: A Study of Maternal Vocation in the Hebrew Bible and the New Testament<\/em>, which gives the full discussion, the Hebrew and Greek texts, and a bibliography. It is the companion to <em>Like a Father<\/em> and the study <em>Fathers in the Bible<\/em>. The notes below point to the main sources behind particular days, and mark places where readings are debated.<\/p><p><strong>Before You Begin.<\/strong> On how the women of Exodus 1–2 are celebrated and then disappear from the story, see J. Cheryl Exum, “‘You Shall Let Every Daughter Live’,” <em>Semeia<\/em> 28 (1983), and her own later reconsideration, “Second Thoughts about Secondary Characters” (1994); more broadly, Esther Fuchs, <em>Sexual Politics in the Biblical Narrative<\/em> (2000).<\/p>", "languages": "<p><strong>Translations.<\/strong> Scripture quotations marked NIV are taken from the Holy Bible, New International Version (Anglicised edition). Copyright © 1979, 1984, 2011 by Biblica. Used by permission of Hodder &amp; Stoughton Ltd, an Hachette UK company. All rights reserved. ‘NIV’ is a registered trademark of Biblica. UK trademark number 1448790. All other Bible quotations are the author’s own translations from the Hebrew and Greek, kept close to the original wording; they are used where a day’s reflection depends on the wording of the original. “The LORD” in capital letters stands for God’s personal name in Hebrew, often written YHWH.<\/p>\n<p><strong>Verse numbers<\/strong> follow English Bibles.<\/p>\n<p><strong>Transliteration.<\/strong> Each Hebrew or Greek word is also written in Latin letters so you can say it:<\/p>\n<ul>\n<li>ʾ is a slight catch in the breath; ʿ is a deeper sound from the throat. Both can simply be skipped when reading aloud.<\/li>\n<li>A line over a vowel (ā, ē, ō) means it is long; a circumflex (â, ê, î, ô, û) means the same.<\/li>\n<li>ĕ and ă are very short, quick vowels.<\/li>\n<li>š is “sh.” ḥ is a rough “h,” like the “ch” in Scottish <em>loch<\/em>. ṣ is “ts.” ś and s both sound like “s.”<\/li>\n<\/ul>\n<p>You do not need to know any of this to use the book. The words are there as small windows into the text — reminders that these stories were first told in real languages, about real mothers, to their own children.<\/p>"}}, "plans": [{"id": "side", "name": "Side by Side", "blurb": "Both books together, one day of each. The two books follow the same five parts, so each day's readings belong together.", "days": [["F1", "M1"], ["F2", "M2"], ["F3", "M3"], ["F4", "M4"], ["F5", "M5"], ["F6", "M6"], ["F7", "M7"], ["F8", "M8"], ["F9", "M9"], ["F10", "M10"], ["F11", "M11"], ["F12", "M12"], ["F13", "M13"], ["F14", "M14"], ["F15", "M15"], ["F16", "M16"], ["F17", "M17"], ["F18", "M18"], ["F19", "M19"], ["F20", "M20"], ["F21", "M21"], ["F22", "M22"], ["F23", "M23"], ["F24", "M24"], ["F25", "M25"], ["F26", "M26"], ["F27", "M27"], ["F28", "M28"], ["F29", "M29"], ["F30", "M30"], ["F31", "M31"]]}, {"id": "father", "name": "Like a Father", "blurb": "The fathers of the Bible, and the Father they are measured by.", "days": [["F1"], ["F2"], ["F3"], ["F4"], ["F5"], ["F6"], ["F7"], ["F8"], ["F9"], ["F10"], ["F11"], ["F12"], ["F13"], ["F14"], ["F15"], ["F16"], ["F17"], ["F18"], ["F19"], ["F20"], ["F21"], ["F22"], ["F23"], ["F24"], ["F25"], ["F26"], ["F27"], ["F28"], ["F29"], ["F30"], ["F31"]]}, {"id": "mother", "name": "As a Mother Comforts", "blurb": "The mothers of the Bible, and the God who comforts like a mother.", "days": [["M1"], ["M2"], ["M3"], ["M4"], ["M5"], ["M6"], ["M7"], ["M8"], ["M9"], ["M10"], ["M11"], ["M12"], ["M13"], ["M14"], ["M15"], ["M16"], ["M17"], ["M18"], ["M19"], ["M20"], ["M21"], ["M22"], ["M23"], ["M24"], ["M25"], ["M26"], ["M27"], ["M28"], ["M29"], ["M30"], ["M31"]]}, {"id": "teach", "name": "Teaching Your Children", "blurb": "What fathers and mothers hand on, and how.", "days": [["F7"], ["M7"], ["F8"], ["M8"], ["F9"], ["M9"], ["F10"], ["M10"]]}, {"id": "wrong", "name": "When Parents Get It Wrong", "blurb": "Favouritism, silence, manipulation — and what the Bible does with them.", "days": [["F21"], ["M25"], ["M26"], ["F22"], ["F23"], ["F24"], ["M27"], ["F26"]]}, {"id": "grief", "name": "Grief and Loss", "blurb": "Mothers and fathers who lost children, and a God who does not forget.", "days": [["M23"], ["M24"], ["F25"], ["M18"], ["M28"], ["M29"], ["M2"]]}, {"id": "hurt", "name": "If a Parent Hurt You", "blurb": "For readers whose father or mother did them harm.", "days": [["F30"], ["M30"], ["F2"], ["F5"], ["M2"], ["F28"], ["F31"]]}]};
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());

/* ---------- indexes ---------- */
const DAY = {};
for (const k of ["F","M"]) for (const d of DATA.books[k].days) DAY[d.id] = Object.assign({book:k}, d);
const PLAN = Object.fromEntries(DATA.plans.map(p => [p.id, p]));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bookName = k => DATA.books[k].title;

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,"0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const dayNum = s => { const [y,m,d] = s.split("-").map(Number); return Math.floor(Date.UTC(y,m-1,d)/864e5); };
const fmtDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("en-GB",{day:"numeric",month:"long"}); };

/* ---------- state: this device, synced to the account when available ---------- */
const KEY = "like-a-father-as-a-mother-v1";
let S = {read:{}, plans:{}, font:1, last:null, t:0};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
let sync = {state:"device", ref:null, writing:false, dirty:false, timer:null};

function isRead(id){ return !!(S.read[id] && S.read[id].r); }
function setRead(id, on){ S.read[id] = {r:on, t:Date.now()}; commit(); }
function activePlans(){ return Object.entries(S.plans).filter(([id,p]) => PLAN[id] && !p.stopped).sort((a,b)=>a[1].t-b[1].t).map(([id,p])=>({plan:PLAN[id], st:p})); }
function startPlan(id){ S.plans[id] = {start: todayStr(), t: Date.now(), stopped:false}; commit(); }
function stopPlan(id){ if (S.plans[id]) { S.plans[id] = Object.assign({}, S.plans[id], {stopped:true, t:Date.now()}); commit(); } }

function commit(){
  S.t = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (sync.ref) { sync.dirty = true; clearTimeout(sync.timer); sync.timer = setTimeout(pushSync, 1200); }
}
async function pushSync(){
  if (!sync.ref || sync.writing || !sync.dirty) return;
  sync.writing = true; sync.dirty = false;
  try { await sync.ref.set(JSON.parse(JSON.stringify(S))); sync.state = "account"; }
  catch (e) { if (e && e.code === "unavailable") sync.dirty = true; else { sync.state = "device"; sync.ref = null; } }
  sync.writing = false;
  if (sync.dirty) sync.timer = setTimeout(pushSync, 2500);
}
function merge(remote){
  if (!remote || typeof remote !== "object") return false;
  let changed = false;
  for (const [id,v] of Object.entries(remote.read || {})) if (!S.read[id] || (v && v.t > S.read[id].t)) { S.read[id] = v; changed = true; }
  for (const [id,v] of Object.entries(remote.plans || {})) if (!S.plans[id] || (v && v.t > S.plans[id].t)) { S.plans[id] = v; changed = true; }
  if ((remote.t||0) > (S.t||0)) { if (remote.font) S.font = remote.font; if (remote.last) S.last = remote.last; changed = true; }
  return changed;
}
async function connect(){
  if (!(window.claude && window.claude.use)) return;
  try {
    const user = await window.claude.use("user");
    const uid = user ? await user.id() : null;
    if (!uid) return;
    const db = await window.claude.use("db");
    if (!db) return;
    const ref = db.doc("data/users/" + uid + "/progress");
    const snap = await ref.get();
    const localNewer = merge(snap.exists ? snap.data() : null) || !snap.exists || (S.t||0) > ((snap.data()||{}).t||0);
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    sync.ref = ref; sync.state = "account";
    if (localNewer && (Object.keys(S.read).length || Object.keys(S.plans).length)) { sync.dirty = true; pushSync(); }
    render();
  } catch (e) { sync.state = "device"; }
}

/* ---------- plan maths ---------- */
function planInfo(plan, st){
  const n = plan.days.length;
  const done = plan.days.map(rs => rs.every(isRead));
  const next = done.indexOf(false);
  const sched = Math.min(n, Math.max(1, dayNum(todayStr()) - dayNum(st.start) + 1));
  let behind = 0; for (let i = 0; i < sched; i++) if (!done[i]) behind++;
  behind = Math.max(0, behind - 1);             // today's own reading is not "behind"
  return {n, done, next, sched, behind, count: done.filter(Boolean).length};
}
function readHref(id, planId, idx){ return "#/read/" + id + (planId ? `?plan=${planId}&d=${idx}` : ""); }

/* ---------- small pieces ---------- */
const ICON = {
  today:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  plans:'<svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>',
  library:'<svg viewBox="0 0 24 24"><path d="M4 5.5C6.5 4.5 9.5 4.6 12 6c2.5-1.4 5.5-1.5 8-.5V19c-2.5-1-5.5-.9-8 .5-2.5-1.4-5.5-1.5-8-.5z"/><path d="M12 6v13.5"/></svg>',
  about:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.2"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  tick:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};
function tabs(active){
  const t = [["today","Today"],["plans","Plans"],["library","Library"],["about","About"]];
  document.getElementById("tabs").innerHTML = t.map(([k,l]) =>
    `<a class="tab" href="#/${k}" ${active===k?'aria-current="page"':''}>${ICON[k]}<span>${l}</span></a>`).join("");
}
function readingRow(id, planId, idx){
  const d = DAY[id];
  return `<a class="reading" data-book="${d.book}" href="${readHref(id,planId,idx)}">
    <span class="dot" aria-hidden="true"></span>
    <span><div class="t">${esc(d.title)}</div><div class="s">${esc(bookName(d.book))} · Day ${d.n}${d.read?" · "+esc(d.read):""}</div></span>
    ${isRead(id) ? `<span class="check on" data-book="${d.book}" aria-label="Read">${ICON.tick}</span>` : `<span class="chev" aria-hidden="true">›</span>`}
  </a>`;
}
function ticks(info){
  return `<div class="ticks" aria-hidden="true">${info.done.map((d,i)=>`<span class="tick ${d?"done":i===info.next?"next":i<info.sched?"due":""}"></span>`).join("")}</div>`;
}
function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.hidden = true; }, 1800);
}

/* ---------- screens ---------- */
function screenToday(){
  const act = activePlans();
  const date = new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
  let h = `<header class="screen-head"><div class="eyebrow">${esc(date)}</div><h1 class="screen-title">Today</h1></header><div class="stack">`;
  if (!act.length){
    const p = PLAN.side;
    h += `<section class="card plan-card">
      <div class="eyebrow">Start here</div>
      <h2 class="plan-name">${esc(p.name)}</h2>
      <p class="lede">${esc(p.blurb)}</p>
      <div class="meta-row"><span>${p.days.length} days</span><span>2 readings a day</span><span>about 10 minutes</span></div>
      <div class="readings">${p.days[0].map(id=>readingRow(id,null,0)).join("")}</div>
      <div class="btn-row"><button class="btn" data-start="side">Start this plan</button><a class="btn quiet" href="#/plans">Other plans</a></div>
    </section>`;
  }
  for (const {plan, st} of act){
    const info = planInfo(plan, st);
    const complete = info.next === -1;
    const status = complete ? `<span class="status ok">Complete</span>`
      : info.behind ? `<span class="status behind">${info.behind} to catch up</span>` : `<span class="status ok">On track</span>`;
    h += `<section class="card plan-card">
      <div class="meta-row" style="justify-content:space-between;margin:0"><span class="eyebrow">Started ${esc(fmtDate(st.start))}</span>${status}</div>
      <h2 class="plan-name">${esc(plan.name)}</h2>
      <div class="meta-row"><span>${complete ? `All ${info.n} days read` : `Day ${info.next+1} of ${info.n}`}</span><span>${info.count} done</span></div>
      ${ticks(info)}
      ${complete ? `<div class="btn-row"><button class="btn quiet" data-restart="${plan.id}">Read it again</button><button class="linkbtn" data-stop="${plan.id}">Remove from Today</button></div>`
        : `<div class="readings">${plan.days[info.next].map(id=>readingRow(id,plan.id,info.next)).join("")}</div>`}
    </section>`;
  }
  if (S.last && DAY[S.last]){
    h += `<div class="section-label">Last opened</div><div class="card" style="padding-block:4px">${readingRow(S.last)}</div>`;
  }
  return h + `</div>`;
}

function screenPlans(){
  let h = `<header class="screen-head"><div class="eyebrow">Reading plans</div><h1 class="screen-title">Plans</h1>
    <p class="lede">Start as many as you like. A plan never runs away from you: if you miss a day, it waits where you left off.</p></header><div class="stack">`;
  for (const p of DATA.plans){
    const st = S.plans[p.id]; const on = st && !st.stopped;
    const info = on ? planInfo(p, st) : null;
    const per = p.days[0].length;
    const books = [...new Set(p.days.flat().map(id=>id[0]))];
    h += `<section class="card plan-card" ${books.length===1?`data-book="${books[0]}"`:""}>
      <h2 class="plan-name">${esc(p.name)}</h2>
      <p class="lede" style="margin-top:4px">${esc(p.blurb)}</p>
      <div class="meta-row"><span>${p.days.length} days</span><span>${per===2?"2 readings a day":"1 reading a day"}</span>${on?`<span>${info.count} of ${info.n} done</span>`:""}</div>
      ${on ? ticks(info) : ""}
      <div class="btn-row">
        ${on ? `<a class="btn" href="#/plan/${p.id}">Open</a><button class="linkbtn" data-stop="${p.id}">Stop plan</button>`
             : `<button class="btn ${books.length===1?"accent":""}" data-start="${p.id}">Start</button><a class="btn quiet" href="#/plan/${p.id}">See readings</a>`}
      </div>
    </section>`;
  }
  return h + `</div>`;
}

function screenPlan(id){
  const p = PLAN[id]; if (!p) return screenPlans();
  const st = S.plans[id]; const on = st && !st.stopped;
  const info = on ? planInfo(p, st) : null;
  let h = `<div class="readbar"><a class="iconbtn" href="#/plans" aria-label="Back to plans">${ICON.back}</a><span class="grow">Plan</span><span style="width:40px"></span></div>
    <header class="screen-head"><h1 class="screen-title">${esc(p.name)}</h1><p class="lede">${esc(p.blurb)}</p>
    ${on ? `<div class="meta-row"><span>Started ${esc(fmtDate(st.start))}</span><span>${info.count} of ${info.n} done</span></div>${ticks(info)}`
         : `<div class="btn-row"><button class="btn" data-start="${id}">Start this plan</button></div>`}</header>`;
  p.days.forEach((rs, i) => {
    h += `<div class="section-label">Day ${i+1}${on && i===info.next ? " · next" : ""}</div><div class="card" style="padding-block:4px"><div class="readings" style="margin:0;border:0">${rs.map(r=>readingRow(r, on?id:null, i)).join("")}</div></div>`;
  });
  return h;
}

function screenLibrary(k){
  k = k === "M" ? "M" : "F";
  const b = DATA.books[k];
  let h = `<header class="screen-head"><div class="eyebrow">Library</div><h1 class="screen-title">The two books</h1></header>
    <div class="seg" role="tablist"><a href="#/library/F" ${k==="F"?'aria-current="page"':''}>Like a Father</a><a href="#/library/M" ${k==="M"?'aria-current="page"':''}>As a Mother Comforts</a></div>
    <div data-book="${k}">
    <div class="book-hero"><h2 class="bt">${esc(b.title)}</h2><p class="bs">${esc(b.tagline)}</p><p class="book-verse">${b.verse}</p></div>
    <div class="btn-row"><a class="btn quiet" href="#/begin/${k}">Before you begin</a><a class="btn quiet" href="#/marks/${k}">${esc(b.marksTitle)}</a></div>`;
  for (const part of b.parts){
    h += `<section class="part"><div class="eyebrow">${esc(part.label)}</div><h3>${esc(part.title)}</h3>${part.intro?`<p class="intro">${part.intro}</p>`:""}
      <ol class="daylist">${part.days.map(n => { const id = k+n, d = DAY[id];
        return `<li><a href="#/read/${id}"><span class="num">${n}</span><span class="t">${esc(d.title)}</span>${isRead(id)?`<span class="check on">${ICON.tick}</span>`:`<span class="chev" aria-hidden="true">›</span>`}</a></li>`; }).join("")}</ol></section>`;
  }
  return h + `</div>`;
}

function screenPage(kind, k){
  const b = DATA.books[k === "M" ? "M" : "F"];
  const title = kind === "begin" ? "Before You Begin" : b.marksTitle;
  const body = kind === "begin" ? b.begin : b.marks;
  return `<div class="readbar" data-book="${b.key}"><a class="iconbtn" href="#/library/${b.key}" aria-label="Back to library">${ICON.back}</a><span class="grow">${esc(b.title)}</span><span style="width:40px"></span></div>
    <article data-book="${b.key}" class="prose" style="padding-top:18px"><div class="eyebrow" style="color:var(--accent)">${esc(b.title)}</div><h1 class="screen-title" style="margin-bottom:14px">${esc(title)}</h1>${body}</article>`;
}

function screenRead(id, q){
  const d = DAY[id]; if (!d) return screenToday();
  const b = DATA.books[d.book];
  const part = b.parts[d.part];
  const planId = q.get("plan"), idx = Number(q.get("d"));
  const plan = planId && PLAN[planId];
  const read = isRead(id);
  const prev = DAY[d.book + (d.n - 1)], next = DAY[d.book + (d.n + 1)];
  // what comes next in the plan: the other reading of the same plan day, else the next plan day
  let planNext = null;
  if (plan && plan.days[idx]){
    const others = plan.days[idx].filter(r => r !== id && !isRead(r));
    if (others.length) planNext = {id: others[0], idx};
    else if (plan.days[idx+1]) planNext = {id: plan.days[idx+1][0], idx: idx+1};
  }
  const gw = "https://www.biblegateway.com/passage/?version=NIVUK&search=" + encodeURIComponent(d.read);
  return `<div class="readbar" data-book="${d.book}">
      <a class="iconbtn" href="${plan ? "#/today" : "#/library/"+d.book}" aria-label="Back">${ICON.back}</a>
      <span class="grow">${esc(plan ? plan.name + " · Day " + (idx+1) : b.title)}</span>
      <button class="iconbtn" data-font="-1" aria-label="Smaller text">A−</button><button class="iconbtn" data-font="1" aria-label="Larger text">A+</button>
    </div>
    <article class="day" data-book="${d.book}">
      <div class="day-eyebrow">${esc(b.title)} · ${esc(part.label)} · Day ${d.n}</div>
      <h1>${esc(d.title)}</h1>
      ${d.read ? `<a class="readref" href="${gw}" target="_blank" rel="noopener">Read ${esc(d.read)} ↗</a>` : ""}
      ${d.html}
      ${d.note ? `<details class="notes"><summary>Notes and sources</summary><p>${d.note}</p></details>` : ""}
      <div class="done-panel">
        <button class="btn ${read?"quiet":"accent"} block" data-toggle="${id}">${read ? "Read ✓ — tap to undo" : "Mark as read"}</button>
        ${planNext ? `<a class="btn quiet block" href="${readHref(planNext.id, planId, planNext.idx)}">Next in plan: ${esc(DAY[planNext.id].title)}</a>` : ""}
        <nav class="pager" aria-label="Previous and next day">
          ${prev ? `<a href="#/read/${prev.id}"><small>‹ Day ${prev.n}</small><span>${esc(prev.title)}</span></a>` : "<span></span>"}
          ${next ? `<a class="next" href="#/read/${next.id}"><small>Day ${next.n} ›</small><span>${esc(next.title)}</span></a>` : "<span></span>"}
        </nav>
      </div>
    </article>`;
}

function screenAbout(){
  const F = DATA.books.F;
  const syncLine = sync.state === "account"
    ? `<p class="sync on"><i></i>Your progress is saved to your account and follows you to other devices.</p>`
    : `<p class="sync"><i></i>Your progress is saved on this device.</p>`;
  return `<header class="screen-head"><div class="eyebrow">About</div><h1 class="screen-title">Two books, one Bible</h1></header>
  <div class="prose">
    <p><em>Like a Father</em> and <em>As a Mother Comforts</em> are two thirty-one-day devotionals on the fathers and mothers of the Bible. Each day has a reading, a key verse, a word from the Hebrew or Greek, a short reflection, questions, a prayer, and one thing to do today. Both books are built on longer studies with full notes and sources; the notes for each day are under "Notes and sources" at the end of the day.</p>
    ${NATIVE ? "" : `<h2>On your iPhone</h2>
    <ol><li>Open this page in Safari.</li><li>Tap the Share button, then <strong>Add to Home Screen</strong>.</li><li>Open it from the home screen like any other app.</li></ol>`}
    ${syncLine}
    <h2>Translations</h2>
    ${F.languages}
  </div>
  <div class="section-label">Progress</div>
  <div class="card"><p class="fine" style="margin:0 0 10px">Clears every reading mark and plan on this device${sync.state==="account"?" and in your account":""}.</p><button class="btn quiet" data-reset="1">Clear my progress</button></div>`;
}

/* ---------- router ---------- */
function render(){
  const [path, qs] = (location.hash.slice(1) || "/today").split("?");
  const seg = path.split("/").filter(Boolean);
  const q = new URLSearchParams(qs || "");
  let html, tab = "today";
  switch (seg[0]){
    case "plans": html = screenPlans(); tab = "plans"; break;
    case "plan": html = screenPlan(seg[1]); tab = "plans"; break;
    case "library": html = screenLibrary(seg[1]); tab = "library"; break;
    case "begin": case "marks": html = screenPage(seg[0], seg[1]); tab = "library"; break;
    case "read":
      html = screenRead(seg[1], q); tab = q.get("plan") ? "today" : "library";
      if (DAY[seg[1]] && S.last !== seg[1]) { S.last = seg[1]; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
      break;
    case "about": html = screenAbout(); tab = "about"; break;
    default: html = screenToday();
  }
  document.documentElement.style.setProperty("--read-scale", S.font || 1);
  document.getElementById("app").innerHTML = html;
  tabs(tab);
}
let lastPath = null;
window.addEventListener("hashchange", () => { render(); const p = location.hash.split("?")[0]; if (p !== lastPath) window.scrollTo(0,0); lastPath = p; });

document.addEventListener("click", e => {
  const el = e.target.closest("[data-start],[data-stop],[data-restart],[data-toggle],[data-font],[data-reset]");
  if (!el) return;
  if (el.dataset.start){ startPlan(el.dataset.start); toast(PLAN[el.dataset.start].name + " started"); location.hash = "#/today"; render(); }
  else if (el.dataset.restart){ const p = PLAN[el.dataset.restart]; p.days.flat().forEach(id => { S.read[id] = {r:false, t:Date.now()}; }); startPlan(p.id); toast("Plan restarted"); render(); }
  else if (el.dataset.stop){ stopPlan(el.dataset.stop); toast("Plan stopped"); render(); }
  else if (el.dataset.toggle){ const on = !isRead(el.dataset.toggle); setRead(el.dataset.toggle, on); toast(on ? "Marked as read" : "Mark removed"); render(); }
  else if (el.dataset.font){ S.font = Math.min(1.35, Math.max(0.85, Math.round(((S.font||1) + Number(el.dataset.font)*0.08)*100)/100)); commit(); render(); }
  else if (el.dataset.reset){ if (confirm("Clear all reading marks and plans?")) { const now = Date.now(); for (const k in S.read) S.read[k] = {r:false, t:now}; for (const k in S.plans) S.plans[k] = Object.assign({}, S.plans[k], {stopped:true, t:now}); S.last = null; commit(); toast("Progress cleared"); render(); } }
});

render();
connect();
</script>

<div id="install-hint" class="install-hint" hidden>
  <p>Install this app: tap <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M6 11v9h12v-9"/></svg> Share, then <strong>Add to Home Screen</strong>.</p>
  <button type="button" aria-label="Close">×</button>
</div>
<script>
// Offline reading on the web (the App Store app already carries everything).
if ("serviceWorker" in navigator && location.protocol === "https:" && !NATIVE) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
// iPhone and iPad never offer to install a web app themselves.
(function(){
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  let until = 0; try { until = Number(localStorage.getItem("install-hint-until") || 0); } catch (e) {}
  if (!ios || standalone || NATIVE || Date.now() < until) return;
  const el = document.getElementById("install-hint"); el.hidden = false;
  el.querySelector("button").addEventListener("click", () => {
    el.hidden = true;
    try { localStorage.setItem("install-hint-until", String(Date.now() + 30 * 864e5)); } catch (e) {}
  });
})();
</script>
