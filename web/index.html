 to her whatever you think best.” And Sarah, the Bible says, “afflicted her” (16:6). The Hebrew word is the same one used later for Egypt’s cruel oppression of the Israelites. The mother of God’s people treated her Egyptian slave the way Egypt would one day treat her descendants.<\/p>\n<p>Hagar ran away into the desert. And there, alone and pregnant, she was met by the angel of the LORD. She gave God a name: “You are a God who sees me.” She is often noted as the only person in the Old Testament who gives God a name.<\/p>\n<p>Years later, after Isaac was born, Sarah insisted that Hagar and her son Ishmael be driven out. In the desert the water ran out. Hagar put the boy under a bush and sat at a distance, saying, “Let me not watch the child die.” And God heard the boy, opened her eyes, and showed her a well.<\/p>\n<p>This is not a story of two rivals. It is the story of a woman who owned another woman — and used her body to get a child. Readers who descend from enslaved people have often seen in Hagar their own mothers and grandmothers: used, cast out, and yet seen by God.<\/p>\n<p>It is also a warning for mothers today. A mother’s fierce protectiveness for her own children can turn against other women — especially women with less power: the nanny, the cleaner, the refugee mother, the woman whose children are not welcome.<\/p>\n<p>Sarah is still the mother of the promise. God still keeps his word to her. But the Bible also makes sure we see Hagar — and that God sees her. He sides with the mother who has been cast out.<\/p>\n<p>If you are a Hagar, he sees you. If you have been a Sarah, it is not too late to turn.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Have you ever been hurt by another mother? Have you hurt one?<\/li>\n<li>Is there a woman with less power than you — at work, in your home, in your community — whom you could see as God sees Hagar?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>God who sees, you saw Hagar in the desert.<br />\nSee every mother who has been pushed aside.<br />\nForgive me where I have wounded another mother,<br />\nand make me a friend to her instead. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Speak or write a genuine word of encouragement to a mother you find it hard to get along with.\n<\/p>", "note": "The verb for Sarah’s treatment of Hagar (<em>ʿinnâ<\/em>, “afflict”) is used of Egypt’s oppression of Israel in Genesis 15:13 and Exodus 1:11–12. See Phyllis Trible, <em>Texts of Terror<\/em> (1984), on Hagar. On Hagar as an enslaved woman, see Delores S. Williams, <em>Sisters in the Wilderness<\/em> (1993), and Renita J. Weems, <em>Just a Sister Away<\/em> (1988).", "art": {"file": "images/m24.webp", "caption": "Hagar in the wilderness, seen by the God who sees", "title": "Hagar and Ishmael in the Wilderness", "credit": "Gustave Doré, Bible illustrations (1866)", "source": "https://commons.wikimedia.org/wiki/File%3A015.Hagar_and_Ishmael_in_the_Wilderness.jpg", "licence": "Public domain", "w": 900, "h": 1134}, "readEn": "Genesis 16:1–13; 21:8–21"}, {"id": "M25", "n": 25, "title": "Rebekah: “Upon Me Be the Curse”", "part": 3, "read": "Genesis 25:19–28; 27:1–17, 41–46", "ref": "Genesis 27:13", "html": "<blockquote>\n<p>“His mother answered him, ‘Upon me be your curse, my son. Only listen to me.’”<\/p>\n<p><span class=\"ref\">Genesis 27:13<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">קִלְלָתְךָ<\/span> (<em>qilĕlātĕkā<\/em>) — “your curse.”<\/p>\n<\/div>\n<p>Rebekah is one of the strongest women in Genesis. When her pregnancy was difficult, she “went to inquire of the LORD” herself (25:22) — something rare for anyone in that story. And God told her that she carried twins, and that “the older will serve the younger.”<\/p>\n<p>Then the Bible adds a sentence that explains much of what follows: “Isaac loved Esau… but Rebekah loved Jacob” (25:28).<\/p>\n<p>Years later, when Isaac was old and blind and about to give his blessing to Esau, Rebekah made a plan. She dressed Jacob in his brother’s clothes, covered his arms with goatskins, cooked the meal, and sent him in to deceive his father.<\/p>\n<p>When Jacob was afraid he would be cursed, she said, “Upon me be your curse, my son.”<\/p>\n<p>It is an astonishing sentence. It shows fierce, sacrificial love. It also shows a mother willing to deceive her husband and cheat her other son to get what she wanted for her favourite.<\/p>\n<p>Perhaps she believed she was helping God’s promise come true. But the Bible does not approve of her method. And the cost was high. Esau vowed to kill Jacob, and Rebekah had to send her beloved son away, “for a few days” (27:44). She never saw him again. The Bible does not even record her death.<\/p>\n<p>Rebekah’s story is a warning about two things mothers can be tempted to do:<\/p>\n<ul>\n<li><strong>to favour one child<\/strong>, even without meaning to;<\/li>\n<li><strong>to manipulate events<\/strong> to secure what we think is best for our children — even what we believe God wants for them.<\/li>\n<\/ul>\n<p>God did not need Rebekah’s deception to keep his promise. And he does not need ours. Trusting God with our children’s future means refusing to cheat on their behalf.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Is there a child you naturally favour? How might your other children see it?<\/li>\n<li>Are you trying to control or manipulate an outcome for one of your children?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, forgive me for the ways I try to secure my children’s future by my own schemes.<br />\nHelp me to love each of them fully,<br />\nand to trust you with the promises I cannot control. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Notice any situation where you are “pulling strings” for a child. Decide to step back and trust God with it.\n<\/p>", "note": "Rebekah’s nurse Deborah’s death is recorded (Genesis 35:8), but Rebekah’s is not.", "art": {"file": "images/m25.webp", "caption": "Isaac blesses Jacob, as Rebekah planned", "title": "Isaac Blessing Jacob (89394529)", "credit": "Gustave Doré, Bible illustrations (1866)", "source": "https://commons.wikimedia.org/wiki/File%3AIsaac_Blessing_Jacob_%2889394529%29.jpg", "licence": "Public domain", "w": 900, "h": 1141}, "readEn": "Genesis 25:19–28; 27:1–17, 41–46"}, {"id": "M26", "n": 26, "title": "Leah and Rachel: Names That Carry Wounds", "part": 3, "read": "Genesis 29:31–30:24", "ref": "Genesis 29:32 (NIV)", "html": "<blockquote>\n<p>“Leah became pregnant and gave birth to a son. She named him Reuben, for she said, ‘It is because the LORD has seen my misery. Surely my husband will love me now.’”<\/p>\n<p><span class=\"ref\">Genesis 29:32 (NIV)<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">רְאוּבֵן<\/span> (<em>rĕʾûbēn<\/em>) — “Reuben.” The name sounds like “See — a son!” and also like “He has seen my misery.”<\/p>\n<\/div>\n<p>In many of the Bible’s stories, it is the mother who names the child. And in the story of Leah and Rachel we see what that can mean.<\/p>\n<p>Jacob loved Rachel and was tricked into marrying her older sister Leah first. So Leah was the unloved wife — and Jacob never hid it. Every time she had a son, she gave him a name that was really a message to her husband:<\/p>\n<ul>\n<li><strong>Reuben<\/strong> — “The LORD has seen my misery. Surely my husband will love me now.”<\/li>\n<li><strong>Simeon<\/strong> — “The LORD has heard that I am unloved.”<\/li>\n<li><strong>Levi<\/strong> — “Now at last my husband will be attached to me.”<\/li>\n<\/ul>\n<p>Rachel, loved but unable to have children, cried to Jacob: “Give me children, or I will die!” (30:1). Jacob’s only answer was anger: “Am I in the place of God?” (30:2). She gave him her maid Bilhah, and when Bilhah had a son, Rachel named him Naphtali: “I have fought a mighty fight with my sister, and I have won” (30:8).<\/p>\n<p>Notice who is <em>not<\/em> speaking. Bilhah and Zilpah, the slave-women who actually gave birth to four of these sons, never name their own children. Their mistresses do it for them. The Bible does not record a single word from either of them.<\/p>\n<p>Imagine growing up with a name like that. Every time someone calls you, they are repeating your mother’s grievance against her husband, or her victory over her sister.<\/p>\n<p>The twelve sons of Jacob grew up inside this rivalry. And the hatred of the older brothers for Joseph, Rachel’s son, was the next chapter of the same war.<\/p>\n<p>Children often end up carrying their parents’ conflicts: in marriages that are unhappy, in divorces, in family feuds. They hear the complaints. They are asked to take sides. They carry the names we give them — sometimes literally, sometimes in the words we speak over them.<\/p>\n<p>And yet the story has a turning point. When Leah had her fourth son, she named him Judah and said simply: “This time I will praise the LORD” (29:35). For once, the name was not about her husband. It was about God.<\/p>\n<p>From Judah came King David — and Jesus.<\/p>\n<p>One more silence. Leah also had a daughter, Dinah (Genesis 30:21). When Dinah was raped (Genesis 34), her brothers took revenge and her father worried about his reputation — and her mother is never mentioned. The Bible almost never shows us mothers with their daughters. If you are a mother of daughters, you are writing a story the Bible mostly leaves blank.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Are your children carrying any of your conflicts — with a spouse, an ex, or a relative?<\/li>\n<li>What words, spoken often, are shaping how your children see themselves?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, you saw Leah’s misery and heard Rachel’s cry.<br />\nKeep me from putting my wounds on my children.<br />\nLet the names I speak over them be words of blessing,<br />\nand let my home be a place of praise, not rivalry. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Speak one sentence of blessing over each child — about who they are, not about anyone else.\n<\/p>", "note": "The explanations of the names are wordplays rather than strict etymologies. On mothers naming children, see Edward J. Bridge, “A Mother’s Influence: Mothers Naming Children in the Hebrew Bible,” <em>Vetus Testamentum<\/em> 64 (2014). On rivalry between the “houses” of different mothers in a household, see Cynthia R. Chapman, <em>The House of the Mother<\/em> (2016). The same child can be named by his mother in one account and his father in another: Eve names Seth in Genesis 4:25, Adam in Genesis 5:3. Rachel and Leah named the sons of Bilhah and Zilpah (Genesis 30:6–13). Leah’s daughter Dinah appears in Genesis 30:21 and 34.", "art": {"file": "images/m26.webp", "caption": "Jacob meets Rachel at the well", "title": "Jacob Tends Laban's Flocks and Meets Rachel", "credit": "Gustave Doré, Bible illustrations (1866)", "source": "https://commons.wikimedia.org/wiki/File%3A022.Jacob_Tends_Laban%27s_Flocks_and_Meets_Rachel.jpg", "licence": "Public domain", "w": 900, "h": 1134}, "readEn": "Genesis 29:31–30:24"}, {"id": "M27", "n": 27, "title": "Using a Child for Our Own Ends", "part": 3, "read": "Mark 6:17–28; Matthew 20:20–28", "ref": "Mark 6:24", "html": "<blockquote>\n<p>“The girl went out and asked her mother, ‘What am I to ask for?’ Her mother replied, ‘The head of John the Baptizer.’”<\/p>\n<p><span class=\"ref\">Mark 6:24<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> αἰτήσωμαι (<em>aitēsōmai<\/em>) — Greek for “Should I ask?” or “What shall I ask for?”<\/p>\n<\/div>\n<p>Two mothers in the Gospels show how easily a mother’s ambition can take over a child’s life.<\/p>\n<p>The first is <strong>Herodias<\/strong>. She hated John the Baptist, who had condemned her marriage to Herod. At Herod’s birthday feast, her daughter danced, and the king, delighted, promised her anything she asked. The girl went to her mother: “What am I to ask for?”<\/p>\n<p>Herodias did not hesitate. “The head of John the Baptizer.”<\/p>\n<p>A mother made her own daughter the instrument of a killing. The girl’s moment of delight became the vehicle for her mother’s grudge. Mark tells the story to explain how John the Baptist died, not to teach about mothering — but the glimpse is still a warning.<\/p>\n<p>The second mother is gentler. <strong>The mother of James and John<\/strong> came to Jesus, knelt before him, and asked that her two sons might sit at his right and left in his kingdom (Matthew 20:20–21). She wanted the best for them — the highest places.<\/p>\n<p>Jesus did not scold her. But he turned to her sons and asked, “Are you able to drink the cup I am about to drink?” He redirected her ambition away from status and toward faithfulness, even suffering. And later, this same mother is named among the women standing near the cross (Matthew 27:56). Her ambition had been transformed into loyalty.<\/p>\n<p>Most mothers would never do what Herodias did. But there are quieter ways of using children for our own ends:<\/p>\n<ul>\n<li>living through their achievements, so that their success becomes our success;<\/li>\n<li>pushing them toward our own unfulfilled dreams;<\/li>\n<li>using them as messengers or weapons in conflicts with the other parent;<\/li>\n<li>caring more about how they make us look than about who they are.<\/li>\n<\/ul>\n<p>The mother of James and John shows the better way. It is right to want good things for our children. But Jesus asks us to want for them what <em>he<\/em> wants: not the best seats, but a faithful life.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Is there any way you are living through your child — their grades, sports, looks, or success?<\/li>\n<li>What do you most want for your children? Is it what Jesus wants for them?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, forgive me where I have used my children to meet my own needs.<br />\nRedirect my ambitions for them,<br />\nas you redirected the mother of James and John —<br />\nfrom status to faithfulness, from my will to yours. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Ask one of your children what <em>they<\/em> hope for their own life — and listen without steering.\n<\/p>", "note": "The mother of the sons of Zebedee appears again at the cross in Matthew 27:56.", "readEn": "Mark 6:17–28; Matthew 20:20–28"}, {"id": "M28", "n": 28, "title": "Rachel Weeping", "part": 4, "read": "Jeremiah 31:15–17; Matthew 2:16–18", "ref": "Jeremiah 31:15–17", "html": "<p class=\"warning\">\nThis reading is especially for mothers who have lost a child — through miscarriage, stillbirth, illness, accident, violence, or estrangement.\n<\/p>\n<blockquote>\n<p>“A cry is heard in Ramah — mourning and bitter weeping. It is Rachel, weeping for her children. She will not be comforted over her children, because they are gone. This is what the LORD says: ‘Hold back your voice from weeping and your eyes from tears… There is hope for your future.’”<\/p>\n<p><span class=\"ref\">Jeremiah 31:15–17<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">מֵאֲנָה לְהִנָּחֵם<\/span> (<em>mēʾănâ lĕhinnāḥēm<\/em>) — “she refuses to be comforted.”<\/p>\n<\/div>\n<p>Rachel died giving birth. Centuries later, when the people of Israel were being led away into exile, the prophet Jeremiah heard her voice again — the voice of a mother weeping for her lost children.<\/p>\n<p>And the Bible lets her refuse to be comforted.<\/p>\n<p>That is important. There is a kind of grief that cannot be comforted, at least not yet. Well-meaning people rush in with words — “at least you have other children,” “God needed another angel,” “you can try again.” Those words usually hurt more than they help.<\/p>\n<p>The Bible does not do that. It records Rachel’s refusal without rebuke. It gives her grief a voice. It includes her weeping in the Scriptures.<\/p>\n<p>And then God speaks — not to correct her, but to promise: “There is hope for your future.”<\/p>\n<p>Matthew brings Rachel’s weeping into the Christmas story. When King Herod killed the little boys of Bethlehem, Matthew says that this fulfilled what Jeremiah the prophet had said: “Rachel, weeping for her children” (Matthew 2:17–18). In the middle of the story of Jesus’ birth there are grieving mothers whose sons were murdered. The Gospel does not skip over them.<\/p>\n<p>If you have lost a child, the Bible is not asking you to “move on.” It makes room for your grief — even for grief that refuses comfort. And it holds out a hope that does not cancel your sorrow but stands beside it: a future in which God will wipe away every tear (Revelation 21:4).<\/p>\n<p>If you are walking alongside a grieving mother, learn from this passage. Don’t hurry her. Don’t explain. Sit with her, and let her weep.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>If you have lost a child, have you been allowed to grieve? Have you allowed yourself?<\/li>\n<li>If you know a grieving mother, how could you simply be with her?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, you heard Rachel weeping and did not silence her.<br />\nHear the mothers who weep for children who are no more.<br />\nHold their grief; do not hurry them.<br />\nAnd give them, in your time, hope for their future. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> If you have lost a child, say their name aloud to God. If you know a grieving mother, send her a message that simply says, “I’m remembering your child today.”\n<\/p>", "note": "Rachel died giving birth to her second son and named him Ben-oni, “son of my sorrow”; Jacob renamed him Benjamin (Genesis 35:18). Jeremiah 31:15 makes her the voice of every mother who has lost her children, and God answers her with a promise, not a rebuke (31:16–17). Matthew applies the verse to the mothers of Bethlehem (2:18).", "readEn": "Jeremiah 31:15–17; Matthew 2:16–18"}, {"id": "M29", "n": 29, "title": "For Those Who Longed for Children", "part": 4, "read": "Isaiah 54:1–5; 56:3–5; Luke 11:27–28", "ref": "Isaiah 56:5", "html": "<blockquote>\n<p>“In my house, inside my walls, I will give them a memorial and a name — better than sons and daughters. An everlasting name I will give them, one that will never be cut off.”<\/p>\n<p><span class=\"ref\">Isaiah 56:5<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">עֲקָרָה<\/span> (<em>ʿăqārâ<\/em>) — “barren,” a woman who has not been able to have children.<\/p>\n<\/div>\n<p>The Bible is full of women who longed for children: Sarah, Rebekah, Rachel, Hannah, Elizabeth. Their stories are told again and again — and in each one, a child is finally born.<\/p>\n<p>For many women, those stories are painful. If God answered Hannah, why not me? Was her faith greater than mine? Did I not pray enough?<\/p>\n<p>It is important to say this clearly: <strong>the Bible’s stories of barren women are not a promise that every woman who prays will have a child.<\/strong> They are about God keeping his promises to his people in impossible circumstances. They were never meant to be a formula — and they were never meant to make childless women feel like failures.<\/p>\n<p>We should also be honest: the Bible treats children as a great blessing, and childlessness as a real grief. When Rachel finally had a son she said, “God has taken away my disgrace” (Genesis 30:23), and a psalm praises God because he “settles the childless woman in her home as a joyful mother of children” (Psalm 113:9). Scripture never pretends that longing for a child is small.<\/p>\n<p>And yet, in a few striking places, the Bible also says that a woman’s worth before God does not depend on children.<\/p>\n<p><strong>Isaiah tells the childless to sing.<\/strong> “Sing, O barren one, who never bore a child” (54:1). God’s people, pictured as a childless woman, are promised a family larger than they could imagine.<\/p>\n<p><strong>Isaiah promises something <em>better<\/em> than children.<\/strong> To those who were cut off from having families — the eunuchs — God says: “I will give them a memorial and a name better than sons and daughters” (56:5). The promise was first spoken to eunuchs, but it has comforted childless women ever since.<\/p>\n<p><strong>Jesus refuses to measure a woman by her womb.<\/strong> When a woman in the crowd called out, “Blessed is the womb that carried you!”, Jesus answered, “Blessed rather are those who hear God’s word and keep it” (Luke 11:27–28). Blessing is not tied to motherhood. It is open to every woman who follows God.<\/p>\n<p><strong>Many of the Bible’s faithful women are never said to have children.<\/strong> Miriam, Huldah, Anna, Phoebe, Lydia, Mary Magdalene — and possibly Deborah, the “mother in Israel” (Day 11). Their worth is never questioned.<\/p>\n<p>If you longed for children and never had them, or are still waiting, you are not less in God’s eyes. Your name is written in his house.<\/p>\n<p>And if you are a mother, remember the women around you for whom Mother’s Day is one of the hardest days of the year.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>If you have longed for children: have you felt judged, by others or by yourself? What does God say about you in these verses?<\/li>\n<li>If you are a mother: who in your church or circle carries this grief silently?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, you promise a name better than sons and daughters.<br />\nFor every woman who has longed for a child and waited in vain,<br />\nbe her joy, her family, and her everlasting name.<br />\nBlessed are those who hear your word and keep it. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> If this is your grief, let a trusted friend know how you are really doing. If it isn’t, reach out kindly to a woman for whom it is.\n<\/p>", "note": "On the stories of barren women as a recurring pattern, see Robert Alter, “How Convention Helps Us Read: The Case of the Bible’s Annunciation Type-Scene,” <em>Prooftexts<\/em> 3 (1983), and Mary Callaway, <em>Sing, O Barren One<\/em> (1986). On the difficult verse 1 Timothy 2:15 (“saved through childbearing”), interpretations differ widely (see Stanley Porter, <em>JSNT<\/em> 49 [1993]; Andreas Köstenberger, <em>BBR<\/em> 7 [1997]); none of the serious readings makes having children a condition of salvation.", "readEn": "Isaiah 54:1–5; 56:3–5; Luke 11:27–28"}, {"id": "M30", "n": 30, "title": "If Your Mother Hurt You", "part": 4, "read": "Isaiah 49:14–16; Psalm 27:7–14; 2 Kings 11:1–3", "ref": "Isaiah 49:15; Psalm 27:10", "html": "<blockquote>\n<p>“Even they may forget — but I will not forget you… Though my father and my mother forsake me, the LORD will take me in.”<\/p>\n<p><span class=\"ref\">Isaiah 49:15; Psalm 27:10<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">גַּם־אֵלֶּה תִשְׁכַּחְנָה<\/span> (<em>gam-ʾēlleh tiškaḥnâ<\/em>) — “even they may forget.” God admits that some mothers fail their children.<\/p>\n<\/div>\n<p>This day is for everyone whose mother hurt them — by cruelty, neglect, manipulation, violence, or a coldness that never let them feel loved.<\/p>\n<p>It is very hard to talk about. Our culture — and often our churches — treat mothers as almost sacred. People who were harmed by their mothers are often not believed, or are told they must “honour” her by staying silent.<\/p>\n<p>The Bible is more honest than that.<\/p>\n<p><strong>It knows that mothers can fail.<\/strong> “Even they may forget,” says Isaiah. God does not pretend that every mother is safe.<\/p>\n<p><strong>It shows God providing other people.<\/strong> When a queen’s murderous grab for power put a baby prince in danger, his aunt Jehosheba stole him away and hid him with his nurse in the temple for six years (2 Kings 11:1–3). That is a story about politics, not parenting — but it shows something God does again and again: where one person fails a child, he raises up another. Many people who were hurt by their mothers can name a “Jehosheba” — an aunt, a grandmother, a teacher, a neighbour, a friend’s mother — who gave them the love their own mother didn’t.<\/p>\n<p><strong>Honour does not mean pretending.<\/strong> The command to honour your mother is not a weapon to silence you. It does not mean saying the harm didn’t happen, and it does not mean putting yourself back in danger. Sometimes honouring a mother who hurt you means telling the truth, setting safe boundaries, and refusing to pass the harm on.<\/p>\n<p><strong>Forgiveness is not the same as trust.<\/strong> Forgiveness means handing your right to revenge over to God. It may take a long time. Trust is different: it can only be rebuilt by real change, and sometimes it cannot be rebuilt at all.<\/p>\n<p><strong>You are not doomed to repeat it.<\/strong> Many people hurt by their mothers have become gentle, faithful parents. It takes courage, and usually help — but it is possible.<\/p>\n<p><strong>God’s love is not a bigger copy of your mother’s.<\/strong> “Even they may forget — but I will not forget you.” His love is the love your mother should have given you.<\/p>\n<p>Please don’t carry this alone. A wise counsellor, pastor, or trusted friend can help.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>What did your mother’s harm teach you to believe about yourself? Is it true?<\/li>\n<li>Who has been a “Jehosheba” to you — someone who gave you the love you needed?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, even mothers may forget, but you never do.<br />\nYou saw what happened to me.<br />\nWhere my mother failed me, take me in.<br />\nHeal what was broken, and keep me from passing it on. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Thank God for a “Jehosheba” in your life. If you carry wounds from your mother, tell one safe person — or write her a letter you do not send, and give it to God.\n<\/p>", "note": "Athaliah’s massacre of the royal family (2 Kings 11:1) was a political purge by a queen seizing the throne; the story is used here only for the rescue of Joash by his aunt Jehosheba.", "readEn": "Isaiah 49:14–16; Psalm 27:7–14; 2 Kings 11:1–3"}, {"id": "M31", "n": 31, "title": "“Woman, Here Is Your Son”", "part": 4, "read": "John 19:25–27; Acts 1:12–14", "ref": "John 19:25–27 (NIV)", "html": "<blockquote>\n<p>“Near the cross of Jesus stood his mother, his mother’s sister, Mary the wife of Clopas, and Mary Magdalene. When Jesus saw his mother there, and the disciple whom he loved standing near by, he said to her, ‘Woman, here is your son,’ and to the disciple, ‘Here is your mother.’ From that time on, this disciple took her into his home.”<\/p>\n<p><span class=\"ref\">John 19:25–27 (NIV)<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> γύναι, ἴδε (<em>gynai, ide<\/em>) — Greek for “Woman, look,” “Woman, here is…”<\/p>\n<\/div>\n<p>For thirty days we have walked with the mothers of the Bible: mothers who hid and let go, prayed and persisted, wept and refused to be comforted; mothers who wounded one another, and mothers who were wounded.<\/p>\n<p>We end at the foot of the cross.<\/p>\n<p>Mary is there. More than thirty years earlier, the old man Simeon had told her, “A sword will pierce your own soul too.” Now the sword has come. She is watching her son die.<\/p>\n<p>Every mother’s deepest fear is gathered in that moment. And Jesus, in agony, sees her.<\/p>\n<p>“Woman, here is your son.” And to his beloved disciple: “Here is your mother.” And from that hour, the disciple welcomed her into his own home.<\/p>\n<p>With his dying breath, Jesus does two things.<\/p>\n<p><strong>He honours his mother.<\/strong> He makes sure she will be cared for. Even on the cross, he keeps the command to honour his mother.<\/p>\n<p><strong>He creates a new family.<\/strong> A mother who is losing her son is given a son. A disciple is given a mother. At the foot of the cross, a new household begins — the family of all who follow Jesus. In that family, no mother need grieve alone, and no child need be motherless.<\/p>\n<p>And Mary’s story does not end at the cross. The last time we see her, she is in the upper room with the disciples, praying (Acts 1:14). The mother who stood at the cross became part of the praying church.<\/p>\n<p>This is the last word for mothers — and for everyone who has had a mother. God has not left us to carry our joys and sorrows alone. He gathers us into a family where the grieving are given sons and daughters, the lonely are given mothers, and every tear will one day be wiped away.<\/p>\n<p>We began with a promise: “As a mother comforts her child, so will I comfort you.” We end where that promise is sealed — at the cross, where God himself entered a mother’s grief, and began to comfort the world.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Looking back over these thirty-one days, which mother of the Bible has spoken to you most?<\/li>\n<li>Who has God given you as family — “here is your son,” “here is your mother” — beyond your own family?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord Jesus, from the cross you saw your mother and gave her a son.<br />\nSee every mother who grieves; give her family and comfort.<br />\nGather us all into your household,<br />\nuntil the day you wipe away every tear. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Pray for three mothers you know by name. Then thank God for the “mothers” and “children” he has given you in his family.\n<\/p>", "note": "“He will wipe away every tear” is from Revelation 21:4.", "art": {"file": "images/m31.webp", "caption": "“Woman, here is your son”", "title": "Gustave Doré - Crucifixion of Jesus", "credit": "Gustave Doré, Bible illustrations (1866)", "source": "https://commons.wikimedia.org/wiki/File%3AGustave_Dor%C3%A9_-_Crucifixion_of_Jesus.jpg", "licence": "Public domain", "w": 900, "h": 1145}, "readEn": "John 19:25–27; Acts 1:12–14"}], "marksTitle": "Sixteen Marks of a Good Mother", "marks": "<p>Sixteen things this book has drawn from Scripture — not a list the Bible itself gives, but one careful reading of it.<\/p>\n<ol type=\"1\">\n<li><strong>Protect life, even against power.<\/strong> <em>(Exodus 1:17; 2:2–3)<\/em><\/li>\n<li><strong>Pour out your soul to God.<\/strong> <em>(1 Samuel 1:15)<\/em><\/li>\n<li><strong>Hold your children with open hands.<\/strong> <em>(1 Samuel 1:28; 1 Kings 3:26)<\/em><\/li>\n<li><strong>Keep showing up — a little robe each year.<\/strong> <em>(1 Samuel 2:19)<\/em><\/li>\n<li><strong>Teach: your teaching is <em>tôrâ<\/em>.<\/strong> <em>(Proverbs 1:8; 6:20)<\/em><\/li>\n<li><strong>Teach justice for the voiceless.<\/strong> <em>(Proverbs 31:8–9)<\/em><\/li>\n<li><strong>Let the teaching of kindness be on your tongue.<\/strong> <em>(Proverbs 31:26)<\/em><\/li>\n<li><strong>Do not forget.<\/strong> <em>(Isaiah 49:15)<\/em><\/li>\n<li><strong>Comfort.<\/strong> <em>(Isaiah 66:13)<\/em><\/li>\n<li><strong>Refuse favouritism and manipulation.<\/strong> <em>(Genesis 27)<\/em><\/li>\n<li><strong>Don’t make your children carry your battles.<\/strong> <em>(Genesis 29–30; Mark 6:24)<\/em><\/li>\n<li><strong>Persist on your child’s behalf.<\/strong> <em>(2 Kings 4:30; Mark 7:28)<\/em><\/li>\n<li><strong>Grieve honestly.<\/strong> <em>(Jeremiah 31:15)<\/em><\/li>\n<li><strong>Mother beyond biology.<\/strong> <em>(Ruth 4:16; Judges 5:7)<\/em><\/li>\n<li><strong>Ponder and treasure.<\/strong> <em>(Luke 2:19)<\/em><\/li>\n<li><strong>Know that your worth is not your womb.<\/strong> <em>(Luke 11:28; Isaiah 56:5)<\/em><\/li>\n<\/ol>", "languages": "<p>Scripture quotations marked NIV are taken from the Holy Bible, New International Version (Anglicised edition). Copyright © 1979, 1984, 2011 by Biblica. Used by permission of Hodder &amp; Stoughton Ltd, an Hachette UK company. All rights reserved. ‘NIV’ is a registered trademark of Biblica. UK trademark number 1448790. All other Bible quotations are the author’s own translations from the Hebrew and Greek, kept close to the original wording; they are used where a day’s reflection depends on the wording of the original. “The LORD” in capital letters stands for God’s personal name in Hebrew, often written YHWH.<\/p>\n<p><strong>Verse numbers<\/strong> follow English Bibles.<\/p>\n<p><strong>Transliteration.<\/strong> Each Hebrew or Greek word is also written in Latin letters so you can say it:<\/p>\n<ul>\n<li>ʾ is a slight catch in the breath; ʿ is a deeper sound from the throat. Both can simply be skipped when reading aloud.<\/li>\n<li>A line over a vowel (ā, ē, ō) means it is long; a circumflex (â, ê, î, ô, û) means the same.<\/li>\n<li>ĕ and ă are very short, quick vowels.<\/li>\n<li>š is “sh.” ḥ is a rough “h,” like the “ch” in Scottish <em>loch<\/em>. ṣ is “ts.” ś and s both sound like “s.”<\/li>\n<\/ul>\n<p>You do not need to know any of this to use the book. The words are there as small windows into the text — reminders that these stories were first told in real languages, about real mothers, to their own children.<\/p>", "sources": [{"group": "Texts and reference works", "items": ["<em>Biblia Hebraica Stuttgartensia<\/em>. 5th ed. Stuttgart: Deutsche Bibelgesellschaft, 1997.", "<em>Novum Testamentum Graece<\/em> (Nestle-Aland). 28th rev. ed. Stuttgart: Deutsche Bibelgesellschaft, 2012.", "Josephus. <em>Jewish Antiquities<\/em>, Book 2.", "Koehler, L., W. Baumgartner, and J. J. Stamm. <em>The Hebrew and Aramaic Lexicon of the Old Testament<\/em> (HALOT). Trans. and ed. M. E. J. Richardson. Leiden: Brill, 1994–2000.", "Barr, James. <em>The Semantics of Biblical Language<\/em>. Oxford: Oxford University Press, 1961.", "Lichtheim, Miriam. <em>Ancient Egyptian Literature<\/em>. Vol. 2: <em>The New Kingdom<\/em>. Berkeley: University of California Press, 1976."]}, {"group": "Household, kinship, and women's lives", "items": ["Bridge, Edward J. \"A Mother's Influence: Mothers Naming Children in the Hebrew Bible.\" <em>Vetus Testamentum<\/em> 64, no. 3 (2014).", "Chapman, Cynthia R. <em>The House of the Mother: The Social Roles of Maternal Kin in Biblical Hebrew Narrative and Poetry<\/em>. Anchor Yale Bible Reference Library. New Haven: Yale University Press, 2016.", "Meyers, Carol. <em>Discovering Eve: Ancient Israelite Women in Context<\/em>. New York: Oxford University Press, 1988.", "———. \"'To Her Mother's House': Considering a Counterpart to the Israelite <em>Bêt ʾāb<\/em>.\" In <em>The Bible and the Politics of Exegesis: Essays in Honor of Norman K. Gottwald on His Sixty-Fifth Birthday<\/em>, ed. David Jobling, Peggy L. Day, and Gerald T. Sheppard. Cleveland: Pilgrim Press, 1991.", "———. <em>Rediscovering Eve: Ancient Israelite Women in Context<\/em>. New York: Oxford University Press, 2013.", "Stager, Lawrence E. \"The Archaeology of the Family in Ancient Israel.\" <em>Bulletin of the American Schools of Oriental Research<\/em> 260 (1985): 1–35.", "Yoder, Christine Roy. <em>Wisdom as a Woman of Substance: A Socioeconomic Reading of Proverbs 1–9 and 31:10–31<\/em>. BZAW 304. Berlin: de Gruyter, 2001."]}, {"group": "Queen mothers", "items": ["Ackerman, Susan. \"The Queen Mother and the Cult in Ancient Israel.\" <em>Journal of Biblical Literature<\/em> 112 (1993): 385–401."]}, {"group": "Maternal images of God", "items": ["Clines, David J. A. \"Alleged Female Language about the Deity in the Hebrew Bible.\" <em>Journal of Biblical Literature<\/em> 140 (2021): 229–249.", "Dille, Sarah J. <em>Mixing Metaphors: God as Mother and Father in Deutero-Isaiah<\/em>. JSOTSup 398. London: T&T Clark, 2004.", "Gruber, Mayer I. \"The Motherhood of God in Second Isaiah.\" <em>Revue Biblique<\/em> 90 (1983): 351–359.", "Levinson, Hanne Løland. \"Still Invisible after All These Years? Female God-Language in the Hebrew Bible: A Response to David J. A. Clines.\" <em>Journal of Biblical Literature<\/em> 141, no. 2 (2022).", "Schüngel-Straumann, Helen. \"Gott als Mutter in Hosea 11.\" <em>Theologische Quartalschrift<\/em> 166 (1986): 119–134.", "Trible, Phyllis. <em>God and the Rhetoric of Sexuality<\/em>. Philadelphia: Fortress, 1978."]}, {"group": "Narrative and literary studies", "items": ["Alter, Robert. \"How Convention Helps Us Read: The Case of the Bible's Annunciation Type-Scene.\" <em>Prooftexts<\/em> 3 (1983): 115–130.", "———. <em>The Art of Biblical Narrative<\/em>. New York: Basic Books, 1981.", "Callaway, Mary. <em>Sing, O Barren One: A Study in Comparative Midrash<\/em>. SBLDS 91. Atlanta: Scholars Press, 1986.", "Exum, J. Cheryl. \"'You Shall Let Every Daughter Live': A Study of Exodus 1:8–2:10.\" <em>Semeia<\/em> 28 (1983): 63–82.", "———. \"Second Thoughts about Secondary Characters: Women in Exodus 1.8–2.10.\" In <em>A Feminist Companion to Exodus to Deuteronomy<\/em>, ed. Athalya Brenner, 75–87. Sheffield: Sheffield Academic Press, 1994.", "Frymer-Kensky, Tikva. <em>Reading the Women of the Bible<\/em>. New York: Schocken, 2002.", "Fuchs, Esther. <em>Sexual Politics in the Biblical Narrative: Reading the Hebrew Bible as a Woman<\/em>. JSOTSup 310. Sheffield: Sheffield Academic Press, 2000.", "Trible, Phyllis. <em>Texts of Terror: Literary-Feminist Readings of Biblical Narratives<\/em>. Philadelphia: Fortress, 1984."]}, {"group": "Womanist interpretation", "items": ["Weems, Renita J. <em>Just a Sister Away: A Womanist Vision of Women's Relationships in the Bible<\/em>. San Diego: LuraMedia, 1988.", "Williams, Delores S. <em>Sisters in the Wilderness: The Challenge of Womanist God-Talk<\/em>. Maryknoll: Orbis, 1993."]}, {"group": "New Testament", "items": ["Gaventa, Beverly Roberts. <em>Mary: Glimpses of the Mother of Jesus<\/em>. Columbia: University of South Carolina Press, 1995.", "Köstenberger, Andreas J. \"Ascertaining Women's God-Ordained Roles: An Interpretation of 1 Timothy 2:15.\" <em>Bulletin for Biblical Research<\/em> 7 (1997): 107–144.", "Porter, Stanley E. \"What Does It Mean to Be 'Saved by Childbirth' (1 Timothy 2.15)?\" <em>Journal for the Study of the New Testament<\/em> 49 (1993): 87–102."]}]}}, "plans": [{"id": "side", "name": "Side by Side", "blurb": "Both books together, one day of each. The two books follow the same five parts, so each day's readings belong together.", "days": [["F1", "M1"], ["F2", "M2"], ["F3", "M3"], ["F4", "M4"], ["F5", "M5"], ["F6", "M6"], ["F7", "M7"], ["F8", "M8"], ["F9", "M9"], ["F10", "M10"], ["F11", "M11"], ["F12", "M12"], ["F13", "M13"], ["F14", "M14"], ["F15", "M15"], ["F16", "M16"], ["F17", "M17"], ["F18", "M18"], ["F19", "M19"], ["F20", "M20"], ["F21", "M21"], ["F22", "M22"], ["F23", "M23"], ["F24", "M24"], ["F25", "M25"], ["F26", "M26"], ["F27", "M27"], ["F28", "M28"], ["F29", "M29"], ["F30", "M30"], ["F31", "M31"]]}, {"id": "father", "name": "Like a Father", "blurb": "The fathers of the Bible, and the Father they are measured by.", "days": [["F1"], ["F2"], ["F3"], ["F4"], ["F5"], ["F6"], ["F7"], ["F8"], ["F9"], ["F10"], ["F11"], ["F12"], ["F13"], ["F14"], ["F15"], ["F16"], ["F17"], ["F18"], ["F19"], ["F20"], ["F21"], ["F22"], ["F23"], ["F24"], ["F25"], ["F26"], ["F27"], ["F28"], ["F29"], ["F30"], ["F31"]]}, {"id": "mother", "name": "As a Mother Comforts", "blurb": "The mothers of the Bible, and the God who comforts like a mother.", "days": [["M1"], ["M2"], ["M3"], ["M4"], ["M5"], ["M6"], ["M7"], ["M8"], ["M9"], ["M10"], ["M11"], ["M12"], ["M13"], ["M14"], ["M15"], ["M16"], ["M17"], ["M18"], ["M19"], ["M20"], ["M21"], ["M22"], ["M23"], ["M24"], ["M25"], ["M26"], ["M27"], ["M28"], ["M29"], ["M30"], ["M31"]]}, {"id": "teach", "name": "Teaching Your Children", "blurb": "What fathers and mothers hand on, and how.", "days": [["F7"], ["M7"], ["F8"], ["M8"], ["F9"], ["M9"], ["F10"], ["M10"]]}, {"id": "wrong", "name": "When Parents Get It Wrong", "blurb": "Favouritism, silence, manipulation — and what the Bible does with them.", "days": [["F21"], ["M25"], ["M26"], ["F22"], ["F23"], ["F24"], ["M27"], ["F26"]]}, {"id": "grief", "name": "Grief and Loss", "blurb": "Mothers and fathers who lost children, and a God who does not forget.", "days": [["M23"], ["M24"], ["F25"], ["M18"], ["M28"], ["M29"], ["M2"]]}, {"id": "hurt", "name": "If a Parent Hurt You", "blurb": "For readers whose father or mother did them harm.", "days": [["F30"], ["M30"], ["F2"], ["F5"], ["M2"], ["F28"], ["F31"]]}]}, "de": {"books": {"F": {"key": "F", "title": "Wie ein Vater", "subtitle": "Einunddreißig Tage mit den Vätern der Bibel", "tagline": "Ein Andachtsbuch für Väter – und für alle, die einen hatten", "verse": "\n„Wie sich ein Vater über seine Kinder erbarmt,<br>so erbarmt sich der HERR über die, die ihn fürchten.“<br><span class=\"ref\">Psalm 103,13<\/span>\n", "begin": "<p>Dieses Buch ist aus einer Frage entstanden: <em>Was sagt die Bibel eigentlich über Väter?<\/em><\/p>\n<p>Die ehrliche Antwort hat mich überrascht. Die Bibel hat kein Kapitel mit der Überschrift „Wie man ein guter Vater wird“. Sie richtet nur sehr wenige Gebote direkt an Väter. Stattdessen gibt sie uns zwei Dinge.<\/p>\n<p>Das erste ist ein Bild von <strong>Gott als Vater<\/strong> – zärtlich, geduldig, stark und unendlich treu. Dieses Bild ist der Maßstab. An ihm wird jeder menschliche Vater gemessen.<\/p>\n<p>Das zweite ist eine lange Reihe <strong>echter Väter<\/strong>, und die meisten von ihnen machen vieles gründlich falsch. Abraham bringt seinen Sohn in Gefahr. Isaak und Jakob ziehen ein Kind dem anderen vor und reißen damit ihre Familien auseinander. Eli sieht zu, wie seine Söhne verkommen, und tut nichts. David – „ein Mann nach dem Herzen Gottes“ – versagt an seinen Kindern auf fast jede Weise, auf die ein Vater versagen kann.<\/p>\n<p>Die Bibel verschweigt nichts davon. Sie erzählt die Geschichten einfach und lässt uns hinsehen.<\/p>\n<p>Ein ehrliches Wort dazu, wie dieses Buch diese Geschichten liest. Sie wurden nicht als Erziehungsratgeber geschrieben. Sie handeln von Gottes Verheißungen, vom Aufstieg und Fall von Familien und Königreichen und von Gottes Treue in alledem. Wenn wir sie <em>als Väter<\/em> lesen, stellen wir eine Frage, die ihre Verfasser nicht beantworten wollten. Die Frage ist berechtigt – schon das Neue Testament liest die alten Geschichten als Beispiele, denen man folgen oder die man meiden soll (1. Korinther 10,11) –, aber wir sollten sie demütig stellen und die Geschichten nicht mehr sagen lassen, als sie sagen.<\/p>\n<p>Und noch ein ehrliches Wort: Die Bibel erzählt von keinem Vater, der alles richtig gemacht hat. Was sie stattdessen bietet, sind Momente – eine gestellte Frage, ein gesprochenes Gebet, ein Blick auf die Straße – und vor allem das Bild von Gott selbst.<\/p>\n<p>Das ist eine gute Nachricht für jeden, der dieses Buch in die Hand nimmt und spürt, dass er nicht der Vater war, der er sein wollte – oder dass er nicht den Vater hatte, den er gebraucht hätte. Du bist in Gesellschaft der Helden der Bibel. Und der Gott, der ihrer aller Vater ist, hat sie nicht aufgegeben – und dich auch nicht.<\/p>\n<h3 id=\"wie-man-dieses-buch-benutzt\">Wie man dieses Buch benutzt<\/h3>\n<p>Es gibt einunddreißig Andachten, eine für jeden Tag eines Monats. Jede dauert etwa zehn Minuten.<\/p>\n<ul>\n<li><strong>Lies<\/strong> zuerst den Abschnitt in deiner eigenen Bibel. Das kurze Zitat oben auf der Seite ist nur sein Herzstück.<\/li>\n<li><strong>Das Wort für heute<\/strong> stellt ein Wort aus dem hebräischen (oder, im Neuen Testament, griechischen) Urtext vor – wie es klingt und was es bedeutet. Du musst kein Hebräisch können. Diese Wörter öffnen nur ein kleines Fenster in den Text.<\/li>\n<li><strong>Zum Nachdenken<\/strong> bietet zwei oder drei Fragen. Beantworte sie ehrlich – am besten schriftlich.<\/li>\n<li><strong>Gebet<\/strong> ist ein kurzes Gebet, das du so sprechen oder zu deinem eigenen machen kannst.<\/li>\n<li><strong>Heute<\/strong> schlägt eine kleine, konkrete Sache für den Tag vor.<\/li>\n<\/ul>\n<p>Du kannst allein lesen, mit deiner Frau oder in einer Gruppe von Vätern. Wenn du einen Tag verpasst, mach einfach dort weiter, wo du aufgehört hast.<\/p>\n<h3 id=\"ein-wort-vor-dem-anfang\">Ein Wort vor dem Anfang<\/h3>\n<p>Manche Leser bringen zu diesem Buch echten Schmerz mit – einen Vater, der abwesend, kalt oder gewalttätig war. Wenn das auf dich zutrifft: Dieses Buch wird nicht von dir verlangen, so zu tun, als wäre nichts gewesen. Die Bibel ist ehrlich über Väter, die Schaden anrichten, und wir werden es auch sein. Tag 2 und Tag 30 sind besonders für dich geschrieben; vielleicht möchtest du sie zuerst lesen.<\/p>\n<p>Und wenn ein Kind gerade jetzt in Gefahr ist: Leg dieses Buch weg und hol Hilfe. Nichts in der Bibel verlangt von irgendjemandem, ein Kind in Gefahr zu lassen.<\/p>", "parts": [{"id": "teil-eins", "label": "Teil Eins", "title": "Der Vater, an dem wir gemessen werden", "intro": "Meistens denken wir uns Gott als Vater, indem wir bei menschlichen Vätern anfangen und uns nach oben vorarbeiten. Die Bibel geht den umgekehrten Weg. Gott ist der Vater; jeder menschliche Vater ist eine kleine, unvollkommene Abbildung. Darum beginnen wir bei ihm – bei seinem Erbarmen und auch bei seiner festen, liebevollen Zurechtweisung. (Das Wort „Vater“ ist nicht für jeden leicht. Für manche Leser ist es mit echtem Schmerz verbunden; Tag 30 ist für sie geschrieben.)", "days": [1, 2, 3, 4, 5, 6]}, {"id": "teil-zwei", "label": "Teil Zwei", "title": "Wozu ein Vater da ist", "intro": "Die Bibel richtet erstaunlich wenige direkte Anweisungen an Väter. Aber die wenigen, die sie gibt, sind klar, und sie zeigen alle in dieselbe Richtung: Ein Vater ist jemand, der weitergibt, was er empfangen hat.", "days": [7, 8, 9, 10, 11, 12]}, {"id": "teil-drei", "label": "Teil Drei", "title": "Väter, die etwas richtig gemacht haben", "intro": "Die Bibel erzählt keine zusammenhängende Geschichte eines Vaters, der seine eigenen Kinder gut großgezogen hat. Was sie bietet, sind Momente: eine gestellte Frage, ein gesprochenes Gebet, ein Blick auf die Straße. Mehrere der Väter in diesem Teil waren gar nicht die leiblichen Väter des Kindes. Wir sehen uns an, was jeder von ihnen gut gemacht hat, ohne so zu tun, als hätten sie keine Fehler gehabt.", "days": [13, 14, 15, 16, 17, 18, 19, 20]}, {"id": "teil-vier", "label": "Teil Vier", "title": "Väter, die versagt haben", "intro": "Die Bibel erzählt vom Versagen ihrer Väter offen und ohne Ausreden. Manche Väter versagen durch Gewalt – Jiftach, Saul, die Könige, die ihre Söhne opferten. Dieses Versagen ist leicht zu erkennen. In diesem Teil geht es vor allem um die andere Art, die wir leicht übersehen: Väter, die wussten, was geschah, und nichts taten.", "days": [21, 22, 23, 24, 25, 26]}, {"id": "teil-fünf", "label": "Teil Fünf", "title": "Harte Worte – und das letzte Wort", "intro": "Zum Schluss kommen die schwierigsten Texte: die über Erziehung und Strafe, die über Töchter und die für Leser, denen ihr Vater Schaden zugefügt hat. Und dann lassen wir die Bibel ihr letztes Wort sprechen – und das ist kein Befehl, sondern eine Verheißung.", "days": [27, 28, 29, 30, 31]}], "days": [{"id": "F1", "n": 1, "title": "Woher die Vaterschaft ihren Namen hat", "part": 0, "read": "Epheser 3,14–21", "ref": "Epheser 3,14–15", "html": "<blockquote>\n<p>„Deshalb beuge ich meine Knie vor dem Vater, von dem jede Vaterschaft im Himmel und auf der Erde ihren Namen hat.“<\/p>\n<p><span class=\"ref\">Epheser 3,14–15<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">אָב<\/span> (<em>ʾāb<\/em>) – „Vater“. Eines der häufigsten Substantive der hebräischen Bibel, rund 1200-mal belegt.<\/p>\n<\/div>\n<p>Paulus macht hier ein kleines Wortspiel, das man leicht überliest. Das griechische Wort für „Vater“ ist <em>patēr<\/em>. Das Wort für „Familie“ ist <em>patria<\/em> – wörtlich eine „Vaterschaft“. Jede <em>patria<\/em>, sagt Paulus, hat ihren Namen vom <em>Patēr<\/em>.<\/p>\n<p>Mit anderen Worten: Gott hat sich die Idee der Vaterschaft nicht bei uns geliehen. Wir haben sie uns bei ihm geliehen.<\/p>\n<p>Das verändert die Frage, die wir stellen. Wir fragen gern: „Was für ein Vater bin ich?“, und messen uns an anderen Männern – an unseren eigenen Vätern, an Freunden, an den Vätern in der Gemeinde. Manche von uns schneiden dabei ganz gut ab. Andere wirken hoffnungslos.<\/p>\n<p>Die Bibel stellt eine andere Frage: „Wie ist Gott als Vater – und wie viel davon können meine Kinder an mir sehen?“<\/p>\n<p>Diese Frage macht demütig und frei zugleich. Demütig, weil keiner von uns auch nur annähernd herankommt. Frei, weil Vaterschaft nichts ist, was du aus dem Nichts erfinden musst. Es gibt ein Original. Du bist nicht die Quelle dessen, was deine Kinder brauchen; du bist ein Kanal dafür. Du kannst immer wieder zum Vater zurückgehen, um zu lernen, was ein Vater ist.<\/p>\n<p>Das hebräische Wort <em>ʾāb<\/em> hat eine weitere Bedeutung als unser deutsches „Vater“. Es kann einen Großvater oder einen fernen Vorfahren meinen. Es kann einen Lehrer meinen – Elisa rief „Mein Vater, mein Vater!“, als der Prophet Elia ihm genommen wurde. Es kann einen Beschützer meinen: Hiob sagte von sich: „Ich war ein Vater der Armen.“ <em>ʾāb<\/em> genannt zu werden hieß, jemand zu sein, dessen Stärke <em>für<\/em> die Menschen eingesetzt wurde, die auf ihn angewiesen waren.<\/p>\n<p>Darauf kommt es an. Vaterschaft ist in der Bibel nicht zuerst eine Frage von Rang oder Autorität. Es geht um Stärke, die für die Schwachen eingesetzt wird.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Wenn du dir „einen guten Vater“ vorstellst – wessen Gesicht siehst du zuerst? Woher kommt dieses Bild?<\/li>\n<li>Was weißt du über Gott als Vater, das deine Kinder gern an dir sehen sollten?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Vater, jede Familie auf der Erde hat ihren Namen von dir.<br />\nLehre mich, was ein Vater ist – nicht aus meinem Stolz oder meinen Ängsten, sondern von dir.<br />\nLass meine Kinder in meinem Gesicht etwas von deinem sehen. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Schreib drei Wörter auf, die Gott als Vater beschreiben. Leg den Zettel an einen Ort, an dem du ihn diese Woche siehst.\n<\/p>", "note": "Das Wortspiel <em>patēr<\/em> / <em>patria<\/em> steht im griechischen Text von Epheser 3,14–15. Zu den weiteren Bedeutungen des hebräischen <em>ʾāb<\/em> („Vater“) gehören Stammvater (1. Mose 4,20–21), Prophet oder Lehrer (2. Könige 2,12) und Beschützer (Hiob 29,16); siehe die hebräischen Wörterbücher (HALOT) und Ringgrens Artikel zu <em>ʾāb<\/em> im <em>Theologischen Wörterbuch zum Alten Testament<\/em>.", "readEn": "Ephesians 3:14–21"}, {"id": "F2", "n": 2, "title": "Vater der Vaterlosen", "part": 0, "read": "Psalm 68,1–7", "ref": "Psalm 68,6", "html": "<blockquote>\n<p>„Ein Vater der Waisen und ein Anwalt der Witwen ist Gott in seiner heiligen Wohnung.“<\/p>\n<p><span class=\"ref\">Psalm 68,6<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">אֲבִי יְתוֹמִים<\/span> (<em>ʾăbî yĕtômîm<\/em>) – „Vater der Waisen“. Das Wort <em>yātôm<\/em> bezeichnet ein Kind, das keinen Vater hat.<\/p>\n<\/div>\n<p>Wenn du Gott als Vater beschreiben wolltest – wo würdest du anfangen? Die meisten von uns würden mit einer glücklichen Familie beginnen: ein Vater, eine Mutter, Kinder um einen Tisch.<\/p>\n<p>Der Psalmdichter fängt woanders an. Er beginnt mit dem Kind, das <em>keinen<\/em> Vater hat.<\/p>\n<p>Das ist kein Zufall. Im ganzen Alten Testament sind die Waise und die Witwe die Menschen, die Gottes Gesetz am sorgfältigsten schützt. Bauern mussten einen Teil ihrer Ernte für sie stehen lassen. Richter wurden gewarnt, ihnen niemals das Recht zu beugen. Gott selbst versprach, ihren Schrei zu hören. Das vaterlose Kind war das Kind, für das niemand eintrat – also sagte Gott: „Ich tue es.“<\/p>\n<p>Das bedeutet zweierlei.<\/p>\n<p>Erstens: Wenn du ohne Vater aufgewachsen bist – weil er gestorben ist, weil er gegangen ist oder weil er zwar da war, aber nie wirklich anwesend –, dann stehst du nicht am Rand dieser Geschichte. Du stehst in ihrer Mitte. Das allererste Bild, das die Bibel von Gottes Vaterschaft zeichnet, ist mit dem Blick auf dich gezeichnet. Du hast den Vater nicht verpasst. Er hat zuerst nach dir gesucht.<\/p>\n<p>Zweitens: Wenn du selbst Vater <em>bist<\/em>, setzt dieser Vers den Maßstab. Gottes Vaterschaft wird nicht daran gemessen, wie gut er mit den einfachen Kindern umgeht. Sie wird daran gemessen, wie er die behandelt, um die sich sonst niemand kümmert. Eine Vaterschaft, die an den Grenzen der eigenen Familie aufhört, ist noch nicht Gottes Art von Vaterschaft geworden.<\/p>\n<p>Viele Männer in der Bibel wurden Väter für Kinder, die nicht ihre eigenen waren. Mordechai nahm seine verwaiste Cousine Ester auf und zog sie als Tochter groß. Josef von Nazareth nahm Marias Kind als sein eigenes an und gab ihm den Namen. Paulus nannte den jungen Timotheus seinen Sohn. Es gibt vaterlose Kinder in jeder Gemeinde, in jeder Straße, in jeder Schule. Manche von ihnen brauchen genau das, was du geben könntest.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Gibt es einen Teil in dir, der sich immer noch „vaterlos“ fühlt? Kannst du ihn heute so zu Gott bringen, wie er ist?<\/li>\n<li>Gibt es in deiner Nähe ein Kind oder einen jungen Menschen, der keinen Vater hat, der für ihn eintritt?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Vater der Vaterlosen,<br />\ndanke, dass du bei denen anfängst, die niemanden haben.<br />\nWo ich vaterlos bin, sei mir Vater.<br />\nWo ich Vater bin, mach mein Herz weiter als mein eigenes Haus. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Denk an einen jungen Menschen, dem die Aufmerksamkeit eines Vaters fehlt. Tu eine kleine Sache – ein Wort, eine Nachricht, eine Mahlzeit –, die ihm zeigt, dass jemand ihn bemerkt.\n<\/p>", "note": "Zur Waise und zur Witwe im Gesetz Israels siehe 2. Mose 22,21–23; 5. Mose 24,17–21; Jesaja 1,17.", "readEn": "Psalm 68:1–6"}, {"id": "F3", "n": 3, "title": "Erbarmen, das weiß, dass wir Staub sind", "part": 0, "read": "Psalm 103,1–14", "ref": "Psalm 103,13–14", "html": "<blockquote>\n<p>„Wie sich ein Vater über seine Kinder erbarmt, so erbarmt sich der HERR über die, die ihn fürchten. Denn er weiß, was für ein Gebilde wir sind; er denkt daran, dass wir Staub sind.“<\/p>\n<p><span class=\"ref\">Psalm 103,13–14<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">רַחֵם<\/span> (<em>raḥēm<\/em>) – „sich erbarmen“. Es ist das stärkste Wort der Bibel für tiefe, zärtliche, schützende Liebe – gebraucht von Gott, von Vätern, von Müttern und von Josef gegenüber seinem Bruder.<\/p>\n<\/div>\n<p>Die hebräische Sprache hat hier etwas Bemerkenswertes. Das Wort, das der Psalm für die zärtliche Liebe eines Vaters gebraucht, gehört zur selben Wortfamilie wie <em>reḥem<\/em>, der Mutterschoß.<\/p>\n<p>Wir sollten daraus nicht zu viel machen – Wörter tragen ihre Familiengeschichte nicht in jeden Satz hinein. Dasselbe Wort wird von Josef gebraucht, als er seinen jüngeren Bruder wiedersieht und sein Erbarmen in ihm „brennt“ (1. Mose 43,30). Es ist einfach das stärkste Wort der Bibel für tiefe, leibliche, schützende Liebe. Aber die Familienähnlichkeit ist trotzdem ein schönes Sprachbild: Liebe, die man im Leib spürt, die Art Liebe, die ein Kind trägt. Und der Psalm sagt ohne Zögern: So fühlt ein guter Vater. So fühlt Gott.<\/p>\n<p>Viele Männer sind mit der Überzeugung aufgewachsen, Zärtlichkeit sei Sache der Mutter und Strenge Sache des Vaters. So säuberlich teilt die Bibel die Dinge nicht auf. Ihr Vorbild-Vater ist stark – aber seine Stärke ist ganz von <em>raḥēm<\/em> durchtränkt.<\/p>\n<p>Sieh dir die Begründung an, die der Psalm gibt: „Er weiß, was für ein Gebilde wir sind; er denkt daran, dass wir Staub sind.“<\/p>\n<p>Gottes Erbarmen ist nicht weichlich. Es beruht auf <em>genauer Kenntnis<\/em>. Er weiß genau, wie schwach wir sind, woraus wir gemacht sind, wie leicht wir zerbrechen. Und weil er es weiß, verlangt er nicht mehr, als wir tragen können.<\/p>\n<p>Für einen Vater ist das ein prüfender Spiegel. Kenne ich das „Gebilde“ meiner Kinder? Weiß ich, was dieses eine Kind in diesem Alter tragen kann und was nicht? Oder erwarte ich von einem Siebenjährigen, dass er sich wie ein Erwachsener benimmt – und ärgere mich dann, wenn er es nicht tut?<\/p>\n<p>Viel väterliche Ungeduld kommt daher, dass wir vergessen, dass unsere Kinder Staub sind – klein, jung, noch im Werden. Viel väterliches Erbarmen beginnt einfach damit, sich daran zu erinnern.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Bist du so erzogen worden, dass Zärtlichkeit als „unmännlich“ galt? Wie hat das dein Vatersein geprägt?<\/li>\n<li>Denk an eines deiner Kinder (oder an einen jungen Menschen, der dir nahesteht). Was fällt ihm gerade wirklich schwer? Hast du zu viel erwartet?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, du weißt, was für ein Gebilde ich bin; du denkst daran, dass ich Staub bin.<br />\nDanke, dass du mich mit einem Erbarmen liebst, so tief wie ein Mutterschoß.<br />\nHilf mir, meine Kinder so zu kennen, wie du mich kennst –<br />\nund so sanft mit ihnen zu sein, wie du mit mir bist. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Achte auf einen Moment, in dem du kurz davor bist, mit einem Kind die Geduld zu verlieren. Halte inne und frag dich: „Was kann dieses Kind gerade wirklich leisten?“\n<\/p>", "note": "<em>Raḥēm<\/em> („sich erbarmen“) und <em>reḥem<\/em> („Mutterschoß“) haben dieselbe Wurzel, aber die Wurzel eines Wortes bestimmt nicht seine Bedeutung in jedem Satz (siehe James Barr, <em>The Semantics of Biblical Language<\/em>, 1961; deutsch: <em>Bibelexegese und moderne Semantik<\/em>, 1965). Dieselbe Wendung vom „brennenden“ Erbarmen wird von Josef gegenüber seinem Bruder gebraucht, 1. Mose 43,30.", "readEn": "Psalm 103:1–14"}, {"id": "F4", "n": 4, "title": "Der Gott, der einem Kind das Laufen beibrachte", "part": 0, "read": "Hosea 11,1–9", "ref": "Hosea 11,1.3", "html": "<blockquote>\n<p>„Als Israel jung war, gewann ich ihn lieb, und aus Ägypten rief ich meinen Sohn … Ich war es, der Ephraim laufen lehrte; ich nahm sie auf meine Arme. Aber sie erkannten nicht, dass ich sie heilte.“<\/p>\n<p><span class=\"ref\">Hosea 11,1.3<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">תִרְגַּלְתִּי<\/span> (<em>tirgaltî<\/em>) – „ich lehrte laufen“. Es ist aus dem hebräischen Wort <em>regel<\/em>, „Fuß“, gebildet: wörtlich „ich brachte ihm bei, seine Füße zu gebrauchen“. Das Wort kommt in der ganzen Bibel nur hier vor.<\/p>\n<\/div>\n<p>Hosea 11 ist vielleicht das zärtlichste Bild elterlicher Liebe in der ganzen Schrift – und es ist ein Bild von Gott. (Hosea gebraucht hier übrigens nie das Wort „Vater“. Gott ist einfach der Elternteil eines kleinen Kindes – und manche Leser hören in diesen Versen ebenso eine Mutter wie einen Vater.)<\/p>\n<p>Es ist eine ganz alltägliche Szene. Ein kleines Kind lernt laufen. Sein Vater beugt sich hinunter, nimmt es an beiden Armen und hilft ihm, einen wackligen Schritt nach dem anderen zu machen. Wenn das Kind hinfällt, hebt der Vater es auf und versorgt die Schürfwunden. Das Kind ahnt davon natürlich nichts. Es glaubt, es laufe ganz allein.<\/p>\n<p>„Sie erkannten nicht, dass ich sie heilte.“<\/p>\n<p>Jeder Vater kennt dieses Gefühl. So vieles von dem, was ein Vater tut, bemerkt niemand. Das frühe Aufstehen, die Sorgen, die stillen Reparaturen, die Gebete in der Nacht. Kinder nehmen das als selbstverständlich hin – und das sollen sie auch. Kinder <em>sollen<\/em> sich sicher fühlen, ohne zu wissen, was es kostet.<\/p>\n<p>Dann nimmt das Kapitel eine schmerzliche Wendung. Das Kind wird erwachsen und geht fort. Israel wendet sich anderen Göttern zu. Und Gottes Antwort ist nicht kalter Zorn. Es ist Schmerz: „Wie könnte ich dich preisgeben, Ephraim? … Mein Herz kehrt sich in mir um; all mein Erbarmen ist entbrannt“ (Vers 8).<\/p>\n<p>Hier ist ein Vater, den sein Sohn tief verletzt hat – und dessen Herz sich dem Sohn <em>zuwendet<\/em> statt sich von ihm abzuwenden.<\/p>\n<p>Wenn deine Kinder klein sind, ist dieses Kapitel eine Einladung: Beug dich hinunter, halt ihre Arme, bring ihnen das Laufen bei und nimm es nicht übel, wenn sie dir nie danken. Wenn deine Kinder erwachsen sind und sich abgewandt haben, ist dieses Kapitel ein Begleiter. Gott hat gefühlt, was du fühlst. Und sein letztes Wort ist nicht Ablehnung.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Was kostet dich dein Vatersein, das deine Kinder nie sehen? Kannst du es Gott heute im Stillen hinhalten?<\/li>\n<li>Gibt es ein Kind – dein eigenes oder ein anderes –, dessen Weggehen dich verletzt hat? Wie sähe es aus, wenn dein Herz sich ihm zuwendete?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Vater, du hast mir das Laufen beigebracht, und ich habe es nicht einmal bemerkt.<br />\nDanke für die Heilung, die ich nie gesehen habe.<br />\nGib mir Geduld, mich zu meinen Kindern hinunterzubeugen,<br />\nund ein Herz, das sich ihnen zuwendet, auch wenn sie sich abwenden. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Tu eine verborgene Sache für deine Familie, die niemand bemerken und für die dir niemand danken wird.\n<\/p>", "note": "<em>Tirgaltî<\/em> („ich lehrte laufen“) kommt nur in Hosea 11,3 vor. Der hebräische Text der zweiten Vershälfte ist schwierig, und die Übersetzungen weichen im Einzelnen voneinander ab. Das Wort „Vater“ kommt in Hosea 11 nicht vor; die Bilder sind elterlich, und Helen Schüngel-Straumann, „Gott als Mutter in Hosea 11“, <em>Theologische Quartalschrift<\/em> 166 (1986), liest sie als mütterlich. In 11,4 ändern viele „Joch“ (<em>ʿōl<\/em>) in „Säugling“ (<em>ʿûl<\/em>).", "readEn": "Hosea 11:1–9"}, {"id": "F5", "n": 5, "title": "Wenn alle anderen Väter versagt haben", "part": 0, "read": "Jesaja 63,15–64,7", "ref": "Jesaja 63,16", "html": "<blockquote>\n<p>„Du bist doch unser Vater! Denn Abraham weiß nichts von uns, und Israel kennt uns nicht. Du, HERR, bist unser Vater; ‚Unser Erlöser von alters her‘ ist dein Name.“<\/p>\n<p><span class=\"ref\">Jesaja 63,16<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">אָבִינוּ<\/span> (<em>ʾābînû<\/em>) – „unser Vater“. Mit diesem Wort betet das Judentum bis heute im <em>Awinu Malkenu<\/em>: „Unser Vater, unser König“.<\/p>\n<\/div>\n<p>Das Alte Testament nennt Gott nicht sehr oft „Vater“ – nur etwa fünfzehnmal. Darum lohnt es sich, darauf zu achten, <em>wann<\/em> es das tut.<\/p>\n<p>In diesem Abschnitt liegt das Volk Israel in Trümmern. Es blickt zurück auf seine großen Vorfahren – Abraham, Jakob – und hat das Gefühl, dass diese Väter es heute nicht einmal wiedererkennen würden. Die Reihe der menschlichen Väter ist zu Ende. Es gibt niemanden mehr, der sich zu ihnen bekennt.<\/p>\n<p>Und genau dort rufen sie: „<em>Du<\/em> bist unser Vater.“<\/p>\n<p>Manchen Menschen fällt es schwer, Gott „Vater“ zu nennen, weil ihr eigener Vater sie so enttäuscht hat. Das ist verständlich. Aber sieh genau hin: Dieses Gebet ist <em>aus<\/em> der Enttäuschung über menschliche Väter geboren. Israel nannte Gott „Vater“ nicht, weil seine irdischen Väter so gut gewesen wären, sondern weil es mit ihnen am Ende war.<\/p>\n<p>Gottes Vaterschaft hängt nicht davon ab, wie gut dein Vater war. Sie ist keine vergrößerte Ausgabe des Mannes, bei dem du aufgewachsen bist. Sie ist die Vaterschaft, die dein Vater dir hätte zeigen <em>sollen<\/em> und nicht konnte.<\/p>\n<p>Der Abschnitt geht weiter: „Und doch, HERR, bist du unser Vater. Wir sind der Ton, und du bist unser Töpfer; wir alle sind das Werk deiner Hände“ (64,7). Ein Töpfer wirft den Ton nicht weg, weil er schlecht geformt ist. Er nimmt ihn wieder in die Hände und arbeitet ihn neu.<\/p>\n<p>Wenn du ein Vater bist, der weiß, dass er versagt hat, dann gilt das auch dir. Die Hoffnung deiner Kinder ruht letztlich nicht auf dir. Hinter dir steht ein Vater, der sie nicht loslässt. Du kannst dein Bestes geben, dein Schlimmstes bekennen und sie ihm anvertrauen.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Wie hat die Erfahrung mit deinem eigenen Vater dein Bild von Gott als Vater geprägt – zum Guten oder zum Schlechten?<\/li>\n<li>Was würde es bedeuten, deine Kinder einem Vater anzuvertrauen, der besser ist als du?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Du bist unser Vater.<br />\nWenn die Väter dieser Welt uns vergessen, denkst du an uns.<br />\nNimm mich wieder in deine Hände wie Ton und forme mich neu.<br />\nUnd halte meine Kinder, wenn meine eigenen Hände versagen. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Bete langsam, dreimal, die Worte „Du bist unser Vater“ – für jedes deiner Kinder mit seinem Namen.\n<\/p>", "note": "Die hebräische Bibel nennt Gott nur etwa fünfzehnmal „Vater“, fast immer entweder bei der Gründung Israels (5. Mose 32,6) oder, wie hier, in einem Hilferuf aus der Not. Die Zählung stammt von Joachim Jeremias (<em>The Prayers of Jesus<\/em>, 1967, S. 12; deutsches Original: <em>Abba<\/em>, 1966); sie lässt die Stellen weg, an denen Gott nur mit einem Vater verglichen wird, etwa Psalm 103,13 (Tag 3). In englischen Bibeln ist Jesaja 64,7 der Vers 64,8.", "readEn": "Isaiah 63:15–64:8"}, {"id": "F6", "n": 6, "title": "Abba", "part": 0, "read": "Markus 14,32–36; Römer 8,14–17", "ref": "Markus 14,36", "html": "<blockquote>\n<p>„Und er sprach: ‚Abba, Vater, alles ist dir möglich. Nimm diesen Kelch von mir! Doch nicht, was ich will, sondern was du willst.‘“<\/p>\n<p><span class=\"ref\">Markus 14,36<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">אַבָּא<\/span> (<em>ʾabbāʾ<\/em>) – „Vater“, auf Aramäisch, der Alltagssprache, die Jesus sprach.<\/p>\n<\/div>\n<p>Vielleicht hast du schon gehört, <em>Abba<\/em> bedeute „Papi“ – das Lallwort eines Kleinkindes. Das ist ein schöner Gedanke, und er wird oft gepredigt. Aber er stimmt nicht ganz.<\/p>\n<p>Die genaue Erforschung der aramäischen Sprache hat gezeigt, dass <em>Abba<\/em> das gewöhnliche Wort war, mit dem erwachsene Männer und Frauen ihre Väter anredeten. Es war warm und persönlich, aber es war keine Babysprache. Auch ein erwachsener Sohn konnte seinen Vater auf dem Sterbebett <em>Abba<\/em> nennen.<\/p>\n<p>Macht es das weniger kostbar? Ganz und gar nicht. Es macht es tiefer.<\/p>\n<p>Sieh, wo Jesus das Wort gebraucht. Im Garten Getsemani, in der Nacht vor seinem Tod, als er den Kelch des Leidens vor sich sieht. Das ist kein Kuscheln eines Kleinkindes. Es ist der Schrei eines erwachsenen Sohnes, der seinem Vater ganz und gar vertraut – so sehr, dass er sagen kann: „Nimm das weg“, und im selben Atemzug: „Nicht, was ich will, sondern was du willst.“<\/p>\n<p>Das ist es, was <em>Abba<\/em> in sich trägt: völlige Zugehörigkeit, völlige Ehrlichkeit und völliges Vertrauen – auch im Dunkeln.<\/p>\n<p>Und dann das Erstaunliche: Jesus schenkt dieses Wort uns. Paulus sagt, dass der Geist in unseren Herzen „<em>Abba<\/em>, Vater“ ruft (Römer 8,15). Wir sind eingeladen in dieselbe Beziehung, die Jesus zu seinem Vater hat.<\/p>\n<p>Für Väter setzt das das Ziel. Wir wollen keine Kinder, die sich bei uns einfach nur wohlfühlen oder nur ein weiches „Papi“ kennen. Wir wollen Kinder, die wissen, dass sie zu uns <em>gehören<\/em>, die uns die Wahrheit sagen können und die uns vertrauen, auch wenn wir „Nein“ sagen. Eine solche Beziehung wächst langsam, durch Jahre der Treue – genau so, wie Gott sie mit uns aufbaut.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Kannst du mit der Ehrlichkeit von Getsemani zu Gott beten – sagen, was du wirklich willst, und ihm trotzdem vertrauen?<\/li>\n<li>Fühlen sich deine Kinder frei, dir die Wahrheit zu sagen, auch die unbequeme? Was macht es ihnen leichter oder schwerer?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Abba, Vater – danke, dass ich zu dir gehöre.<br />\nLehre mich, dir im Dunkeln zu vertrauen, wie Jesus es tat.<br />\nMach mein Zuhause zu einem Ort, an dem meine Kinder mir die Wahrheit sagen können<br />\nund wissen, dass sie trotzdem dazugehören. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Stell einem deiner Kinder eine ehrliche Frage – „Was ist gerade schwer für dich?“ – und hör einfach zu, ohne gleich eine Lösung zu haben.\n<\/p>", "note": "Die verbreitete Behauptung, <em>Abba<\/em> bedeute „Papi“, geht auf Joachim Jeremias zurück (<em>Abba<\/em>, 1966; englisch <em>The Prayers of Jesus<\/em>, 1967). Korrigiert wurde sie von James Barr, „‚Abbā Isn’t „Daddy“‘“, <em>Journal of Theological Studies<\/em> 39 (1988): 28–47. Siehe auch Marianne Meye Thompson, <em>The Promise of the Father<\/em> (2000).", "art": {"file": "images/f6.webp", "caption": "Getsemani: „Abba, Vater“", "title": "Jesus betet im Garten Getsemani", "credit": "Gustave Doré, Bibelillustrationen (1866)", "source": "https://commons.wikimedia.org/wiki/File%3ADoreJesusPrayingintheGarden.jpg", "licence": "Public domain", "w": 546, "h": 687}, "readEn": "Mark 14:32–36; Romans 8:14–17"}, {"id": "F7", "n": 7, "title": "Zuerst auf dein eigenes Herz", "part": 1, "read": "5. Mose 6,4–9", "ref": "5. Mose 6,6–7", "html": "<blockquote>\n<p>„Diese Worte, die ich dir heute gebiete, sollen auf deinem Herzen sein. Und du sollst sie deinen Kindern einschärfen.“<\/p>\n<p><span class=\"ref\">5. Mose 6,6–7<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">עַל־לְבָבֶךָ<\/span> (<em>ʿal-lĕbābekā<\/em>) – „auf deinem Herzen“. Im Hebräischen ist das Herz nicht in erster Linie der Ort der Gefühle, sondern die Mitte des Menschen: der Ort, an dem man denkt, entscheidet und wählt.<\/p>\n<\/div>\n<p>Das ist die wichtigste Anweisung an Väter im ganzen Alten Testament. Und das Erste, was sie sagt, betrifft überhaupt nicht die Kinder.<\/p>\n<p>„Diese Worte sollen auf <em>deinem<\/em> Herzen sein.“<\/p>\n<p>Erst dann: „Schärfe sie deinen Kindern ein.“<\/p>\n<p>Die Reihenfolge ist wichtig. Gott verlangt von Vätern nicht, etwas weiterzugeben, das sie selbst nie aufgenommen haben. Ein Mann kann seinem Sohn keinen Glauben weiterreichen, den er nur vom Hörensagen kennt. Kinder haben ein außerordentlich feines Gespür für den Unterschied zwischen dem, was wir sagen, und dem, was wir sind. Meistens glauben sie dem, was wir sind.<\/p>\n<p>Das kann sich schwer anfühlen. Die meisten von uns wissen, dass unser eigenes Herz nicht dort ist, wo es sein sollte. Wir sind müde, abgelenkt und unbeständig. Wir sagen unseren Kindern, sie sollen geduldig sein, während wir im Stau schimpfen.<\/p>\n<p>Aber achte darauf, was der Vers <em>nicht<\/em> sagt. Er sagt nicht: „Wenn dein Herz vollkommen ist, dann unterrichte deine Kinder.“ Er sagt: „Lass diese Worte auf deinem Herzen sein.“ Es ist eine Einladung, selbst immer wieder zu Gott zurückzukehren – zu lesen, zu beten, umzukehren, zu vertrauen –, damit das, was zu deinen Kindern hinüberfließt, aus etwas Echtem kommt.<\/p>\n<p>Das beste Geschenk für den Glauben deiner Kinder ist vielleicht nicht eine bessere Familienandacht. Es ist vielleicht ein Vater, der sichtbar und ehrlich selbst noch lernt, Gott zu folgen. Kinder, die ihren Vater beten, um Entschuldigung bitten und weitermachen sehen, lernen etwas, das keine Predigt ihnen beibringen kann.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Was verlangst du von deinen Kindern, das du selbst nicht lebst?<\/li>\n<li>Wo steht dein eigenes Herz gerade mit Gott – ehrlich?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, lege deine Worte auf mein Herz, bevor ich sie auf das Herz meiner Kinder lege.<br />\nWo ich gelehrt habe, was ich nicht lebe, vergib mir.<br />\nMach meinen Glauben echt genug, dass meine Kinder ihn sehen können. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Nimm dir zehn Minuten allein mit Gott, bevor du versuchst, deinen Kindern irgendetwas über ihn beizubringen.\n<\/p>", "note": "In 5. Mose 6,6–7 gehen die Worte „auf dein Herz“, bevor sie zu den Kindern gehen; die Reihenfolge ist die des Textes selbst. Zur Frage, ob der „Sohn“ der Sprüche, die dieselbe Aufgabe des Lehrens aufnehmen, das Kind eines Vaters oder der Schüler eines Lehrers ist, vergleiche André Lemaire, <em>Les écoles et la formation de la Bible dans l’ancien Israël<\/em> (1981), der für Schreiberschulen argumentiert, mit Friedemann Golka, <em>The Leopard’s Spots<\/em> (1993), der für eine Herkunft aus Familie und Dorf argumentiert.", "readEn": "Deuteronomy 6:4–9"}, {"id": "F8", "n": 8, "title": "Schärfen statt Vorträge halten", "part": 1, "read": "5. Mose 6,6–9.20–25", "ref": "5. Mose 6,7", "html": "<blockquote>\n<p>„Schärfe sie deinen Kindern ein und rede davon, wenn du in deinem Haus sitzt und wenn du unterwegs bist, wenn du dich hinlegst und wenn du aufstehst.“<\/p>\n<p><span class=\"ref\">5. Mose 6,7<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">וְשִׁנַּנְתָּם<\/span> (<em>wĕšinnantām<\/em>) – „und du sollst sie einschärfen“. In diesem Vers heißt es, etwas so zu lehren, dass es haften bleibt – es durch Wiederholung einzuprägen.<\/p>\n<\/div>\n<p>Luther übersetzte diesen Vers: „Und sollst sie deinen Kindern einschärfen.“ Das trifft es genau. Und die Verwandtschaft des Wortes mit dem Schärfen gibt uns ein hilfreiches Bild.<\/p>\n<p>Denk an einen Mann, der eine Klinge am Wetzstein schärft. Er tut es nicht einmal mit großer Kraft. Er tut es wieder und wieder, Strich um Strich, geduldig, bis die Schneide entsteht. Oder denk an einen Steinmetz, der Buchstaben in Stein haut – langsam, immer wieder, bis die Worte bleiben.<\/p>\n<p>So wird Glaube weitergegeben. Nicht vor allem durch große Reden, sondern durch Tausende kleiner, wiederholter Berührungen.<\/p>\n<p>Und sieh, wo es geschieht: „wenn du in deinem Haus sitzt und wenn du unterwegs bist, wenn du dich hinlegst und wenn du aufstehst“. Das umfasst fast einen ganzen gewöhnlichen Tag. Das Frühstück. Die Fahrt zur Schule. Ein Spaziergang. Die Schlafenszeit.<\/p>\n<p>Das Bild, das die Bibel von einem Vater zeichnet, der seine Kinder unterweist, ist nicht das eines Mannes hinter einer Kanzel. Es ist das eines Mannes, der ganz selbstverständlich mitten im Alltag von Gott spricht, weil Gott für ihn zum Alltag gehört.<\/p>\n<p>Viele Väter haben das Gefühl, geistliche Gespräche „nicht zu können“. Aber du musst keine Reden halten können. Du musst da sein und bereit, Gott so selbstverständlich zu erwähnen wie das Wetter. „Ich mache mir Sorgen wegen der Arbeit heute – ich habe Gott um Hilfe gebeten.“ „Sieh dir diesen Sonnenuntergang an. Den hat Gott gemacht.“ „Das habe ich vorhin falsch gemacht. Es tut mir leid. Gott bringt mir da auch gerade etwas bei.“<\/p>\n<p>Kleine Striche. Viele Male. Über viele Jahre. So entsteht eine Schneide.<\/p>\n<p>Die jüdischen Weisen waren darin herrlich praktisch. Der Talmud zählt auf, was ein Vater seinem Sohn schuldet: ihn die Tora zu lehren, ihn ein Handwerk zu lehren – „und manche sagen: ihn schwimmen zu lehren“ (Kidduschin 29a). Glaube, ein Weg, den Lebensunterhalt zu verdienen, und die Fähigkeit, in tiefem Wasser am Leben zu bleiben: gewöhnliches Lernen für das gewöhnliche Leben.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Wann bist du im Alltag mit deinen Kindern zusammen, ohne Bildschirme und ohne Eile – beim Essen, im Auto, beim Zubettgehen?<\/li>\n<li>Was hält dich davon ab, in diesen Momenten ganz selbstverständlich von Gott zu reden?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, ich muss zu Hause keine Predigten halten.<br />\nHilf mir, in den kleinen Momenten von dir zu reden –<br />\nim Sitzen, im Gehen, beim Hinlegen und beim Aufstehen –,<br />\nbis deine Worte in die Herzen meiner Kinder eingegraben sind. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Wähle einen gewöhnlichen Moment – die Autofahrt, eine Mahlzeit, das Zubettgehen – und erwähne Gott darin, schlicht und selbstverständlich.\n<\/p>", "note": "Die Wurzel von <em>wĕšinnantām<\/em> wird vom Schärfen eines Schwertes (5. Mose 32,41) und einer Zunge (Psalm 64,4) gebraucht; in 5. Mose 6,7 bedeutet sie „einschärfen, so lehren, dass es haften bleibt“. Die Liste der Pflichten eines Vaters steht im Babylonischen Talmud, Kidduschin 29a – spätere jüdische Überlieferung, mehrere Jahrhunderte jünger als die biblischen Texte.", "readEn": "Deuteronomy 6:6–9, 20–25"}, {"id": "F9", "n": 9, "title": "Ein Leben, das Kinder fragen lässt", "part": 1, "read": "Josua 4,1–7; 2. Mose 12,24–27", "ref": "Josua 4,6", "html": "<blockquote>\n<p>„Wenn eure Kinder künftig fragen: ‚Was bedeuten euch diese Steine?‘ …“<\/p>\n<p><span class=\"ref\">Josua 4,6<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">מָה הָאֲבָנִים הָאֵלֶּה<\/span> (<em>mâ hāʾăbānîm hāʾēlleh<\/em>) – „Was sind das für Steine?“<\/p>\n<\/div>\n<p>Hier zeigt sich etwas Wunderbares daran, wie die Bibel sich das Lernen von Kindern vorstellt. Immer wieder wird der Glaube als Antwort auf eine <em>Kinderfrage<\/em> weitergegeben.<\/p>\n<p>Nachdem Israel den Jordan durchquert hatte, ließ Josua zwölf Steine am Fluss aufschichten. Wozu? „Damit ihr es euren Kindern sagen könnt, wenn sie fragen: ‚Was sind das für Steine?‘“ Dasselbe beim Passamahl: „Wenn eure Kinder zu euch sagen: ‚Was bedeutet dieser Brauch für euch?‘, dann sollt ihr sagen …“ (2. Mose 12,26). Und noch einmal im 5. Buch Mose: „Wenn dich dein Sohn künftig fragt …“ (6,20).<\/p>\n<p>Gott hat den Eltern nicht gesagt, sie sollten ihre Kinder hinsetzen und ihnen alles erklären. Er hat ihnen gesagt, <em>so zu leben, dass Kinder neugierig werden<\/em>. Ein Steinhaufen auf einem Feld. Eine Mahlzeit, die seltsam gegessen wird, mit bitteren Kräutern und flachem Brot. Ein Tag in jeder Woche, an dem niemand arbeitet. Diese Dinge sollten Kinder innehalten und fragen lassen: „Warum machen wir das?“<\/p>\n<p>Und dann antwortet der Vater – nicht mit einer Theorie, sondern mit einer Geschichte. „Das hat Gott für uns getan.“<\/p>\n<p>Gibt es etwas in deinem Zuhause, das ein Kind fragen lassen würde? Eine Familie, die vor dem Essen be
