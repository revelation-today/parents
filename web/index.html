/* ---------- indexes ---------- */
const DAY = {};
for (const k of ["F","M"]) for (const d of L.books[k].days) DAY[d.id] = Object.assign({book:k}, d);
const PLAN = Object.fromEntries(L.plans.map(p => [p.id, p]));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bookName = k => L.books[k].title;

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,"0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const dayNum = s => { const [y,m,d] = s.split("-").map(Number); return Math.floor(Date.UTC(y,m-1,d)/864e5); };
const fmtDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(UI.locale,{day:"numeric",month:"long"}); };

/* ---------- state: this device, synced to the account when available ---------- */
const KEY = "like-a-father-as-a-mother-v1" + (LANG === "en" ? "" : "-" + LANG);
let S = {read:{}, plans:{}, font:1, last:null, remind:{on:false, hour:7, minute:0}, voice:{id:null, rate:1, mode:'recorded'}, t:0};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
let sync = {state:"device", ref:null, writing:false, dirty:false, timer:null};

function isRead(id){ return !!(S.read[id] && S.read[id].r); }
function setRead(id, on){ S.read[id] = {r:on, t:Date.now()}; commit(); }
function activePlans(){ return Object.entries(S.plans).filter(([id,p]) => PLAN[id] && !p.stopped).sort((a,b)=>a[1].t-b[1].t).map(([id,p])=>({plan:PLAN[id], st:p})); }
function startPlan(id){ S.plans[id] = {start: todayStr(), t: Date.now(), stopped:false}; commit(); }
function stopPlan(id){ if (S.plans[id]) { S.plans[id] = Object.assign({}, S.plans[id], {stopped:true, t:Date.now()}); commit(); } }

function commit(){
  S.t = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (sync.ref) { sync.dirty = true; clearTimeout(sync.timer); sync.timer = setTimeout(pushSync, 1200); }
}
async function pushSync(){
  if (!sync.ref || sync.writing || !sync.dirty) return;
  sync.writing = true; sync.dirty = false;
  try { await sync.ref.set(JSON.parse(JSON.stringify(S))); sync.state = "account"; }
  catch (e) { if (e && e.code === "unavailable") sync.dirty = true; else { sync.state = "device"; sync.ref = null; } }
  sync.writing = false;
  if (sync.dirty) sync.timer = setTimeout(pushSync, 2500);
}
function merge(remote){
  if (!remote || typeof remote !== "object") return false;
  let changed = false;
  for (const [id,v] of Object.entries(remote.read || {})) if (!S.read[id] || (v && v.t > S.read[id].t)) { S.read[id] = v; changed = true; }
  for (const [id,v] of Object.entries(remote.plans || {})) if (!S.plans[id] || (v && v.t > S.plans[id].t)) { S.plans[id] = v; changed = true; }
  if ((remote.t||0) > (S.t||0)) { if (remote.theme) S.theme = remote.theme; if (remote.face) S.face = remote.face; if (remote.font) S.font = remote.font; if (remote.last) S.last = remote.last; if (remote.remind) S.remind = remote.remind; if (remote.voice) S.voice = remote.voice; changed = true; }
  return changed;
}
async function connect(){
  if (!(window.claude && window.claude.use)) return;
  try {
    const user = await window.claude.use("user");
    const uid = user ? await user.id() : null;
    if (!uid) return;
    const db = await window.claude.use("db");
    if (!db) return;
    const ref = db.doc("data/users/" + uid + "/progress" + (LANG === "en" ? "" : "-" + LANG));
    const snap = await ref.get();
    const localNewer = merge(snap.exists ? snap.data() : null) || !snap.exists || (S.t||0) > ((snap.data()||{}).t||0);
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    sync.ref = ref; sync.state = "account";
    if (localNewer && (Object.keys(S.read).length || Object.keys(S.plans).length)) { sync.dirty = true; pushSync(); }
    render();
  } catch (e) { sync.state = "device"; }
}

/* ---------- the daily reminder (the iPhone app only) ---------- */
const REMINDER_ID = 1;
function notifications(){
  const P = window.Capacitor && window.Capacitor.Plugins;
  return (NATIVE && P && P.LocalNotifications) || null;
}
function reminderText(){
  const act = activePlans();
  for (const {plan, st} of act){
    const info = planInfo(plan, st);
    if (info.next >= 0){
      const first = DAY[plan.days[info.next][0]];
      return `${plan.name} · ${UI.day(info.next + 1)}: ${first.title}`;
    }
  }
  return UI.waiting;
}
async function syncReminder(){
  const LN = notifications();
  if (!LN) return;
  try {
    await LN.cancel({notifications: [{id: REMINDER_ID}]});
    if (!S.remind || !S.remind.on) return;
    let perm = await LN.checkPermissions();
    if (perm.display !== "granted") perm = await LN.requestPermissions();
    if (perm.display !== "granted"){ S.remind.on = false; commit(); render(); toast(UI.notifOff); return; }
    await LN.schedule({notifications: [{
      id: REMINDER_ID,
      title: "Faithful parents",
      body: reminderText(),
      schedule: {on: {hour: S.remind.hour, minute: S.remind.minute}, allowWhileIdle: true}
    }]});
  } catch (e) {}
}
const hhmm = r => `${String(r.hour).padStart(2,"0")}:${String(r.minute).padStart(2,"0")}`;

/* ---------- reading aloud ----------
   In the iPhone app the phone's own voices speak through the text-to-speech
   plugin (AVSpeechSynthesizer), which keeps going with the screen locked; on
   the web the browser's speech synthesis does the same job. Asked only for a
   language, iOS reads with the flat "compact" voice, so the installed voices
   are ranked — premium, then enhanced, then standard — and the reader can
   choose. Novelty and Eloquence voices are left out; they are not for books. */
const SPEECH_LANG = UI.speech;
const QUALITY = {premium: 0, enhanced: 1, standard: 2};
const QUALITY_LABEL = UI.quality;
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
/* The recorded narration: every paragraph spoken once in advance (Kokoro in
   English, Piper in German), so the app plays a narrator instead of the phone's flat voice.
   The files sit next to the web version; the iPhone app streams them from
   there and falls back to the phone's voice when they cannot be reached. */
const AUDIO_BASE = NATIVE ? "https://revelation-today.github.io/parents/audio/" : "audio/";
let audioIndex = null, audioAsked = false;
async function recordings(){
  if (audioIndex || audioAsked) return audioIndex;
  audioAsked = true;
  try {
    const r = await fetch(AUDIO_BASE + UI.audioIndex, {cache: "no-cache"});
    if (r.ok) audioIndex = await r.json();
  } catch (e) {}
  return audioIndex;
}
const AUDIO_CACHE = "parents-narration";
function audioURL(h){ return AUDIO_BASE + h + ".mp3"; }
function blocksOf(book){
  const idx = audioIndex; if (!idx) return [];
  return Object.entries(idx.days).filter(([id]) => id[0] === book).flatMap(([, list]) => list.map(b => b.h));
}
async function audioStore(){ try { return await caches.open(AUDIO_CACHE); } catch (e) { return null; } }
/** How much of a book is already on the phone. */
async function downloaded(book){
  const c = await audioStore(); if (!c) return {have: 0, total: 0};
  const hashes = [...new Set(blocksOf(book))];
  let have = 0;
  for (const h of hashes) if (await c.match(audioURL(h))) have++;
  return {have, total: hashes.length};
}
async function downloadBook(book, onProgress){
  const c = await audioStore(); if (!c) return false;
  const hashes = [...new Set(blocksOf(book))];
  let done = 0;
  for (const h of hashes){
    const url = audioURL(h);
    if (!(await c.match(url))){
      try {
        const r = await fetch(url, {cache: "no-store"});
        if (r.ok) await c.put(url, r.clone());
      } catch (e) { return false; }
    }
    if (onProgress && ++done % 3 === 0) onProgress(done, hashes.length);
  }
  if (onProgress) onProgress(hashes.length, hashes.length);
  return true;
}
async function removeDownloads(){ try { await caches.delete(AUDIO_CACHE); } catch (e) {} }

function wantsRecording(){ return (S.voice && S.voice.mode) !== "device"; }
const player = new Audio();
player.preload = "auto";

const talk = {playing: false, blocks: [], starts: [], first: 0, current: -1, run: 0, listening: false, onPos: null};

function ttsPlugin(){ const P = window.Capacitor && window.Capacitor.Plugins; return (NATIVE && P && P.TextToSpeech) || null; }
function webSpeech(){ return ("speechSynthesis" in window) ? window.speechSynthesis : null; }
function canSpeak(){ return !!(ttsPlugin() || webSpeech()); }
function qualityOf(uri, name){ const t = (uri || "") + " " + (name || ""); return /premium/i.test(t) ? "premium" : /enhanced|natural|neural/i.test(t) ? "enhanced" : "standard"; }

function webVoicesReady(){
  const ss = webSpeech(); if (!ss) return Promise.resolve([]);
  const now = ss.getVoices(); if (now.length) return Promise.resolve(now);
  return new Promise(res => {
    const t = setTimeout(() => res(ss.getVoices()), 1500);
    ss.addEventListener("voiceschanged", () => { clearTimeout(t); res(ss.getVoices()); }, {once: true});
  });
}
async function voiceList(){
  let raw = [];
  const P = ttsPlugin();
  if (P){
    try { raw = (await P.getSupportedVoices()).voices.map((v, i) => ({index: i, uri: v.voiceURI, name: v.name, lang: v.lang})); } catch (e) { raw = []; }
  } else {
    raw = (await webVoicesReady()).map((v, i) => ({index: i, uri: v.voiceURI, name: v.name, lang: v.lang, obj: v}));
  }
  const wanted = SPEECH_LANG.toLowerCase();
  return raw
    .map(v => Object.assign(v, {lang: (v.lang || "").toLowerCase().replace("_", "-"), quality: qualityOf(v.uri, v.name)}))
    .filter(v => v.lang.startsWith(LANG) && !/eloquence|speech\.synthesis\.voice/i.test(v.uri || ""))
    .sort((a, b) => QUALITY[a.quality] - QUALITY[b.quality] || Number(b.lang === wanted) - Number(a.lang === wanted) || a.name.localeCompare(b.name));
}
async function chosenVoice(){
  const vs = await voiceList();
  return vs.find(v => v.uri === (S.voice && S.voice.id)) || vs[0] || null;
}

/* What is read: the day itself, not its picture, notes or buttons, and not the
   Hebrew script, which an English voice cannot pronounce. */
const READ_BLOCKS = "h1, p, li";
function spokenText(el){
  const c = el.cloneNode(true);
  c.querySelectorAll('[lang="he"], .he-line, .ref').forEach(n => n.remove());
  return c.textContent.replace(/[ʾʿ]/g, "").replace(/\bLORD\b/g, "Lord").replace(/\bHERRN?\b/g, m => m === "HERRN" ? "Herrn" : "Herr").replace(/\(\s*\)/g, "").replace(/\s+/g, " ").trim();
}
function readableBlocks(root){
  return [...root.querySelectorAll(READ_BLOCKS)].filter(el =>
    !el.querySelector(READ_BLOCKS) && !el.closest("figure, details, .done-panel, .day-eyebrow, .pager") &&
    !el.classList.contains("readref") && spokenText(el));
}
function asSentence(el, t){
  if (!/[.!?…:;]["'”’»)]*$/.test(t)) t += ".";
  if (/^H[1-4]$/.test(el.tagName)) t += " …";
  return t + "\n\n";
}
function markSpeaking(i){
  const old = talk.blocks[talk.current]; if (old) old.classList.remove("speaking");
  talk.current = i;
  const el = talk.blocks[i]; if (!el) return;
  el.classList.add("speaking");
  const r = el.getBoundingClientRect();
  if (r.top < 90 || r.bottom > window.innerHeight - 90) el.scrollIntoView({block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}
function updateListenButton(){
  const b = document.querySelector("[data-listen]"); if (!b) return;
  b.setAttribute("aria-pressed", talk.playing ? "true" : "false");
  b.setAttribute("aria-label", talk.playing ? UI.stopReading : UI.readAloud);
  b.innerHTML = talk.playing ? ICON.stop : ICON.speaker;
}
async function engineSpeak(text, voice, rate, onPos){
  const P = ttsPlugin();
  if (P){
    if (!talk.listening){ talk.listening = true; try { await P.addListener("onRangeStart", ({start}) => talk.onPos && talk.onPos(start)); } catch (e) {} }
    talk.onPos = onPos || null;
    await P.speak({text, lang: voice ? voice.lang : SPEECH_LANG, rate, voice: voice ? voice.index : undefined, category: "playback", queueStrategy: 0});
  } else {
    const ss = webSpeech(); if (!ss) return;
    const u = new SpeechSynthesisUtterance(text);
    if (voice && voice.obj){ u.voice = voice.obj; u.lang = voice.obj.lang; } else u.lang = SPEECH_LANG;
    u.rate = rate;
    if (onPos) u.onboundary = e => onPos(e.charIndex);
    await new Promise(res => { u.onend = res; u.onerror = res; ss.cancel(); ss.speak(u); });
  }
}
async function engineStop(){
  try { player.pause(); player.removeAttribute("src"); player.load(); } catch (e) {}
  const P = ttsPlugin();
  if (P){ try { await P.stop(); } catch (e) {} }
  else { const ss = webSpeech(); if (ss) ss.cancel(); }
}
async function playRecorded(dayId, from){
  const idx = await recordings();
  const list = idx && idx.days && idx.days[dayId];
  if (!list || !list.length) return false;
  const mine = talk.run, rate = (S.voice && S.voice.rate) || 1;
  for (let n = from; n < list.length && mine === talk.run; n++){
    if (n >= talk.blocks.length) break;
    markSpeaking(n);
    const src = await localOrRemote(list[n].h);
    const ok = await new Promise(res => {
      player.onended = () => res(true);
      player.onerror = () => res(false);
      player.src = src;
      player.playbackRate = rate;
      player.play().catch(() => res(false));
    });
    if (mine !== talk.run) return true;            // stopped, or started again elsewhere
    if (!ok) return n === from ? false : "partial"; // nothing played at all: let the phone read
  }
  return true;
}

async function localOrRemote(h){
  const url = audioURL(h);
  try {
    const c = await audioStore();
    const hit = c && await c.match(url);
    if (hit){
      if (player.dataset.blob) URL.revokeObjectURL(player.dataset.blob);
      const blob = URL.createObjectURL(await hit.blob());
      player.dataset.blob = blob;
      return blob;
    }
  } catch (e) {}
  return url;
}

async function startReading(from){
  const root = document.querySelector("article.day"); if (!root) return;
  await stopReading();
  talk.blocks = readableBlocks(root);
  talk.first = Math.max(0, Math.min(from || 0, talk.blocks.length - 1));
  let text = ""; const starts = [];
  for (let i = talk.first; i < talk.blocks.length; i++){ starts.push(text.length); text += asSentence(talk.blocks[i], spokenText(talk.blocks[i])); }
  talk.starts = starts;
  const voice = await chosenVoice(), rate = (S.voice && S.voice.rate) || 1;
  const mine = ++talk.run;
  talk.playing = true; markSpeaking(talk.first); updateListenButton();
  if (wantsRecording()){
    const dayId = (location.hash.split("?")[0].split("/")[2] || "");
    const played = await playRecorded(dayId, talk.first);
    if (played){
      if (mine === talk.run){
        const finished = talk.playing;
        talk.playing = false; markSpeaking(-1); updateListenButton();
        if (finished && played !== "partial") toast(UI.finished);
      }
      if (played !== "partial") return;
    }
  }
  const onPos = pos => {
    if (!talk.playing || mine !== talk.run) return;
    let i = starts.length - 1; while (i > 0 && starts[i] > pos) i--;
    if (talk.first + i !== talk.current) markSpeaking(talk.first + i);
  };
  try { await engineSpeak(text, voice, rate, onPos); } catch (e) {}
  if (mine === talk.run){
    const finished = talk.playing;
    talk.playing = false; markSpeaking(-1); updateListenButton();
    if (finished) toast(UI.finished);
  }
}
async function stopReading(){
  talk.run++;
  talk.playing = false; markSpeaking(-1); updateListenButton();
  await engineStop();
}
const SAMPLE = UI.sample;
async function previewVoice(){
  await stopReading();
  if (wantsRecording()){
    const idx = await recordings();
    const first = idx && idx.days && (idx.days.F1 || Object.values(idx.days)[0]);
    if (first && first.length){
      player.src = AUDIO_BASE + first[1 % first.length].h + ".mp3";
      player.playbackRate = (S.voice && S.voice.rate) || 1;
      player.play().catch(() => {});
      return;
    }
  }
  const voice = await chosenVoice();
  try { await engineSpeak(SAMPLE, voice, (S.voice && S.voice.rate) || 1); } catch (e) {}
}

/* The settings card, filled once the voices are known. */
async function fillVoiceSettings(){
  const pick = document.getElementById("voice-pick"); if (!pick) return;
  const vs = await voiceList();
  const hint = document.getElementById("voice-hint");
  const state = document.getElementById("audio-state");
  if (state){
    const idx = await recordings();
    const n = idx && idx.days ? Object.keys(idx.days).length : 0;
    state.textContent = n
      ? UI.narratorReads(n)
      : UI.noNarration;
  }
  showDownloads();
  if (!vs.length){
    pick.innerHTML = `<option>${UI.noVoice}</option>`; pick.disabled = true;
    return;
  }
  const chosen = vs.find(v => v.uri === (S.voice && S.voice.id)) || vs[0];
  pick.innerHTML = vs.map(v => `<option value="${esc(v.uri)}" ${v === chosen ? "selected" : ""}>${esc(v.name)} · ${QUALITY_LABEL[v.quality]}</option>`).join("");
  pick.disabled = false;
  // Only the flat compact voices are installed: say where the better ones are.
  if (hint) hint.hidden = !(vs[0].quality === "standard" && (NATIVE || IOS));
}

async function showDownloads(){
  const box = document.getElementById("offline-audio"); if (!box) return;
  const idx = await recordings();
  box.hidden = !(idx && idx.days && Object.keys(idx.days).length);
  if (box.hidden) return;
  for (const book of ["F", "M"]){
    const line = document.getElementById("dl-" + book); if (!line) continue;
    const {have, total} = await downloaded(book);
    line.textContent = !total ? UI.notRecorded
      : have >= total ? UI.onDevice(total)
      : have ? UI.partOnDevice(have, total) : UI.sizeOf(total, Math.round(total * 0.55));
    const btn = document.querySelector(`[data-download="${book}"]`);
    if (btn) btn.textContent = have >= total && total ? UI.downloaded : have ? UI.resume : UI.download;
  }
}

/* ---------- plan maths ---------- */
function planInfo(plan, st){
  const n = plan.days.length;
  const readCount = plan.days.map(rs => rs.filter(isRead).length);
  const done = plan.days.map((rs, i) => readCount[i] === rs.length);
  const next = done.indexOf(false);
  const sched = Math.min(n, Math.max(1, dayNum(todayStr()) - dayNum(st.start) + 1));
  let behind = 0; for (let i = 0; i < sched; i++) if (!done[i]) behind++;
  behind = Math.max(0, behind - 1);             // today's own reading is not "behind"
  const perDay = plan.days[0].length;
  const left = next < 0 ? [] : plan.days[next].filter(r => !isRead(r));
  return {n, done, readCount, next, sched, behind, perDay, left, count: done.filter(Boolean).length};
}
function readHref(id, planId, idx){ return "#/read/" + id + (planId ? `?plan=${planId}&d=${idx}` : ""); }

/* ---------- small pieces ---------- */
const ICON = {
  today:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  plans:'<svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>',
  library:'<svg viewBox="0 0 24 24"><path d="M4 5.5C6.5 4.5 9.5 4.6 12 6c2.5-1.4 5.5-1.5 8-.5V19c-2.5-1-5.5-.9-8 .5-2.5-1.4-5.5-1.5-8-.5z"/><path d="M12 6v13.5"/></svg>',
  about:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.2"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  speaker:'<svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',

/* Light, dark and the reading font, as the reader set them (untouched until they do). */
function applyLook(){

  if (S.theme === "light" || S.theme === "dark") r.dataset.theme = S.theme;
  else if (S.theme === "system") delete r.dataset.theme;

function tabs(active){

  document.getElementById("tabs").innerHTML = t.map(([k,l]) =>
    `<a class="tab" href="#/${k}" ${active===k?'aria-current="page"':''}>${ICON[k]}<span>${l}</span></a>`).join("");

function readingRow(id, planId, idx, badge){
  const d = DAY[id], read = isRead(id);
  return `<a class="reading${read ? " is-read" : ""}" data-book="${d.book}" href="${readHref(id,planId,idx)}">
    <span class="dot" aria-hidden="true"></span>
    <span><div class="t">${esc(d.title)}${badge && !read ? ` <em class="badge">${UI.next}</em>` : ""}</div>
      <div class="s">${esc(bookName(d.book))} · ${UI.day(d.n)}${d.read?" · "+esc(d.read):""}</div></span>
    ${read ? `<span class="check on" data-book="${d.book}" aria-label="${UI.read}">${ICON.tick}</span>` : `<span class="chev" aria-hidden="true">›</span>`}
  </a>`;
}
function ticks(info){
  return `<div class="ticks" aria-hidden="true">${info.done.map((d,i)=>{
    const half = !d && info.readCount[i] > 0;
    return `<span class="tick ${d?"done":half?"half":i===info.next?"next":i<info.sched?"due":""}"></span>`;
  }).join("")}</div>`;
}
function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.hidden = true; }, 1800);
}

function screenToday(){
  const act = activePlans();
  const date = new Date().toLocaleDateString(UI.locale,{weekday:"long",day:"numeric",month:"long"});
  let h = `<header class="screen-head">${gear()}<div class="eyebrow">${esc(date)}</div><h1 class="screen-title">${UI.today}</h1></header><div class="stack">`;
  if (!act.length){
    const p = PLAN.side;
    h += `<section class="card plan-card">
      <div class="eyebrow">${UI.startHere}</div>
      <h2 class="plan-name">${esc(p.name)}</h2>
      <p class="lede">${esc(p.blurb)}</p>
      <div class="meta-row"><span>${UI.nDays(p.days.length)}</span><span>${UI.twoPerDay}</span><span>${UI.tenMinutes}</span></div>
      <div class="readings">${p.days[0].map(id=>readingRow(id,null,0)).join("")}</div>
      <div class="btn-row"><button class="btn" data-start="side">${UI.startThisPlan}</button><a class="btn quiet" href="#/plans">${UI.otherPlans}</a></div>
    </section>`;
  }
  for (const {plan, st} of act){
    const info = planInfo(plan, st);
    const complete = info.next === -1;
    const status = complete ? `<span class="status ok">${UI.complete}</span>`
      : info.behind ? `<span class="status behind">${UI.catchUp(info.behind)}</span>` : `<span class="status ok">${UI.onTrack}</span>`;
    h += `<section class="card plan-card">
      <div class="meta-row" style="justify-content:space-between;margin:0"><span class="eyebrow">${esc(UI.started(fmtDate(st.start)))}</span>${status}</div>
      <h2 class="plan-name">${esc(plan.name)}</h2>
      <div class="meta-row"><span>${complete ? UI.allRead(info.n) : UI.dayOf(info.next+1, info.n)}</span><span>${UI.nDone(info.count)}</span>${
        !complete && info.perDay > 1 ? `<span>${UI.readToday(info.perDay - info.left.length, info.perDay)}</span>` : ""}</div>
      ${ticks(info)}
      ${complete ? `<div class="btn-row"><button class="btn quiet" data-restart="${plan.id}">${UI.readAgain}</button><button class="linkbtn" data-stop="${plan.id}">${UI.removeFromToday}</button></div>`
        : `<div class="readings">${plan.days[info.next].map(id=>readingRow(id,plan.id,info.next,info.left.length < info.perDay)).join("")}</div>`}
    </section>`;
  }
  if (S.last && DAY[S.last]){
    h += `<div class="section-label">${UI.lastOpened}</div><div class="card" style="padding-block:4px">${readingRow(S.last)}</div>`;
  }
  return h + `</div>`;
}

function screenPlans(){

  for (const p of L.plans){
    const st = S.plans[p.id]; const on = st && !st.stopped;
    const info = on ? planInfo(p, st) : null;
    const per = p.days[0].length;
    const books = [...new Set(p.days.flat().map(id=>id[0]))];
    h += `<section class="card plan-card" ${books.length===1?`data-book="${books[0]}"`:""}>

      <p class="lede" style="margin-top:4px">${esc(p.blurb)}</p>
      <div class="meta-row"><span>${UI.nDays(p.days.length)}</span><span>${per===2?UI.twoPerDay:UI.onePerDay}</span>${on?`<span>${UI.doneOf(info.count, info.n)}</span>`:""}</div>
      ${on ? ticks(info) : ""}
      <div class="btn-row">
        ${on ? `<a class="btn" href="#/plan/${p.id}">${UI.open}</a><button class="linkbtn" data-stop="${p.id}">${UI.stopPlan}</button>`

}

function screenPlan(id){

  let h = `<div class="readbar"><a class="iconbtn" href="#/plans" aria-label="${UI.backToPlans}">${ICON.back}</a><span class="grow">${UI.plan}</span><span style="width:40px"></span></div>

function screenRead(id, q){
  const d = DAY[id]; if (!d) return screenToday();
  const b = L.books[d.book];
  const part = b.parts[d.part];
  let planId = q.get("plan"), idx = Number(q.get("d"));
  let plan = planId && PLAN[planId];
  // Opened from the library or a link? If this reading is where one of your
  // plans stands right now, carry on inside that plan anyway.
  if (!plan){
    for (const {plan: p, st} of activePlans()){
      const info = planInfo(p, st);
      if (info.next >= 0 && p.days[info.next].indexOf(id) !== -1){ plan = p; planId = p.id; idx = info.next; break; }
    }
  }
  const read = isRead(id);
  const prev = DAY[d.book + (d.n - 1)], next = DAY[d.book + (d.n + 1)];
  // what comes next in the plan: the other reading of the same plan day, else the next plan day
  let planNext = null, dayDone = false;
  if (plan && plan.days[idx]){
    const others = plan.days[idx].filter(r => r !== id && !isRead(r));
    if (others.length) planNext = {id: others[0], idx};
    else {
      dayDone = plan.days[idx].every(isRead);
      if (plan.days[idx+1]) planNext = {id: plan.days[idx+1][0], idx: idx+1};
    }
  }
  const gw = UI.bible(d);
  return `<div class="readbar" data-book="${d.book}">
      <a class="iconbtn" href="${plan ? "#/today" : "#/library/"+d.book}" aria-label="${UI.back}">${ICON.back}</a>
      <span class="grow">${esc(plan ? plan.name + " · " + UI.day(idx+1) : b.title)}</span>
      ${canSpeak() ? `<button class="iconbtn listen" data-listen aria-pressed="false" aria-label="${UI.readAloud}">${ICON.speaker}</button>` : ""}
      <button class="iconbtn" data-font="-1" aria-label="${UI.smaller}">A−</button><button class="iconbtn" data-font="1" aria-label="${UI.larger}">A+</button>
    </div>
    <article class="day" data-book="${d.book}">
      <div class="day-eyebrow">${esc(b.title)} · ${esc(part.label)} · ${UI.day(d.n)}</div>
      <h1>${esc(d.title)}</h1>
      ${d.read ? `<a class="readref" href="${gw}" target="_blank" rel="noopener">${esc(UI.readPassage(d.read))}</a>` : ""}
      ${d.art ? `<figure class="plate">
        <img src="${d.art.file}" width="${d.art.w}" height="${d.art.h}" alt="${esc(d.art.title)}" decoding="async">
        <figcaption>${esc(d.art.caption)}<span class="who">${esc(d.art.title)} · ${esc(d.art.credit)}</span></figcaption>
      </figure>` : ""}
      ${d.html}
      <details class="notes"><summary>${UI.notes}</summary>
        ${d.note ? `<p>${d.note}</p>` : ""}
        <p><a href="#/sources/${d.book}">${UI.allSources}</a></p></details>
      <div class="done-panel">
        <button class="btn ${read?"quiet":"accent"} block" data-toggle="${id}">${read ? UI.readUndo : UI.markRead}</button>
        ${planNext ? `<a class="btn ${dayDone ? "quiet" : "accent"} block" href="${readHref(planNext.id, planId, planNext.idx)}">${
            dayDone ? UI.dayComplete(idx+1, planNext.idx+1) : esc(UI.nextInPlan(DAY[planNext.id].title))}</a>` : ""}
        ${dayDone && !plan.days[idx+1] ? `<p class="fine" style="text-align:center;margin:0">${esc(UI.lastDay(plan.name))}</p>` : ""}
        <nav class="pager" aria-label="${UI.prevNext}">
          ${prev ? `<a href="#/read/${prev.id}"><small>‹ ${UI.day(prev.n)}</small><span>${esc(prev.title)}</span></a>` : "<span></span>"}
          ${next ? `<a class="next" href="#/read/${next.id}"><small>${UI.day(next.n)} ›</small><span>${esc(next.title)}</span></a>` : "<span></span>"}
        </nav>
      </div>
    </article>`;
}

/* ---------- router ---------- */
function render(){
  const [path, qs] = (location.hash.slice(1) || "/today").split("?");
  const seg = path.split("/").filter(Boolean);
  const q = new URLSearchParams(qs || "");
  let html, tab = "today";
  switch (seg[0]){
    case "plans": html = screenPlans(); tab = "plans"; break;
    case "plan": html = screenPlan(seg[1]); tab = "plans"; break;
    case "library": html = screenLibrary(seg[1]); tab = "library"; break;
    case "begin": case "marks": html = screenPage(seg[0], seg[1]); tab = "library"; break;
    case "sources": html = screenSources(seg[1]); tab = "library"; break;
    case "read":
      html = screenRead(seg[1], q); tab = q.get("plan") ? "today" : "library";
      if (DAY[seg[1]] && S.last !== seg[1]) { S.last = seg[1]; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
      break;
    case "about": case "settings": html = screenSettings(); tab = "settings"; break;
    default: html = screenToday();
  }
  document.documentElement.style.setProperty("--read-scale", S.font || 1);
  applyLook();
  document.getElementById("app").innerHTML = html;
  tabs(tab);
  if (talk.playing){                     // same day re-drawn (e.g. marked as read): keep following the voice
    const root = document.querySelector("article.day");
    if (root){ const cur = talk.current; talk.blocks = readableBlocks(root); talk.current = -1; markSpeaking(cur); updateListenButton(); }
  }
  if (seg[0] === "about" || seg[0] === "settings") fillVoiceSettings();
}
let lastPath = null;
window.addEventListener("hashchange", () => { if (talk.playing) stopReading(); render(); const p = location.hash.split("?")[0]; if (p !== lastPath) window.scrollTo(0,0); lastPath = p; });

document.addEventListener("change", e => {
  const el = e.target;
  if (el.name === "lang"){
    try { localStorage.setItem("parents-lang", el.value); } catch (e) {}
    location.hash = "#/settings"; location.reload(); return;
  }
  if (el.id === "theme-pick"){ S.theme = el.value; commit(); applyLook(); return; }
  if (el.id === "text-size"){ S.font = Number(el.value); commit(); return; }
  if (el.id === "voice-mode"){
    S.voice = Object.assign({rate: 1}, S.voice, {mode: el.value}); commit();
    const row = document.getElementById("device-voice-row"); if (row) row.hidden = el.value !== "device";
    previewVoice(); return;
  }
  if (el.id === "voice-pick"){ S.voice = Object.assign({rate: 1}, S.voice, {id: el.value}); commit(); previewVoice(); return; }
  if (el.id === "voice-rate"){ S.voice = Object.assign({id: null}, S.voice, {rate: Number(el.value)}); commit(); return; }
  if (el.id === "remind-on"){
    S.remind = Object.assign({hour:7, minute:0}, S.remind, {on: el.checked});
    commit(); render(); syncReminder();
    if (el.checked) toast(UI.reminderSet(hhmm(S.remind)));
  } else if (el.id === "remind-time" && el.value){
    const [h, m] = el.value.split(":").map(Number);
    S.remind = Object.assign({on:true}, S.remind, {hour: h, minute: m});
    commit(); syncReminder(); toast(UI.reminderSet(hhmm(S.remind)));
  }
});

// the text size follows the slider while it moves, and the sample shows it
document.addEventListener("input", e => {
  if (e.target.id === "text-size") document.documentElement.style.setProperty("--read-scale", e.target.value);
});

document.addEventListener("click", async e => {
  const face = e.target.closest("[data-face]");
  if (face){ S.face = face.dataset.face; commit(); render(); return; }
  if (e.target.closest("[data-listen]")){ talk.playing ? stopReading() : startReading(0); return; }
  if (e.target.closest("[data-preview]")){ previewVoice(); return; }
  const dl = e.target.closest("[data-download]");
  if (dl){
    const book = dl.dataset.download, line = document.getElementById("dl-" + book);
    dl.disabled = true; dl.textContent = UI.downloading;
    const ok = await downloadBook(book, (done, total) => { if (line) line.textContent = UI.downloadProgress(done, total); });
    dl.disabled = false;
    toast(ok ? UI.downloadedToast : UI.downloadStopped);
    showDownloads();
    return;
  }
  if (e.target.closest("[data-remove-audio]")){ await removeDownloads(); toast(UI.downloadsRemoved); showDownloads(); return; }
  // while reading, a tap on a paragraph moves the voice there
  if (talk.playing){
    const blk = e.target.closest("article.day h1, article.day p, article.day li");
    const i = blk ? talk.blocks.indexOf(blk) : -1;
    if (i >= 0 && !e.target.closest("a, button, summary")){ startReading(i); return; }
  }
  const el = e.target.closest("[data-start],[data-stop],[data-restart],[data-toggle],[data-font],[data-reset]");
  if (!el) return;
  if (el.dataset.start){ startPlan(el.dataset.start); toast(UI.planStarted(PLAN[el.dataset.start].name)); location.hash = "#/today"; render(); syncReminder(); }
  else if (el.dataset.restart){ const p = PLAN[el.dataset.restart]; p.days.flat().forEach(id => { S.read[id] = {r:false, t:Date.now()}; }); startPlan(p.id); toast(UI.planRestarted); render(); }
  else if (el.dataset.stop){ stopPlan(el.dataset.stop); toast(UI.planStopped); render(); }
  else if (el.dataset.toggle){ const on = !isRead(el.dataset.toggle); setRead(el.dataset.toggle, on); toast(on ? UI.marked : UI.unmarked); render(); syncReminder(); }
  else if (el.dataset.font){ S.font = Math.min(1.35, Math.max(0.85, Math.round(((S.font||1) + Number(el.dataset.font)*0.08)*100)/100)); commit(); render(); }
  else if (el.dataset.reset){ if (confirm(UI.confirmClear)) { const now = Date.now(); for (const k in S.read) S.read[k] = {r:false, t:now}; for (const k in S.plans) S.plans[k] = Object.assign({}, S.plans[k], {stopped:true, t:now}); S.last = null; commit(); toast(UI.cleared); render(); } }
});

render();
connect();
syncReminder();
</script>

<div id="install-hint" class="install-hint" hidden></div>
<script>
// Offline reading on the web (the App Store app already carries everything).
if ("serviceWorker" in navigator && location.protocol === "https:" && !NATIVE) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
// iPhone and iPad never offer to install a web app themselves.
(function(){
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  let until = 0; try { until = Number(localStorage.getItem("install-hint-until") || 0); } catch (e) {}
  if (!ios || standalone || NATIVE || Date.now() < until) return;
  const el = document.getElementById("install-hint");
  const share = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M6 11v9h12v-9"/></svg>';
  el.innerHTML = LANG === "de"
    ? `<p>Als App installieren: Tippe auf ${share} <strong>Teilen</strong>, dann <strong>Zum Home-Bildschirm</strong>.</p><button type="button" aria-label="Schließen">×</button>`
    : `<p>Install this app: tap ${share} Share, then <strong>Add to Home Screen</strong>.</p><button type="button" aria-label="Close">×</button>`;
  el.hidden = false;
  el.querySelector("button").addEventListener("click", () => {
    el.hidden = true;
    try { localStorage.setItem("install-hint-until", String(Date.now() + 30 * 864e5)); } catch (e) {}
  });
})();
</script>
