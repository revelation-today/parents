tet. Ein Vater, der Geld verschenkt. Ein Haushalt, der einsame Menschen zum Sonntagsessen einlädt. Ein Papa, der am Bett kniet, um zu beten. Eine Kiste mit „Steinen“ – kleinen Gegenständen, die an Zeiten erinnern, in denen Gott der Familie geholfen hat.<\/p>\n<p>Wir machen uns oft Gedanken darüber, wie wir geistliche Gespräche mit unseren Kindern <em>anfangen<\/em> sollen. Die Antwort der Bibel ist einfach: Lebe so, dass deine Kinder sie für dich anfangen.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Was in eurem Familienleben könnte ein Kind fragen lassen: „Warum machen wir das?“<\/li>\n<li>Welche Geschichte von Gottes Hilfe in deinem eigenen Leben könntest du deinen Kindern erzählen?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, gib unserer Familie „Steine“ –<br />\nsichtbare Zeichen deiner Treue, die unsere Kinder neugierig machen.<br />\nUnd wenn sie fragen, gib mir die Worte, ihnen zu erzählen, was du getan hast. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Fang eine kleine, sichtbare Gewohnheit in deinem Zuhause an – oder erzähl deinen Kindern eine Geschichte von einer Zeit, in der Gott dir geholfen hat.\n<\/p>", "note": "Die Texte, die um eine Kinderfrage herum aufgebaut sind, sind 2. Mose 12,26–27, 5. Mose 6,20–25 und Josua 4,6.21. Die vier Söhne der Pessach-Haggada führen dieselbe Logik in späterer jüdischer Überlieferung weiter.", "art": {"file": "images/f9.webp", "caption": "Die Steine am Jordan, aufgestellt, damit Kinder fragen", "title": "Josua führt Israel durch den Jordan", "credit": "Gustave Doré, Bibelillustrationen (1866)", "source": "https://commons.wikimedia.org/wiki/File%3AJoshua_Crossing_Jordan_%2889396850%29.jpg", "licence": "Public domain", "w": 900, "h": 725}, "readEn": "Joshua 4:1–7; Exodus 12:24–27"}, {"id": "F10", "n": 10, "title": "Gerechtigkeit und Recht am Küchentisch", "part": 1, "read": "1. Mose 18,16–33", "ref": "1. Mose 18,19", "html": "<blockquote>\n<p>„Denn ich habe ihn erwählt, damit er seinen Kindern und seinem Haus nach ihm gebiete, den Weg des HERRN zu bewahren und Gerechtigkeit und Recht zu üben.“<\/p>\n<p><span class=\"ref\">1. Mose 18,19<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">צְדָקָה וּמִשְׁפָּט<\/span> (<em>ṣĕdāqâ ûmišpāṭ<\/em>) – „Gerechtigkeit und Recht“. Zusammen bedeuten diese beiden Wörter, Menschen richtig zu behandeln – besonders die, die schwach sind oder leicht übersehen werden.<\/p>\n<\/div>\n<p>Warum hat Gott Abraham erwählt? Die Bibel gibt viele Antworten, aber hier – an einer der wenigen Stellen, an denen Gott seine Gründe erklärt – geht es in der Antwort um <em>Vaterschaft<\/em>.<\/p>\n<p>„Ich habe ihn erwählt, damit er seinen Kindern und seinem Haus nach ihm gebiete.“<\/p>\n<p>Drei Dinge in diesem Vers lohnen es, langsamer zu lesen.<\/p>\n<p><strong>Erstens der Umfang: „seinen Kindern <em>und seinem Haus<\/em>“.<\/strong> Zu Abrahams Zeit gehörten zu einem Haushalt Knechte, Arbeiter und Abhängige. Abrahams Unterweisung galt nicht nur seinen eigenen Söhnen. Sie galt allen unter seinem Dach.<\/p>\n<p><strong>Zweitens der Inhalt: „Gerechtigkeit und Recht“.<\/strong> Gott sagte nicht: „damit er ihnen die richtige Lehre beibringt“ oder „damit sie sich gut benehmen“. Er sagte: damit sie <em>tun, was gerecht und recht ist<\/em> – Menschen fair behandeln, die Schwachen schützen, ehrlich handeln.<\/p>\n<p><strong>Drittens der Horizont: „nach ihm“.<\/strong> Abrahams Unterweisung sollte ihn überdauern. Ein Vater erzieht nicht nur Kinder; er prägt Enkel, denen er vielleicht nie begegnen wird.<\/p>\n<p>Und dann, direkt nach diesem Vers, geschieht etwas. Gott sagt Abraham, dass er die böse Stadt Sodom richten will, und Abraham <em>verhandelt mit Gott<\/em> um der Unschuldigen dort willen. Der Mann, der berufen ist, sein Haus Gerechtigkeit zu lehren, wird gleich in der nächsten Szene gezeigt, wie er selbst für Gerechtigkeit kämpft.<\/p>\n<p>Kinder lernen Gerechtigkeit durch Zusehen. Sie lernen sie daran, wie ihr Vater ihre Mutter behandelt, den Kellner, den Nachbarn, den Mann, der nicht zahlen kann, das Kind, das niemand in seiner Mannschaft haben will. Sie lernen sie daran, was ihren Vater wütend macht – und was nicht.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Wenn deine Kinder „Gerechtigkeit“ nur dadurch gelernt hätten, dass sie dir in der letzten Woche zugesehen haben – was hätten sie gelernt?<\/li>\n<li>Wer ist der „schwache oder übersehene“ Mensch, den eure Familie in diesem Monat gerecht behandeln könnte?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Gott Abrahams, du hast ihn erwählt, sein Haus deinen Weg zu lehren.<br />\nMach unser Zuhause zu einem Ort, an dem Gerechtigkeit und Recht gelebt und nicht nur besprochen werden.<br />\nLass meine Kinder sehen, wie ich für die Schwachen eintrete. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Tu einem übersehenen Menschen gegenüber eine gerechte oder freundliche Tat – und nimm, wenn du kannst, ein Kind mit.\n<\/p>", "note": "Die Sprache von 1. Mose 18,19 („den Weg des HERRN bewahren“, „Gerechtigkeit und Recht“) steht der des 5. Buches Mose und der Propheten nahe. Seit dem 19. Jahrhundert haben viele Forscher – Julius Wellhausen, Hermann Gunkel, John Skinner – 18,17–19 für einen späteren Zusatz gehalten: Israels eigenes Nachdenken darüber, was Abrahams Berufung bedeutete. So oder so zeigt der Text, wie Israel diese Berufung verstehen lernte.", "art": {"file": "images/f10.webp", "caption": "Abraham, der sein Haus Gerechtigkeit und Recht lehren sollte", "title": "Abraham und die drei Engel", "credit": "Gustave Doré, Bibelillustrationen (1866)", "source": "https://commons.wikimedia.org/wiki/File%3AAbraham_and_the_Three_Angels_%2889393872%29.jpg", "licence": "Public domain", "w": 900, "h": 1109}, "readEn": "Genesis 18:16–33"}, {"id": "F11", "n": 11, "title": "Kein Vater steht allein", "part": 1, "read": "Sprüche 1,8–9; 4,1–4", "ref": "Sprüche 1,8", "html": "<blockquote>\n<p>„Höre, mein Sohn, die Unterweisung deines Vaters, und verlass nicht die Weisung deiner Mutter.“<\/p>\n<p><span class=\"ref\">Sprüche 1,8<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">תּוֹרַת אִמֶּךָ<\/span> (<em>tôrat ʾimmekā<\/em>) – „die Weisung deiner Mutter“. Das Wort für „Weisung“ ist hier <em>tôrâ<\/em> – dasselbe Wort, das für Gottes Gesetz gebraucht wird.<\/p>\n<\/div>\n<p>Man stellt sich den Vater im alten Israel leicht als einsamen Herrscher an der Spitze seiner Familie vor, der jede Entscheidung allein trifft. Die Bibel zeichnet ein anderes Bild.<\/p>\n<p>Eine Familie lebte in biblischer Zeit in einem sogenannten „Vaterhaus“ (hebräisch <em>bêt ʾāb<\/em>). Archäologen haben solche Wohnanlagen gefunden: Gruppen von zwei oder drei Häusern um einen gemeinsamen Hof, in denen zwanzig oder dreißig Menschen zusammenlebten – Großeltern, Eltern, verheiratete Söhne mit ihren Frauen, Kinder und Arbeiter. Ein Kind wuchs umgeben von Erwachsenen auf.<\/p>\n<p>Und der Vater war nie die einzige Stimme. Sieh dir den heutigen Vers an. Die Unterweisung des Vaters steht direkt neben der <em>tôrâ<\/em> der Mutter – demselben Wort wie für Gottes Gesetz. Die Zehn Gebote fordern Kinder auf, „deinen Vater <em>und<\/em> deine Mutter“ zu ehren, immer beide zusammen. Selbst in den ernstesten Familienangelegenheiten im Gesetz des Mose konnte ein Vater nicht allein handeln: Vater und Mutter mussten gemeinsam vor die Ältesten der Stadt treten, und diese entschieden.<\/p>\n<p>Mit anderen Worten: Der Vater der Bibel ist eine Stimme unter vielen, eingebunden in ein Netz von Menschen, die die Aufgabe teilen, ein Kind großzuziehen.<\/p>\n<p>Das hat den Vätern von heute etwas Wichtiges zu sagen. Viele von uns ziehen ihre Kinder in kleinen, vereinzelten Haushalten groß, weit weg von den Großeltern, mit wenig Hilfe. Wir haben das Gefühl, alles hänge an uns. Das ist eine neue Lage in der Geschichte der Menschheit, und sie ist schwer.<\/p>\n<p>Die Antwort ist nicht, sich allein noch mehr anzustrengen. Sie heißt: ein Dorf bauen. Großeltern, Paten, Onkel und Tanten, andere Familien aus der Gemeinde, ein vertrauenswürdiger Trainer oder Lehrer – Kinder brauchen viele gute Erwachsene, nicht nur einen Vater. Und ein weiser Vater achtet und unterstützt die Unterweisung durch die Mutter seiner Kinder, statt mit ihr zu konkurrieren.<\/p>\n<p>Wenn du alleinerziehender Vater bist – oder wenn deine Kinder ohne dich im Haus aufwachsen –, dann gilt das umso mehr. Bitte um Hilfe. Das ist keine Schwäche. So hat Gott Familien gedacht.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Wer sind die anderen guten Erwachsenen im Leben deiner Kinder? Wer fehlt?<\/li>\n<li>Wie achtest und unterstützt du die Mutter deiner Kinder in dem, was sie ihnen beibringt?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, ich sollte das nie allein tun.<br />\nDanke für die Menschen, die mit mir meine Kinder großziehen.<br />\nGib uns ein Dorf – und mach mich dankbar für jede gute Stimme in ihrem Leben. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Nenne drei vertrauenswürdige Erwachsene, die du gern im Leben deiner Kinder hättest. Melde dich diese Woche bei einem von ihnen.\n<\/p>", "note": "Zum israelitischen „Vaterhaus“ siehe Lawrence Stager, „The Archaeology of the Family in Ancient Israel“, <em>BASOR<\/em> 260 (1985); zur Rolle der Mütter im Haushalt Carol Meyers, <em>Rediscovering Eve<\/em> (2013). Das Gesetz, das beide Eltern und die Ältesten der Stadt verlangt, ist 5. Mose 21,18–21; die jüdische Überlieferung kam später zu dem Schluss, dass es nie tatsächlich angewandt wurde (Babylonischer Talmud, Sanhedrin 71a).", "readEn": "Proverbs 1:8–9; 4:1–4"}, {"id": "F12", "n": 12, "title": "Was ein Vater niemals tun darf", "part": 1, "read": "Jeremia 7,30–31; 5. Mose 24,16", "ref": "Jeremia 7,31", "html": "<blockquote>\n<p>„Sie haben die Opferhöhen gebaut …, um ihre Söhne und Töchter im Feuer zu verbrennen – was ich nicht geboten habe und was mir nie in den Sinn gekommen ist.“<\/p>\n<p><span class=\"ref\">Jeremia 7,31<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">לֹא עָלְתָה עַל־לִבִּי<\/span> (<em>lōʾ ʿālĕtâ ʿal-libbî<\/em>) – „es ist nicht in mein Herz aufgestiegen“. Mit anderen Worten: Der Gedanke ist Gott nie auch nur in den Sinn gekommen.<\/p>\n<\/div>\n<p>Wir haben mehrere Tage darüber nachgedacht, wozu ein Vater <em>da ist<\/em>. Heute geht es darum, was ein Vater niemals tun darf.<\/p>\n<p>Die Bibel gibt Vätern echte Autorität, und manches davon beunruhigt heutige Leser. Das Gesetz des Mose erlaubte einem Vater, eine Tochter in Dienst zu verkaufen (2. Mose 21,7) und ihre Gelübde aufzuheben (4. Mose 30). Wir sollten nicht so tun, als wäre es anders.<\/p>\n<p>Aber dasselbe Gesetz zieht der Macht eines Vaters auch feste Grenzen:<\/p>\n<ul>\n<li><strong>Ein Vater darf sein Kind niemals opfern.<\/strong> Manche Nachbarvölker Israels opferten ihren Göttern Kinder, und zwei Könige von Juda, Ahas und Manasse, taten dasselbe (2. Könige 16,3; 21,6). Gottes Reaktion bei Jeremia ist heftig: „Ich habe es nie geboten. Es ist mir nie ins Herz gekommen.“ Das Leben eines Kindes gehört nicht dem Vater, um es einzusetzen.<\/li>\n<li><strong>Ein Vater darf nicht allein Richter sein.<\/strong> Selbst in den schwersten Familienangelegenheiten verlangte das Gesetz des Mose, dass der Fall vor die Ältesten der Stadt kam. Die Macht des Vaters war durch die Gemeinschaft begrenzt.<\/li>\n<li><strong>Ein Vater darf beim Erbe nicht bevorzugen.<\/strong> 5. Mose 21,15–17 verbietet einem Mann, dem Sohn der Lieblingsfrau die Rechte zu geben, die einem anderen Sohn zustanden.<\/li>\n<li><strong>Ein Kind wird nicht für die Sünde des Vaters bestraft.<\/strong> „Die Väter sollen nicht für die Kinder sterben und die Kinder nicht für die Väter; jeder soll für seine eigene Sünde sterben“ (5. Mose 24,16).<\/li>\n<\/ul>\n<p>Die Botschaft ist klar. Die Autorität eines Vaters ist echt – aber sie ist geliehen, und sie hat Grenzen. Kinder gehören Gott, bevor sie uns gehören.<\/p>\n<p>Nur wenige von uns werden je in Versuchung geraten, ihren Kindern so zu schaden wie Ahas. Aber es gibt andere Arten, Kinder zu „opfern“: einer Karriere, die keine Zeit für sie lässt; unserem Ehrgeiz, indem wir sie zum Erfolg drängen, damit wir uns erfolgreich fühlen; unserem Ansehen, indem uns wichtiger ist, wie sie uns aussehen lassen, als wie es ihnen geht; sogar frommer Betriebsamkeit, die jeden Abend mit Sitzungen füllt, während unsere eigenen Kinder zu Hause warten.<\/p>\n<p>Gottes Herz ist eindeutig: Nichts davon ist ihm je ins Herz gekommen.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Gibt es etwas – Arbeit, Ehrgeiz, Image, sogar Gemeindedienst –, dem deine Kinder „geopfert“ werden?<\/li>\n<li>Wie fühlt es sich an zu wissen, dass deine Kinder Gott gehören, bevor sie dir gehören?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Vater, meine Kinder sind deine, bevor sie meine sind.<br />\nVergib mir alles, was ich ihnen vorgezogen habe.<br />\nBewahre mich davor, meine Autorität für mich selbst zu gebrauchen,<br />\nund lass mich sie halten wie Geschenke, die ich dir eines Tages zurückgebe. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Sieh dir deinen Kalender für die kommende Woche an. Streiche oder verschiebe eine Sache, damit du diese Zeit deinen Kindern geben kannst.\n<\/p>", "note": "Zum Familienrecht in Israel und bei seinen Nachbarn siehe Raymond Westbrook (Hg.), <em>A History of Ancient Near Eastern Law<\/em> (2003). Zum Kinderopfer und seiner Ablehnung in Israel siehe Jon D. Levenson, <em>The Death and Resurrection of the Beloved Son<\/em> (1993).", "readEn": "Jeremiah 7:30–31; Deuteronomy 24:16"}, {"id": "F13", "n": 13, "title": "Hiob: Beten für das, was du nicht in der Hand hast", "part": 2, "read": "Hiob 1,1–5", "ref": "Hiob 1,5", "html": "<blockquote>\n<p>„Früh am Morgen brachte er für jeden von ihnen ein Brandopfer dar, denn er dachte: ‚Vielleicht haben meine Kinder gesündigt und Gott in ihrem Herzen geflucht.‘ So tat Hiob immer wieder.“<\/p>\n<p><span class=\"ref\">Hiob 1,5<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">כָּל־הַיָּמִים<\/span> (<em>kol-hayyāmîm<\/em>) – wörtlich „alle Tage“, im Sinn von „beständig“, „immer“.<\/p>\n<\/div>\n<p>Hiobs Kinder waren erwachsen. Sie hatten eigene Häuser und feierten eigene Feste. Es war nicht mehr Hiobs Aufgabe, ihr Leben zu organisieren – und er versuchte es auch nicht.<\/p>\n<p>Was tat er stattdessen? Er betete. Früh am Morgen, nach jeder Runde von Festen, brachte er ein Opfer dar, für jedes Kind eines. Nicht weil er wusste, dass sie etwas Falsches getan hatten, sondern weil er es nicht wusste. „<em>Vielleicht<\/em> haben meine Kinder in ihrem Herzen gesündigt.“<\/p>\n<p>(Eine kleine Einzelheit: Der hebräische Text sagt eigentlich „Gott in ihrem Herzen <em>gesegnet<\/em>“. Der Schreiber brachte es nicht über sich, „Gott geflucht“ hinzuschreiben, also schrieb er das Gegenteil und vertraute darauf, dass der Leser verstand. So ernst war dieser Gedanke.)<\/p>\n<p>Zwei Dinge fallen an Hiobs Vatersein auf.<\/p>\n<p><strong>Er kannte die Grenzen dessen, was er in der Hand hatte.<\/strong> Er konnte seinen Kindern nicht ins Herz sehen. Er konnte ihnen nicht auf jedes Fest folgen. Er tat nicht so, als könnte er es.<\/p>\n<p><strong>Er tat, was er <em>tun konnte<\/em> – und er tat es treu.<\/strong> „So tat Hiob immer wieder.“ Es war kein Panikgebet, wenn etwas schiefging. Es war eine Gewohnheit, jedes Mal wiederholt, über Jahre.<\/p>\n<p>Jeder Vater kommt irgendwann an den Rand dessen, was er steuern kann. Aus Babys werden Teenager, die ihre Zimmertür schließen. Aus Teenagern werden Erwachsene, die ihre eigenen Entscheidungen treffen. Viele Väter reagieren an diesem Punkt, indem sie entweder fester zupacken oder aufgeben.<\/p>\n<p>Hiob zeigt einen dritten Weg: Lass los mit deinen Händen, und halte fest mit deinen Gebeten.<\/p>\n<p>Die Evangelien zeigen Väter, die dasselbe tun – und erhört werden. Jaïrus fällt Jesus zu Füßen: „Meine kleine Tochter liegt im Sterben. Komm doch und leg ihr die Hände auf, damit sie gesund wird und lebt“ (Markus 5,23). Ein anderer Vater, dessen Sohn die Jünger nicht helfen konnten, schreit: „Ich glaube; hilf meinem Unglauben!“ (Markus 9,24). Keiner von beiden konnte sein Kind retten. Beide brachten das Kind zu dem, der es konnte. Und Jesus setzt als selbstverständlich voraus, dass Väter ihren Kindern Gutes wollen: „Wenn nun ihr, die ihr böse seid, euren Kindern gute Gaben geben könnt, wie viel mehr wird euer Vater im Himmel denen Gutes geben, die ihn bitten!“ (Matthäus 7,11).<\/p>\n<p>Wir sollten ehrlich sein: Hiobs Geschichte endet nicht damit, dass seine Kinder bewahrt bleiben. Das Buch erzählt weiter von furchtbarem Verlust. Gebet ist kein Zauberschild. Aber es bleibt das Richtige – das eine, was ein Vater immer tun kann, egal wie alt seine Kinder sind und wie weit weg sie leben.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Welchen Teil vom Leben deiner Kinder hast du nicht mehr in der Hand? Wie reagierst du – mit Festhalten, Aufgeben oder Beten?<\/li>\n<li>Betest du für jedes deiner Kinder mit Namen? Wie oft?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, ich kann meinen Kindern nicht ins Herz sehen, aber du kannst es.<br />\nWohin ich ihnen nicht folgen kann, dahin geh du mit ihnen.<br />\nMach meine Gebete für sie zu einer Gewohnheit und nicht zu einer Panik –<br />\nalle Tage meines Lebens. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Stell dir eine tägliche Erinnerung, für jedes deiner Kinder mit Namen zu beten. Fang heute an.\n<\/p>", "note": "Im Hebräischen steht in Hiob 1,5 „Gott gesegnet“, eine Umschreibung der Schreiber für „Gott geflucht“; dasselbe Mittel findet sich in Hiob 1,11; 2,5.9 und 1. Könige 21,10.", "art": {"file": "images/f13.webp", "caption": "Hiob, der für Kinder betete, die er nicht in der Hand hatte", "title": "Hiob spricht mit seinen Freunden", "credit": "Gustave Doré, Bibelillustrationen (1866)", "source": "https://commons.wikimedia.org/wiki/File%3A119.Job_Speaks_with_His_Friends.jpg", "licence": "Public domain", "w": 900, "h": 1113}, "readEn": "Job 1:1–5"}, {"id": "F14", "n": 14, "title": "Manoach: Der Vater, der fragte, wie", "part": 2, "read": "Richter 13,1–14", "ref": "Richter 13,8", "html": "<blockquote>\n<p>„Da betete Manoach zum HERRN: ‚Ach, Herr, lass doch den Mann Gottes, den du gesandt hast, noch einmal zu uns kommen, damit er uns lehrt, was wir mit dem Knaben tun sollen, der geboren werden soll.‘“<\/p>\n<p><span class=\"ref\">Richter 13,8<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">יוֹרֵנוּ<\/span> (<em>yôrēnû<\/em>) – „er möge uns lehren“. Es kommt von derselben Wurzel wie <em>tôrâ<\/em>, „Weisung“ oder „Unterweisung“.<\/p>\n<\/div>\n<p>Manoach gehört nicht zu den Helden der Bibel. Die Geschichte ist sogar ein wenig komisch auf seine Kosten. Der Engel erscheint zuerst seiner Frau, und sie versteht sofort alles. Manoach stellt eine Frage nach der anderen, versteht nicht, worum es geht, und hat am Ende Todesangst, sie müssten nun sterben – während seine Frau ihm in aller Ruhe erklärt, warum sie das nicht werden.<\/p>\n<p>Und doch tut Manoach etwas, was kein anderer Vater in der Bibel tut. Noch bevor sein Sohn geboren ist, betet er: „Herr, lehre uns, was wir für diesen Jungen tun sollen.“ Und als der Engel wiederkommt, fragt er noch einmal: „Was soll die Ordnung für den Jungen sein, und was soll er tun?“ (13,12).<\/p>\n<p>Manoach geht davon aus, dass er nicht weiß, wie man dieses Kind großzieht. Also fragt er.<\/p>\n<p>Das ist seltener, als es klingt. Vielen Männern fällt es sehr schwer, beim Vatersein um Hilfe zu bitten. Wir fragen nach dem Weg in einer fremden Stadt oder holen Rat beim Autokauf, aber wir nehmen an, dass wir irgendwie schon wissen müssten, wie man ein Kind großzieht. Wir lesen nichts darüber, fragen keine älteren Väter, reden mit niemandem, wenn wir kämpfen – und geben vor Gott ganz sicher nicht zu, dass wir ratlos sind.<\/p>\n<p>Manoach ist eine komische Figur und eine demütige. Vielleicht gehört beides zusammen.<\/p>\n<p>Noch eine ehrliche Bemerkung. Manoachs Sohn war Simson – stark, begabt, wild und am Ende tragisch. Die richtige Frage zu stellen, garantierte keinen Sohn, der die richtigen Entscheidungen traf. Das kann ein Trost sein für Eltern, die ihr Bestes gegeben haben und trotzdem zusehen mussten, wie ein Kind auf Abwege geriet. Gutes Vatersein ist wichtig, aber es produziert kein gutes Ergebnis. Kinder treffen ihre eigenen Entscheidungen.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Wann hast du zuletzt jemanden um Hilfe oder Rat beim Vatersein gebeten?<\/li>\n<li>Welche Frage zu deinen Kindern würdest du Gott gerade gern stellen?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, ich weiß nicht immer, was ich für meine Kinder tun soll.<br />\nLehre mich.<br />\nGib mir die Demut zu fragen – dich und die Menschen, die du um mich herum gestellt hast. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Stell einem erfahrenen Vater oder einer erfahrenen Mutter eine echte Frage zur Kindererziehung – und hör dir die Antwort an.\n<\/p>", "note": "Manoachs Bitte um Unterweisung steht in Richter 13,8 und 13,12. Das Kapitel zeigt ihn als langsamer als seine Frau, und Simsons späteres Leben ist eine Warnung davor, anzunehmen, gutes Elternsein garantiere das Ergebnis. Zum Muster der kinderlosen Frau und des angekündigten Sohnes, von dem Richter 13 ein Beispiel ist, siehe Robert Alter, „How Convention Helps Us Read: The Case of the Bible’s Annunciation Type-Scene“, <em>Prooftexts<\/em> 3 (1983).", "readEn": "Judges 13:1–14"}, {"id": "F15", "n": 15, "title": "Die Rechabiter: Was bleibt", "part": 2, "read": "Jeremia 35,1–19", "ref": "Jeremia 35,6", "html": "<blockquote>\n<p>„Sie aber antworteten: ‚Wir trinken keinen Wein; denn unser Vater Jonadab, der Sohn Rechabs, hat uns geboten: Ihr sollt niemals Wein trinken, weder ihr noch eure Söhne.‘“<\/p>\n<p><span class=\"ref\">Jeremia 35,6<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">צִוָּה<\/span> (<em>ṣiwwâ<\/em>) – „er hat geboten“. Es ist dieselbe Wurzel wie <em>miṣwâ<\/em>, „Gebot“.<\/p>\n<\/div>\n<p>Das ist eine der seltsamsten Geschichten der Bibel und eine der am wenigsten bekannten.<\/p>\n<p>Gott sagt Jeremia, er solle eine Sippe namens Rechabiter in den Tempel holen und ihnen Wein anbieten. Sie lehnen ab. Warum? Weil ihr Vorfahr Jonadab ihnen vor langer Zeit gesagt hatte, keinen Wein zu trinken, keine Häuser zu bauen und in Zelten zu wohnen.<\/p>\n<p>Jonadab hatte mehr als zweihundert Jahre zuvor gelebt. Seine Nachkommen hatten ihn nie kennengelernt. Und sie hielten sich immer noch an seine Anweisungen.<\/p>\n<p>Dann wendet sich Gott an die Leute von Juda und sagt sinngemäß: „Seht euch diese Familie an. Ein menschlicher Vater hat ihnen Anweisungen gegeben, und sie haben über Generationen gehorcht. Ich habe immer wieder zu euch geredet, und ihr habt nicht gehört.“<\/p>\n<p>Uns wird hier nicht gesagt, dass alle auf Wein verzichten oder in Zelten leben sollten. Das verlangt die Bibel nicht von uns. Es geht um etwas anderes: <strong>Es ist möglich, dass die Unterweisung eines Vaters Bestand hat.<\/strong><\/p>\n<p>Manchmal haben wir das Gefühl, nichts von dem, was wir unseren Kindern sagen, bleibe hängen – die Kultur sei zu laut und unsere Stimme zu leise. Die Rechabiter sind ein stiller Einspruch gegen diese Angst. Die Worte eines Vaters, mit Überzeugung gegeben und beständig gelebt, können eine Familie über Generationen prägen.<\/p>\n<p>Was ließ Jonadabs Anweisungen so lange halten? Wir erfahren nicht alles. Aber zwei Dinge fallen auf. Sie waren klar. Und sie waren mit einer Art zu <em>leben<\/em> verbunden, nicht nur mit einer Reihe von Gedanken. Die Rechabiter glaubten nicht nur etwas; sie taten jeden Tag etwas anders.<\/p>\n<p>Was sollte in hundert Jahren in deiner Familie noch wahr sein? Nicht die Regeln über Wein und Zelte – aber Glaube, Ehrlichkeit, Großzügigkeit, Gastfreundschaft, die Gewohnheit des Gebets? Diese Dinge werden auf dieselbe Weise weitergegeben: klar, und indem man sie lebt.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Was hast du von deinem eigenen Vater oder Großvater bekommen, das in dir geblieben ist – Gutes oder Schlechtes?<\/li>\n<li>Was würdest du deinen Urenkeln am liebsten mitgegeben haben?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Gott der Generationen,<br />\nlass meine Worte und mein Leben etwas Gutes weitergeben, das mich überdauert.<br />\nLass die Kinder meiner Kinder dich kennen,<br />\nweil ich gelebt habe, was ich geglaubt habe. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Schreib einen Satz auf, der mit „In unserer Familie …“ beginnt und der über Generationen wahr sein soll. Erkläre ihn deinen Kindern.\n<\/p>", "note": "Jonadab, der Sohn Rechabs, erscheint in 2. Könige 10,15–23, im 9. Jahrhundert v. Chr.; Jeremias Begegnung mit seinen Nachkommen fand um das Ende des 7. Jahrhunderts v. Chr. statt.", "readEn": "Jeremiah 35:1–19"}, {"id": "F16", "n": 16, "title": "Josef: Der Vater, der handelte", "part": 2, "read": "Matthäus 1,18–25; 2,13–23", "ref": "Matthäus 1,19", "html": "<blockquote>\n<p>„Josef aber, ihr Mann, war gerecht und wollte sie nicht bloßstellen; darum beschloss er, sie heimlich zu entlassen.“<\/p>\n<p><span class=\"ref\">Matthäus 1,19<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> δίκαιος (<em>dikaios<\/em>) – griechisch „gerecht“. Es ist das neutestamentliche Gegenstück zum hebräischen <em>ṣaddîq<\/em>.<\/p>\n<\/div>\n<p>Josef sagt in der ganzen Bibel kein einziges überliefertes Wort. Das liegt nicht daran, dass er ein Mann weniger Worte gewesen wäre – die Evangelien richten ihre Aufmerksamkeit einfach auf das Kind. Aber was sie Josef <em>tun<\/em> lassen, macht ihn zu einem der besten Väter der Schrift.<\/p>\n<p>Sieh dir an, wie Matthäus ihn beschreibt. Josef erfährt, dass Maria, die Frau, mit der er verlobt ist, schwanger ist – und er weiß, dass das Kind nicht von ihm ist. Er ist „gerecht“. Und was tut seine Gerechtigkeit? Sie macht ihn <em>unwillig, sie bloßzustellen<\/em>. Noch bevor er die Wahrheit kennt, ist sein erster Impuls, ihre Würde zu schützen.<\/p>\n<p>Für viele Männer bedeutet „gerecht“, im Recht zu sein und dafür zu sorgen, dass alle es wissen. Für Josef bedeutete es, niemanden zu demütigen, selbst wenn er sich verletzt fühlte.<\/p>\n<p>Dann, nachdem Gott im Traum zu ihm gesprochen hat, tut Josef vier Dinge:<\/p>\n<ul>\n<li>Er nimmt Maria zur Frau.<\/li>\n<li>Er <strong>gibt dem Kind den Namen<\/strong> Jesus (1,25). In jener Kultur war die Namensgebung der Akt, mit dem ein Vater ein Kind als seines annahm. Durch Josef wurde Jesus rechtlich ein „Sohn Davids“.<\/li>\n<li>Er steht in der Nacht auf und bringt die Familie als Flüchtlinge nach Ägypten, um das Leben des Kindes zu retten (2,14).<\/li>\n<li>Später zieht er mit ihnen noch einmal um, nach Nazareth, um sie in Sicherheit zu bringen (2,22–23).<\/li>\n<\/ul>\n<p>Lukas ergänzt, dass Josef die Familie jedes Jahr zum Passafest nach Jerusalem mitnahm (Lukas 2,41) – der Vater, der seinen Haushalt zum Gottesdienst führt –, und dass er und Maria drei Tage lang voller Angst suchten, als der zwölfjährige Jesus verschwunden war (2,48).<\/p>\n<p>Hier ist ein Vater, der nicht der leibliche Vater war und dessen Worte die Evangelien nicht überliefern. Was sie überliefern: Er schützte, nahm an, zog um, betete an und suchte.<\/p>\n<p>Wenn du Stiefvater bist, Adoptivvater oder ein Mann, der ein Kind großzieht, das nicht „deins“ ist – dann ist Josef dein Schutzpatron. Vaterschaft hängt nicht am Blut. Sie hängt an dem, was du tust.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Wann hattest du Gelegenheit, jemanden bloßzustellen, der dir Unrecht getan hatte? Was hast du getan?<\/li>\n<li>Was würden deine Kinder sagen, was du für sie „tust“, auch wenn du nichts sagst?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, mach mich gerecht, wie Josef gerecht war:<br />\nlangsam im Bloßstellen, schnell im Schützen, bereit aufzubrechen, wenn du sprichst.<br />\nLass meine Kinder wissen, dass sie angenommen, beim Namen gerufen und sicher sind. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Achte auf einen Moment, in dem du jemanden dumm oder klein dastehen lassen könntest – und schütze stattdessen bewusst seine Würde.\n<\/p>", "note": "Die Evangelien überliefern keine Worte Josefs; ihre Aufmerksamkeit gilt dem Kind, und Josef ist an dem zu erkennen, was er tut. Zur Namensgebung als Anerkennung eines Sohnes durch den Vater und dazu, wie Jesus durch Josef rechtlich ein Sohn Davids wurde, siehe Raymond E. Brown, <em>The Birth of the Messiah<\/em> (erw. Neuausgabe 1993). Das spätere jüdische Recht fasste den Grundsatz so: „Wenn ein Mann sagt: ‚Das ist mein Sohn‘, so ist ihm zu glauben“ (Mischna, Baba Batra 8,6, zusammengestellt um 200 n. Chr.).", "readEn": "Matthew 1:18–25; 2:13–23"}, {"id": "F17", "n": 17, "title": "Eli und Samuel: Einem Jungen das Hören beibringen", "part": 2, "read": "1. Samuel 3,1–18", "ref": "1. Samuel 3,9", "html": "<blockquote>\n<p>„Und Eli sprach zu Samuel: ‚Geh hin und leg dich schlafen; und wenn er dich ruft, so sprich: Rede, HERR, denn dein Knecht hört.‘“<\/p>\n<p><span class=\"ref\">1. Samuel 3,9<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">הִנֵּנִי<\/span> (<em>hinnēnî<\/em>) – „Hier bin ich.“ Die Antwort von jemandem, der bereit ist zu hören und zu gehorchen. Abraham, Mose, Jesaja – und der Junge Samuel – sagen es alle.<\/p>\n<\/div>\n<p>Eli ist einer der traurigsten Väter der Bibel. Sein Versagen an seinen eigenen Söhnen sehen wir uns später an (Tag 22). Heute aber sehen wir eine andere Seite von ihm – und sie überrascht.<\/p>\n<p>Als Samuel ein kleiner Junge war, brachte seine Mutter Hanna ihn zum Heiligtum und „lieh ihn dem HERRN“. Samuel wuchs in Elis Obhut auf. Und Eli, der alte Priester, nennt den Jungen „mein Sohn“ (3,6.16).<\/p>\n<p>Eines Nachts ruft eine Stimme: „Samuel!“ Dreimal läuft der Junge zu Eli: „<em>Hier bin ich<\/em>, du hast mich gerufen.“ Dreimal sagt Eli: „Ich habe dich nicht gerufen.“ Und dann begreift der alte Mann, was da geschieht. Es ist Gott. Also gibt er dem Jungen die Worte, die er braucht: „Geh zurück, und wenn er dich noch einmal ruft, sag: ‚Rede, HERR, denn dein Knecht hört.‘“<\/p>\n<p>Eli bringt einem Kind bei, auf Gott zu hören. Das ist eines der kostbarsten Dinge, die ein Vater je tun kann.<\/p>\n<p>Dann wird die Geschichte schmerzlich. Gottes Botschaft an Samuel ist ein Gericht über Elis eigene Familie. Am Morgen hat der Junge Angst, es ihm zu sagen. Und Eli besteht darauf: „Verschweig mir nichts.“ Er hört das harte Wort – über sich selbst – und sagt: „Er ist der HERR; er tue, was ihm gefällt“ (1. Samuel 3,18).<\/p>\n<p>Und hier ist das Merkwürdige. Elis großes Versagen an seinen eigenen Söhnen bestand darin, dass er sie nicht mit harten Wahrheiten konfrontierte. Bei Samuel tut er das Gegenteil. Er verlangt die Wahrheit, auch gegen sich selbst. Und doch unternimmt er, nachdem er sie gehört hat, immer noch nichts gegen seine Söhne. „Er tue, was ihm gefällt“ kann man als Vertrauen hören – oder als eine weitere Art, die Zurechtweisung Gott zu überlassen, die Eli selbst hätte leisten müssen.<\/p>\n<p>Wir sollten Eli nicht zu viel zuschreiben. Die Bibel sagt, dass Samuel „bei dem HERRN aufwuchs“ (2,21) – es ist Gott, der ihn formt. Und wenn es heißt, Samuel „kannte den HERRN noch nicht“ (3,7), dann erklärt sie auch, warum: „Das Wort des HERRN war ihm noch nicht offenbart worden.“ Samuel stand kurz davor, ein Prophet zu werden.<\/p>\n<p>Aber in der einen Nacht, auf die es ankam, gab Eli dem Jungen genau das, was er brauchte: die Worte, um Gott zu antworten. Der alte Mann, der es nicht über sich brachte, seine eigenen Söhne zur Rede zu stellen, half dem Sohn eines anderen, Gottes Stimme zu hören. Das ist Warnung und Hoffnung zugleich. Eine Warnung: Den Kindern anderer zu helfen, entbindet uns nicht von unseren eigenen. Eine Hoffnung: Es ist nie zu spät, einem Kind – irgendeinem Kind – beizubringen zu sagen: „Rede, Herr, ich höre.“<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Wer hat <em>dir<\/em> beigebracht, auf Gott zu hören? Hast du dich dafür bedankt?<\/li>\n<li>Fällt es dir leichter, den Kindern anderer harte Wahrheiten zu sagen als deinen eigenen – oder umgekehrt?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Rede, Herr, denn dein Knecht hört.<br />\nLehre mich zu hören – und meine Kinder hören zu lehren.<br />\nGib mir Mut, harte Worte anzunehmen, auch über mich selbst. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Bring einem Kind das Gebet „Rede, Herr, ich höre“ bei. Betet es zusammen, und dann seid eine Minute lang still.\n<\/p>", "note": "Der Gegensatz zwischen Elis Söhnen und Samuel wird von Kommentatoren vielfach bemerkt: Walter Brueggemann, <em>First and Second Samuel<\/em> (1990); Robert Alter, <em>The David Story<\/em> (1999); Robert Polzin, <em>Samuel and the Deuteronomist<\/em> (1989). Man beachte, dass der Text Samuels Heranwachsen Gott zuschreibt („der Knabe Samuel wuchs auf bei dem HERRN“, 2,21) und sein „Noch-nicht-Kennen“ des HERRN damit erklärt, dass ihm das Wort des HERRN noch nicht offenbart war (3,7).", "readEn": "1 Samuel 3:1–18"}, {"id": "F18", "n": 18, "title": "Abram und Lot: Obdach ist noch keine Vaterschaft", "part": 2, "read": "1. Mose 11,27–12,5; 13,5–12; 14,12–16", "ref": "1. Mose 13,8", "html": "<blockquote>\n<p>„Da sprach Abram zu Lot: ‚Lass doch keinen Streit sein zwischen mir und dir und zwischen meinen Hirten und deinen Hirten – denn wir sind Brüder.‘“<\/p>\n<p><span class=\"ref\">1. Mose 13,8<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">בֶּן־אָחִיו<\/span> (<em>ben-ʾāḥîw<\/em>) – „der Sohn seines Bruders“. So beschreibt das 1. Buch Mose Lot immer wieder.<\/p>\n<\/div>\n<p>Lots Vater Haran starb noch vor seinem eigenen Vater, in Ur (1. Mose 11,28). Als sein Onkel Abram nach Kanaan aufbrach, nahm er den vaterlosen Lot mit.<\/p>\n<p>Sieh dir an, was Abram alles für Lot tat. Er gab ihm ein Zuhause und einen Platz in der Familie. Er teilte seinen Weg mit ihm. Als ihre Herden zu groß für das Land wurden, ließ Abram den Jüngeren zuerst wählen, welches Land er nehmen wollte (13,9). Als Plünderer Lot gefangen wegführten, sammelte Abram 318 Männer und befreite ihn in einem nächtlichen Überfall (14,14–16). Als Gott Sodom richtete, wo Lot wohnte, flehte Abram bei Gott um die Stadt – und die Bibel sagt, dass Gott „an Abraham dachte“ und Lot herausführte (19,29).<\/p>\n<p>Das ist eine große Menge Liebe und Treue.<\/p>\n<p>Und doch – das ist aufmerksamen Lesern aufgefallen – nennt die Bibel Lot kein einziges Mal Abrams „Sohn“. Er ist immer „der Sohn seines Bruders“ oder einfach „sein Bruder“ – im weiten biblischen Sinn von „Verwandter“. Abram selbst sagt: „Wir sind Brüder.“ Ein Forscher, Dan Rickett, hat das genau untersucht und ist zu dem Schluss gekommen, dass Abram Lot nie adoptiert und nie als seinen Erben behandelt hat.<\/p>\n<p>Warum ist das für uns wichtig? Nicht weil Lots Geschichte für sich allein etwas beweisen würde – das 1. Buch Mose zeigt selten <em>irgendeinen<\/em> Vater, der seine Kinder unterweist, und auch Abraham sehen wir nie Isaak unterweisen. Es ist wichtig wegen dessen, was Gott ein paar Kapitel später darüber sagt, warum er Abraham erwählt hat: „damit er seinen Kindern und seinem Haus nach ihm <em>gebiete<\/em>, Gerechtigkeit und Recht zu üben“ (18,19). Obdach, Wohlstand, Schutz und Rettung sind alles gute Gaben, und Abram gab Lot jede davon. Aber 1. Mose 18,19 nennt etwas Weiteres als Herzstück der Aufgabe eines Vaters.<\/p>\n<p>Die Bibel macht Lot nicht zum Bösewicht, und wir sollten es auch nicht tun. Aber neben 1. Mose 18,19 gestellt, wirft seine Geschichte eine Frage auf, die sich zu stellen lohnt: Ist es möglich, für ein Kind zu sorgen, ein Kind zu schützen, ein Kind sogar zu retten – und ihm trotzdem kein <em>Vater<\/em> zu sein?<\/p>\n<p>Viele Männer geben ihren Kindern ein Dach über dem Kopf, ein Einkommen und Sicherheit, aber sehr wenig von sich selbst: wenig Gespräch, wenig Unterweisung, wenig von dem, was sie glauben und warum. Diese Dinge sind gut und kostbar. Aber die Bibel deutet an, dass Vaterschaft mehr ist: eine Art zu leben weiterzugeben.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Was gibst du deinen Kindern, das vor allem „Obdach“ ist – und was gibst du ihnen von dir selbst?<\/li>\n<li>Gibt es einen jungen Menschen, für den du sorgst, mit dem du aber nie wirklich geredet hast?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, danke für alles, was ich meinen Kindern geben kann.<br />\nAber lass mich nicht beim Obdach stehen bleiben.<br />\nHilf mir, ihnen mich selbst zu geben – meine Zeit, meinen Glauben, meine Worte –,<br />\ndamit das, was ich glaube, in ihnen weiterlebt. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Führe ein echtes Gespräch mit einem Kind oder jungen Menschen – über etwas, das dir wichtig ist, und warum.\n<\/p>", "note": "Dass Abram Lot nie adoptiert oder als Erben behandelt, begründet Dan Rickett ausführlich in <em>Separating Abram and Lot<\/em> (Brill, 2019); siehe auch Larry Helyer, „The Separation of Abram and Lot“, <em>JSOT<\/em> 26 (1983). Rickett vertritt außerdem, dass Lot nicht als moralischer Bösewicht gegenüber einem gerechten Abram gelesen werden sollte; dieses Andachtsbuch versucht, das zu beachten. Der Gedanke, dass Lots Geschichte den Unterschied zwischen dem <em>Beherbergen<\/em> und dem <em>Unterweisen<\/em> eines Kindes veranschaulicht, im Blick auf 1. Mose 18,19, ist eine eigene Überlegung des Verfassers und wurde, soweit ich weiß, in der veröffentlichten Forschung bisher nicht vorgeschlagen. Das 1. Buch Mose zeigt Abraham auch nie, wie er Isaak unterweist; das Schweigen über Lot ist also für sich allein kein Beweis.", "art": {"file": "images/f18.webp", "caption": "Lot, bis zuletzt beherbergt – und nie unterwiesen", "title": "Lots Flucht", "credit": "Gustave Doré, Bibelillustrationen (1866)", "source": "https://commons.wikimedia.org/wiki/File%3AFlight_of_Lot.png", "licence": "Public domain", "w": 900, "h": 1137}, "readEn": "Genesis 11:27–12:5; 13:5–12; 14:12–16"}, {"id": "F19", "n": 19, "title": "Der Vater, der lief – zweimal", "part": 2, "read": "Lukas 15,11–32", "ref": "Lukas 15,20.28.31", "html": "<blockquote>\n<p>„Als er aber noch weit entfernt war, sah ihn sein Vater, und es jammerte ihn; er lief, fiel ihm um den Hals und küsste ihn … Da ging sein Vater hinaus und redete ihm zu … ‚Mein Kind‘, sagte der Vater, ‚du bist allezeit bei mir, und alles, was mein ist, ist dein.‘“<\/p>\n<p><span class=\"ref\">Lukas 15,20.28.31<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> ἐσπλαγχνίσθη (<em>esplanchnisthē<\/em>) – griechisch „es jammerte ihn“, wörtlich „er wurde in seinen Eingeweiden bewegt“. Es ist das griechische Echo des hebräischen <em>raḥēm<\/em> (Tag 3): Liebe, die man im Bauch spürt.<\/p>\n<\/div>\n<p>Wir nennen es das Gleichnis vom verlorenen Sohn. Aber wenn du genau hinsiehst, erkennst du: Eigentlich ist es eine Geschichte über einen Vater.<\/p>\n<p><strong>Er lässt seinen Sohn gehen.<\/strong> Der jüngere Sohn verlangt sein Erbe, während sein Vater noch lebt – er will jetzt, was normalerweise erst beim Tod des Vaters käme. Der Vater gibt es ihm. Er zwingt den Jungen nicht zu bleiben. Liebe, die zwingt, ist keine Liebe.<\/p>\n<p><strong>Er hält Ausschau.<\/strong> „Als er noch weit entfernt war, sah ihn sein Vater.“ Jemanden in weiter Ferne sieht man nur, wenn man nach ihm Ausschau gehalten hat.<\/p>\n<p><strong>Er läuft.<\/strong> Er läuft, fällt seinem Sohn um den Hals und küsst ihn, bevor der Junge seine eingeübte Rede beenden kann. Die ersten Zuhörer Jesu kannten diese Worte aus einer alten Familiengeschichte. Als Jakob nach zwanzig Jahren heimkehrte, voller Angst vor dem Bruder, den er betrogen hatte, „lief Esau ihm entgegen und umarmte ihn; er fiel ihm um den Hals und küsste ihn, und sie weinten“ (1. Mose 33,4). Der Vater im Gleichnis tut genau das, was Esau tat – die Geste einer zerbrochenen Familie, die wieder heil wird.<\/p>\n<p>Und dann der Teil, den wir oft vergessen.<\/p>\n<p><strong>Er geht auch zu dem anderen Sohn hinaus.<\/strong> Der ältere Bruder, der zu Hause geblieben ist und hart gearbeitet hat, ist wütend und weigert sich, zum Fest zu kommen. Der Vater verlässt seine eigene Feier und geht auch zu ihm hinaus. Er redet ihm zu. Und seine letzten überlieferten Worte gelten <em>diesem<\/em> Sohn – dem pflichtbewussten, verbitterten: „Kind, du bist allezeit bei mir, und alles, was mein ist, ist dein.“<\/p>\n<p>Zwei Söhne. Zwei sehr verschiedene Arten, verloren zu sein. Der eine lief weg. Der andere blieb zu Hause und wurde bitter. Und der Vater geht zu beiden hinaus.<\/p>\n<p>Vielen Vätern fällt es leicht, die eine Art Kind zu lieben, und schwer, die andere. Manche fühlen sich zu dem dramatischen, kämpfenden Kind hingezogen und nehmen das „einfache“ als selbstverständlich hin. Andere bewundern das verantwortungsvolle Kind und sind kühl zu dem, das vom Weg abkommt. Dieser Vater geht zweimal hinaus.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Zu welchem deiner Kinder fällt es dir leichter hinauszugehen? Zu welchem schwerer?<\/li>\n<li>Gibt es ein Kind – oder ein erwachsenes Kind – „in der Ferne“, nach dem du nicht mehr Ausschau hältst?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Vater, du bist mir entgegengelaufen, als ich noch weit weg war.<br />\nGib mir ein Herz, das nach denen Ausschau hält, die sich verirrt haben,<br />\nund das zu denen hinausgeht, die geblieben sind und doch leiden.<br />\nLass keines meiner Kinder sich vergessen fühlen. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Geh auf das Kind zu, das du gewöhnlich schwerer erreichst – oft das, das „nie Ärger macht“.\n<\/p>", "note": "Viele Predigten sagen, die Bitte um das Erbe habe bedeutet, dem Vater den Tod zu wünschen, und ein älterer Mann wäre nie gerannt. Beide Behauptungen stammen von Kenneth Bailey, <em>The Cross and the Prodigal<\/em> (2. Aufl. 2005); Amy-Jill Levine, <em>Short Stories by Jesus<\/em> (2014), zeigt, wie dünn die Belege dafür sind. Der Anklang an 1. Mose 33,4 liegt im Wortlaut von Lukas 15,20 selbst. Zu Ehre und Scham in der Welt des Gleichnisses allgemein siehe David deSilva, <em>Honor, Patronage, Kinship &amp; Purity<\/em> (2000).", "art": {"file": "images/f19.webp", "caption": "Der Sohn, der heimkehrte, zu einem Vater, der ihm entgegenlief", "title": "Der verlorene Sohn beschließt heimzukehren", "credit": "Gustave Doré, Bibelillustrationen (1866)", "source": "https://commons.wikimedia.org/wiki/File%3AGustave_Dore_-_The_prodigal_son_decides_to_return_to_his_father.jpg", "licence": "Public domain", "w": 602, "h": 479}, "readEn": "Luke 15:11–32"}, {"id": "F20", "n": 20, "title": "Paulus: Ein Vater mit Worten", "part": 2, "read": "1. Thessalonicher 2,7–12; 1. Korinther 4,14–15", "ref": "1. Thessalonicher 2,11–12", "html": "<blockquote>\n<p>„Ihr wisst ja, dass wir jeden Einzelnen von euch wie ein Vater seine Kinder ermutigt, getröstet und beschworen haben, ein Leben zu führen, das Gottes würdig ist.“<\/p>\n<p><span class=\"ref\">1. Thessalonicher 2,11–12<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> παρακαλοῦντες (<em>parakalountes<\/em>) – griechisch „ermutigend“. Es kommt von einem Verb, das „herbeirufen, an die Seite rufen“ bedeutet: zu jemandem hingehen und ihm zusprechen.<\/p>\n<\/div>\n<p>Paulus hatte keine eigenen Kinder. Aber er beschrieb sich oft als Vater der Gemeinden, die er gegründet hatte – und die Art, wie er das beschreibt, ist aufschlussreich.<\/p>\n<p>Im heutigen Vers gebraucht er drei Wörter für das, was ein Vater tut:<\/p>\n<ul>\n<li><strong>Ermutigen<\/strong> – an die Seite treten und jemandem Mut zusprechen.<\/li>\n<li><strong>Trösten<\/strong> – jemanden aufrichten, wenn er leidet.<\/li>\n<li><strong>Beschwören<\/strong> – ihn eindringlich auffordern, gut zu leben.<\/li>\n<\/ul>\n<p>Achte auf das Gleichgewicht. Zwei der drei Wörter sind sanft. Eines ist fest. Die väterlichen Worte des Paulus sind überwiegend Ermutigung und Trost, mit einem klaren Ruf, recht zu leben.<\/p>\n<p>An anderer Stelle schreibt er: „Nicht um euch zu beschämen, schreibe ich das, sondern um euch als meine geliebten Kinder zurechtzuweisen“ (1. Korinther 4,14). Ein Vater weist zurecht – aber nicht durch Beschämung. Und: „Nicht die Kinder sollen für die Eltern sparen, sondern die Eltern für die Kinder“ (2. Korinther 12,14). Die Fürsorge fließt nach unten.<\/p>\n<p>Am auffälligsten ist: Nur wenige Verse vor der heutigen Stelle vergleicht Paulus sich auch mit einer <em>Mutter<\/em>: „Wir waren sanft unter euch, wie eine stillende Mutter, die ihre eigenen Kinder pflegt“ (1. Thessalonicher 2,7). Er sieht keinen Widerspruch zwischen väterlicher Stärke und mütterlicher Zärtlichkeit.<\/p>\n<p>Viele Väter lieben ihre Kinder tief, <em>sagen<\/em> es aber selten. Wir zeigen Liebe, indem wir hart arbeiten, Dinge reparieren, versorgen. Das ist wichtig. Aber Kinder brauchen auch Worte – ausgesprochen, konkret und wiederholt. „Ich bin stolz auf dich.“ „Das hast du gut gemacht.“ „Es tut mir leid, dass es dir so schlecht geht.“ „Ich glaube, dass Gott etwas Gutes mit dir vorhat.“<\/p>\n<p>Denk an die Taufe Jesu. Bevor er eine einzige Predigt gehalten oder ein einziges Wunder getan hatte, sagte eine Stimme vom Himmel: „Du bist mein geliebter Sohn; an dir habe ich Wohlgefallen“ (Markus 1,11). Der Segen des Vaters kam <em>vor<\/em> den Leistungen, nicht als Belohnung dafür.<\/p>\n<p>Unsere Kinder brauchen das auch.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Wann hast du zuletzt jedem deiner Kinder „Ich bin stolz auf dich“ oder „Ich hab dich lieb“ gesagt – in Worten?<\/li>\n<li>Sind deine Worte an deine Kinder überwiegend Ermutigung oder überwiegend Korrektur?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Vater, du hast deinen Segen über deinen Sohn gesprochen, bevor er irgendetwas getan hatte.<br />\nLeg mir Worte des Segens in den Mund.<br />\nHilf mir, meine Kinder zu ermutigen, zu trösten und zu ermahnen –<br />\nund sie niemals zu beschämen. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Schreib jedem deiner Kinder eine kurze Notiz: eine Sache, die du an ihm bewunderst, einen Trost und eine Hoffnung, die du für es hast.\n<\/p>", "note": "Paulus nennt sich derselben Gemeinde gegenüber auch eine stillende Mutter (1. Thessalonicher 2,7) und formuliert die Richtung der Fürsorge als Grundsatz: „Nicht die Kinder sollen für die Eltern sparen, sondern die Eltern für die Kinder“ (2. Korinther 12,14). Wie Juden in den letzten Jahrhunderten v. Chr. die Vater-Texte hörten, zeigen Tobit 4, die Abschiedsunterweisung eines Vaters an seinen Sohn, und Jesus Sirach 30,1–13, der erheblich härter ist als die Sprüche.", "readEn": "1 Thessalonians 2:7–12; 1 Corinthians 4:14–15"}, {"id": "F21", "n": 21, "title": "Ein Gewand, das eine Familie zerbrach", "part": 3, "read": "1. Mose 25,27–28; 37,1–4.31–35", "ref": "1. Mose 37,3–4", "html": "<blockquote>\n<p>„Israel aber liebte Josef mehr als alle seine anderen Söhne, weil er ihm im Alter geboren war; und er ließ ihm ein langes Gewand mit Ärmeln machen. Als nun seine Brüder sahen, dass ihr Vater ihn mehr liebte als sie alle, hassten sie ihn und konnten kein freundliches Wort mehr mit ihm reden.“<\/p>\n<p><span class=\"ref\">1. Mose 37,3–4<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">כְּתֹנֶת פַּסִּים<\/span> (<em>kĕtōnet passîm<\/em>) – „ein langes Gewand mit Ärmeln“, traditionell übersetzt als „bunter Rock“. Die einzige andere Person in der Bibel, die so ein Gewand trägt, ist eine Königstochter (2. Samuel 13,18).<\/p>\n<\/div>\n<p>Die Bevorzugung eines Kindes zieht sich durch die Familie Abrahams wie ein Riss durch eine Mauer.<\/p>\n<p>Sie beginnt bei Isaak. „Isaak hatte Esau lieb, weil er gern von seinem Wildbret aß; Rebekka aber hatte Jakob lieb“ (25,28). Sieh dir den Grund an, den die Bibel für Isaaks Liebe nennt: seinen eigenen Appetit. Er liebte den Sohn, der ihm gab, was er genoss. Die Folge war eine gespaltene Familie, ein erschlichener Segen und ein Jakob, der um sein Leben floh.<\/p>\n<p>Man könnte meinen, Jakob, der so sehr unter der Bevorzugung durch seine Eltern gelitten hatte, wäre fest entschlossen gewesen, sie nie zu wiederholen. Stattdessen tut er genau dasselbe. Er liebt Josef mehr als seine anderen Söhne – und er sorgt dafür, dass es jeder sehen kann. Er schenkt Josef ein besonderes Gewand.<\/p>\n<p>Die Bibel zeichnet nach, was dann geschieht, Schritt für Schritt:<\/p>\n<ul>\n<li>Der Vater zeigt seine Vorliebe.<\/li>\n<li>Die Brüder <em>sehen<\/em> es.<\/li>\n<li>Sie hassen Josef.<\/li>\n<li>Sie können nicht einmal mehr friedlich mit ihm reden.<\/li>\n<\/ul>\n<p>Als der Moment kommt, reißen die Brüder ihm als Erstes das Gewand vom Leib (37,23). Dann verkaufen sie ihn als Sklaven. Jakob lebt mehr als zwanzig Jahre in dem Glauben, sein Lieblingssohn sei tot.<\/p>\n<p>Ein Gewand zerbrach eine Familie.<\/p>\n<p>Später verbot das Gesetz des Mose den Vätern, beim Erbe einen Sohn vor dem anderen zu bevorzugen (5. Mose 21,15–17). Es ist, als hätte Gott auf die Geschichte von Abrahams Familie geschaut und gesagt: „Nie wieder.“<\/p>\n<p>Jedes Kind anders zu lieben, ist natürlich und richtig – Kinder sind verschieden, und wir finden auf verschiedene Weise zu ihnen. Aber wenn unsere Kinder <em>sehen<\/em> können, dass eines von ihnen vorgezogen wird, wird etwas Tiefes beschädigt: in denen, die sich weniger geliebt fühlen, und auch im Liebling selbst. Beachte, dass der Schaden in Josefs Familie durch das entstand, was die Brüder <em>sahen<\/em>. Eine Gerechtigkeit, die Kinder nicht sehen können, hilft ihnen nicht.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Wenn jemand jedes deiner Kinder fragte: „Wer ist Papas Liebling?“ – was würden sie sagen?<\/li>\n<li>Bist du in einer Familie aufgewachsen, in der ein Kind bevorzugt wurde? Hast du etwas davon in dein eigenes Zuhause mitgenommen?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Vater, du liebst jedes deiner Kinder ganz.<br />\nVergib mir, wo ich eines bevorzugt habe, auch ohne es zu wollen.<br />\nLass jedes meiner Kinder ohne jeden Zweifel wissen, dass es ganz geliebt ist. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Verbring Zeit allein mit dem Kind, das am wenigsten von deiner Aufmerksamkeit bekommt.\n<\/p>", "note": "Die genaue Bedeutung von <em>kĕtōnet passîm<\/em> ist unsicher. „Langes Gewand mit Ärmeln“ ist der wahrscheinlichste Sinn; der „bunte Rock“ stammt aus den alten griechischen und lateinischen Übersetzungen. Das einzige andere <em>kĕtōnet passîm<\/em> der Bibel ist das Tamars, „denn solche Gewänder trugen die Töchter des Königs, solange sie Jungfrauen waren“ (2. Samuel 13,18).", "art": {"file": "images/f21.webp", "caption": "Josef und seine Brüder, Jahre nach dem Gewand", "title": "Josef gibt sich seinen Brüdern zu erkennen", "credit": "Gustave Doré, Bibelillustrationen (1866)", "source": "https://commons.wikimedia.org/wiki/File%3ADore_Bible_Joseph_Makes_Himself_Known_to_His_Brethren.jpg", "licence": "Public domain", "w": 900, "h": 1217}, "readEn": "Genesis 25:27–28; 37:1–4, 31–35"}, {"id": "F22", "n": 22, "title": "Der Vater, der nicht einschritt", "part": 3, "read": "1. Samuel 2,12–17.22–29; 3,11–14", "ref": "1. Samuel 3,13", "html": "<blockquote>\n<p>„Ich habe ihm angekündigt, dass ich sein Haus für immer richten werde um der Schuld willen, von der er wusste – seine Söhne luden einen Fluch auf sich, und er hat ihnen nicht gewehrt.“<\/p>\n<p><span class=\"ref\">1. Samuel 3,13<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">כִהָה<\/span> (<em>kihâ<\/em>) – „wehren, zurechtweisen, zurückhalten“. Ein seltenes Wort. „Er hat ihnen nicht gewehrt“ ist die ganze Anklage gegen Eli.<\/p>\n<\/div>\n<p>Elis Söhne, Hofni und Pinhas, waren Priester. Und sie waren verdorben. Sie nahmen sich mit Gewalt das beste Fleisch von den Opfern. Sie schliefen mit den Frauen, die am Eingang des Heiligtums Dienst taten. Sie behandelten den Gottesdienst als Mittel, ihre eigenen Gelüste zu stillen.<\/p>\n<p>Eli wusste es. Die Bibel lässt daran keinen Zweifel. Als Gott das Urteil spricht, lautet die Anklage: „die Schuld, <em>von der er wusste<\/em>“.<\/p>\n<p>Was tat Eli? Er sprach sie einmal darauf an. „Warum tut ihr solche Dinge? Ich höre von allen Leuten von euren bösen Taten. Nicht doch, meine Söhne – das ist kein gutes Gerücht, das ich höre“ (2,23–24). Und dann – nichts. Keine Folgen. Keine Enthebung vom Dienst. Das Leben ging weiter wie zuvor.<\/p>\n<p>Eine frühere Botschaft Gottes hatte es noch schärfer gesagt: „Warum ehrst du deine Söhne mehr als mich?“ (2,29). Im Hebräischen heißt „ehren“, jemandem <em>Gewicht<\/em> zu geben. Eli gab der Bequemlichkeit seiner Söhne – und vielleicht seiner eigenen Ruhe – mehr Gewicht als Gott und mehr als den Menschen, denen seine Söhne schadeten.<\/p>\n<p>Gewöhnlich stellen wir uns vor, die große Gefahr für Väter sei zu große Härte. Die Bibel kennt diese Gefahr gut: Sie erzählt von Vätern, die gewalttätig waren, sogar mörderisch gegen ihre Kinder (über Härte denken wir an Tag 27 und 28 nach). Aber sie erzählt auch, immer wieder, von einem Versagen, das man viel leichter übersieht: <em>Passivität<\/em>. Väter, die es wussten und nicht handelten. Väter, die zornig waren und nichts sagten. Väter, die ihre Söhne zu sehr liebten, um ihnen „Nein“ zu sagen.<\/p>\n<p>Elis Freundlichkeit war überhaupt keine Freundlichkeit. Sie ließ seinen Söhnen freie Hand, anderen zu schaden – und am Ende sich selbst.<\/p>\n<p>Denk auch daran, dass Eli nicht nur Vater war. Er war der oberste Priester, und seine Söhne waren Priester, die den Menschen schadeten, die zum Gottesdienst kamen. Sein Versagen war das Versagen einer Leitungsperson, die die eigene Familie nicht zur Rechenschaft zog – und dieses Versagen gibt es bis heute, in Familien, Gemeinden und Institutionen, die die Ihren schützen.<\/p>\n<p>Das ist kein Aufruf, streng oder kalt zu werden. Es ist ein Aufruf, <em>da<\/em> und <em>bereit<\/em> zu sein: bereit zu dem schwierigen Gespräch, bereit, eine Grenze zu setzen, bereit zu sagen: „Damit ist jetzt Schluss“ – besonders dann, wenn anderen geschadet wird.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Gibt es etwas in deiner Familie, von dem du weißt, das du aber nicht angesprochen hast? Warum nicht?<\/li>\n<li>Ist deine „Geduld“ manchmal in Wahrheit Ausweichen?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, vergib mir die Male, in denen ich es wusste und nichts getan habe.<br />\nGib mir Mut, „Nein“ zu sagen, wenn es darauf ankommt,<br />\nund eine Liebe, die stark genug ist, zu wehren und zu trösten. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Benenne ein Thema, dem du bei einem Kind ausgewichen bist. Entscheide, wann und wie du es ansprichst – ruhig, aber klar.\n<\/p>", "note": "In 1. Samuel 3,13 liest der überlieferte hebräische Text „sie luden einen Fluch auf sich“. Die alte griechische Übersetzung liest „sie verfluchten Gott“; viele Forscher halten das für den ursprünglichen Wortlaut, den Schreiber aus Ehrfurcht geändert haben.", "readEn": "1 Samuel 2:12–17, 22–29; 3:11–14"}, {"id": "F23", "n": 23, "title": "Die Frage, die David nie stellte", "part": 3, "read": "1. Könige 1,5–10", "ref": "1. Könige 1,6", "html": "<blockquote>\n<p>„Und sein Vater hatte ihn sein Leben lang nie betrübt und gefragt: ‚Warum tust du so etwas?‘“<\/p>\n<p><span class=\"ref\">1. Könige 1,6<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">עֲצָבוֹ<\/span> (<em>ʿăṣābô<\/em>) – „er betrübte ihn“, „er kränkte ihn“. Das Verb bedeutet, Kummer oder Unbehagen zu verursachen.<\/p>\n<\/div>\n<p>Dieser Vers könnte über Davids ganzem Leben als Vater stehen.<\/p>\n<p>Adonija war einer von Davids Söhnen – gut aussehend, ehrgeizig und nach seinem Bruder Absalom der Nächste in der Reihe. Als David alt wurde, rief Adonija sich selbst zum König aus, ohne jemanden zu fragen. Und die Bibel gibt eine einzeilige Erklärung: <em>Sein Vater hatte ihn nie betrübt und gefragt: „Warum tust du so etwas?“<\/em><\/p>\n<p>Lies diesen Satz genau. Die Bibel stellt als <em>Versagen<\/em> dar, was viele Väter heute für einen Erfolg halten würden: „Ich habe mein Kind nie verärgert.“<\/p>\n<p>David hat Adonija nie Unbehagen bereitet. Er hat die unbequeme Frage nie gestellt. Also wuchs Adonija in dem Glauben auf, er könne sich nehmen, was er wollte.<\/p>\n<p>Achte darauf, was David versäumte. Es war nicht, ihn zu schlagen, ihn anzuschreien oder ihn zu bestrafen. Es war schlicht, eine Frage zu stellen: „Warum hast du das getan?“<\/p>\n<p>Eine solche Frage bewirkt etwas Wichtiges. Sie behandelt ein Kind als jemanden, der für sein Handeln verantwortlich ist. Sie lädt es zum Nachdenken ein. Sie sagt: „Was du tust, ist wichtig, und du bist mir wichtig genug, dass ich hinsehe.“<\/p>\n<p>Natürlich kann eine solche Frage ein wenig wehtun. Ein Kind fühlt sich vielleicht einen Moment lang verlegen, ertappt oder beschämt. Aber das ist die gute Art von Schmerz – die Art, die einem Menschen hilft zu wachsen. Ein Vater, der seinen Kindern nie irgendein Unbehagen zumutet, schützt sie nicht. Er lässt sie unvorbereitet in eine Welt gehen, die nicht so sanft mit ihnen umgehen wird.<\/p>\n<p>Das Ziel ist nicht, Schmerz zu verursachen. Das Ziel ist eine Liebe, die bereit ist, dem Kind zuliebe <em>etwas<\/em> Schmerz zuzumuten – so wie ein Arzt eine Wunde reinigt.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Hast du Angst, deine Kinder zu verärgern? Woher kommt diese Angst?<\/li>\n<li>Gibt es ein Verhalten bei einem deiner Kinder, das dir aufgefallen ist, nach dem du aber nie gefragt hast?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, gib mir den Mut, die schwierige Frage zu stellen,<br />\nund die Sanftheit, sie gut zu stellen.<br />\nLass meine Liebe stark genug sein, ein wenig Schmerz zuzumuten,<br />\nwenn dieser Schmerz meinem Kind hilft zu wachsen. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Stell eine ruhige, neugierige „Warum?“-Frage zu etwas, das dein Kind getan hat – und hör zu, bevor du antwortest.\n<\/p>", "note": "Das Verb in 1. Könige 1,6 bedeutet „Schmerz oder Kummer bereiten“: David hat seinem Sohn nie auch nur Unbehagen bereitet, indem er fragte: „Warum tust du so etwas?“ Derselbe Vers vermerkt, dass Adonija nach Absalom geboren war, und lädt damit zum Vergleich ein. Die Notiz erklärt einen Umsturzversuch (1,5): Davids Versagen ist zuerst das Versagen eines Königs, der die eigene Familie nicht zur Rechenschaft zieht.", "readEn": "1 Kings 1:5–10"}, {"id": "F24", "n": 24, "title": "Zornig – und sonst nichts", "part": 3, "read": "2. Samuel 13,1–22", "ref": "2. Samuel 13,20–21", "html": "<p class=\"warning\">\nDieser Abschnitt handelt von sexueller Gewalt innerhalb einer Familie. Bitte lies ihn mit Bedacht.\n<\/p>\n<blockquote>\n<p>„So blieb Tamar einsam und verstört im Haus ihres Bruders Absalom. Als König David das alles hörte, wurde er sehr zornig.“<\/p>\n<p><span class=\"ref\">2. Samuel 13,20–21<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">שֹׁמֵמָה<\/span> (<em>šōmēmâ<\/em>) – „verwüstet“, „einsam und verstört“. Es ist ein Wort für Land, das verheert wurde, eine Ruine, auf der nichts mehr wächst.<\/p>\n<\/div>\n<p>Das ist eines der dunkelsten Kapitel der Bibel. Davids Sohn Amnon vergewaltigt seine Halbschwester Tamar und wirft sie dann aus seinem Haus. Tamar zerreißt ihr königliches Gewand, streut sich Asche aufs Haupt und geht weinend davon. Ihr leiblicher Bruder Absalom nimmt sie bei sich auf.<\/p>\n<p>Und David? „Als König David das alles hörte, wurde er sehr zornig.“<\/p>\n<p>Das ist alles. Zorn – und sonst nichts.<\/p>\n<p>Einige sehr alte Fassungen dieser Geschichte, in der alten griechischen Übersetzung und in einer Schriftrolle, die am Toten Meer gefunden wurde, fügen einen Satz hinzu, der vielleicht einmal zum ursprünglichen Text gehörte: „<em>Aber er wollte seinem Sohn Amnon keinen Kummer bereiten, denn er liebte ihn, weil er sein Erstgeborener war.<\/em>“<\/p>\n<p>Ob diese Worte ursprünglich waren oder nicht – sie beschreiben genau, was geschah. David tat nichts für Tamar. Keine Gerechtigkeit. Kein Schutz. Kein tröstendes Wort, von dem wir wüssten. Tamar lebte weiter im Haus ihres Bruders, „verstört“ – ein zerstörtes Leben. Zwei Jahre später nahm Absalom selbst Rache und ermordete Amnon, und die Familie zerfiel.<\/p>\n<p>Wenn ein Vater über ein Unrecht zornig ist, aber nichts tut, hat er in Wahrheit Partei ergriffen. Er hat sich auf die Seite des Stärkeren gegen den Schwächeren gestellt.<\/p>\n<p>Das ist heute bitter wichtig. Missbrauch geschieht in Familien und in Gemeinden. Allzu oft sind diejenigen, die Macht haben – Väter, Pastoren, Leitende –, zornig und betroffen und schweigen dann, um den Ruf der Familie zu schützen, oder den der Gemeinde, oder ihren eigenen. Das Opfer bleibt verstört zurück.<\/p>\n<p>Wenn du Vater bist, ist die Lehre klar: Wenn jemandem in deiner Obhut Schaden zugefügt wird, reicht Zorn nicht. Schütze den, der verletzt wurde. Glaube ihm. Hol Hilfe. Schalte die zuständigen Stellen ein. Vertusche es nie.<\/p>\n<p>Und wenn du eine Tamar bist – wenn dir Schaden zugefügt wurde und die, die dich hätten schützen sollen, nichts getan haben –, dann hör bitte dies: Gott hat es gesehen. Die Bibel hat deine Geschichte nicht versteckt und nicht wegerklärt. Sie hat sie aufgeschrieben und deine Verwüstung beim Namen genannt. Dein Schmerz sollte nie zum Schweigen gebracht werden.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Warst du schon einmal zornig über ein Unrecht und hast doch nichts getan? Was hat dich zurückgehalten?<\/li>\n<li>Würden sich die Kinder und jungen Menschen in deinem Leben sicher fühlen, es dir zu sagen, wenn jemand ihnen wehgetan hat?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Gott, der sieht, du hast Tamar gesehen, als ihr Vater wegsah.<br />\nGib mir den Mut, nicht wegzusehen.<br />\nMach mich zu jemandem, zu dem die Verletzlichen laufen können,<br />\nund niemals zu jemandem, der die Mächtigen schützt. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Sag deinen Kindern in Worten, die sie verstehen, dass sie immer zu dir kommen können, wenn jemand ihnen wehtut – und dass du ihnen glauben und handeln wirst.\n<\/p>", "note": "Der zusätzliche Satz, dass David Amnon nicht bestrafte, findet sich in der Septuaginta (der alten griechischen Übersetzung) und in einer hebräischen Samuel-Handschrift aus Qumran (4QSamᵃ). Viele Textforscher halten ihn für einen Teil des ursprünglichen Textes. Zu den biblischen Geschichten verletzter Töchter siehe Phyllis Trible, <em>Texts of Terror<\/em> (1984; deutsch: <em>Mein Gott, warum hast du mich vergessen!<\/em>, 1987).", "readEn": "2 Samuel 13:1–22"}, {"id": "F25", "n": 25, "title": "Zwei Jahre Schweigen", "part": 3, "read": "2. Samuel 14,21–33; 18,31–19,1", "ref": "2. Samuel 19,1", "html": "<blockquote>\n<p>„Da erbebte der König, ging hinauf in das Obergemach über dem Tor und weinte. Und im Gehen sprach er: ‚Mein Sohn Absalom! Mein Sohn, mein Sohn Absalom! Wäre ich doch an deiner Stelle gestorben – o Absalom, mein Sohn, mein Sohn!‘“<\/p>\n<p><span class=\"ref\">2. Samuel 19,1<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">בְּנִי אַבְשָׁלוֹם<\/span> (<em>bĕnî ʾabšālôm<\/em>) – „mein Sohn Absalom“. In diesem einen Vers sagt David fünfmal „mein Sohn“ und dreimal den Namen seines Sohnes.<\/p>\n<\/div>\n<p>Nachdem Absalom Amnon getötet hatte, floh er für drei Jahre ins Exil. Schließlich erlaubte David ihm, nach Jerusalem zurückzukehren. Aber er gab einen merkwürdigen Befehl: „Er soll in sein eigenes Haus gehen; mein Angesicht soll er nicht sehen“ (14,24).<\/p>\n<p>So lebte Absalom zwei volle Jahre in derselben Stadt wie sein Vater, und sein Vater weigerte sich, ihn zu sehen (14,28).<\/p>\n<p>Als sie sich endlich begegneten, berichtet die Bibel von einem Kuss – und nicht von einem einzigen Wort (14,33).<\/p>\n<p>Bald danach begann Absalom, das Volk gegen seinen Vater aufzubringen. Es endete in einem Bürgerkrieg und in Absaloms Tod. Als die Nachricht kam, brach David zusammen: „Mein Sohn Absalom, mein Sohn, mein Sohn!“<\/p>\n<p>Es ist der herzzerreißendste Schrei eines Vaters in der ganzen Bibel: „Wäre ich doch an deiner Stelle gestorben.“ Es gibt keinen Zweifel, dass David Absalom liebte. Aber sieh dir die Reihenfolge an. Die Liebe war echt – und sie kam zu spät. Die Tränen kamen nach der Beerdigung. Die Worte kamen, als der Sohn sie nicht mehr hören konnte.<\/p>\n<p>Zwei Jahre Schweigen haben den Zorn nicht beendet. Sie haben ihn verhärten lassen.<\/p>\n<p>Viele Familien haben eine Beziehung, die langsam erkaltet: ein Vater und ein erwachsener Sohn, die nicht mehr miteinander reden, eine Tochter, die seit Jahren nicht mehr zu Hause war, ein Streit, den nie jemand beigelegt hat. Jede Seite wartet darauf, dass die andere den ersten Schritt tut. Das Schweigen wird normal. Und dann, eines Tages, ist es zu spät.<\/p>\n<p>Gott hat nicht darauf gewartet, dass wir zu ihm kommen. Er ist zuerst zu uns gekommen. Ein Vater kann dasselbe tun – nicht indem er so tut, als wäre nichts geschehen, sondern indem er als Erster spricht, als Erster um Entschuldigung bittet, als Erster sagt: „Ich möchte, dass wir reden.“<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Gibt es in deiner Familie eine Beziehung, in der das Schweigen normal geworden ist?<\/li>\n<li>Was würde es dich kosten, den ersten Schritt zu tun? Was könnte es kosten, wenn du es nicht tust?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, du bist zu mir gekommen, bevor ich zu dir kam.<br />\nLass mich nicht warten, bis es zu spät ist.<br />\nGib mir Mut, das Schweigen zu brechen,<br />\nund die Worte zu sagen, solange sie noch gehört werden können. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Wenn eine Beziehung in deiner Familie abgekühlt ist, tu einen kleinen ersten Schritt: eine Nachricht, einen Anruf, ein einfaches „Ich habe an dich gedacht“.\n<\/p>", "note": "Dass Absaloms Aufstand aus diesen zwei Jahren der Entfremdung erwächst, ist die Lesart von Walter Brueggemann, <em>First and Second Samuel<\/em> (1990), und Robert Alter, <em>The David Story<\/em> (1999); Alter (S. 308) bemerkt auch, wie Davids Schrei in 19,1 den Namen und „mein Sohn“ immer wieder hämmert. In englischen Bibeln ist dieser Vers 18,33.", "art": {"file": "images/f25.webp", "caption": "Absalom – und die Trauer eines Vaters, die zu spät kam", "title": "Absaloms Tod", "credit": "Gustave Doré, Bibelillustrationen (1866)", "source": "https://commons.wikimedia.org/wiki/File%3A080.The_Death_of_Absalom.jpg", "licence": "Public domain", "w": 900, "h": 1126}, "readEn": "2 Samuel 14:21–33; 18:31–33"}, {"id": "F26", "n": 26, "title": "Wenn die Söhne eines guten Mannes auf Abwege geraten", "part": 3, "read": "1. Samuel 8,1–5; Hesekiel 18,1–4.20", "ref": "1. Samuel 8,3", "html": "<blockquote>\n<p>„Aber seine Söhne gingen nicht auf seinen Wegen, sondern suchten ihren Vorteil, nahmen Bestechung an und beugten das Recht.“<\/p>\n<p><span class=\"ref\">1. Samuel 8,3<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">בִּדְרָכָיו<\/span> (<em>bidrākāyw<\/em>) – „auf seinen Wegen“. Im Hebräischen bedeutet „Weg“ (<em>derek<\/em>) eine Straße und zugleich eine Art zu leben.<\/p>\n<\/div>\n<p>Samuel ist eine der größten Gestalten des Alten Testaments. Er wuchs in Elis Haus auf. Er sah aus nächster Nähe, was geschah, als ein Vater seinen Söhnen nicht wehrte. Als Junge überbrachte er Eli sogar Gottes Gerichtsbotschaft.<\/p>\n<p>Und dann, als Samuel alt war, setzte er seine eigenen Söhne als Richter über Israel ein – und sie nahmen Bestechung an und beugten das Recht. Es war so schlimm, dass das Volk stattdessen einen König verlangte.<\/p>\n<p>Die Bibel bietet keine Erklärung, keine Entschuldigung. Ein Mann kann das Unglück eines anderen Vaters aus der ersten Reihe miterleben, dagegen sprechen – und trotzdem erleben, dass in seiner eigenen Familie etwas Ähnliches geschieht.<\/p>\n<p>Das ist ernüchternd. Aber achte auch darauf, wie die Bibel es beschreibt: „Seine Söhne gingen nicht auf <em>seinen<\/em> Wegen.“ Dieser Satz sagt etwas über die Söhne. Sie wählten eine andere Straße.<\/p>\n<p>Die Bibel hält zwei Wahrheiten zusammen, und wir brauchen beide.<\/p>\n<p><strong>Väter sind wirklich verantwortlich.<\/strong> Ihr Vorbild, ihre Unterweisung, ihre Anwesenheit oder Abwesenheit prägen ihre Kinder tief. Wir können unser Versagen nicht mit einem Achselzucken abtun.<\/p>\n<p><strong>Väter sind nicht die einzige Ursache.<\/strong> Kinder sind wirkliche Menschen, die wirkliche Entscheidungen treffen. Der Prophet Hesekiel sprach zu einer Generation, die alles ihren Eltern anlastete: „Die Väter haben saure Trauben gegessen, und den Kindern sind die Zähne stumpf geworden.“ Gottes Antwort war unmissverständlich: „Der Sohn soll nicht die Schuld des Vaters tragen, und der Vater soll nicht die Schuld des Sohnes tragen“ (Hesekiel 18,2.20).<\/p>\n<p>Selbst das bekannte Sprichwort – „Gewöhne einen Knaben an seinen Weg, so lässt er auch nicht davon, wenn er alt wird“ (Sprüche 22,6) – ist ein Sprichwort, kein Versprechen. Sprichwörter sagen uns, wie das Leben gewöhnlich läuft, nicht, wie es immer läuft. Die Bibel selbst ist voller Ausnahmen.<\/p>\n<p>Wenn du ein Kind hast, das vom Weg abgekommen ist, trägst du vielleicht zwei Lasten: echtes Bedauern und eine falsche Schuld, die sagt: „Es ist alles meine Schuld.“ Bring dein echtes Bedauern zu Gott und nimm seine Vergebung an. Und leg die falsche Schuld ab. Die Geschichte deines Kindes ist noch nicht zu Ende, und sie zu schreiben liegt nicht allein bei dir.<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Was bedauerst du ehrlich an deinem Vatersein – und hast du es zu Gott gebracht?<\/li>\n<li>Was trägst du als Schuld mit dir herum, das eigentlich gar nicht deins ist?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Herr, ich stehe zu meinem Versagen; vergib mir.<br />\nUnd ich lasse los, was nie in meiner Hand lag.<br />\nMeine Kinder gehören dir.<br />\nSchreib den Rest ihrer Geschichte mit deiner Gnade. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Schreib zwei Listen: „Wozu ich stehen muss“ und „Was ich loslassen muss“. Bete über beiden.\n<\/p>", "note": "Die Bedeutung von Sprüche 22,6 ist umstritten; manche Forscher lesen den Vers als Warnung statt als Verheißung. Siehe Michael V. Fox, <em>Proverbs 10–31<\/em> (2009).", "readEn": "1 Samuel 8:1–5; Ezekiel 18:1–4, 20"}, {"id": "F27", "n": 27, "title": "Die Rute – ehrlich betrachtet", "part": 4, "read": "Sprüche 13,24; Psalm 23,1–4; Epheser 6,4", "ref": "Sprüche 13,24", "html": "<blockquote>\n<p>„Wer seine Rute schont, der hasst seinen Sohn; wer ihn aber lieb hat, der erzieht ihn beizeiten.“<\/p>\n<p><span class=\"ref\">Sprüche 13,24<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> <span dir=\"rtl\" lang=\"he\">שֵׁבֶט<\/span> (<em>šēbeṭ<\/em>) – „Rute, Stab, Zepter“. Es ist dasselbe Wort wie in Psalm 23 („dein Stecken und Stab trösten mich“) – aber in den Sprüchen meint es eine Rute zum Schlagen.<\/p>\n<\/div>\n<p>Wir können kein Buch über Väter in der Bibel schreiben und diesen Vers überspringen. Er wird seit Jahrhunderten zitiert – oft, um das Schlagen von Kindern zu rechtfertigen. Manche Leser dieses Buches wurden von Vätern verletzt, die ihn zitierten. Darum müssen wir ihn ehrlich lesen – und Ehrlichkeit heißt, nicht so zu tun, als sage er etwas Sanfteres, als er sagt.<\/p>\n<p><strong>Die Rute ist hier eine Rute zum Schlagen.<\/strong> Ein anderes Sprichwort sagt es unverblümt: „Enthalte dem Knaben die Zucht nicht vor; wenn du ihn mit der Rute schlägst, wird er nicht sterben“ (Sprüche 23,13). Das Wort für „Knabe“ kann dort ein Kind jeden Alters bezeichnen – es wird sogar vom kleinen Mose in seinem Körbchen gebraucht. Die Verfasser der Sprüche lebten in einer Welt, in der Eltern und Lehrer Kinder schlugen, und sie hielten das für richtig. Die meisten Christen haben diese Verse über den größten Teil der Geschichte ebenso gelesen.<\/p>\n<p><strong>Aber die Sprüche sind nicht die ganze Bibel – und die Rute ist nicht das Ganze der Sprüche.<\/strong> Das meiste, was sie über die Erziehung von Kindern lehren, handelt von Worten. Das hebräische Wort für „Zucht“, <em>mûsār<\/em>, bedeutet Erziehung und Unterweisung: ein Vater und eine Mutter, die reden, erklären, warnen, überzeugen.<\/p>\n<p><strong>Das eine Gebot des Neuen Testaments an Väter ist eine Grenze, keine Erlaubnis.<\/strong> „Ihr Väter, reizt eure Kinder nicht zum Zorn“ (Epheser 6,4). Morgen sehen wir es uns an.<\/p>\n<p><strong>Die ganze Gestalt der Schrift schützt die Schwachen.<\/strong> Die Bibel begrenzt die Macht eines Vaters, verbietet das Opfern von Kindern und zeigt Gott als Beschützer der Verletzlichen. Jesus stellte ein Kind in die Mitte seiner Jünger und warnte sie, jemals einem dieser Kleinen einen Anstoß zum Fall zu geben (Markus 9,36–42).<\/p>\n<p>Wenn Christen heute also das Schlagen von Kindern ablehnen, verdrehen sie die Sprüche nicht so, dass sie etwas sagen, was sie nicht sagen. Sie lesen die Sprüche im Zusammenhang der ganzen Bibel – und urteilen, wie das Neue Testament es uns lehrt, dass der Weg Christi weiter geht als die Sitten der alten Welt. Christen waren sich uneinig darüber, ob irgendeine Form körperlicher Strafe je richtig sein kann. Aber darüber kann es keine Uneinigkeit geben: <strong>Nichts in der Bibel erlaubt irgendjemandem, ein Kind zu verletzen oder in Angst und Schrecken zu versetzen.<\/strong><\/p>\n<p>Denk an Eli (Tag 22). Sein Versagen bestand nicht darin, dass er seine Söhne nicht schlug. Es bestand darin, dass er nicht <em>sprach<\/em>.<\/p>\n<p>Wie sieht gute Erziehung also aus? Mehr lehren als strafen. Mehr Ruhe als Zorn. Klare, faire Konsequenzen statt Gewalt. Und niemals, niemals ein Kind zurechtweisen, während man selbst die Beherrschung verloren hat.<\/p>\n<p class=\"warning\">\nWenn einem Kind Gewalt angetan wird – durch dich oder durch irgendjemanden –, hol bitte jetzt Hilfe. Wende dich an das Jugendamt, einen Arzt, eine Beratungsstelle oder die Polizei. Um Hilfe zu bitten, ist eine Tat der Liebe.\n<\/p>\n<div class=\"questions\">\n<p><strong>Zum Nachdenken<\/strong><\/p>\n<ol type=\"1\">\n<li>Wie wurdest du als Kind erzogen und bestraft? Was hat es dich gelehrt – über dich selbst und über Gott?<\/li>\n<li>Wenn du deine Kinder zurechtweist: Lehrst du sie – oder lässt du nur deinen eigenen Frust heraus?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Gebet<\/strong><\/p>\n<p>Guter Hirte, dein Stecken und Stab trösten mich.<br />\nMach meine Erziehung wie deine: leitend, schützend, niemals zerstörend.<br />\nHeile, was in mir verletzt wurde,<br />\nund lass keinen Schaden durch mich zu meinen Kindern weitergehen. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Heute:<\/strong> Entscheide dich für eine ruhige, faire Art, wie du reagieren willst, wenn ein Kind das nächste Mal ungehorsam ist – und für eine Art, dich selbst vorher zu beruhigen.\n<\/p>", "note": "Zur Sprache und zum Hintergrund der Sprüche siehe Michael V. Fox, <em>Proverbs 1–9<\/em> (2000). William J. Webb, <em>Corporal Punishment in the Bible<\/em> (2011), vertritt, dass die Rutentexte tatsächlich körperliche Strafe meinen und dass Christen der eigenen Bewegung der Bibel über die härteren Praktiken ihrer Welt hinaus folgen sollten. Das Wort <em>naʿar<\/em> („Knabe“) in Sprüche 23,13 wird auch für den Säugling Mose gebraucht (2. Mose 2,6).", "readEn": "Proverbs 13:24; Psalm 23:1–4; Ephesians 6:4"}, {"id": "F28", "n": 28, "title": "Entmutigt sie nicht", "part": 4, "read": "Kolosser 3,20–21; Epheser 6,1–4; Hebräer 12,7–11", "ref": "Kolosser 3,21", "html": "<blockquote>\n<p>„Ihr Väter, reizt eure Kinder nicht, damit sie nicht mutlos werden.“<\/p>\n<p><span class=\"ref\">Kolosser 3,21<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Das Wort für heute:<\/strong> ἀθυμῶσιν (<em>athymōsin<\/em>) – griechisch „mutlos werden“, „den Mut verlieren“. Wörtlich heißt es, „ohne Lebensmut“ zurückzubleiben.<\/p>\n<\/div>\n<p>Als das Neue Testament sich endlich direkt an Väter wendet – was sagt es?<\/p>\n<p>Nicht: „Sorgt dafür, dass eure Kinder gehorchen.“ Das wird den Kindern gesagt (3,20). Den Vätern sagt Paulus: „Reizt sie nicht. Verbittert sie nicht. Lasst sie nicht den Mut verlieren.“<\/p>\n<p>Das war in der römischen Welt ein verblüffender Satz. Das Gesetz gab dort einem Vater weitreichende Macht über seinen Haushalt – auch wenn die meisten Väter sie nie voll ausschöpften. Ausgerechnet der Mächtigste im Haus bekommt die Einschränkung.<\/p>\n<p>Achte darauf, worum Paulus sich sorgt. Nicht, dass die Kinder ungehorsam sein könnten. Sondern dass sie <em>mutlos<\/em> werden – dass ihr Geist gebrochen wird.<\/p>\n<p>Ein Vater kann vollkommen gehorsame Kinder haben und dieses Gebot trotzdem verfehlen. Wie brechen Väter den Mut ihrer Kinder? Meistens nicht in einem einzigen schrecklichen Moment, sondern auf kleine, wiederholte Weise:<\/p>\n<ul>\n<li>ständige Kritik, wenig Lob;<\/li>\n<li>Sarkasmus und Spott, auch wenn es „nur Spaß“ ist;<\/li>\n<li>ein Kind mit einem anderen vergleichen;<\/li>\n<li>Ansprüche, die so hoch si
