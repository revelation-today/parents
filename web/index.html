had more than one wife — and some of those “wives” were slaves — and where everything — security, status, inheritance — depended on having sons. Those households set women against each other, and the fathers in them usually made things worse. So as we look at mothers who struggled and failed, we should notice the pressures they lived under. Nearly every mother in this section is also hurting — and God meets several of them in their pain.", "days": [23, 24, 25, 26, 27]}, {"id": "part-five", "label": "Part Five", "title": "Hard Words, and the Last Word", "intro": "We end with the readings many will find hardest: for mothers who have lost children, for women who longed for children and have none, and for everyone whose own mother did them harm. And then we stand with Mary at the foot of the cross, where the story of every mother’s sorrow meets the promise of comfort.", "days": [28, 29, 30, 31]}], "days": [{"id": "M1", "n": 1, "title": "As a Mother Comforts", "part": 0, "read": "Isaiah 66:10–14", "ref": "Isaiah 66:13 (NIV)", "html": "<blockquote>\n<p>“As a mother comforts her child, so will I comfort you; and you will be comforted over Jerusalem.”<\/p>\n<p><span class=\"ref\">Isaiah 66:13 (NIV)<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">אֵם<\/span> (<em>ʾēm<\/em>) — “mother.” It is shared across the Semitic languages, and sounds almost the same in Hebrew, Arabic and Akkadian.<\/p>\n<\/div>\n<p>The last chapter of Isaiah describes the day when God will bring his scattered people home. First it pictures <em>Jerusalem<\/em> as a mother: “You shall nurse and be satisfied at her comforting breast… you shall be carried on her hip and bounced on her knees” (66:11–12). The city is the mother; the people are her children.<\/p>\n<p>Then God himself speaks, and borrows the picture: “As a mother comforts her child, so will I comfort you” (66:13).<\/p>\n<p>Notice who is being comforted. It is not a baby. The Hebrew says “a <em>man<\/em> whom his mother comforts.” It is a grown son, come home hurt, being held by his mother.<\/p>\n<p>Most of us know that picture. The grown child who comes back after a failure, a loss, a broken marriage, and finds that at his mother’s table, for a while, he is simply her child again. No lecture. No “I told you so.” Just comfort.<\/p>\n<p>God says: <em>that<\/em> is how I will comfort you.<\/p>\n<p>Two things follow for mothers.<\/p>\n<p>First, <strong>your comfort is an image of God’s.<\/strong> When you hold a crying child, sit with a teenager after a heartbreak, or welcome an adult son home, you are doing something God himself uses to describe his love. Ordinary mothering carries a holy weight.<\/p>\n<p>Second, <strong>you need comfort too.<\/strong> Mothers are so often the comforters that they forget they are also the comforted. This verse is not only a model for you; it is a promise <em>to<\/em> you. The God who comforts like a mother wants to comfort <em>you<\/em> — tired, stretched, sometimes empty.<\/p>\n<p>A small but important note, which we will return to: the Bible never makes “Mother” one of God’s names, the way it does with “Father.” What it does is compare God’s love to a mother’s. That comparison is enough to honour every mother who has ever comforted a child.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Who comforted you as a child? What did their comfort feel like?<\/li>\n<li>When did you last let yourself be comforted — by God, or by anyone?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, you comfort us as a mother comforts her child.<br />\nThank you for every time I have been held.<br />\nMake my comfort to my children a small picture of yours —<br />\nand comfort me, too, when I am the one who is tired. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Give someone the kind of comfort that doesn’t lecture or fix — just presence. Then take five quiet minutes to receive God’s comfort yourself.\n<\/p>", "note": "The Hebrew of Isaiah 66:13 says “a <em>man<\/em> whom his mother comforts.” The Bible compares God’s love to a mother’s but never uses “Mother” as a name for God. How much weight these maternal images carry is debated: compare Phyllis Trible, <em>God and the Rhetoric of Sexuality<\/em> (1978); Mayer Gruber, “The Motherhood of God in Second Isaiah,” <em>Revue Biblique<\/em> 90 (1983); and Sarah Dille, <em>Mixing Metaphors<\/em> (2004), with David Clines, “Alleged Female Language about the Deity in the Hebrew Bible,” <em>Journal of Biblical Literature<\/em> 140 (2021), and the reply by Hanne Løland Levinson in <em>JBL<\/em> 141 (2022). In Isaiah 66:11–12 the nursing mother is Jerusalem; God speaks of himself only in the simile of 66:13.", "readEn": "Isaiah 66:10–14"}, {"id": "M2", "n": 2, "title": "God Does Not Forget", "part": 0, "read": "Isaiah 49:13–16", "ref": "Isaiah 49:15–16", "html": "<blockquote>\n<p>“Can a woman forget the child at her breast, and feel no compassion for the son she bore? Even they may forget — but I will not forget you. Look: I have carved you on the palms of my hands.”<\/p>\n<p><span class=\"ref\">Isaiah 49:15–16<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">עוּלָהּ<\/span> (<em>ʿûlāh<\/em>) — “her nursing child,” the infant still at the breast.<\/p>\n<\/div>\n<p>Zion — God’s people in exile — says, “The LORD has abandoned me; my Lord has forgotten me” (49:14). God answers with a question every mother can feel in her body.<\/p>\n<p><em>Can a woman forget the child at her breast?<\/em><\/p>\n<p>A nursing mother cannot forget her baby even if she tries. Her body remembers. It wakes her in the night before the baby cries. It knows when the next feed is due. The bond is not just an idea; it is physical.<\/p>\n<p>God chooses that picture — and then says that he is more faithful even than that. He goes further: <em>even they may forget.<\/em> The Bible is honest. It knows that some mothers do forget — through illness, exhaustion, addiction, despair, or cruelty. Human mothering can fail.<\/p>\n<p>“But I will not forget you.”<\/p>\n<p>Here is a comfort for two kinds of readers.<\/p>\n<p><strong>For the mother who fears she is failing:<\/strong> you are not the final safety net for your children. There is a love behind yours that never forgets them, even on the days when you are too tired to think straight. You can do your best, and then rest in a faithfulness greater than yours.<\/p>\n<p><strong>For anyone whose own mother forgot them:<\/strong> God does not pretend it didn’t happen. He names it — “even they may forget.” And then he promises that his love does not depend on hers. “I have carved you on the palms of my hands.” You are written where he cannot fail to see you.<\/p>\n<p>The best thing a human mother can give her children is a small, faithful echo of this: attention that keeps coming back, remembrance that doesn’t run out. Not perfection. Just not forgetting.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Is there a child — yours or someone else’s — who needs to know they have not been forgotten?<\/li>\n<li>Where do you most need to hear God say, “I will not forget you”?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, even the best mother may forget, but you never do.<br />\nThank you that my name is written on your hands.<br />\nWhere I have forgotten my children, forgive me.<br />\nWhere I have been forgotten, remember me. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Write the names of your children — or the children you care for — on a card. Keep it where you will see it and pray for each name.\n<\/p>", "note": "In Isaiah 49:15 human mothers are the comparison God outdoes: they may forget; God will not. The word for the nursing infant (<em>ʿûl<\/em>) is the one many scholars also read in Hosea 11:4. On how much the maternal images of God carry, see the note to Day 1.", "readEn": "Isaiah 49:13–16"}, {"id": "M3", "n": 3, "title": "Carried from the Womb", "part": 0, "read": "Isaiah 46:1–4", "ref": "Isaiah 46:3–4", "html": "<blockquote>\n<p>“…you who have been carried by me from the belly, lifted up from the womb. Until you are old, I am the same; until your hair is grey, I will carry you. I made you, and I will lift you; I will carry you and rescue you.”<\/p>\n<p><span class=\"ref\">Isaiah 46:3–4<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">נְשֻׂאִים<\/span> (<em>nĕśuʾîm<\/em>) — “carried,” “lifted up.” It is the same verb used for carrying a child in your arms.<\/p>\n<\/div>\n<p>This chapter opens with a strange picture. The gods of Babylon are being loaded onto carts and dragged away by weary animals. They are idols — heavy statues that have to be <em>carried<\/em> (46:1–2).<\/p>\n<p>Then God speaks to his people: “You are the ones <em>I<\/em> have carried. From the womb. And I will keep carrying you until your hair is grey.”<\/p>\n<p>The contrast is sharp. Idols are burdens that people carry. The true God is the one who carries his people.<\/p>\n<p>Every mother knows what carrying means. Nine months of carrying a child inside her body. Then years of carrying on her hip, in her arms, on her back. Then a different kind of carrying — the worries, the prayers, the sleepless nights over a teenager or a grown child far away. Mothers carry their children long after they have stopped being physically heavy.<\/p>\n<p>God says: I know that kind of carrying. I have been doing it for you since before you were born. And I won’t stop when you get old.<\/p>\n<p>This is a word to tired mothers. You are carrying a great deal. But you are not the only one carrying. The God who carries <em>you<\/em> has not put you down. The load you bear for your children is itself being borne.<\/p>\n<p>It is also a word to older mothers — and to all of us as we age. “Until your hair is grey, I will carry you.” The roles reverse as parents grow old; the children begin to carry the parents. But God’s carrying never reverses. We are always the carried ones.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>What are you “carrying” for your children right now that feels heavy?<\/li>\n<li>Can you imagine yourself being carried by God — the way you have carried a child?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, you have carried me since before I was born.<br />\nI carry so much for my children; carry me as I carry them.<br />\nAnd when I am old and grey, keep carrying me still. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Name one worry you are carrying for a child. Deliberately hand it to God in prayer — and notice if you pick it back up.\n<\/p>", "note": "Isaiah 46:1–4 contrasts the idols of Babylon, which must be carried, with the God who carries his people.", "readEn": "Isaiah 46:1–4"}, {"id": "M4", "n": 4, "title": "Like a Woman in Labour", "part": 0, "read": "Isaiah 42:10–16; Galatians 4:19", "ref": "Isaiah 42:14", "html": "<blockquote>\n<p>“Long have I been silent; I have kept quiet and held myself in. Now I will cry out like a woman giving birth; I will gasp and pant together.”<\/p>\n<p><span class=\"ref\">Isaiah 42:14<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">כַּיּוֹלֵדָה<\/span> (<em>kayyôlēdâ<\/em>) — “like a woman giving birth.”<\/p>\n<\/div>\n<p>This may be the most daring picture of God in the Old Testament. God has been silent for a long time while his people suffered. Now he is about to act. And the prophet says: he will cry out <em>like a woman in labour.<\/em> (The comparison is to the cry — loud, urgent, straining. Elsewhere the Bible goes further: Moses asks God, “Did <em>I<\/em> conceive all this people?” — implying that God did [Numbers 11:12]; and the Song of Moses speaks of “the God who writhed in labour with you” [Deuteronomy 32:18].)<\/p>\n<p>Anyone who has given birth — or been with someone who has — knows what that means. Labour is not gentle. It is loud, exhausting, and painful. But it is not the pain of injury. It is the pain of something <em>new coming into the world.<\/em><\/p>\n<p>Paul uses the same picture for himself. Writing to a church that was going astray, he says: “My little children, I am in the pain of childbirth again until Christ is formed in you” (Galatians 4:19). Caring for people’s souls, he says, feels like labour.<\/p>\n<p>Many mothers will recognise that “again.” Giving birth happens once. But mothering involves labour again and again: the long nights with a sick baby, the battles of the toddler years, the anguish over a teenager who has lost their way. It often feels like being in labour all over again, with no guarantee of when it will end.<\/p>\n<p>These texts give that pain a meaning. It is not wasted. It is the kind of pain that brings something new into being. God himself knows it. He labours to bring about a new creation; Paul labours to see Christ formed in people; and mothers labour — in body, in patience, in prayer — to bring their children into life.<\/p>\n<p>If you are in a season of “labour” right now, you are not failing. You are doing something God himself does.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Is there a season in your mothering that feels like “labour all over again”?<\/li>\n<li>What new life might be coming into being through it?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, you know the pain of bringing something new into the world.<br />\nIn the seasons when mothering feels like labour,<br />\nremind me that the pain is not wasted.<br />\nBring new life out of it — in my children, and in me. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> If you are in a hard season with a child, tell one trusted friend about it. Labour was never meant to be done alone.\n<\/p>", "note": "Paul’s “I am in the pain of childbirth” (Galatians 4:19) uses the Greek verb <em>ōdinō<\/em>, “to be in labour.” The verb for “conceive” in Numbers 11:12 (<em>hārâ<\/em>) is used in its literal sense only of women.", "readEn": "Isaiah 42:10–16; Galatians 4:19"}, {"id": "M5", "n": 5, "title": "Like a Weaned Child", "part": 0, "read": "Psalm 131", "ref": "Psalm 131:2", "html": "<blockquote>\n<p>“I have made my soul still and quiet, like a weaned child resting on its mother; my soul within me is like that weaned child.”<\/p>\n<p><span class=\"ref\">Psalm 131:2<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">כְּגָמֻל<\/span> (<em>kĕgāmul<\/em>) — “like a weaned child.” In Bible times a child was weaned at around two or three years old.<\/p>\n<\/div>\n<p>Psalm 131 is only three verses long. It may be the gentlest prayer in the whole Bible.<\/p>\n<p>“My heart is not proud; I do not busy myself with things too great for me. I have made my soul still and quiet, like a weaned child resting on its mother.”<\/p>\n<p>Think about the difference between a nursing baby and a weaned child on its mother’s lap. The nursing baby comes to its mother <em>because it needs something<\/em>. It roots and fusses until it is fed. The weaned child comes to its mother simply to <em>be with her<\/em>. It is not demanding anything. It rests.<\/p>\n<p>The psalmist says: that is how I want to be with God. Not always coming with needs and demands, but sometimes simply resting in his presence, content.<\/p>\n<p>This psalm is headed “of David.” It paints a picture every mother knows, and many readers have heard in it a hint of God as the mother and the believer as the child resting on her lap. The psalm does not quite say that; it simply compares a quieted soul to a weaned child. But the picture invites it.<\/p>\n<p>Mothers spend their days being the lap that others rest on. Children climb on you, lean on you, fall asleep on you. It is easy to forget that you, too, need somewhere to rest.<\/p>\n<p>This psalm is an invitation. Not to do more for God, but to stop for a moment and be still with him — like a child who has nothing to ask for, and simply wants to be close.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>When you pray, do you ever simply <em>rest<\/em> with God, without asking for anything?<\/li>\n<li>What is one “thing too great for you” that you could stop carrying today?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, I bring you so many needs.<br />\nToday I want simply to be with you,<br />\nlike a weaned child resting on its mother.<br />\nQuiet my soul. Let me rest. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Take five minutes of silence with God. No list, no requests — just rest in his presence.\n<\/p>", "note": "On the age of weaning, compare 1 Samuel 1:22–24 and 2 Maccabees 7:27, where a mother says she nursed her son for three years. Psalm 131 compares the psalmist’s soul to a weaned child with its mother; reading the mother as an image of God is an interpretation, not something the psalm states.", "readEn": "Psalm 131"}, {"id": "M6", "n": 6, "title": "As a Hen Gathers Her Chicks", "part": 0, "read": "Matthew 23:37–39; Luke 13:31–35", "ref": "Matthew 23:37 (NIV)", "html": "<blockquote>\n<p>“Jerusalem, Jerusalem… how often I have longed to gather your children together, as a hen gathers her chicks under her wings, and you were not willing.”<\/p>\n<p><span class=\"ref\">Matthew 23:37 (NIV)<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> ὄρνις (<em>ornis<\/em>) — Greek for “bird,” here “hen.” It is the only time in the Gospels that Jesus uses a mother’s image for himself.<\/p>\n<\/div>\n<p>Jesus called himself many things: shepherd, light, door, vine, bread. Only once did he compare himself to a mother — and he chose, of all things, a hen.<\/p>\n<p>It is not a grand image. A hen is not a lion or an eagle. But anyone who has seen a mother hen when danger comes knows what Jesus meant. She spreads her wings, and the chicks run underneath. She stands between them and the threat. If a fox comes, she will die before they do.<\/p>\n<p>That is what Jesus longed to be for Jerusalem. And that is what he became — on the cross, he stood between his people and the danger, and gave his life.<\/p>\n<p>But look at the heartbreak in this verse: “but you would not.” The chicks would not come. A hen can spread her wings, but she cannot force her chicks underneath.<\/p>\n<p>Every mother eventually learns this painful truth. You can offer shelter. You cannot make your children accept it. A toddler runs off in the car park. A teenager refuses your advice. An adult child walks away from the faith you taught them.<\/p>\n<p>Jesus knows exactly what that feels like. He wept over it (Luke 19:41). And yet he did not stop being the hen. He kept his wings open, all the way to the cross.<\/p>\n<p>If you have a child who will not come under your wings right now, you are in the company of Jesus himself. Keep your wings open. Keep praying. And trust that his wings are wider than yours.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Is there a child in your life who “would not” come right now? How does that feel?<\/li>\n<li>What would it look like to keep your wings open without trying to force them underneath?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord Jesus, you longed to gather your people like a hen gathers her chicks.<br />\nGive me that same love for my children —<br />\nwings always open, never forcing.<br />\nWhere they will not come to me, gather them to you. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Send a simple, no-pressure message to a child who has pulled away: “I’m thinking of you. My door is always open.”\n<\/p>", "note": "The saying is in both Matthew 23:37 and Luke 13:34. It is the one place where Jesus describes his own love in maternal terms. In Luke 15 the same pairing appears in a parable: God’s seeking is pictured by a shepherd (15:3–7) and by a woman searching her house for a lost coin (15:8–10).", "readEn": "Matthew 23:37–39; Luke 13:31–35"}, {"id": "M7", "n": 7, "title": "Your Mother’s Teaching", "part": 1, "read": "Proverbs 1:8–9; 6:20–23", "ref": "Proverbs 6:20, 22", "html": "<blockquote>\n<p>“Keep, my son, your father’s command, and do not abandon your mother’s teaching… Wherever you walk, it will lead you; when you sleep, it will keep watch; when you wake, it will speak with you.”<\/p>\n<p><span class=\"ref\">Proverbs 6:20, 22<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">תּוֹרַת אִמֶּךָ<\/span> (<em>tôrat ʾimmekā<\/em>) — “your mother’s teaching.” The word for “teaching” is <em>tôrâ<\/em> — the same word as “Torah,” God’s Law.<\/p>\n<\/div>\n<p>Some people imagine that in the Bible, fathers teach and mothers nurture — that serious instruction belongs to men, and women provide the warmth.<\/p>\n<p>The book of Proverbs does not see it that way. Twice it sets the mother’s teaching directly beside the father’s (1:8; 6:20). And the word it chooses for her teaching is <em>tôrâ<\/em>. That is not a soft word. It is the word for authoritative instruction — the word the Bible uses for the Law of Moses.<\/p>\n<p>In other words, what a mother teaches her child is not a lesser kind of teaching. It is <em>tôrâ<\/em>: instruction that shapes a whole life.<\/p>\n<p>Look at how Proverbs describes it: “Wherever you walk, it will lead you; when you sleep, it will keep watch; when you wake, it will speak with you.” A mother’s teaching goes with a child long after the child has left home. Many adults still hear their mother’s voice at key moments — “Tell the truth.” “Be kind.” “Say your prayers.”<\/p>\n<p>It is striking how many people say their first faith came from their mother. The bedtime prayer. The song sung over a cot. The Bible story told on a rainy afternoon. The quiet example of a woman who prayed.<\/p>\n<p>None of that is small. It is <em>tôrâ<\/em>.<\/p>\n<p>If you are a mother, you may not feel like a teacher. You may feel that you are simply getting through the day. But the words you speak, the prayers you pray aloud, and the way you live in front of your children are forming them more deeply than you know.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>What words of your own mother (or another woman who raised you) still come back to you?<\/li>\n<li>What do you most want your children to hear in their heads when they are grown?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, you have given my teaching a place beside your own Word.<br />\nLet what I teach my children be true, and kind, and lasting.<br />\nWalk with them through my words long after they leave my home. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Teach your child one short prayer, Bible verse, or song — and say it together at bedtime.\n<\/p>", "note": "Proverbs 6:22 echoes Deuteronomy 6:7 (“when you walk… when you lie down… when you rise”).", "readEn": "Proverbs 1:8–9; 6:20–23"}, {"id": "M8", "n": 8, "title": "Faith That Lived First in a Grandmother", "part": 1, "read": "2 Timothy 1:3–7; 3:14–15; Acts 16:1", "ref": "2 Timothy 1:5 (NIV)", "html": "<blockquote>\n<p>“I am reminded of your sincere faith, which first lived in your grandmother Lois and in your mother Eunice and, I am persuaded, now lives in you also.”<\/p>\n<p><span class=\"ref\">2 Timothy 1:5 (NIV)<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> μάμμη (<em>mammē<\/em>) — Greek for “grandmother.” It appears only here in the whole New Testament.<\/p>\n<\/div>\n<p>Timothy became one of Paul’s most trusted co-workers — a leader in the early church. Where did his faith come from?<\/p>\n<p>Paul tells us. It “dwelt first” in his grandmother Lois, then in his mother Eunice, and then in him. And later Paul adds: “from infancy you have known the sacred writings” (3:15).<\/p>\n<p>The book of Acts adds one more detail: Timothy’s father was a Greek (Acts 16:1). He was probably not a believer. The faith came to Timothy through the women of his family.<\/p>\n<p>Many readers will recognise this story. It is very common for faith to be carried by mothers and grandmothers — sometimes in homes where the father does not share it, or is not there at all. If that is your situation, this passage is for you. Your faithfulness matters. A faith that “lives” in you can live on in your children and grandchildren.<\/p>\n<p>Notice the word Paul uses: <em>sincere<\/em> faith — in Greek, <em>unpretended<\/em> — literally “unhypocritical.” Children are quick to spot the difference between a faith that is performed and a faith that is real. What passed from Lois to Eunice to Timothy was not a set of religious habits but a living trust in God that the child could see was genuine.<\/p>\n<p>And notice the grandmother. Grandmothers often have something mothers don’t: more time, more patience, a longer view. Many people say it was a grandmother who first showed them what faith looked like. If you are a grandmother, your role in passing on faith may be larger than you think.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Who first showed you a real, sincere faith? Was it a woman in your family?<\/li>\n<li>Is there a grandchild, niece, or young person whose faith you could help nurture?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, thank you for the women who handed faith down to me.<br />\nLet my faith be sincere — real enough for a child to see.<br />\nLet it live on in my children, and in their children after them. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Tell a child one true story about a time God helped you — or, if you’re a grandmother, call a grandchild and pray for them by name.\n<\/p>", "note": "On Timothy’s father, see Acts 16:1.", "readEn": "2 Timothy 1:3–7; 3:14–15; Acts 16:1"}, {"id": "M9", "n": 9, "title": "A Mother Teaches a King Justice", "part": 1, "read": "Proverbs 31:1–9", "ref": "Proverbs 31:1, 8–9", "html": "<blockquote>\n<p>“The words of King Lemuel, which his mother taught him… Open your mouth for those who cannot speak, for the rights of all who are perishing. Open your mouth, judge rightly, and defend the poor and needy.”<\/p>\n<p><span class=\"ref\">Proverbs 31:1, 8–9<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">יִסְּרַתּוּ<\/span> (<em>yissĕrattû<\/em>) — “she instructed him,” “she trained him.” It comes from the same root as the main word for teaching and discipline in Proverbs.<\/p>\n<\/div>\n<p>There is only one place in the whole Bible where a long piece of teaching is said to come directly from a mother. It is here, at the start of Proverbs 31 — and her pupil is a king.<\/p>\n<p>We know almost nothing else about King Lemuel or his mother. “Massa” may be the name of an Arabian tribe descended from Ishmael (Genesis 25:14) — in which case Lemuel’s mother was not an Israelite at all, and her wisdom was welcomed into Israel’s Bible from outside. But we know what she taught him, and it is worth listening to.<\/p>\n<p>First, she warns him about self-indulgence: don’t waste your strength on women, don’t drink yourself into forgetting your duties (31:3–7).<\/p>\n<p>Then she tells him what his power is <em>for<\/em>:<\/p>\n<p>“Open your mouth for those who cannot speak. Judge rightly. Defend the poor and needy.”<\/p>\n<p>A mother teaching her son, the king, that his whole purpose is to speak up for people who have no voice. That is extraordinary.<\/p>\n<p>In the companion book on fathers, we saw that God chose Abraham “so that he may teach his children… to do righteousness and justice” (Genesis 18:19). It is striking — though it may be no more than a happy echo — that the one long teaching from a mother in the Bible has the same heart: <em>raise children who stand up for the weak.<\/em><\/p>\n<p>Most of us are not raising kings. But every child will one day have some kind of power — over a younger sibling, in a classroom, at work, in a family of their own. What they do with that power will depend a great deal on what they learned at home.<\/p>\n<p>Lemuel’s mother did not only teach her son to be good. She taught him to be <em>just<\/em>.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>What are your children learning from you about how to treat people who are weaker than them?<\/li>\n<li>Who in your community “cannot speak for themselves”? How could your family help?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, thank you for Lemuel’s mother, who taught a king to care for the voiceless.<br />\nHelp me to raise children who open their mouths for the weak,<br />\nand who use whatever power they have for others. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Talk with your child about someone who is left out or unfairly treated — and think together of one small way to help.\n<\/p>", "note": "The word <em>maśśāʾ<\/em> in Proverbs 31:1 may be a place-name (“Massa,” an Ishmaelite tribe in Genesis 25:14) or may mean “oracle.” The parallel with Genesis 18:19 is the author’s own observation, not an established reading.", "readEn": "Proverbs 31:1–9"}, {"id": "M10", "n": 10, "title": "The Teaching of Kindness", "part": 1, "read": "Proverbs 31:10–31", "ref": "Proverbs 31:26, 28", "html": "<blockquote>\n<p>“Her mouth she opens in wisdom, and on her tongue is the teaching of kindness… Her children rise up and call her blessed.”<\/p>\n<p><span class=\"ref\">Proverbs 31:26, 28<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">תּוֹרַת־חֶסֶד<\/span> (<em>tôrat-ḥesed<\/em>) — “the teaching of kindness.” <em>Ḥesed<\/em> is one of the richest words in the Old Testament: loyal, steadfast, faithful love — the word used for God’s own love.<\/p>\n<\/div>\n<p>Proverbs 31 has probably made more women feel inadequate than any other chapter in the Bible.<\/p>\n<p>The “woman of strength” gets up before dawn, runs a household, buys a field, plants a vineyard, makes and sells clothing, cares for the poor, and never seems to rest. Many women read it as a checklist — and fail.<\/p>\n<p>So it helps to know four things about this poem.<\/p>\n<p><strong>It is a poem of praise, not a job description.<\/strong> In Hebrew, each verse begins with the next letter of the alphabet — A to Z. It is a celebration, not a set of instructions.<\/p>\n<p><strong>It describes a working woman.<\/strong> She is a businesswoman and a landowner. She is “known in the city gates.” Whatever this poem says, it does not say that a woman’s only place is the nursery.<\/p>\n<p><strong>Many read it as a portrait of Wisdom herself.<\/strong> Proverbs begins with Wisdom pictured as a woman calling out in the streets (chapters 1–9), and many interpreters think it ends with her too. If so, this is not a job description for mothers at all, but a picture of what wisdom looks like in a life.<\/p>\n<p><strong>When it finally talks about mothering, it praises her <em>words<\/em>.<\/strong> Not her cooking, her cleaning, or her schedule. “Her mouth she opens in wisdom, and on her tongue is the teaching of kindness.”<\/p>\n<p>That phrase — <em>tôrat-ḥesed<\/em> — is lovely. It joins “teaching” (<em>tôrâ<\/em>) with God’s own word for faithful love (<em>ḥesed<\/em>). Her instruction is shaped by kindness. She corrects, guides, and teaches — but in a way that carries love.<\/p>\n<p>And the result? “Her children rise up and call her blessed.”<\/p>\n<p>Children rarely remember the tidiness of the house or the perfection of the meals. They remember the tone of their mother’s voice. Was it harsh, or kind? Anxious, or steady? Mocking, or encouraging?<\/p>\n<p>You don’t have to be the woman of Proverbs 31 in every detail. But you can let the teaching of kindness be on your tongue.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Has Proverbs 31 made you feel inadequate? What changes when you read it as praise rather than a checklist?<\/li>\n<li>What is the usual <em>tone<\/em> of your voice when you correct your children?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, set me free from impossible checklists.<br />\nPut your kind of teaching on my tongue —<br />\nwise, faithful, and full of steadfast love —<br />\nso that my children will one day rise up and bless you for it. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> The next time you need to correct a child, pause first — and let your first words be kind.\n<\/p>", "note": "Proverbs 31:10–31 is an alphabetic acrostic. On its social and economic background, see Christine Roy Yoder, <em>Wisdom as a Woman of Substance<\/em> (2001). Ruth is also called an <em>ʾēšet ḥayil<\/em>, “woman of strength” (Ruth 3:11). Many interpreters read the poem as a portrait of personified Wisdom.", "readEn": "Proverbs 31:10–31"}, {"id": "M11", "n": 11, "title": "A Mother in Israel", "part": 1, "read": "Judges 4:4–10; 5:1–7", "ref": "Judges 5:7", "html": "<blockquote>\n<p>“The villages were empty in Israel; they were empty until I arose — I, Deborah — until I arose, a mother in Israel.”<\/p>\n<p><span class=\"ref\">Judges 5:7<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">אֵם בְּיִשְׂרָאֵל<\/span> (<em>ʾēm bĕyiśrāʾēl<\/em>) — “a mother in Israel.” A title of honour for a woman who protects and leads her people.<\/p>\n<\/div>\n<p>Deborah was a prophet and a judge. People came to her under a palm tree to have their disputes settled. When Israel was oppressed, she summoned the army commander Barak and went with him into battle.<\/p>\n<p>And when she sang about it afterwards, she chose a surprising title for herself: “a mother in Israel.”<\/p>\n<p>The Bible never tells us whether Deborah had children of her own. That is the point. “Mother in Israel” was not a description of her family life. It was a description of her role: someone who protected, guided, and fought for the people in her care, the way a mother fights for her children.<\/p>\n<p>Elsewhere in the Bible, a whole city is called “a mother in Israel” (2 Samuel 20:19), because it sheltered the villages around it.<\/p>\n<p>This matters for many women.<\/p>\n<p><strong>For women without children<\/strong>, whether by choice, by circumstance, or through the pain of infertility: the Bible has a place for you in the family of “mothers.” Some of the most important mothering in the world is done by women who never gave birth — teachers, aunts, mentors, leaders, friends. Deborah was a mother to a whole nation.<\/p>\n<p><strong>For mothers whose children are grown<\/strong>: your mothering is not over. The church and the world need women who will be “mothers in Israel” — wise, protective, willing to stand up for others.<\/p>\n<p><strong>For every woman<\/strong>: motherhood in the Bible is bigger than biology. It is a way of loving that anyone can practise.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Who has been a “mother in Israel” to you — a woman who guided or protected you, though she wasn’t your mother?<\/li>\n<li>Who could you “mother” who isn’t your own child?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, thank you for Deborah, a mother to a whole people.<br />\nThank you for the women who have mothered me.<br />\nShow me whom I am called to mother,<br />\nwhether or not they are my own. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Thank a woman who has been a “mother in Israel” to you — or reach out to a younger person who needs someone to watch out for them.\n<\/p>", "note": "A city is called “a mother in Israel” in 2 Samuel 20:19. Judges does not say whether Deborah had children.", "readEn": "Judges 4:4–10; 5:1–7"}, {"id": "M12", "n": 12, "title": "Honour Your Mother", "part": 1, "read": "Exodus 20:12; Leviticus 19:3; Proverbs 23:22–25; John 19:25–27", "ref": "Leviticus 19:3", "html": "<blockquote>\n<p>“Each of you shall revere his mother and his father.”<\/p>\n<p><span class=\"ref\">Leviticus 19:3<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">תִּירָאוּ<\/span> (<em>tîrāʾû<\/em>) — “you shall revere.” It is related to the word for “fear,” meaning deep respect and awe.<\/p>\n<\/div>\n<p>The Ten Commandments say, “Honour your father and your mother.” But in Leviticus, the same command appears with the order reversed: “Each of you shall revere his <em>mother<\/em> and his father.”<\/p>\n<p>The ancient rabbis noticed this. They concluded that neither parent comes first. Mother and father are owed exactly the same honour.<\/p>\n<p>In a world where women often had little legal power, this was significant. A mother’s honour was not a secondary matter. Striking or cursing a mother was treated just as seriously as striking or cursing a father (Exodus 21:15, 17).<\/p>\n<p>What does honouring a mother mean? Proverbs gives one clear answer: “Do not look down on your mother when she is old” (23:22). Honour includes care — especially when a mother grows old, frail, or dependent.<\/p>\n<p>Jesus showed this in the most moving way possible. Dying on the cross, in terrible pain, he looked down and saw his mother. And he made sure she would be cared for: “Woman, here is your son.” And to his disciple: “Here is your mother.” “From that time on, this disciple took her into his home” (John 19:26–27, NIV).<\/p>\n<p>With almost his last breath, Jesus kept the commandment to honour his mother.<\/p>\n<p>For mothers, this is a word of dignity. You are owed honour — not because you were perfect, but because you gave life and care.<\/p>\n<p>For adult children, it is a word of calling. Honouring our mothers may mean phone calls, visits, practical help, patience with their ageing, and gratitude spoken while they can still hear it.<\/p>\n<p>And for those whose mothers caused them deep harm: honour does not mean pretending, or putting yourself back in danger. We will come back to that on Day 30.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>If your mother is living, how could you honour her this week?<\/li>\n<li>If you are a mother of grown children, how do you want to be honoured — and have you told them?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord Jesus, even on the cross you cared for your mother.<br />\nTeach me to honour my mother as you honoured yours —<br />\nwith care, with patience, and with gratitude.<br />\nAnd let my children learn honour by watching me. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Call, visit, or write to your mother or an older woman in your life. If your mother has died, give thanks to God for one thing she gave you.\n<\/p>", "note": "The rabbinic discussion of Leviticus 19:3 and Exodus 20:12 is in the Babylonian Talmud, Qiddushin 30b–31a.", "readEn": "Exodus 20:12; Leviticus 19:3; Proverbs 23:22–25; John 19:25–27"}, {"id": "M13", "n": 13, "title": "The Midwives Who Said No", "part": 2, "read": "Exodus 1:8–22", "ref": "Exodus 1:17 (NIV)", "html": "<blockquote>\n<p>“The midwives, however, feared God and did not do what the king of Egypt had told them to do; they let the boys live.”<\/p>\n<p><span class=\"ref\">Exodus 1:17 (NIV)<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">הַמְיַלְּדֹת<\/span> (<em>hamyallĕdōt<\/em>) — “the midwives,” literally “the women who help to give birth.”<\/p>\n<\/div>\n<p>The story of Israel’s rescue from Egypt begins with two women whose names most people have never heard: Shiphrah and Puah.<\/p>\n<p>They were midwives. Their work was bringing babies safely into the world. (We don’t actually know whether they were Hebrews themselves. The Hebrew can mean “the Hebrew midwives” or “the midwives of the Hebrew women,” and the ancient historian Josephus thought they were Egyptians. If so, their courage is even more striking: Egyptian women defying their own king to save the children of foreigners.) And the most powerful man on earth, the king of Egypt, gave them an order: when a Hebrew woman gives birth, kill the boy.<\/p>\n<p>They said no.<\/p>\n<p>Not with a speech or a protest march. Quietly. They simply did not do it. When the king summoned them and demanded an explanation, they gave him a clever answer: “The Hebrew women are not like the Egyptian women. They are full of life, and they have given birth before the midwife reaches them” (1:19).<\/p>\n<p>Why did they risk their lives? The Bible gives one reason: “The midwives feared God.” They feared God more than they feared Pharaoh.<\/p>\n<p>And God rewarded them: “He made them households” (1:21) — families of their own.<\/p>\n<p>This is the first act of resistance in the whole story of the Exodus. Before Moses, before the plagues, before the Red Sea, there were two women who would not harm a child.<\/p>\n<p>Every mother is, in some way, a guardian of life. Most of the time that means ordinary things — feeding, protecting, keeping safe. But sometimes it means saying no to powerful people: a system, a school, a doctor, an employer, a relative, even a church, when what they ask would harm a child.<\/p>\n<p>Shiphrah and Puah show that such courage does not need to be loud. It needs only to fear God more than anyone else.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Is there a situation where you need to say “no” to protect a child?<\/li>\n<li>Whom do you fear more — God, or the people who have power over you?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, thank you for Shiphrah and Puah, who feared you more than a king.<br />\nGive me their courage — quiet, clever, and unafraid —<br />\nto protect the children in my care,<br />\nwhatever it costs. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Pray for mothers and midwives in places where children’s lives are in danger. If you know of a situation where a child is at risk, take one step to protect them.\n<\/p>", "note": "“He made them households” (Exodus 1:21) may mean that God gave the midwives families of their own. Exodus 1:15 can mean “the Hebrew midwives” or “the midwives of the Hebrew women”; Josephus (<em>Jewish Antiquities<\/em> 2.206–207) took them to be Egyptians.", "readEn": "Exodus 1:8–22"}, {"id": "M14", "n": 14, "title": "A Small Ark in the Reeds", "part": 2, "read": "Exodus 2:1–10", "ref": "Exodus 2:2–3", "html": "<blockquote>\n<p>“The woman conceived and bore a son. She saw that he was good, and she hid him for three months. When she could hide him no longer, she took a papyrus basket for him, sealed it with tar and pitch, laid the child inside, and set it among the reeds at the river’s edge.”<\/p>\n<p><span class=\"ref\">Exodus 2:2–3<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">תֵּבָה<\/span> (<em>tēbâ<\/em>) — “basket,” “ark.” This word appears in only two places in the Bible: here, and in the story of Noah’s ark.<\/p>\n<\/div>\n<p>The mother of Moses isn’t even named in this chapter. We learn later that her name was Jochebed (Exodus 6:20). But what she did is unforgettable.<\/p>\n<p>She “saw that he was good” — the same words God said over creation in Genesis 1. Every mother knows that moment of looking at her newborn and seeing something wonderful.<\/p>\n<p>Then she hid him. For three months she kept a baby quiet in a land where every Hebrew boy was to be thrown into the Nile.<\/p>\n<p>And when she could hide him no longer, she built him a <em>tēbâ<\/em> — the same word used for Noah’s ark. A small ark, sealed with tar, to carry her son through the waters.<\/p>\n<p>Then came the hardest part. She put him in the river and let him go.<\/p>\n<p>This is one of the great paradoxes of motherhood. A mother protects her child with all her strength — and then, at the right moment, she must let go and trust. Jochebed could not follow the basket down the river. She had done all she could; the rest was in God’s hands.<\/p>\n<p>But she was not alone. The baby’s sister — Miriam, as we learn later — watched from a distance and spoke up at exactly the right moment. And Pharaoh’s own daughter — an Egyptian princess — took pity on the child and adopted him as her son. Jochebed was even paid to nurse her own baby!<\/p>\n<p>Moses survived because of a whole team of women: a mother, a sister, a princess, and before them, two midwives.<\/p>\n<p>If you are facing a moment when you must let a child go — to school, to hospital, to a new home, into adulthood — remember Jochebed. Build the best ark you can. Then trust the river to God.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>In what part of your child’s life do you need to “let go” right now?<\/li>\n<li>Who are the other people — sisters, friends, even strangers — who share in protecting your child?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, you saw Jochebed’s little ark in the reeds.<br />\nHelp me to protect my children with all my strength,<br />\nand to let them go when the time comes,<br />\ntrusting them to your hands. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Name one area where you need to let go a little. Pray about it — and thank God for the people who help you care for your children.\n<\/p>", "note": "The word <em>tēbâ<\/em> is used in Genesis 6–9 for Noah’s ark and in Exodus 2:3, 5 for Moses’ basket. Moses’ mother is named in Exodus 6:20, and his sister Miriam in Numbers 26:59; Exodus 2 names neither.", "art": {"file": "images/m14.webp", "caption": "The basket among the reeds", "title": "The Finding of Moses", "credit": "Gustave Doré, Bible illustrations (1866)", "source": "https://commons.wikimedia.org/wiki/File%3A031.The_Finding_of_Moses.jpg", "licence": "Public domain", "w": 900, "h": 1118}, "readEn": "Exodus 2:1–10"}, {"id": "M15", "n": 15, "title": "Hannah Pours Out Her Soul", "part": 2, "read": "1 Samuel 1:1–18", "ref": "1 Samuel 1:15 (NIV)", "html": "<blockquote>\n<p>“‘Not so, my lord,’ Hannah replied, ‘I am a woman who is deeply troubled. I have not been drinking wine or beer; I was pouring out my soul to the LORD.’”<\/p>\n<p><span class=\"ref\">1 Samuel 1:15 (NIV)<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">מָרַת נָפֶשׁ<\/span> (<em>mārat nāpeš<\/em>) — “bitter of soul.” It describes Hannah’s state in 1 Samuel 1:10: deep, aching grief.<\/p>\n<\/div>\n<p>Hannah wanted a child and could not have one. Year after year she went with her family to worship at Shiloh, and year after year her husband’s other wife, Peninnah, taunted her.<\/p>\n<p>Her husband Elkanah loved her, but he didn’t really understand. “Why are you weeping? Am I not better to you than ten sons?” (1:8). He meant well. But it didn’t help.<\/p>\n<p>So Hannah went to the house of God and prayed. The Bible says she was “bitter of soul” and “wept bitterly.” She prayed so intensely that her lips moved but no sound came out. The priest Eli, watching, thought she was drunk and told her off.<\/p>\n<p>Her answer is one of the most honest lines in the Bible: “I was pouring out my soul to the LORD.”<\/p>\n<p>Hannah does not tidy up her prayer. She does not pretend to be fine. She brings her grief, her longing, and her bitterness straight to God — so raw that it looks like drunkenness to someone watching.<\/p>\n<p>Many mothers, and many women who long to be mothers, know that kind of prayer. The prayer at 3 a.m. over a sick child. The prayer after another month with no pregnancy. The prayer for a child who is lost. Words fail, and all that is left is pouring out.<\/p>\n<p>Hannah shows that God welcomes that kind of prayer. He does not require us to be calm before we come to him. And after she had prayed, she no longer looked sad (1:18) — not because anything had changed yet, but because she had brought it to God.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Is there a grief or longing you have been holding back from God, because it feels too raw?<\/li>\n<li>Has anyone ever misunderstood your pain, as Eli misunderstood Hannah’s? How did that feel?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, you heard Hannah when no one else understood her.<br />\nI pour out my soul before you now —<br />\nthe longing, the grief, the bitterness.<br />\nHear me, as you heard her. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Take time alone to pray honestly — out loud or on paper — about the thing that weighs most on your heart as a mother, or as a woman who longs to be one.\n<\/p>", "note": "Hannah’s story follows the pattern of the childless wife and the announced son; see Robert Alter, “How Convention Helps Us Read: The Case of the Bible’s Annunciation Type-Scene,” <em>Prooftexts<\/em> 3 (1983). Her song (1 Samuel 2:1–10) is the model for Mary’s Magnificat (Luke 1:46–55).", "readEn": "1 Samuel 1:1–18"}, {"id": "M16", "n": 16, "title": "Lent to the Lord — and a Little Robe Each Year", "part": 2, "read": "1 Samuel 1:19–28; 2:18–21", "ref": "1 Samuel 1:28; 2:19", "html": "<blockquote>\n<p>“So I have lent him to the LORD; for as long as he lives, he is lent to the LORD… Every year his mother would sew him a small robe and take it up to him when she came with her husband for the yearly sacrifice.”<\/p>\n<p><span class=\"ref\">1 Samuel 1:28; 2:19<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">מְעִיל קָטֹן<\/span> (<em>mĕʿîl qāṭōn<\/em>) — “a little robe.”<\/p>\n<\/div>\n<p>God answered Hannah’s prayer. She gave birth to a son and named him Samuel. And then she did something almost impossible to imagine.<\/p>\n<p>She had promised that if God gave her a son, she would give him back. So when Samuel was weaned — probably around three years old — she brought him to the house of God at Shiloh and left him there, to grow up serving the Lord with the old priest Eli.<\/p>\n<p>“I have lent him to the LORD,” she said.<\/p>\n<p>What kind of mother does that? One who knows that her child was never really hers to keep. Every child is, in a sense, “lent.” They come from God, and they belong to God before they belong to us. Hannah simply made visible what is true for every parent.<\/p>\n<p>But the story doesn’t end there. Look at the small detail in chapter 2: “Every year his mother would sew him a small robe and take it up to him.”<\/p>\n<p>Hannah gave her son to God — and she kept on being his mother. Every year she made him new clothes. Every year she knew he had grown and made them a little bigger. Every year she came, and saw him, and gave him something made by her own hands.<\/p>\n<p>Letting go did not mean stopping loving. It meant loving differently.<\/p>\n<p>Every mother faces this. Children leave for school, for university, for marriage, for jobs far away. Some leave for the mission field; some leave for paths we would not have chosen. Letting go is part of motherhood. But so is the “little robe”: the care package, the phone call, the visit, the prayer, the steady presence that says, <em>I’m still your mother.<\/em><\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Can you think of your children as “lent” to you by God? How does that change things?<\/li>\n<li>What is the “little robe” you can still give to a child who has left home?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, my children were lent to me by you.<br />\nGive me grace to give them back to you,<br />\nand to keep on loving them —<br />\na little robe each year, for as long as I live. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Do something small and personal for a child who has left home, or is beginning to: a note, a parcel, a call, a meal.\n<\/p>", "note": "“Lent” (<em>šāʾûl<\/em>) is a play on the name Saul.", "readEn": "1 Samuel 1:19–28; 2:18–21"}, {"id": "M17", "n": 17, "title": "“She Is His Mother”", "part": 2, "read": "1 Kings 3:16–28", "ref": "1 Kings 3:26–27", "html": "<blockquote>\n<p>“Then the woman whose son was alive spoke to the king — for her compassion burned for her son — ‘Oh, my lord, give her the child alive; don’t put him to death!’… And the king answered, ‘Hand the living child to the first woman; do not kill him. She is his mother.’”<\/p>\n<p><span class=\"ref\">1 Kings 3:26–27<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">רַחֲמֶיהָ<\/span> (<em>raḥămêhā<\/em>) — “her compassion.” The word is related to <em>reḥem<\/em>, “womb” — a lovely word-picture, though the same phrase is also used of Joseph’s love for his brother (Genesis 43:30).<\/p>\n<\/div>\n<p>This is the most famous court case in the Bible. Two women come before King Solomon. They share a house; both gave birth; one baby died in the night. Now both claim the living child.<\/p>\n<p>There are no witnesses. It is one woman’s word against another’s.<\/p>\n<p>Solomon calls for a sword. “Cut the living child in two; give half to one and half to the other.”<\/p>\n<p>One woman says, “Fine — let him be neither mine nor yours.” The other cries out: “No! Give her the child. Don’t kill him.”<\/p>\n<p>And Solomon knows immediately who the real mother is. “She is his mother.”<\/p>\n<p>What revealed her? Not a claim of ownership. The real mother was the one willing to <em>lose<\/em> her child rather than see him harmed. Her love was bigger than her right to keep him.<\/p>\n<p>The Hebrew says her compassion “burned” for her son. It is a physical word. Something moved in her body before her mind had even decided.<\/p>\n<p>Notice who these women were: the Bible says they were prostitutes (3:16). No one would have thought them respectable. Yet the king listened to them, and the Bible holds up one of them as the very picture of a true mother.<\/p>\n<p>There are moments in every mother’s life when love means giving something up: a plan, a hope, a claim, a relationship. Sometimes it means stepping back so that a child can be safe or free, even at great cost to ourselves. That is not weakness. According to Solomon, it is the surest sign of real motherhood.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Is there a situation where love for your child means giving something up?<\/li>\n<li>Do you ever confuse “keeping” your child with loving them?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, give me a love like hers —<br />\na love that would rather lose than harm,<br />\na love bigger than my rights.<br />\nLet my compassion burn for my children’s good, not my own. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Ask yourself honestly: is there any way I am holding on to a child for my sake rather than theirs? Pray about it.\n<\/p>", "note": "The same idiom — compassion “growing warm” — is used of Joseph for Benjamin in Genesis 43:30. <em>Raḥămîm<\/em> (“compassion”) and <em>reḥem<\/em> (“womb”) share a root; on the limits of arguing from roots, see James Barr, <em>The Semantics of Biblical Language<\/em> (1961).", "art": {"file": "images/m17.webp", "caption": "“Give her the living child”", "title": "The Judgment of Solomon", "credit": "Gustave Doré, Bible illustrations (1866)", "source": "https://commons.wikimedia.org/wiki/File%3A084.The_Judgment_of_Solomon.jpg", "licence": "Public domain", "w": 900, "h": 1108}, "readEn": "1 Kings 3:16–28"}, {"id": "M18", "n": 18, "title": "Rizpah on the Rock", "part": 2, "read": "2 Samuel 21:1–14", "ref": "2 Samuel 21:10 (NIV)", "html": "<blockquote>\n<p>“Rizpah daughter of Aiah took sackcloth and spread it out for herself on a rock. From the beginning of the harvest till the rain poured down from the heavens on the bodies, she did not let the birds touch them by day or the wild animals by night.”<\/p>\n<p><span class=\"ref\">2 Samuel 21:10 (NIV)<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">שַׂק<\/span> (<em>śaq<\/em>) — “sackcloth,” the rough cloth worn for mourning. It is the origin of our word “sack.”<\/p>\n<\/div>\n<p>This is one of the hardest stories in the Bible, and one of the least known.<\/p>\n<p>King David, to end a famine, handed over seven descendants of the former king Saul to the Gibeonites, who executed them and left their bodies exposed on a hill. Two of the dead were the sons of Rizpah, one of Saul’s concubines. They died for something their father had done years before: the Gibeonites demanded Saul’s descendants as payment for his crimes against them. Yet the Bible’s own law says that children must not be put to death for their father’s sin (Deuteronomy 24:16).<\/p>\n<p>Rizpah could not save her sons. She could not change the king’s decision. She had no power at all.<\/p>\n<p>But she would not let them be forgotten.<\/p>\n<p>She took a piece of sackcloth, spread it on the rock beside their bodies, and stayed there. Day after day, she drove away the vultures. Night after night, she drove away the jackals. From the barley harvest in spring until the autumn rains — for months.<\/p>\n<p>And it worked. When David heard what Rizpah had done, he was moved to act. He gathered the bones of Saul and Jonathan and of the executed men, and gave them all an honourable burial. Only then, the Bible says, did God answer prayer for the land (21:14).<\/p>\n<p>Remember how David failed his own children — how he did nothing when his daughter Tamar was harmed, and refused to see his son Absalom for two years. Now a powerless mother, by sheer faithful presence, shamed the king into doing what was right.<\/p>\n<p>In our own time, mothers have done the same. In Argentina, the “Mothers of the Plaza de Mayo” walked in the public square every week for years, holding photographs of children who had “disappeared” under the military regime, until the world could no longer look away.<\/p>\n<p>Some mothers today keep vigil too: for a child in prison, a child in hospital, a child who died unjustly. Rizpah tells you that your faithful presence matters — even when you cannot change the outcome. Love that will not leave is a kind of power.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Is there a situation where you feel powerless to help a child? What would “keeping vigil” look like?<\/li>\n<li>Do you know a mother who is keeping vigil right now? How could you support her?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>God who saw Rizpah on the rock,<br />\nbe with every mother who keeps vigil over a child she cannot save.<br />\nGive strength to faithful love,<br />\nand move the powerful to act justly. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Pray for a mother who is keeping vigil — for a child who is sick, imprisoned, missing, or lost. If you can, send her a message to say she is not alone.\n<\/p>", "note": "The reason for the executions is given in 2 Samuel 21:1–9; the law that forbids putting children to death for their father’s sin is Deuteronomy 24:16. The narrative does not resolve the tension. The Mothers of the Plaza de Mayo began their weekly marches in Buenos Aires in 1977.", "art": {"file": "images/m18.webp", "caption": "Rizpah, who would not let her sons be forgotten", "title": "Rizpah’s Kindness toward the Dead", "credit": "Gustave Doré, Bible illustrations (1866)", "source": "https://commons.wikimedia.org/wiki/File%3A082.Rizpah%E2%80%99s_Kindness_toward_the_Dead.jpg", "licence": "Public domain", "w": 900, "h": 1111}, "readEn": "2 Samuel 21:1–14"}, {"id": "M19", "n": 19, "title": "“It Is Well”", "part": 2, "read": "2 Kings 4:8–37", "ref": "2 Kings 4:26, 30", "html": "<blockquote>\n<p>“‘Are you well? Is your husband well? Is the boy well?’ And she said, ‘It is well.’… Then the boy’s mother said, ‘By the life of the LORD and by your own life, I will not leave you.’”<\/p>\n<p><span class=\"ref\">2 Kings 4:26, 30<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">שָׁלוֹם<\/span> (<em>šālôm<\/em>) — “peace,” “well-being,” “it is well.”<\/p>\n<\/div>\n<p>The woman of Shunem had given the prophet Elisha a room in her house. In return, God gave her a son she had not dared to hope for.<\/p>\n<p>Years later, the boy was working in the fields with his father when he cried out, “My head, my head!” He was carried to his mother, sat on her lap until noon, and died.<\/p>\n<p>What she did next is astonishing.<\/p>\n<p>She carried him upstairs, laid him on the prophet’s bed, and shut the door. She told her husband nothing except “It is well” — <em>šālôm<\/em>. She saddled a donkey and rode as fast as she could to find Elisha.<\/p>\n<p>When Elisha’s servant ran to meet her and asked, “Is it well with the child?”, she said again: “It is well.”<\/p>\n<p>Then she reached Elisha, fell at his feet, and would not let go.<\/p>\n<p>Her “It is well” was not denial. It was determination. She refused to fall apart until she reached the one person who could help. She did not waste her strength explaining to others; she went straight to the source.<\/p>\n<p>And when Elisha tried to send his servant ahead with his staff, she refused. “By the life of the LORD and by your own life, I will not leave you.” She would not accept a substitute. She wanted the prophet himself.<\/p>\n<p>Elisha went, and the boy was raised to life.<\/p>\n<p>Not every story ends like this one. Many mothers have prayed with the same determination and still lost their child. In 1873 a father named Horatio Spafford lost his four daughters in a shipwreck, and wrote the hymn “It Is Well With My Soul.” Sometimes “It is well” is spoken in the deepest grief, not after a miracle.<\/p>\n<p>But the Shunammite shows us something every mother can do: bring the crisis straight to God, refuse to let go, and trust that he hears.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>In a crisis, where do you go first? Do you “go straight to the source”?<\/li>\n<li>Is there something for your child that you need to keep holding before God, and not let go?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, when my child is in trouble, give me the Shunammite’s resolve:<br />\nto come straight to you, to hold on, and not to let go.<br />\nAnd whether you answer with a miracle or with your presence,<br />\nteach my soul to say: it is well. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Bring one urgent need for a child directly to God in prayer — and keep bringing it, every day this week.\n<\/p>", "note": "Horatio Spafford’s four daughters died in the sinking of the <em>Ville du Havre<\/em> in 1873; he wrote “It Is Well with My Soul” afterwards.", "readEn": "2 Kings 4:8–37"}, {"id": "M20", "n": 20, "title": "Better Than Seven Sons", "part": 2, "read": "Ruth 1:1–22; 4:13–17", "ref": "Ruth 4:15–16", "html": "<blockquote>\n<p>“…for your daughter-in-law, who loves you and is worth more to you than seven sons, is the one who bore him. Naomi took the boy, held him in her lap, and became his foster-mother.”<\/p>\n<p><span class=\"ref\">Ruth 4:15–16<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">אֹמֶנֶת<\/span> (<em>ʾōmenet<\/em>) — “foster-mother,” “nurse,” “one who cares for a child.”<\/p>\n<\/div>\n<p>When Naomi came back to Bethlehem, she had lost everything: her husband and both her sons had died in a foreign country. “Don’t call me Naomi” (which means “pleasant”), she told the women of the town. “Call me Mara” (“bitter”) (1:20).<\/p>\n<p>The only thing she brought home was Ruth, her Moabite daughter-in-law, who had refused to leave her. “Wherever you go, I go; wherever you stay the night, I stay. Your people — my people; your God — my God” (1:16).<\/p>\n<p>The book of Ruth is, among other things, the story of how Naomi becomes a mother again.<\/p>\n<p>Ruth marries Boaz and gives birth to a son. And then something beautiful happens. Naomi takes the baby in her arms and becomes his <em>ʾōmenet<\/em> — his foster-mother, his nurse, his carer. The women of the town say: “A son has been born to Naomi!” (4:17).<\/p>\n<p>And they say something even more remarkable about Ruth: she “is better to you than seven sons.” In a culture that valued sons above almost everything, that was an astonishing thing to say about a daughter-in-law — and a foreigner at that.<\/p>\n<p>This little book stretches motherhood in two directions.<\/p>\n<p><strong>Across the boundary of blood.<\/strong> A grandmother becomes a mother. A daughter-in-law becomes more than a daughter.<\/p>\n<p><strong>Across the boundary of nation.<\/strong> A Moabite woman becomes the great-grandmother of King David — and an ancestor of Jesus (Matthew 1:5).<\/p>\n<p>Many families today look like Naomi’s: blended, broken and rebuilt, stretched across generations and cultures. Grandmothers raising grandchildren. Stepmothers. Mothers-in-law who become true mothers. The book of Ruth says: this, too, is motherhood — and God is in it.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Is there someone outside your “blood family” who has been a mother or daughter to you?<\/li>\n<li>Is there a child — a grandchild, a stepchild, a foster child — whom God is calling you to “take in your arms”?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, you turned Naomi’s bitterness into joy.<br />\nThank you for the families you build beyond blood and borders.<br />\nWhere I am empty, fill me;<br />\nand show me whom I am called to hold. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Thank a daughter-in-law, stepmother, grandmother, or other “Ruth” or “Naomi” in your life for what she means to you.\n<\/p>", "note": "Ruth appears in the genealogy of Jesus in Matthew 1:5.", "art": {"file": "images/m20.webp", "caption": "Naomi and Ruth, on the road to Bethlehem", "title": "Naomi and Her Daughters-in-Law", "credit": "Gustave Doré, Bible illustrations (1866)", "source": "https://commons.wikimedia.org/wiki/File%3A068.Naomi_and_Her_Daughters-in-Law.jpg", "licence": "Public domain", "w": 900, "h": 1124}, "readEn": "Ruth 1:1–22; 4:13–17"}, {"id": "M21", "n": 21, "title": "Mary Pondered", "part": 2, "read": "Luke 1:26–38; 2:15–19, 41–52", "ref": "Luke 2:19, 34–35", "html": "<blockquote>\n<p>“Mary kept all these things, turning them over in her heart… Then Simeon said to Mary his mother, ‘And a sword will pierce your own soul too.’”<\/p>\n<p><span class=\"ref\">Luke 2:19, 34–35<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> συνετήρει (<em>synetērei<\/em>) — Greek for “she kept,” “she treasured,” “she held carefully.” It is used of keeping something safe.<\/p>\n<\/div>\n<p>Mary is the most famous mother in history. Yet the Gospels tell us surprisingly little about her. What they give us are a few “glimpses,” and each one shows a different side of motherhood.<\/p>\n<p><strong>She said yes.<\/strong> When the angel told her she would bear a child, she answered, “Let it be to me according to your word” (1:38). Her motherhood began with trust — in a situation that could have brought her shame.<\/p>\n<p><strong>She knew she would be remembered.<\/strong> In her song, the Magnificat, she says: “From now on all generations will call me blessed” (1:48). And they have. For much of Christian history, and especially in the Catholic and Orthodox churches, Mary has been honoured above all others as the mother of the Lord; as early as the year 431 the church called her <em>Theotokos<\/em>, “God-bearer” — a title that was first of all a confession about who Jesus is. Christians differ about how to honour her. But no book about the mothers of the Bible can leave her at the margins.<\/p>\n<p><strong>She pondered.<\/strong> When the shepherds came with their strange story, Mary “kept all these things, turning them over in her heart” (2:19). Later, after the twelve-year-old Jesus stayed behind in the temple, Luke says it again: she “kept all these words in her heart” (2:51).<\/p>\n<p>Mary did not fully understand her son. But she held on to what she saw and heard, and kept thinking about it. That is a kind of love: patient, attentive, reflective.<\/p>\n<p><strong>She was warned.<\/strong> Simeon told her, “A sword will pierce your own soul too.” Mary’s motherhood would include deep sorrow — ultimately, watching her son die.<\/p>\n<p><strong>She searched anxiously.<\/strong> When Jesus went missing in Jerusalem, she and Joseph searched for three days. “Your father and I have been looking for you in anguish” (2:48). Even the mother of Jesus knew the panic of a lost child.<\/p>\n<p><strong>She pointed away from herself.<\/strong> At the wedding in Cana, she told the servants, “Whatever he tells you, do it” (John 2:5).<\/p>\n<p><strong>She stood at the cross<\/strong> (John 19:25) — and afterwards, she prayed with the disciples (Acts 1:14).<\/p>\n<p>Mary’s motherhood was not a fairy tale. It was trust, reflection, confusion, anxiety, sorrow, and faithfulness. Many mothers will find in her not a distant saint but a companion.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>What do you “keep and ponder” about your children — things you don’t yet understand?<\/li>\n<li>Which “glimpse” of Mary’s motherhood speaks most to you right now?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, thank you for Mary, who said yes, and pondered, and stood firm.<br />\nGive me her trust when I don’t understand,<br />\nher patience to keep watching,<br />\nand her courage to stand by my children in sorrow. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Write down one thing about each of your children that you want to “keep and ponder” — something you have noticed, but don’t yet fully understand.\n<\/p>", "note": "See Beverly Roberts Gaventa, <em>Mary: Glimpses of the Mother of Jesus<\/em> (1995). The title <em>Theotokos<\/em> was affirmed at the Council of Ephesus (431), against Nestorius, as a confession that the one born of Mary is God incarnate.", "readEn": "Luke 1:26–38; 2:15–19, 41–52"}, {"id": "M22", "n": 22, "title": "The Mother Who Would Not Take No", "part": 2, "read": "Mark 7:24–30; Matthew 15:21–28", "ref": "Mark 7:28–29", "html": "<blockquote>\n<p>“But she answered him, ‘Yes, Lord — but even the little dogs under the table get the children’s crumbs.’ And he said to her, ‘Because of this word, go — the demon has left your daughter.’”<\/p>\n<p><span class=\"ref\">Mark 7:28–29<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> ναί, κύριε (<em>nai, kyrie<\/em>) — Greek for “Yes, Lord.”<\/p>\n<\/div>\n<p>This is one of the most surprising conversations in the Gospels.<\/p>\n<p>A Gentile woman — a foreigner, not Jewish — finds Jesus in a house where he is trying not to be noticed. Her little daughter is tormented by an evil spirit. She falls at his feet and begs him for help.<\/p>\n<p>And Jesus seems to refuse. “First let the children eat their fill; it isn’t right to take the children’s bread and toss it to the little dogs” (7:27). The “children” are the people of Israel; the “little dogs” are the Gentiles.<\/p>\n<p>It is a hard saying. Many mothers would have walked away hurt.<\/p>\n<p>She doesn’t. She answers: “Yes, Lord — but even the little dogs under the table eat the children’s crumbs.”<\/p>\n<p>She accepts his picture and turns it around. <em>All right, I’m not at the table. But I only need a crumb.<\/em> She is humble, quick-witted, and utterly determined — all for the sake of her daughter.<\/p>\n<p>And Jesus is delighted. In Matthew’s version he says, “Woman, great is your faith!” (15:28). Her daughter is healed.<\/p>\n<p>In Mark’s telling, Jesus heals her daughter “for saying that” (7:29) — her answer, not his, has the last word. And she does it for her child.<\/p>\n<p>Mothers often have to become advocates: with doctors, schools, social services, courts, even churches. They are told “no,” or “not yet,” or “that’s not our responsibility.” Some give up. This mother shows the faith that keeps asking — humbly, cleverly, and without letting go — because a child’s life depends on it.<\/p>\n<p>Jesus does not rebuke that kind of persistence. He praises it.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Where do you need to advocate for a child right now? Have you been tempted to give up?<\/li>\n<li>What does it look like to be both humble and persistent in prayer?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, thank you for this mother who would not take no for an answer.<br />\nGive me her faith — humble, clever, and unshakeable —<br />\nto keep asking, for my children and for others,<br />\nuntil your help comes. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> Take one practical step in advocating for a child — a phone call, a letter, a meeting you have been putting off.\n<\/p>", "note": "Matthew calls her a Canaanite (15:22); Mark calls her a Greek, Syrophoenician by birth (7:26). In Mark, Jesus heals her daughter “for saying that” (7:29): her answer, not his, has the last word. On how unusual that is among the Gospel stories, see Sharon H. Ringe, “A Gentile Woman’s Story,” in Letty M. Russell, ed., <em>Feminist Interpretation of the Bible<\/em> (1985), and her “A Gentile Woman’s Story, Revisited,” in <em>A Feminist Companion to Mark<\/em> (2001).", "readEn": "Mark 7:24–30; Matthew 15:21–28"}, {"id": "M23", "n": 23, "title": "Eve: Joy and Grief in One Chapter", "part": 3, "read": "Genesis 4:1–16, 25–26", "ref": "Genesis 4:1, 25", "html": "<blockquote>\n<p>“Eve conceived and bore Cain, and she said, ‘I have gotten a man, together with the LORD!’… She bore a son and called him Seth: ‘For God has set another child in place of Abel, because Cain killed him.’”<\/p>\n<p><span class=\"ref\">Genesis 4:1, 25<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">קָנִיתִי<\/span> (<em>qānîtî<\/em>) — “I have gotten,” “I have made.” Eve’s first word as a mother is a cry of triumph: she has made a new person, together with God.<\/p>\n<\/div>\n<p>The first mother in the Bible begins with a shout of joy. When Cain is born, Eve cries out, “I have made a man — together with the LORD!” Every mother who has held her firstborn knows something of that wonder.<\/p>\n<p>And then, in the same chapter, the worst thing imaginable happens. One of her sons kills the other.<\/p>\n<p>The Bible records no words from Eve when Abel dies. Nothing at all. Perhaps there were no words.<\/p>\n<p>Many chapters could have been written about her grief, but the Bible gives only one more sentence. When she bears another son, she names him Seth, and explains: “God has given me another child in place of Abel, because Cain killed him.”<\/p>\n<p>In that one sentence are both grief and hope. She does not pretend Abel is replaced. She names what happened — “Cain killed him.” And she receives a new child as a gift from God.<\/p>\n<p>Eve is not a “bad” mother. But the first mother in Scripture is also the first bereaved mother, and the first mother whose children turned on one another.<\/p>\n<p>This matters for many mothers:<\/p>\n<ul>\n<li>mothers whose children are at war with each other;<\/li>\n<li>mothers who have lost a child;<\/li>\n<li>mothers who carry joy and sorrow in the same heart.<\/li>\n<\/ul>\n<p>The Bible’s story of motherhood begins with both. It does not ask you to choose between them. You can hold your grief, and still receive the gifts God gives.<\/p>\n<div class=\"questions\">\n<p><strong>Think it over<\/strong><\/p>\n<ol type=\"1\">\n<li>Do you carry a grief over one of your children, even as you rejoice over another?<\/li>\n<li>Are there tensions between your children that break your heart?<\/li>\n<\/ol>\n<\/div>\n<div class=\"prayer\">\n<p><strong>Pray<\/strong><\/p>\n<p>Lord, you were with Eve in her joy and in her grief.<br />\nBe with me in both.<br />\nWhere my children are at war, bring peace.<br />\nWhere I have lost, give me hope. Amen.<\/p>\n<\/div>\n<p class=\"today\">\n<strong>Today:<\/strong> If your children are in conflict, pray for each of them by name — and look for one small way to help them see each other kindly.\n<\/p>", "note": "Eve’s cry “I have gotten a man” (Genesis 4:1) uses the verb <em>qānâ<\/em>, the verb Deuteronomy 32:6 uses of God fathering Israel. The text records no word from Eve at Abel’s death; she speaks again only in naming Seth (4:25).", "art": {"file": "images/m23.webp", "caption": "The first mother’s grief", "title": "Cain Slays Abellabel QS:Lru,\"Каин убивает Авеля\"label QS:Lde,\"Kain erschlägt Abel\"label QS:Len,\"Cain Slays Abel\"label QS:Lno,\"Abels død\"", "credit": "Gustave Doré, Bible illustrations (1866)", "source": "https://commons.wikimedia.org/wiki/File%3ACain_kills_Abel.png", "licence": "Public domain", "w": 900, "h": 1144}, "readEn": "Genesis 4:1–16, 25–26"}, {"id": "M24", "n": 24, "title": "Sarah and Hagar: The Mistress and the Slave", "part": 3, "read": "Genesis 16:1–13; 21:8–21", "ref": "Genesis 16:13; 21:16", "html": "<blockquote>\n<p>“She called the LORD who had spoken to her by this name: ‘You are El-roi — a God who sees me.’… ‘Let me not watch the child die.’”<\/p>\n<p><span class=\"ref\">Genesis 16:13; 21:16<\/span><\/p>\n<\/blockquote>\n<div class=\"word\">\n<p><strong>Word for the day:<\/strong> <span lang=\"he\" dir=\"rtl\">אֵל רֳאִי<\/span> (<em>ʾēl rŏʾî<\/em>) — “a God who sees me.” Hagar, an Egyptian slave woman, gives God this name.<\/p>\n<\/div>\n<p>Sarah could not have children. In desperation she gave her Egyptian slave, Hagar, to Abraham, hoping to have a child through her — a practice of the time. Hagar had no say in it.<\/p>\n<p>It worked, and it went terribly wrong. When Hagar became pregnant, she looked down on Sarah. Sarah complained to Abraham, and he washed his hands of it: “Your slave is in your hands; do
